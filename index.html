    <th class="gc g-wk sepL">FC</th><th class="gc g-wk">MC</th><th class="gc g-wk">합계</th><th class="gc g-wk">순번</th><th class="gc g-pur">OT</th><th class="gc g-pur">순번</th>
  </tr>`;
  const c0 = v => v||'';
  const nEmp = perEmp.length;
  // 순번 배지: 1~3위 진하게, 상위 절반 연하게, 나머지는 글자색만
  const rk = (n, g, tot) => n==null ? '' : `<span class="rk ${n<=3?'t1':(n<=Math.ceil((tot||nEmp)/2)?'t2':'t3')} g-${g}">${n}</span>`;

  const statRows = perEmp.map((r,idx)=>{
    const ex = rankExcl(r.emp), hA = ex==='all', hO = ex!=='';
    const nAll = nAllT[teamOf(r)]||0, nOt = nOtT[teamOf(r)]||0;
    const v = x => hA ? '' : c0(x);
    const ot = x => hO ? '' : fmtH(x);
    // 누르면 보정 팝업: data-adj(보정 항목), data-raw(계산값)
    const A = (key, label, total, shown, extra) => `<td class="adjCell${extra||''}" data-act="adj" data-emp="${esc(r.emp.id)}" data-key="${key}" data-label="${esc(label)}" data-raw="${Math.round((total - userAdjOf(r.emp,key))*100)/100}" style="text-align:center;${key==='supAdj'?'font-weight:700;':''}${key==='holAdj'||key==='wkAdj'?'min-width:52px;':''}">${shown}</td>`;
    return `<tr>
      <td class="stNo" style="text-align:center;">${idx+1}</td>
      <td class="namecell nameLink stName" data-act="leave" data-emp="${esc(r.emp.id)}" title="연간 누계 보기">${esc(r.emp.name)}</td>

      ${A('fchAdj','FCH', r.codeCnt.FCH, v(r.codeCnt.FCH), ' sepL')}${A('mchAdj','MCH', r.codeCnt.MCH, v(r.codeCnt.MCH))}
      ${A('holCntAdj','휴일 합계', r.gyeHol, v(r.gyeHol))}<td style="text-align:center;">${rk(rankGyeHol[idx],'blue',nAll)}</td>
      ${A('mcsAdj','MCS', r.codeCnt.MCS, v(r.codeCnt.MCS))}<td style="text-align:center;">${rk(rankMCS[idx],'red',nAll)}</td>
      ${A('holAdj','휴일 OT', r.otHoliday, ot(r.otHoliday))}<td style="text-align:center;">${rk(rankOtHol[idx],'yel',nOt)}</td>
      ${A('fcAdj','FC', r.codeCnt.FC, v(r.codeCnt.FC), ' sepL')}${A('mcAdj','MC', r.codeCnt.MC, v(r.codeCnt.MC))}
      ${A('wkCntAdj','평일 합계', r.gyeWk, v(r.gyeWk))}<td style="text-align:center;">${rk(rankGyeWk[idx],'wk',nAll)}</td>
      ${A('wkAdj','평일 OT', r.otWeekdayFinal, ot(r.otWeekdayFinal))}<td style="text-align:center;">${rk(rankOtWk[idx],'pur',nOt)}</td>

  const {y:cy, m:cm} = combinedYm;

  }).join('');
  const codeRows = sortedEmployees.map(e=>{
    const cells = monthDays.map(ds=>{
      const d = Number(ds.slice(8,10));
      const rec = codeStatsAttendance[ds+'_'+e.id];
      const cls = dayCellClass(ds, cy, cm, d);
      let inner = '', fill = '';
      const dc = gridCode(rec, ds, String(e.name||'').trim());
      {
        fill = dc ? codeFill(dc) : '';
        if(dc) inner = `<span class="mini" style="color:${fill ? codeFillText(dc) : codeColor(dc)};font-weight:800;">${esc(dc)}</span>`;
      }
      const memo = rec && rec.note ? String(rec.note) : '';
      return `<td class="daycell ${cls} ${weekBand(ds)}${fill?' filled':''}" data-act="grid-cell" data-date="${esc(ds)}" data-emp="${esc(e.id)}"${fill?` style="background:${fill};"`:''}>${inner}</td>`;

  const modal = gridEdit ? renderGridEditModal() : '';
  const teamBtns = `<div class="row" style="margin-bottom:14px;">
    <button class="btn ${combinedTeamFilter===''?'':'ghost'} sm" data-act="team-filter" data-team="">전체</button>
    <button class="btn ${combinedTeamFilter==='1'?'':'ghost'} sm" data-act="team-filter" data-team="1">1조</button>
    <button class="btn ${combinedTeamFilter==='2'?'':'ghost'} sm" data-act="team-filter" data-team="2">2조</button>

  return `

  ${teamBtns}
  <div class="cmbWrap">
    <div class="panel cmbLeft">
      <div class="cmbCtrl">
        <h3>근태 집계 <span style="font-weight:400;color:var(--text-muted);font-size:12px;">(${esc(rangeStart)} ~ ${esc(rangeEnd)})</span></h3>
        <div class="row" style="align-items:flex-end;flex-wrap:nowrap;">

/* ========================= 근태·OT 집계 ========================= */
function pageOT(){
  if(!otMatrixStart || !otMatrixEnd){
    const t = new Date();
    otPayYear = t.getFullYear(); otPayMonth = t.getMonth()+1;
    if(t.getDate()>=26){ otPayMonth++; if(otPayMonth>12){ otPayMonth=1; otPayYear++; } }
    [otMatrixStart, otMatrixEnd] = payPeriodRange(otPayYear, otPayMonth);
  }
  const sortedEmployees = employees.slice().filter(e=> !otTeamFilter || (e.team||'')===otTeamFilter).sort((a,b)=>{
    const ta = a.team||'9', tb = b.team||'9';
    if(ta!==tb) return ta<tb?-1:1;
    return (a.teamOrder||999)-(b.teamOrder||999);
  });
  const days = [];
  for(let ds=otMatrixStart; ds<=otMatrixEnd; ds=addDays(ds,1)) days.push(ds);

  const perEmp = sortedEmployees.map(e=>{
    let wkTotal=0, hoTotal=0, spTotal=0, mealTotal=0;
    const daily = {};
    days.forEach(ds=>{
      const rec = otMatrixAttendance[ds+'_'+e.id];
      const c = computeDaily(rec, ds);
      const s = computeSupportDaily(rec, ds);
      const meal = computeMealAllowance(rec);
      if(c.valid){ if(c.category==='평일'||c.category==='토요일') wkTotal+=c.premium; else hoTotal+=c.premium; }
      if(s.valid){
        const cat = dayCategory(ds, recManguen(rec, ds), rec && rec.employeeId);
        if(cat==='SU' || cat==='H') hoTotal += s.premium; else spTotal += s.premium;
      }
      mealTotal += meal;
      daily[ds] = (c.valid?c.premium:0) + (s.valid?s.premium:0) + meal;
    });
    const grand = wkTotal + hoTotal + spTotal + mealTotal;

    return {emp:e, wkTotal, hoTotal, hoGuar, spTotal, spGuar, mealTotal, grand, otGuar, otDiff: otGuar-grand, daily};

function pageTeamOT(){
  const sortedEmployees = employees.slice().filter(e=> !teamOtFilter || (e.team||'')===teamOtFilter).sort((a,b)=>{
    const ta = a.team||'9', tb = b.team||'9';
    if(ta!==tb) return ta<tb?-1:1;
    return (a.teamOrder||999)-(b.teamOrder||999);
  });
  const perEmp = sortedEmployees.map(e=>{
    let wkWeekday=0, wkSat=0, hoSun=0, hoHol=0, hoSup=0, spWeekday=0, spSat=0;
    let jochul=0, seokchul=0, jungsik=0, yasik=0;
    for(let ds=otMatrixStart; ds<=otMatrixEnd; ds=addDays(ds,1)){
      const rec = otMatrixAttendance[ds+'_'+e.id];
      if(!rec) continue;
      const c = computeDaily(rec, ds);
      if(c.valid){
        if(c.category==='평일') wkWeekday += c.premium;
        else if(c.category==='토요일') wkSat += c.premium;
        else if(c.category==='일요일') hoSun += c.premium;
        else if(c.category==='공휴일') hoHol += c.premium;
      }
      const s = computeSupportDaily(rec, ds);
      if(s.valid){
        const cat = dayCategory(ds, recManguen(rec, ds), rec && rec.employeeId);
        if(cat==='SU' || cat==='H') hoSup += s.premium;
        else if(cat==='SA') spSat += s.premium;
        else spWeekday += s.premium;
      }
      if(rec.jochul) jochul += 1.5;
      if(rec.seokchul) seokchul += 1.5;
      if(rec.jungsik) jungsik += 1.5;
      if(rec.yasik) yasik += 1.5;
    }
    const wkTotal = wkWeekday + wkSat;
    const hoTotal = hoSun + hoHol + hoSup;
    const spTotal = spWeekday + spSat;
    const mealTotal = jochul + seokchul + jungsik + yasik;
    const wkGuar = wkTotal; // 평일: 보전(최소보장) 없음 — 실적 그대로
    const hoGuar = Math.max(hoTotal, 60); // 휴일 보전: 월 60시간 최소 보장
    const spGuar = Math.max(spTotal, 30); // 지원 보전: 월 30시간 최소 보장
    const mealGuar = mealTotal; // 식사: 보전 없음 — 실적 그대로
    const otReal = wkTotal + hoTotal + spTotal + mealTotal;
    const otGuar = wkGuar + hoGuar + spGuar + mealGuar;
    return {emp:e, wkWeekday, wkSat, wkTotal, wkGuar, hoSun, hoHol, hoSup, hoTotal, hoGuar,
      spWeekday, spSat, spTotal, spGuar, jochul, seokchul, jungsik, yasik, mealTotal, mealGuar,
      otReal, otGuar, otDiff: otGuar-otReal};
  });

  const rows = perEmp.map((r,idx)=>{
    const noCell = idx+1;
    const z = v => v ? fmtH(v) : '';
    return `<tr>
      <td style="text-align:center;">${esc(noCell)}</td>
      <td class="namecell">${esc(r.emp.name)}</td>
      <td style="text-align:center;">${z(r.wkTotal)}</td>
      <td style="text-align:center;">${z(r.hoTotal)}</td>
      <td style="text-align:center;background:var(--amber-soft);font-weight:700;">${z(r.hoGuar)}</td>
      <td style="text-align:center;">${z(r.spTotal)}</td>
      <td style="text-align:center;background:var(--amber-soft);font-weight:700;">${z(r.spGuar)}</td>
      <td style="text-align:center;">${z(r.mealTotal)}</td>
      <td style="text-align:center;">${z(r.otReal)}</td><td style="text-align:center;">${z(r.otGuar)}</td><td style="text-align:center;font-weight:700;">${z(r.otDiff)}</td>
    </tr>`;
  }).join('');

  const n = perEmp.length || 1;
  const avgOf = k => fmtH(perEmp.reduce((s,r)=>s+(r[k]||0),0)/n);
  const avgRow = `<tr style="background:var(--bg);font-weight:800;">
    <td colspan="2" style="text-align:center;">평균</td>
    <td style="text-align:center;">${avgOf('wkTotal')}</td>
    <td style="text-align:center;">${avgOf('hoTotal')}</td>
    <td style="text-align:center;background:var(--amber-soft);">${avgOf('hoGuar')}</td>
    <td style="text-align:center;">${avgOf('spTotal')}</td>
    <td style="text-align:center;background:var(--amber-soft);">${avgOf('spGuar')}</td>
    <td style="text-align:center;">${avgOf('mealTotal')}</td>
    <td style="text-align:center;">${avgOf('otReal')}</td><td style="text-align:center;">${avgOf('otGuar')}</td><td style="text-align:center;">${avgOf('otDiff')}</td>
  </tr>`;

  return `
  <h2 class="pgttl">조별 월간집계</h2>
  <p class="pgsub">평일(평일+토요)·휴일(일요+공휴+휴일지원)·지원(평일지원+토요지원)·식사(조출+석출+중식+야식) 월간 합계와, 휴일(월 60시간)·지원(월 30시간) 최소보장(보전) 시간을 보여줍니다. (임금월 ${otPayYear}년 ${otPayMonth}월: ${esc(otMatrixStart)} ~ ${esc(otMatrixEnd)})</p>
  <div class="row" style="margin-bottom:14px;">
    <button class="btn ${teamOtFilter===''?'':'ghost'} sm" data-act="teamot-filter" data-team="">전체</button>
    <button class="btn ${teamOtFilter==='1'?'':'ghost'} sm" data-act="teamot-filter" data-team="1">1조</button>
    <button class="btn ${teamOtFilter==='2'?'':'ghost'} sm" data-act="teamot-filter" data-team="2">2조</button>
  </div>
  ${sortedEmployees.length? `<div class="scrollx"><table class="gtbl"><thead>
    <tr>
      <th rowspan="2" class="namehead">No</th><th rowspan="2" class="namehead" style="left:34px;">성명</th>
      <th>평일</th>
      <th colspan="2">휴일</th>
      <th colspan="2">지원</th>
      <th>식사</th>
      <th colspan="3">OT</th>
    </tr>
    <tr>
      <th>계</th>
      <th>계</th><th style="background:var(--amber-soft);">휴일보전</th>
      <th>계</th><th style="background:var(--amber-soft);">지원보전</th>
      <th>계</th>
      <th>실</th><th>보전</th><th>증감</th>
    </tr>
  </thead><tbody>${rows}${avgRow}</tbody></table></div>`
    : `<div class="empty">등록된 직원이 없습니다.</div>`}
  <p class="hint">휴일보전=MAX(휴일계, 60), 지원보전=MAX(지원계, 30) (평일·식사는 최소보장 없이 실적 그대로). OT 실=평일+휴일+지원+식사, OT 보전=평일+휴일보전+지원보전+식사, 증감=보전-실.</p>
  `;

/* ========================= 근태코드 집계 ========================= */
function pageCodeStats(){
  if(!codeStatsStart || !codeStatsEnd){
    const t = new Date();
    codeStatsStart = dstr(t.getFullYear(), t.getMonth()+1, 1);
    codeStatsEnd = dstr(t.getFullYear(), t.getMonth()+1, daysInMonth(t.getFullYear(), t.getMonth()+1));
  }
  const rangeStart = codeStatsStart, rangeEnd = codeStatsEnd;
  const sortedEmployees = employees.slice().sort((a,b)=>{
    const ta = a.team||'9', tb = b.team||'9';
    if(ta!==tb) return ta<tb?-1:1;
    return (a.teamOrder||999)-(b.teamOrder||999);
  });
  const perEmp = sortedEmployees.map(e=>{
    let codeCnt = {FCH:0,MCH:0,MCS:0,FC:0,MC:0};
    let otHoliday=0, otWeekday=0, workHoliday=0, workWeekday=0, supDays=0, mealAllow=0;
    for(let ds=rangeStart; ds<=rangeEnd; ds=addDays(ds,1)){
      const rec = codeStatsAttendance[ds+'_'+e.id];
      if(!rec) continue;
      if(rec.statusCode && codeCnt.hasOwnProperty(rec.statusCode)) codeCnt[rec.statusCode]++;
      const c = computeDaily(rec, ds);
      if(c.valid){
        if(c.category==='일요일' || c.category==='공휴일'){ otHoliday += c.premium; workHoliday++; }
        else { otWeekday += c.premium; workWeekday++; }
      }
      const s = computeSupportDaily(rec, ds);
      if(s.valid) supDays++;
      mealAllow += computeMealAllowance(rec);
    }
    const gyeHol = codeCnt.FCH + codeCnt.MCH;
    const hyuHol = gyeHol + codeCnt.MCS;
    const gyeWk = codeCnt.FC + codeCnt.MC;
    const hyuWk = gyeWk;
    const otWeekdayFinal = otWeekday + (codeStatsIncludeMeal ? mealAllow : 0);
    return {emp:e, codeCnt, gyeHol, hyuHol, gyeWk, hyuWk, otHoliday, otWeekdayFinal, workHoliday, workWeekday, supDays};
  });

  // 순위(순번): 지원일수/계/MCS는 값이 작을수록 1등(오름차순), OT는 값이 클수록 1등(내림차순)
  function rankByAsc(getVal){
    const s = perEmp.map((r,i)=>({i, v:getVal(r)||0})).sort((a,b)=> a.v-b.v || a.i-b.i);
    const ranks = new Array(perEmp.length);
    s.forEach((x,idx)=>{ ranks[x.i] = idx+1; });
    return ranks;
  }
  function rankByDesc(getVal){
    const s = perEmp.map((r,i)=>({i, v:getVal(r)||0})).sort((a,b)=> b.v-a.v || a.i-b.i);
    const ranks = new Array(perEmp.length);
    s.forEach((x,idx)=>{ ranks[x.i] = idx+1; });
    return ranks;
  }
  const rankSup = rankByAsc(r=>r.supDays);
  const rankGyeHol = rankByAsc(r=>r.gyeHol);
  const rankMCS = rankByAsc(r=>r.codeCnt.MCS);
  const rankGyeWk = rankByAsc(r=>r.gyeWk);
  const rankOtHol = rankByDesc(r=>r.otHoliday);
  const rankOtWk = rankByDesc(r=>r.otWeekdayFinal);

  const rows = perEmp.map((r,idx)=>{
    const noCell = idx+1;
    return `<tr style="height:34px;">
      <td style="text-align:center;">${esc(noCell)}</td>
      <td class="namecell" style="height:34px;">${esc(r.emp.name)}</td>
      <td style="text-align:center;background:var(--accent-soft);">${r.supDays||''}</td>
      <td style="text-align:center;background:var(--accent-soft);font-weight:700;">${rankSup[idx]}</td>
      <td style="text-align:center;background:var(--amber-soft);">${r.codeCnt.FCH||''}</td>
      <td style="text-align:center;background:var(--amber-soft);">${r.codeCnt.MCH||''}</td>
      <td style="text-align:center;background:var(--amber-soft);">${r.gyeHol||''}</td>
      <td style="text-align:center;background:var(--amber-soft);font-weight:700;">${rankGyeHol[idx]}</td>
      <td style="text-align:center;background:var(--amber-soft);">${r.codeCnt.MCS||''}</td>
      <td style="text-align:center;background:var(--amber-soft);font-weight:700;">${rankMCS[idx]}</td>
      <td style="text-align:center;background:var(--amber-soft);">${fmtH(r.otHoliday)}</td>
      <td style="text-align:center;background:var(--amber-soft);font-weight:700;">${rankOtHol[idx]}</td>
      <td style="text-align:center;background:var(--ok-soft);">${r.codeCnt.FC||''}</td>
      <td style="text-align:center;background:var(--ok-soft);">${r.codeCnt.MC||''}</td>
      <td style="text-align:center;background:var(--ok-soft);">${r.gyeWk||''}</td>
      <td style="text-align:center;background:var(--ok-soft);font-weight:700;">${rankGyeWk[idx]}</td>
      <td style="text-align:center;background:var(--ok-soft);">${fmtH(r.otWeekdayFinal)}</td>
      <td style="text-align:center;background:var(--ok-soft);font-weight:700;">${rankOtWk[idx]}</td>
    </tr>`;
  }).join('');
  const footerRow = `<tr style="background:var(--bg);font-weight:800;height:30px;"><td style="text-align:center;"></td><td class="namecell">합계</td>
    <td style="text-align:center;background:var(--accent-soft);">${perEmp.reduce((s,r)=>s+r.supDays,0)||''}</td><td style="background:var(--accent-soft);"></td>
    <td style="text-align:center;background:var(--amber-soft);">${perEmp.reduce((s,r)=>s+r.codeCnt.FCH,0)||''}</td>
    <td style="text-align:center;background:var(--amber-soft);">${perEmp.reduce((s,r)=>s+r.codeCnt.MCH,0)||''}</td>
    <td style="text-align:center;background:var(--amber-soft);">${perEmp.reduce((s,r)=>s+r.gyeHol,0)||''}</td><td style="background:var(--amber-soft);"></td>
    <td style="text-align:center;background:var(--amber-soft);">${perEmp.reduce((s,r)=>s+r.codeCnt.MCS,0)||''}</td><td style="background:var(--amber-soft);"></td>
    <td style="text-align:center;background:var(--amber-soft);">${fmtH(perEmp.reduce((s,r)=>s+r.otHoliday,0))}</td><td style="background:var(--amber-soft);"></td>
    <td style="text-align:center;background:var(--ok-soft);">${perEmp.reduce((s,r)=>s+r.codeCnt.FC,0)||''}</td>
    <td style="text-align:center;background:var(--ok-soft);">${perEmp.reduce((s,r)=>s+r.codeCnt.MC,0)||''}</td>
    <td style="text-align:center;background:var(--ok-soft);">${perEmp.reduce((s,r)=>s+r.gyeWk,0)||''}</td><td style="background:var(--ok-soft);"></td>

  ${sortedEmployees.length? `<div class="scrollx"><table class="gtbl"><thead>
    <tr>
      <th class="namehead">No</th><th class="namehead" style="left:34px;">성명</th>
      <th style="background:var(--accent-soft);">지원일수</th><th style="background:var(--accent-soft);">순번</th>
      <th style="background:var(--amber-soft);">FCH</th><th style="background:var(--amber-soft);">MCH</th><th style="background:var(--amber-soft);">계</th><th style="background:var(--amber-soft);">순번</th><th style="background:var(--amber-soft);">MCS</th><th style="background:var(--amber-soft);">순번</th><th style="background:var(--amber-soft);">OT</th><th style="background:var(--amber-soft);">순번</th>
      <th style="background:var(--ok-soft);">FC</th><th style="background:var(--ok-soft);">MC</th><th style="background:var(--ok-soft);">계</th><th style="background:var(--ok-soft);">순번</th><th style="background:var(--ok-soft);">OT</th><th style="background:var(--ok-soft);">순번</th>
    </tr>
  </thead><tbody>${rows}${footerRow}</tbody></table></div>`
    : `<div class="empty">등록된 직원이 없습니다.</div>`}
  <p class="hint">계(휴일)=FCH+MCH, 계(평일)=FC+MC. 지원일수·계·MCS의 "순번"은 <b>숫자가 작을수록 1등</b>(오름차순), OT의 "순번"은 <b>숫자가 클수록 1등</b>(내림차순)입니다. OT는 해당 구분(휴일/평일)의 가산시간 합계이며, 근태·OT 집계 화면의 값과 연동됩니다.</p>
  `;
}

/* ========================= 근태코드 참조 ========================= */
function pageCodes(){
  // 근무코드 + 근태코드(기본·추가)를 한 목록으로 모아 색깔별로 묶어서 보여줌
  const customCodes = Object.keys(codeDefs).filter(c => !STATUS_CODE_LIST.includes(c) && !WORK_CODES.some(w=>w.code===c));
  const all = [...WORK_CODES.map(w=>w.code), ...STATUS_CODE_LIST, ...customCodes].filter((c,i,a)=>a.indexOf(c)===i && !hiddenCodes.has(c));
  all.sort((a,b)=> codeSortKey(a)-codeSortKey(b));
  const labelOf = c => { const d = codeDefs[c]; if(d && d.label) return d.label; const w = WORK_CODES.find(x=>x.code===c); return w ? w.label.replace(/\([^)]*\)$/, '') : (CODE_LABELS[c] || ''); };
  let lastG = '';
  const rows = all.map(c=>{
    const g = codeGroup(c), gname = (CODE_GROUPS.find(x=>x.key===g)||{}).name || '';
    const head = g!==lastG ? `<tr><td colspan="4" style="background:var(--bg);font-weight:800;font-size:12px;padding:6px 8px;">${codeBadge(c).replace(/>[^<]*<\/span>$/, '>&nbsp;&nbsp;</span>')} ${esc(gname)}</td></tr>` : '';
    lastG = g;
    return head + `<tr><td>${codeBadge(c)}</td>
      <td><input type="text" data-code-label="${esc(c)}" value="${esc(labelOf(c))}" placeholder="설명을 입력하세요" style="border:1px solid var(--border);border-radius:6px;padding:5px 8px;background:var(--bg);color:var(--text);width:100%;max-width:320px;"></td>
      <td><button class="btn sm" data-act="save-code" data-code="${esc(c)}">저장</button></td>
      <td><button class="btn warn ghost sm" data-act="delete-code" data-code="${esc(c)}">삭제</button></td></tr>`;
  }).join('');
  const wcRows = rows, scRows = '';
  const hiddenList = Array.from(hiddenCodes).filter(c=>!FORCED_HIDDEN.includes(c));
  const hiddenRow = hiddenList.length ? `
  <div class="panel">
    <h3>숨긴 코드 (${hiddenList.length}개)</h3>
    <p class="hint">삭제한 코드예요. 다시 쓰려면 복원하세요.</p>
    <div class="row" style="flex-wrap:wrap;">
      ${hiddenList.map(c=>`<span class="btn ghost sm" style="cursor:default;">${esc(c)} <button class="btn sm" data-act="restore-code" data-code="${esc(c)}" style="margin-left:6px;">복원</button></span>`).join('')}
    </div>
  </div>` : '';
  return `
  <h2 class="pgttl">근태코드 참조</h2>
  <div class="note">근무코드(D/N 등)와 근태코드를 <b>색깔별로</b> 모아 보여줍니다. 설명을 고치고 저장하거나, 삭제 버튼으로 정리할 수 있어요.</div>
  <div class="panel">
    <h3>전체 코드</h3>
    <div class="scrollx"><table class="tbl"><thead><tr><th>코드</th><th>의미/설명</th><th></th><th></th></tr></thead><tbody>${wcRows}${scRows}</tbody></table></div>
    <div class="row" style="margin-top:14px;">
      <button class="btn ghost sm" id="showAddCodeBtn">+ 코드 추가</button>
    </div>
    <div id="addCodeForm" style="display:${addCodeFormOpen?'flex':'none'};gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap;">
      <input type="text" id="newCodeInput" placeholder="코드 (예: HD)" maxlength="8" style="border:1px solid var(--border);border-radius:6px;padding:6px 8px;background:var(--bg);color:var(--text);width:100px;text-transform:uppercase;">
      <input type="text" id="newCodeLabelInput" placeholder="설명 (예: 반차)" style="border:1px solid var(--border);border-radius:6px;padding:6px 8px;background:var(--bg);color:var(--text);width:200px;">
      <button class="btn sm" id="addCodeSaveBtn">추가</button>
      <button class="btn ghost sm" id="addCodeCancelBtn">취소</button>
    </div>
  </div>
  ${hiddenRow}
  `;
}

/* ========================= 배차표 ========================= */
function pageDispatch(){
  if(!dispatchDate) dispatchDate = todayStr();
  const ds = dispatchDate;
  const slots = dispatchShift==='day' ? DAY_SLOTS : NIGHT_SLOTS;
  const [dy,dm,dd] = ds.split('-').map(Number);
  const dateBanner = `${dy}년 ${dm}월 ${dd}일 ${weekdayKr(dy,dm,dd)}요일 · ${dispatchShift==='night' ? '야간(18~07시)' : '주간(07~19시)'}`;

  // 전 직원을 조편성 순서(조 → 순번) 기준으로 정렬해서 항상 표시 (조별 필터 적용)
  const sortedEmployees = employees.slice().filter(e=> !dispatchTeamFilter || (e.team||'')===dispatchTeamFilter).sort((a,b)=>{
    const ta = a.team||'9', tb = b.team||'9';
    if(ta!==tb) return ta<tb?-1:1;
    return (a.teamOrder||999)-(b.teamOrder||999);
  });

  const palette = DISPATCH_CATS.map(c=>`<button type="button" class="dpCatBtn" data-cat="${esc(c.key)}"
      style="background:${c.bg};color:${c.fg};border:2px solid ${dispatchPaint===c.key?'var(--text)':c.border};border-radius:10px;padding:8px 16px;font-weight:700;font-size:13px;cursor:pointer;box-shadow:${dispatchPaint===c.key?'0 0 0 2px var(--accent)':'none'};">${esc(c.key)}</button>`).join('');

  // 빨간 시간 묶음(예: 07·30)의 바깥쪽에만 빨간 테두리: 묶음의 왼쪽 끝 mL, 오른쪽 끝 mR
  const mealEdge = s => {
    const i = slots.indexOf(s);
    if(i<0 || !isMealSlot(s)) return '';
    return (i===0 || !isMealSlot(slots[i-1]) ? ' mL' : '') + (i===slots.length-1 || !isMealSlot(slots[i+1]) ? ' mR' : '');
  };
  function slotCell(empId, s, catKey, note){
    if(isMealSlot(s)){
      return `<td class="dpMeal${mealEdge(s)}"><input type="text" class="dpNote" data-dp-note-emp="${esc(empId)}" data-dp-note-slot="${esc(s)}" value="${esc(note||'')}" maxlength="6"></td>`;
    }
    const cat = dispatchCat(catKey);
    const bg = cat ? cat.bg : 'transparent';
    const fg = cat ? cat.fg : 'var(--text)';
    return `<td class="dpCell${cat?' dpPainted':''}" data-dispatch-emp="${esc(empId)}" data-dispatch-slot="${esc(s)}" data-dispatch-cur="${esc(catKey||'')}"
      style="background:${bg};color:${fg};"${note?` title="${esc(note)}"`:''}>${note?`<span class="dpTxt">${esc(note)}</span>`:''}</td>`;
  }

  // 그 날짜의 OT 순번: 일요일·공휴일이면 휴일 OT 순번, 아니면 평일 OT 순번 (근태관리 집계 기간·조별 순번 기준)
  if(!codeStatsStart || !codeStatsEnd){ const t = new Date(); codeStatsStart = dstr(t.getFullYear(), t.getMonth()+1, 1); codeStatsEnd = dstr(t.getFullYear(), t.getMonth()+1, daysInMonth(t.getFullYear(), t.getMonth()+1)); }
  const dayIsHol = ['SU','H'].includes(dayCategory(ds, false));
  const allSorted = employees.slice().sort((a,b)=>{ const ta=a.team||'9', tb=b.team||'9'; if(ta!==tb) return ta<tb?-1:1; return (a.teamOrder||999)-(b.teamOrder||999); });
  const cd = combinedData(allSorted, codeStatsStart, codeStatsEnd);
  const otRankOf = {};
  cd.perEmp.forEach((r,i)=>{ otRankOf[r.emp.id] = {n: dayIsHol ? cd.rankOtHol[i] : cd.rankOtWk[i], tot: cd.nOtT[cd.teamOf(r)]||0}; });
  const otRankCell = empId => {
    const o = otRankOf[empId]; if(!o || o.n==null) return '';
    const g = dayIsHol ? 'yel' : 'pur';
    return `<span class="rk ${o.n<=3?'t1':(o.n<=Math.ceil(o.tot/2)?'t2':'t3')} g-${g}">${o.n}</span>`;
  };
  const head = `<th class="dpI dpI1">No</th><th class="dpI dpI2">성명</th><th class="dpI dpI3">근태</th><th class="dpI dpI4 gc g-${dayIsHol?'yel':'pur'}" title="근태관리 집계 기간(${esc(codeStatsStart)}~${esc(codeStatsEnd)}) 기준">${dayIsHol?'휴일':'평일'}<br>OT순번</th><th class="dpI dpI5">승무</th>` +
    slots.map(s=>{
      const [hh,mm] = s.split(':');
      const isRed = isMealSlot(s);
      const color = isRed ? '#E03131' : '#000000';
      const cls = 'dpSlotH' + (isRed ? ' dpMealH' + mealEdge(s) : '');
      if(mm==='00'){
        return `<th class="${cls}" style="color:${color};font-size:15px;font-weight:800;">${esc(hh)}</th>`;
      }
      return `<th class="${cls}" style="color:${color};font-size:10px;font-weight:600;">${esc(mm)}</th>`;
    }).join('');

  const slotCounts = slots.map(()=>0); // 시간대(칸)별 배치 인원 수

  const rows = sortedEmployees.map((e,idx)=>{
    const rec = attendance[ds+'_'+e.id] || {};
    const id = `${ds}_${dispatchShift}_${e.id}`;
    const drec = dispatch[id];
    let paintedSlots = 0;
    const cells = slots.map((s,si)=>{
      const v = drec && drec.slots ? (drec.slots[s]||'') : '';
      const note = drec && drec.notes ? (drec.notes[s]||'') : '';
      if(isMealSlot(s)){ if(note) slotCounts[si]++; return slotCell(e.id, s, '', note); }
      if(v){ paintedSlots++; slotCounts[si]++; }
      return slotCell(e.id, s, v, note);
    }).join('');
    // 근태: 월별 근태코드 표와 같은 코드(FC·MC·SC·AV·DN 등). 없으면 교대 순환 근무(D/N)
    const mcode = gridCode(rec && rec.date ? rec : null, ds, String(e.name||'').trim());
    const dcode = mcode || scheduledShift(ds, e.team||'');
    const offDay = !!dcode && !DP_WORK_CODES.has(dcode); // D·N 계열이 아니면(휴무·휴가 등) 행을 흐린 회색으로
    return `<tr class="${offDay ? 'dpOff' : ''}">
      <td class="dpI dpI1">${idx+1}</td>
      <td class="dpI dpI2" style="text-align:left;">${esc(e.name)}</td>
      <td class="dpI dpI3">${mcode ? (DP_WORK_CODES.has(mcode) ? `<b>${esc(mcode)}</b>` : codeBadge(mcode)) : `<span style="color:var(--text-muted);font-weight:700;" title="교대 순환 근무">${esc(dcode)}</span>`}</td>
      <td class="dpI dpI4">${otRankCell(e.id)}</td>
      <td class="dpI dpI5" data-dispatch-suwu="${esc(e.id)}">${paintedSlots?fmtH(paintedSlots*0.5):''}</td>
      ${cells}
    </tr>`;
  }).join('');

  // 지원 인력 - 이름을 직접 입력하는 빈 행 10개
  const SUP_COUNT = 10;
  const supRows = Array.from({length:SUP_COUNT}, (_,i)=>{
    const supId = 'sup'+pad2(i+1);
    const id = `${ds}_${dispatchShift}_${supId}`;
    const drec = dispatch[id];
    const supName = drec && drec.name ? drec.name : '';
    let supPainted = 0;
    const cells = slots.map((s,si)=>{
      const v = drec && drec.slots ? (drec.slots[s]||'') : '';
      const note = drec && drec.notes ? (drec.notes[s]||'') : '';
      if(isMealSlot(s)){ if(note) slotCounts[si]++; return slotCell(supId, s, '', note); }
      if(v){ supPainted++; slotCounts[si]++; }
      return slotCell(supId, s, v, note);
    }).join('');
    const supLabel = i===0 ? `<td class="dpI dpI1" rowspan="${SUP_COUNT}" style="vertical-align:middle;">지원</td>` : '';
    return `<tr>
      ${supLabel}
      <td class="dpI dpI2"><input type="text" data-dispatch-sup="${esc(supId)}" value="${esc(supName)}" placeholder="이름" style="width:66px;border:1px solid var(--border);border-radius:5px;padding:3px 5px;background:var(--bg);color:var(--text);"></td>
      <td class="dpI dpI3"></td><td class="dpI dpI4"></td><td class="dpI dpI5" data-dispatch-suwu="${esc(supId)}">${supPainted?fmtH(supPainted*0.5):''}</td>
      ${cells}
    </tr>`;
  }).join('');

  const countRow = `<tr style="background:var(--bg);">
    <td class="dpI dpI1" colspan="5" style="font-weight:800;">시간대별 인원</td>
    ${slots.map((s,si)=>`<td data-dispatch-count="${esc(s)}"${isMealSlot(s)?` class="dpMealF${mealEdge(s)}"`:''} style="text-align:center;font-weight:800;color:${slotCounts[si]>0?'var(--accent)':'var(--text-muted)'};">${slotCounts[si]||''}</td>`).join('')}
  </tr>`;

  return `
  <h2 class="pgttl">배차표</h2>
  <div class="row" style="margin-bottom:12px;align-items:center;">
    <input type="date" id="dpDate" value="${esc(ds)}" style="border:1px solid var(--border);border-radius:8px;padding:7px 10px;background:var(--bg);color:var(--text);font:inherit;">
    <button class="btn ${dispatchTeamFilter===''?'':'ghost'} sm" data-act="dispatch-team-filter" data-team="">전체</button>
    <button class="btn ${dispatchTeamFilter==='1'?'':'ghost'} sm" data-act="dispatch-team-filter" data-team="1">1조</button>
    <button class="btn ${dispatchTeamFilter==='2'?'':'ghost'} sm" data-act="dispatch-team-filter" data-team="2">2조</button>
  </div>
  <div class="panel" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;">${palette}</div>
  <div style="background:#E8B84B;color:#3a2a00;font-weight:700;font-size:15px;padding:10px 16px;border-radius:8px 8px 0 0;">${esc(dateBanner)}</div>
  ${sortedEmployees.length? `<div class="dpScrollBar">
      <button type="button" class="btn ghost sm" data-dp-scroll="-1">◀ 앞 시간</button>
      <span style="flex:1"></span>
      <button type="button" class="btn ghost sm" data-dp-scroll="1">뒤 시간 ▶</button>
    </div>
    <div class="dpWrap" id="dpWrap"><table class="gtbl" id="dpTable"><thead><tr>${head}</tr></thead><tbody>${rows}${supRows}${countRow}</tbody></table></div>`
    : `<div class="empty">등록된 직원이 없습니다. 먼저 직원 관리에서 직원을 추가하세요.</div>`}
  ${dpPop ? renderDpPop() : ''}
  `;
}

/* ========================= 지원계획표 ========================= */
const SPLAN_ROWS = [
  {key:'capacity', label:'가동대수(입력)', editable:true},
  {key:'quota', label:'정원(입력)', editable:true},
  {key:'offCount', label:'휴무·휴가·기타(입력)', editable:true},
  {key:'leadCount', label:'총괄조장(입력)', editable:true},
  {key:'preSupport', label:'선지원(입력)', editable:true},
  {key:'supportOff', label:'지원휴무(입력)', editable:true},
  {key:'support', label:'지원(입력)', editable:true},
  {key:'avail', label:'지원가능', editable:false},
  {key:'attend', label:'출근원', editable:false},
  {key:'ratio', label:'교대비율', editable:false}
];
function splanCalc(rec){
  const n = k => Number(rec && rec[k]) || 0;
  const avail = n('quota') - n('offCount') - n('supportOff');
  const attend = avail + n('leadCount') + n('preSupport') + n('support');
  const ratio = n('capacity') ? attend / n('capacity') : 0;
  return {avail, attend, ratio};
}
function pageSupportPlan(){
  if(!weekStart) weekStart = mondayOf(todayStr());
  const days = Array.from({length:7}, (_,i)=>addDays(weekStart,i));
  const head = `<th style="text-align:left;">항목</th>` + days.map(ds=>{
    const [y,m,d]=ds.split('-').map(Number);
    return `<th colspan="2">${m}/${d}(${weekdayKr(y,m,d)})</th>`;
  }).join('');
  const subhead = `<th></th>` + days.map(()=>`<th style="font-size:10px;">주</th><th style="font-size:10px;">야</th>`).join('');
  const rows = SPLAN_ROWS.map(rowDef=>{

async function saveTeamOrders(updates){
  if(!requireEdit() || !updates.length) return;
  updates.forEach(u=>{ const e = employees.find(x=>x.id===u.id); if(e){ e.team = u.team; e.teamOrder = u.teamOrder; } }); // 낙관적 로컬 업데이트
  render();
  if(!db) return;
  try{
    await Promise.all(updates.map(u=> db.collection('employees').doc(u.id).set({team:u.team, teamOrder:u.teamOrder}, {merge:true})));
    showToast('순번이 저장되었습니다.');
  }catch(err){ console.error(err); showToast(saveErrMsg('순번 저장에 실패했습니다.', err)); }
}
let teamDrag = null; // {id, fromTeam, target:{team, beforeId|null}}
function teamListOf(teamKey, excludeId){
  return employees.filter(e=>(e.team||'')===teamKey && e.id!==excludeId).sort((a,b)=>(a.teamOrder||999)-(b.teamOrder||999));
}
function clearTeamDropMarks(){
  document.querySelectorAll('.drop-before,.drop-after,.drop-into').forEach(x=>x.classList.remove('drop-before','drop-after','drop-into'));
}
function teamDragMove(clientX, clientY){
  if(!teamDrag) return;
  // 화면 가장자리 근처면 자동 스크롤
  const main = document.getElementById('content');
  const r = main.getBoundingClientRect();
  if(clientY < r.top + 50) main.scrollTop -= 12; else if(clientY > r.bottom - 50) main.scrollTop += 12;
  clearTeamDropMarks();
  const at = document.elementFromPoint(clientX, clientY);
  if(!at){ teamDrag.target = null; return; }
  const row = at.closest('tr[data-emp-row]');
  const zone = at.closest('[data-team-drop]');
  if(row && row.dataset.empRow !== teamDrag.id){
    const rr = row.getBoundingClientRect();
    const after = clientY > rr.top + rr.height/2;
    row.classList.add(after ? 'drop-after' : 'drop-before');
    const teamKey = row.closest('[data-team-drop]').dataset.teamDrop;
    const list = teamListOf(teamKey, teamDrag.id);
    const i = list.findIndex(e=>e.id===row.dataset.empRow);
    teamDrag.target = {team: teamKey, index: after ? i+1 : i};
  } else if(zone && !row){
    zone.classList.add('drop-into');
    teamDrag.target = {team: zone.dataset.teamDrop, index: teamListOf(zone.dataset.teamDrop, teamDrag.id).length};
  } else if(!row){
    teamDrag.target = null;
  }
}
function teamDragEnd(){
  if(!teamDrag) return;
  const {id, fromTeam, target} = teamDrag;
  teamDrag = null;
  clearTeamDropMarks();
  document.querySelectorAll('tr.dragging').forEach(x=>x.classList.remove('dragging'));
  document.body.classList.remove('team-dragging');
  if(!target) return;
  const me = employees.find(e=>e.id===id);
  if(!me) return;
  const updates = [];
  const dest = teamListOf(target.team, id);
  dest.splice(Math.max(0, Math.min(target.index, dest.length)), 0, me);
  dest.forEach((e,i)=>{ if((e.team||'')!==target.team || e.teamOrder!==i+1) updates.push({id:e.id, team:target.team, teamOrder:i+1}); });
  if(target.team !== fromTeam){
    teamListOf(fromTeam, id).forEach((e,i)=>{ if(e.teamOrder!==i+1) updates.push({id:e.id, team:fromTeam, teamOrder:i+1}); });
  }
  saveTeamOrders(updates);
}

    h.onpointermove = (e)=>{ if(teamDrag) teamDragMove(e.clientX, e.clientY); };
    h.onpointerup = ()=> teamDragEnd();
    h.onpointercancel = ()=>{ if(teamDrag){ teamDrag.target = null; teamDragEnd(); } };
  });
}

const round10 = v => Math.round(v/10)*10;
// 명세서에서 직접 입력하는 금액 항목
const PAY_FIXED = [['base','기본급'],['tuition','학자금'],['longevity','근속수당'],['position','직책수당'],['tech','기술수당'],['hazard','고공(위험)수당'],['meal','식대'],['special','특근수당'],['keep','보전수당']];
const RATE_ITEMS = ['base','longevity','position','tech','hazard']; // 통상시급에 들어가는 항목
function payInfo(empId){
  const p = payroll[empId] || {};
  const sum = RATE_ITEMS.reduce((a,k)=> a + (Number(p[k])||0), 0);
  const wage = sum || Number(p.wageTotal) || 0;
  return {p, wage, rate: wage ? Math.round(wage/209) : 0};
}
// 명세서 시간 표기: 시간.분 (28.5시간 → 28.3 = 28시간 30분)
function hm(v){
  if(!v) return '';
  let h = Math.floor(v + 1e-9), m = Math.round((v - h) * 60);
  if(m===60){ h++; m = 0; }
  return m ? `${h}.${String(m).padStart(2,'0').replace(/0$/,'')}` : String(h);
}
function payAmounts(e, start, end){
  const pc = payCalc(e, start, end), info = payInfo(e.id), rate = info.rate;
  const a = {
    ext: rate ? round10(pc.extHours*rate*1.5) : 0,
    night: rate ? round10(pc.wkNight*rate*0.5) : 0,
    hol: rate ? round10((pc.holWork*1.5 + pc.holExtra)*rate) : 0,
    holOT: rate ? round10(pc.holOT*rate*2) : 0,
    holN: rate ? round10(pc.holNight*rate*0.5) : 0,
    etc: rate ? round10(pc.diff*rate) : 0
  };
  a.ot = a.ext + a.night + a.hol + a.holOT + a.holN + a.etc;
  const fixed = PAY_FIXED.reduce((x,[k])=> x + (Number(info.p[k])||0), 0);
  a.gross = a.ot + fixed;
  return {pc, info, rate, a};
}

function payCalc(e, start, end){
  let wk=0, ho=0, sp=0, meal=0;           // 월별 OT현황과 같은 묶음(보전 계산용)
  let holWork=0, holOT=0, holNight=0, holExtra=0, wkNight=0, wkGroupPrem=0;
  for(let ds=start; ds<=end; ds=addDays(ds,1)){
    const rec = attStore[ds+'_'+e.id]; if(!rec) continue;
    const c = computeDaily(rec, ds), p = computeSupportDaily(rec, ds), m = computeMealAllowance(rec);
    if(c.valid){
      if(c.category==='일요일' || c.category==='공휴일'){
        ho += c.premium;
        holWork += c.totalWork - c.overtime; holOT += c.overtime; holNight += c.night;
        holExtra += c.premium - (c.totalWork*1.5 + c.overtime*0.5 + c.night*0.5); // 연근 등 추가분
      } else { wk += c.premium; wkNight += c.night; wkGroupPrem += c.premium; }
    }
    if(p.valid){
      const k = dayCategory(ds, recManguen(rec, ds), rec && rec.employeeId);
      if(k==='SU' || k==='H') ho += p.premium; else sp += p.premium;
      wkNight += p.supNight; wkGroupPrem += p.premium;
    }
    meal += m; wkGroupPrem += m;
  }
  const real = wk + ho + sp + meal;
  const guar = wk + Math.max(ho,60) + Math.max(sp,30) + meal;
  const extHours = Math.max((wkGroupPrem - wkNight*0.5) / 1.5, 0);
  return {real, guar, diff: Math.max(guar-real,0), extHours, wkNight, holWork, holOT, holNight, holExtra};
}

function importAttendanceByName(obj){
  const rows = Array.isArray(obj.rows) ? obj.rows : [];
  const byName = {};
  employees.forEach(e=>{ byName[String(e.name||'').trim()] = e.id; });
  const statusSet = refStatusCodes();
  const ALL_WORK = new Set(WORK_CODES.map(w=>w.code));
  const docs = {}, missing = {}, skippedCodes = {};
  let minD = null, maxD = null, nCode = 0;
  rows.forEach(r=>{
    const id = byName[String(r.name||'').trim()];
    if(!id){ missing[r.name] = (missing[r.name]||0) + 1; return; }
    const {name, code, workCheck, rawCode: _raw, ...fields} = r;
    // 근무코드·근태코드: 근태코드 참조에 있는 것만 반영
    // 근태코드 칸 원래 값은 항상 attCode로 저장(지원근무 일수 계산용 — 참조표·숨김 설정과 무관)
    fields.attCode = code || '';
    if(r.rawCode) fields.rawCode = r.rawCode; // 원본 코드(AV·RV 등 — 연가 누계용)
    if(code){
      if(ALL_WORK.has(code)){ fields.workCode = code; fields.statusCode = ''; nCode++; }
      else if(statusSet.has(code)){ fields.statusCode = code; fields.workCode = (workCheck && ALL_WORK.has(workCheck)) ? workCheck : 'OFF'; nCode++; }
      else {
        skippedCodes[code] = (skippedCodes[code]||0) + 1;
        if(workCheck && ALL_WORK.has(workCheck)){ fields.workCode = workCheck; }
      }
    } else if(workCheck && ALL_WORK.has(workCheck)){
      fields.workCode = workCheck; fields.statusCode = ''; nCode++;
    }
    if(Object.keys(fields).length <= 1) return; // date만 남으면 넣을 게 없음
    docs[r.date+'_'+id] = Object.assign(fields, {employeeId:id, updatedAt:Date.now()});
    if(!minD || r.date<minD) minD = r.date;
    if(!maxD || r.date>maxD) maxD = r.date;
  });
  const n = Object.keys(docs).length;
  const missTxt = Object.keys(missing).length ? ` 직원 명단에 없는 이름(${Object.entries(missing).map(([k,v])=>k+' '+v+'건').join(', ')})은 건너뜁니다.` : '';
  const skipTxt = Object.keys(skippedCodes).length ? ` 근태코드 참조에 없는 코드(${Object.entries(skippedCodes).sort((a,b)=>b[1]-a[1]).map(([k,v])=>k+' '+v+'건').join(', ')})는 넣지 않습니다.` : '';
  if(!n){ showToast('넣을 기록이 없습니다.' + missTxt); return; }
  const codeTxt = obj.includesCodes ? ` 근무코드·근태코드 ${nCode.toLocaleString()}건도 함께 넣습니다.` : ' 근무코드·근태코드는 그대로 둡니다.';
  const empAdj = {}; let nAdj = 0;
  (Array.isArray(obj.adjust) ? obj.adjust : []).forEach(a=>{
    const id = byName[String(a.name||'').trim()];
    if(id){ empAdj[id] = {}; ['supAdj','holAdj','wkAdj','holCntAdj','mcsAdj','wkCntAdj'].forEach(f=>{ if(a[f]!==undefined) empAdj[id][f] = Number(a[f])||0; }); nAdj++; }
  });
  const hol = {};
  (Array.isArray(obj.holidays) ? obj.holidays : []).forEach(h=>{ if(h && h.date) hol[h.date] = {date:h.date, name:h.name||'공휴일'}; });
  const holTxt = Object.keys(hol).length ? ` 원본의 공휴일 ${Object.keys(hol).length}일도 공휴일 관리에 맞춰 넣습니다.` : '';
  const adjTxt = nAdj ? ` 근태관리 보정값(지원·휴일·평일) ${nAdj}명도 넣습니다.` : '';
  appConfirm(`엑셀 DB입력 기록 ${n.toLocaleString()}건(${minD} ~ ${maxD})을 넣을까요?${codeTxt}${holTxt}${adjTxt}${skipTxt}${missTxt}`,
    ()=>{ const up = {attendance: docs}; if(Object.keys(hol).length) up.holidays = hol; if(nAdj) up.employees = empAdj; uploadData(up); });
}
document.addEventListener('click', (e)=>{
  if(e.target.closest('#backupExportBtn')) exportBackup();
  else if(e.target.closest('#backupImportBtn')){ if(!requireEdit()) return; const f=document.getElementById('backupImportFile'); if(f){ f.value=''; f.click(); } }
  else if(e.target.closest('#uploadOldLocalBtn')){
    if(!requireEdit()) return;
    const old = oldLocalData(); if(!old) return;
    appConfirm('이 브라우저의 이전 데이터를 클라우드로 올릴까요? 같은 기록은 덮어씁니다.', ()=> uploadData(old));
  }
});
document.addEventListener('change', (e)=>{
  if(e.target && e.target.id==='backupImportFile') importBackupFile(e.target.files && e.target.files[0]);
});
