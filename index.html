<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SNCT 근태관리</title>
<style>
:root{
  --accent:#1d4ed8; --accent-soft:#eff6ff; --accent-line:#bfdbfe;
  --warn:#b91c1c; --warn-soft:#fef2f2; --warn-line:#fecaca;
  --ok:#047857; --ok-soft:#ecfdf5; --ok-line:#a7f3d0;
  --amber:#b45309; --amber-soft:#fffbeb; --amber-line:#fde68a;
  --night:#4338ca; --night-soft:#eef2ff; --night-line:#c7d2fe;
  --text:#0f172a; --text-muted:#64748b; --border:#e2e8f0; --surface:#fff; --bg:#f1f5f9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --accent:#60a5fa; --accent-soft:#101d33; --accent-line:#1e3a5f;
    --warn:#f87171; --warn-soft:#341316; --warn-line:#7f1d1d;
    --ok:#34d399; --ok-soft:#052a20; --ok-line:#065f46;
    --amber:#fbbf24; --amber-soft:#302205; --amber-line:#78350f;
    --night:#a5b4fc; --night-soft:#1c1a3d; --night-line:#3730a3;
    --text:#e5e9f0; --text-muted:#8b96a8; --border:#2c3646; --surface:#161d2b; --bg:#0c1119;
  }
}
:root[data-theme="dark"]{
  --accent:#60a5fa; --accent-soft:#101d33; --accent-line:#1e3a5f;
  --warn:#f87171; --warn-soft:#341316; --warn-line:#7f1d1d;
  --ok:#34d399; --ok-soft:#052a20; --ok-line:#065f46;
  --amber:#fbbf24; --amber-soft:#302205; --amber-line:#78350f;
  --night:#a5b4fc; --night-soft:#1c1a3d; --night-line:#3730a3;
  --text:#e5e9f0; --text-muted:#8b96a8; --border:#2c3646; --surface:#161d2b; --bg:#0c1119;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body,.tbl th,.tbl td,button,input,select,textarea{word-break:keep-all;overflow-wrap:break-word;}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;margin:0;}
body{background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden;
  font-family:'맑은 고딕','Malgun Gothic',Pretendard,-apple-system,sans-serif;font-size:14px;line-height:1.55;}

header.app{flex:0 0 auto;background:var(--surface);border-bottom:3px solid var(--accent);
  display:flex;align-items:center;gap:12px;padding:calc(9px + env(safe-area-inset-top,0px)) 16px 9px;z-index:300;}
header.app .badge{background:var(--accent);color:#fff;font-size:10px;font-weight:700;
  letter-spacing:.06em;padding:2px 7px;border-radius:3px;margin-right:6px;vertical-align:2px;}
header.app h1{margin:0;font-size:17px;letter-spacing:-.02em;}
header.app .sub{color:var(--text-muted);font-size:11.5px;margin-top:1px;}
header.app .spacer{flex:1 1 auto;}
header.app .status{font-size:11px;color:var(--text-muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
header.app .status .btn{padding:4px 9px;font-size:11px;white-space:nowrap;}
header.app .status span{white-space:nowrap;}
@media (max-width:700px){
  header.app .sub{display:none;}
  header.app h1{font-size:15px;white-space:nowrap;}
  header.app .status .conn-txt{display:none;}
  header.app .status{gap:5px;}
}
header.app .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none;}
header.app .dot.off{background:var(--text-muted);}
.menu-btn{display:none;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);
  border-radius:7px;width:38px;height:38px;font-size:16px;cursor:pointer;flex:none;}

.layout{flex:1 1 auto;display:flex;min-height:0;}
nav#nav{flex:0 0 218px;width:218px;background:var(--surface);border-right:1px solid var(--border);
  overflow-y:auto;padding:14px 10px 30px;}
nav#nav .navttl{font-size:10.5px;font-weight:700;color:var(--text-muted);letter-spacing:.4px;padding:6px 10px;}
nav#nav a{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:8px;text-decoration:none;
  color:var(--text);font-size:13.5px;margin-bottom:2px;cursor:pointer;min-height:40px;}
nav#nav a:hover{background:var(--accent-soft);color:var(--accent);}
nav#nav a.on{background:var(--accent);color:#fff;font-weight:700;}
nav#nav a .ic{flex:none;width:20px;text-align:center;}

main#content{flex:1 1 auto;min-width:0;overflow-y:auto;padding:22px 26px 60px;}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:250;}

h2.pgttl{margin:0 0 3px;font-size:19px;letter-spacing:-.01em;}
p.pgsub{margin:0 0 18px;color:var(--text-muted);font-size:12.5px;}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:22px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;}
.card .n{font-size:24px;font-weight:700;letter-spacing:-.02em;}
.card .l{font-size:11.5px;color:var(--text-muted);margin-top:2px;}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:18px;}
.panel h3{margin:0 0 12px;font-size:14px;}

.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;}
.field{display:flex;flex-direction:column;gap:4px;min-width:120px;}
.field label{font-size:11.5px;color:var(--text-muted);}
.field input,.field select,.field textarea{border:1px solid var(--border);border-radius:8px;padding:8px 10px;
  font-size:13.5px;background:var(--bg);color:var(--text);font-family:inherit;}
.field textarea{min-height:56px;resize:vertical;}
.field.grow{flex:1 1 200px;}

.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:9px 16px;
  font-size:13px;font-weight:700;cursor:pointer;}
.btn.ghost{background:var(--surface);color:var(--accent);}
.btn.warn{background:var(--warn);border-color:var(--warn);}
.btn.warn.ghost{background:var(--surface);color:var(--warn);border-color:var(--warn-line);}
.btn.sm{padding:5px 10px;font-size:11.5px;border-radius:6px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.gridCodeOpt:hover{background:var(--bg);}

.badge-code{display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;
  border-radius:6px;padding:2px 7px;border:1px solid transparent;}
.bc-D{background:var(--amber-soft);color:var(--amber);border-color:var(--amber-line);}
.bc-N{background:var(--night-soft);color:var(--night);border-color:var(--night-line);}
.bc-OFF{background:var(--bg);color:var(--text-muted);border-color:var(--border);}
.bc-DN{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line);}
.bc-ND{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line);}
.bc-DS{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line);}
.bc-NS{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line);}
.bc-IN{background:var(--bg);color:var(--text);border-color:var(--border);}
.bc-status{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line);}

table.tbl{border-collapse:collapse;width:100%;font-size:12.5px;}
.tbl th,.tbl td{border:1px solid var(--border);padding:6px 8px;text-align:left;white-space:nowrap;}
.tbl th{background:var(--bg);font-weight:700;color:var(--text-muted);font-size:11.5px;}
.scrollx{overflow-x:auto;max-width:100%;border-radius:10px;}
.gridwrap{border:2px solid var(--text);border-radius:10px;}

.gridwrap table.gtbl{border-collapse:collapse;font-size:11.5px;}
.gtbl th,.gtbl td{border:1px solid var(--border);padding:0;text-align:center;}
.gtbl th{background:var(--bg);color:var(--text-muted);font-weight:700;padding:5px 3px;position:sticky;top:0;z-index:2;}
.gtbl td.namecell{background:var(--surface);text-align:left;padding:6px 10px;font-weight:700;white-space:nowrap;
  position:sticky;left:0;z-index:1;}
.gtbl th.namehead{position:sticky;left:0;top:0;z-index:3;text-align:left;padding:6px 10px;}
.gtbl td.daycell{width:34px;height:34px;cursor:pointer;}
.gtbl td.daycell:hover{outline:2px solid var(--accent);outline-offset:-2px;}
.gtbl th.weekday,.tbl th.weekday{color:var(--text);}
.gtbl th.sunday,.tbl th.sunday{color:var(--warn);}
.gtbl th.saturday,.tbl th.saturday{color:var(--accent);}
.gtbl th.holiday,.tbl th.holiday{color:var(--warn);font-weight:800;}
.gtbl td.sunday,.tbl td.sunday{color:var(--warn);}
.gtbl td.saturday,.tbl td.saturday{color:var(--accent);}
.gtbl td.holiday,.tbl td.holiday{color:var(--warn);}
.daycell .mini{font-size:10.5px;font-weight:700;}
.daycell .mini2{font-size:8.5px;color:var(--text-muted);display:block;}
/* 근태관리(통합) 화면: 좌(집계)·우(월별표) 표의 행 높이/글자 크기를 강제로 맞춤 */
.ctbl.gtbl th,.ctbl.gtbl td{height:30px !important;font-size:10.5px !important;padding:2px 3px !important;box-sizing:border-box;}
.ctbl.gtbl td.namecell,.ctbl.gtbl th.namehead{padding:2px 8px !important;font-size:11px !important;}
.ctbl.gtbl td.daycell{width:30px !important;}

.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:11.5px;color:var(--text-muted);align-items:center;}
.legend .sw{display:inline-flex;align-items:center;gap:4px;}

.empty{color:var(--text-muted);font-size:12.5px;padding:20px;text-align:center;border:1px dashed var(--border);border-radius:10px;}
.hint{font-size:11.5px;color:var(--text-muted);margin-top:8px;}
.note{background:var(--amber-soft);border:1px solid var(--amber-line);color:var(--amber);border-radius:8px;
  padding:9px 12px;font-size:12px;margin-bottom:14px;}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--surface);
  padding:9px 16px;border-radius:8px;font-size:12.5px;z-index:400;opacity:0;pointer-events:none;transition:opacity .25s;}
.toast.show{opacity:1;}

@media (max-width:860px){
  .menu-btn{display:flex;align-items:center;justify-content:center;}
  nav#nav{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .2s;
    z-index:260;padding-top:calc(14px + env(safe-area-inset-top,0px));box-shadow:0 0 24px rgba(0,0,0,.25);}
  nav#nav.open{transform:translateX(0);}
  .scrim.show{display:block;}
  main#content{padding:16px 14px 50px;}
}
</style>
</head>
<body>
<header class="app">
  <button class="menu-btn" id="menuBtn" aria-label="메뉴">☰</button>
  <h1><span class="badge">근태관리</span>SNCT 근태관리</h1>
  <div class="sub" id="headerSub">선광신컨테이너터미널 · STS파트</div>
  <div class="spacer"></div>
  <div class="status" id="dbStatus"><span class="dot off"></span>연결 확인 중…</div>
</header>
<div class="layout">
  <nav id="nav">
    <div class="navttl">근태관리</div>
    <a data-view="input"><span class="ic">✏️</span>출퇴근 입력</a>
    <a data-view="combined"><span class="ic">📋</span>근태관리</a>
    <a data-view="ot"><span class="ic">🧮</span>월별 OT현황</a>
    <div class="navttl" style="margin-top:10px;">조장관리</div>
    <a data-view="dispatch"><span class="ic">🚧</span>배차표</a>
    <a data-view="splan"><span class="ic">📋</span>지원계획표</a>
    <div class="navttl" style="margin-top:10px;">조장 운영</div>
    <a data-view="team"><span class="ic">🧩</span>조편성 관리</a>
    <a data-view="holidays"><span class="ic">📅</span>공휴일 관리</a>
    <a data-view="codes"><span class="ic">🏷️</span>근태코드 참조</a>
    <div class="navttl" style="margin-top:10px;">데이터</div>
    <a data-view="backup"><span class="ic">💾</span>백업·복원</a>
  </nav>
  <main id="content"></main>
</div>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast"></div>

<script>
/* ========================= 상태 ========================= */
let VIEW = 'input';
let db = null, userCap = null, dbReady = false;
let employees = [];        // [{id,name,part,order,active}]
let holidays = {};         // dateStr -> name
let codeDefs = {};         // code -> {code,label}
let hiddenCodes = new Set(); // 근무코드/근태코드 중 사용자가 "삭제"해서 목록·선택창에서 숨긴 코드들
let attendance = {};       // `${date}_${empId}` -> record
let curYear = 2026, curMonth = 9; // 표시 중인 년/월 (grid + input 기본값)
let unsub = { emp:null, hol:null, code:null, att:null, dispatch:null, splan:null, codeStats:null, otMatrix:null, hiddenCodes:null };
let prefill = null; // {date, employeeId} - 그리드에서 셀 클릭 시 입력화면 프리필
let inputViewDate = null, inputViewEmp = null; // 출퇴근 입력화면에서 마지막으로 보던 날짜/직원 (재렌더 시에도 유지)
let combinedTeamFilter = ''; // 근태관리 표: '' (전체), '1', '2'
let teamOtFilter = ''; // 조별 월간집계: '' (전체), '1', '2'
let otMatrixStart = null, otMatrixEnd = null; // 월별 OT현황: 작업기간
let otPayYear = null, otPayMonth = null; // 월별 OT현황: 임금월(예: "10월"=9/26~10/25) 기준 연/월
let otTeamFilter = ''; // 월별 OT현황: '' (전체), '1', '2'
let dispatchTeamFilter = ''; // 배차표: '' (전체), '1', '2'
let addCodeFormOpen = false; // 근태코드 참조: 코드 추가 폼 표시 여부
// 임금월 계산: "M월"은 (M-1월)26일 ~ M월25일
function payPeriodRange(y,m){
  let sy=y, sm=m-1;
  if(sm<1){ sm=12; sy=y-1; }
  return [dstr(sy,sm,26), dstr(y,m,25)];
}
let otMatrixAttendance = {}; // 기사별 OT현황 전용 출퇴근 데이터(작업기간 전체 구독)
let holYearFilter = null;
let dispatchDate = null, dispatchShift = 'day', dispatchPaint = '초반'; // 배차표 화면 상태
let paintSession = null; // {empId, changes:{slot:value}} - 배차표 드래그 색칠 중 임시 상태
let gridEdit = null; // {date, employeeId} - 월별표에서 셀 클릭 시 근무코드/근태코드 인라인 편집
let otDetailEmpId = null; // 기사별 OT현황: 달력 상세보기 중인 직원
let codeStatsIncludeMeal = true; // 근태코드 집계: 평일OT에 식사연장(식사계) 포함 여부
let codeStatsStart = null, codeStatsEnd = null; // 근태코드 집계: 집계 기간(시작~종료)
let codeStatsAttendance = {}; // 근태코드 집계 전용 출퇴근 데이터 (선택한 기간 전체를 별도로 구독)
let dispatch = {}; // `${date}_${shift}_${empId}` -> {slots:{slot:catKey}}
let weekStart = null; // 지원계획표 화면 상태 (해당 주의 월요일, YYYY-MM-DD)
let supportPlan = {}; // `${date}_${shift}` -> {capacity,quota,offCount,leadCount,preSupport,supportOff,support}
const DAY_SLOTS = ['07:00','07:30','08:00','08:30','09:00','09:30','10:00','10:30','11:00','11:30','12:00','12:30','13:00','13:30','14:00','14:30','15:00','15:30','16:00','16:30','17:00','17:30','18:00','18:30','19:00'];
const NIGHT_SLOTS = ['18:00','18:30','19:00','19:30','20:00','20:30','21:00','21:30','22:00','22:30','23:00','23:30','24:00','00:30','01:00','01:30','02:00','02:30','03:00','03:30','04:00','04:30','05:00','05:30','06:00','06:30','07:00'];
const DISPATCH_CATS = [
  {key:'수정', bg:'#FFFFFF', fg:'#333333', border:'#c7cad1'},
  {key:'초반', bg:'#8CE24C', fg:'#1a3d00', border:'#8CE24C'},
  {key:'후반', bg:'#FFA654', fg:'#5c2d00', border:'#FFA654'},
  {key:'당직', bg:'#8C8C8C', fg:'#ffffff', border:'#8C8C8C'},
  {key:'정비', bg:'#F3B3F3', fg:'#5c005c', border:'#F3B3F3'},
  {key:'기타', bg:'#7A2FA8', fg:'#ffffff', border:'#7A2FA8'}
];
function dispatchCat(key){ return DISPATCH_CATS.find(c=>c.key===key); }
function currentEmpSlots(empId){
  const id = `${dispatchDate}_${dispatchShift}_${empId}`;
  const base = (dispatch[id] && dispatch[id].slots) || {};
  const overlay = (paintSession && paintSession.empId===empId) ? paintSession.changes : {};
  return Object.assign({}, base, overlay);
}
function countPaintedHours(empId){
  const slots = currentEmpSlots(empId);
  let n = 0;
  for(const k in slots){ if(slots[k]) n++; }
  return n*0.5;
}
function applyPaintToCell(td, value){
  const cat = dispatchCat(value);
  td.style.background = cat ? cat.bg : 'transparent';
  td.style.color = cat ? cat.fg : 'var(--text)';
  td.dataset.dispatchCur = value || '';
}
function updateSuwuLive(empId){
  const cell = document.querySelector(`[data-dispatch-suwu="${empId}"]`);
  if(cell) cell.textContent = fmtH(countPaintedHours(empId));
}
function updateCountLive(slot){
  const cells = document.querySelectorAll(`.dpCell[data-dispatch-slot="${slot}"]`);
  let cnt = 0;
  cells.forEach(td=>{ if(td.dataset.dispatchCur) cnt++; });
  const countCell = document.querySelector(`[data-dispatch-count="${slot}"]`);
  if(countCell){
    countCell.textContent = cnt || '';
    countCell.style.color = cnt>0 ? 'var(--accent)' : 'var(--text-muted)';
  }
}
function dispatchPaintValue(){ return dispatchPaint==='수정' ? '' : dispatchPaint; }
function dispatchStartPaint(td){
  if(!td || !td.classList.contains('dpCell')) return;
  if(!canEdit){ requireEdit(); return; }
  const empId = td.dataset.dispatchEmp, slot = td.dataset.dispatchSlot;
  paintSession = {empId, changes:{}};
  paintSession.changes[slot] = dispatchPaintValue();
  applyPaintToCell(td, paintSession.changes[slot]);
  updateSuwuLive(empId);
  updateCountLive(slot);
}
function dispatchContinuePaint(td){
  if(!paintSession || !td || !td.classList.contains('dpCell')) return;
  if(td.dataset.dispatchEmp !== paintSession.empId) return;
  const slot = td.dataset.dispatchSlot;
  if(slot in paintSession.changes) return;
  paintSession.changes[slot] = dispatchPaintValue();
  applyPaintToCell(td, paintSession.changes[slot]);
  updateSuwuLive(paintSession.empId);
  updateCountLive(slot);
}
function dispatchFinishPaint(){
  if(!paintSession) return;
  const {empId, changes} = paintSession;
  paintSession = null;
  saveDispatchSlots(dispatchDate, dispatchShift, empId, changes);
}
function mondayOf(dateStr){
  const [y,m,d]=dateStr.split('-').map(Number);
  const dt=new Date(y,m-1,d);
  const wd=dt.getDay(); // 0=일
  const diff = wd===0 ? -6 : 1-wd;
  dt.setDate(dt.getDate()+diff);
  return dstr(dt.getFullYear(), dt.getMonth()+1, dt.getDate());
}
function addDays(dateStr, n){
  const [y,m,d]=dateStr.split('-').map(Number);
  const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n);
  return dstr(dt.getFullYear(), dt.getMonth()+1, dt.getDate());
}
// 날짜를 n개월 이동(일자는 최대한 유지, 말일 초과시 그 달 말일로 보정)
function shiftMonth(dateStr, n){
  const [y,m,d] = dateStr.split('-').map(Number);
  let ny=y, nm=m+n;
  while(nm>12){ nm-=12; ny++; }
  while(nm<1){ nm+=12; ny--; }
  const nd = Math.min(d, daysInMonth(ny,nm));
  return dstr(ny, nm, nd);
}
// 기간을 n개월 이동. "1일~말일" 한 달 전체 기간이면 이동 후에도 그 달의 1일~말일로 맞춤(8/31, 2/29 등 누락 방지)
function shiftRangeMonth(start, end, n){
  const [sy,sm,sd] = start.split('-').map(Number);
  const [ey,em,ed] = end.split('-').map(Number);
  if(sd===1 && sy===ey && sm===em && ed===daysInMonth(ey,em)){
    const ns = shiftMonth(start, n);
    const [ny,nm] = ns.split('-').map(Number);
    return [ns, dstr(ny,nm,daysInMonth(ny,nm))];
  }
  return [shiftMonth(start,n), shiftMonth(end,n)];
}

function dateAt(dateStr, h, m, addDay){
  const [y,mo,d] = dateStr.split('-').map(Number);
  return new Date(y, mo-1, d + (addDay||0), h, m||0);
}
// 분 반올림 규칙: 1~29분→30분, 31~59분→다음 시(0분). 0/30분은 그대로.
function normalizeHM(h,m){
  h = Math.round(h); m = Math.round(m);
  if(m>=1 && m<=29) m = 30;
  else if(m>=31 && m<=59){ h += 1; m = 0; }
  let dayOffset = 0;
  while(h > 24){ h -= 24; dayOffset += 1; }
  return {h, m, dayOffset};
}
// 입력값은 "H:MM" (H=1~24, M=00 또는 30) 체계 — 원본 엑셀의 HH.MM(24시=자정) 표기와 동일한 규칙
function parseHM(dateStr, hm){
  if(!hm) return null;
  let [h,m] = hm.split(':').map(Number);
  if(isNaN(h) || isNaN(m)) return null;
  const norm = normalizeHM(h,m);
  const dayOffset = (norm.h===24 ? 1 : 0) + norm.dayOffset;
  const realHour = norm.h===24 ? 0 : norm.h;
  return dateAt(dateStr, realHour, norm.m, dayOffset);
}
function toDec(hm){
  let [h,m] = hm.split(':').map(Number);
  const norm = normalizeHM(h,m);
  return norm.h + norm.m/60;
}

function dayCategory(dateStr, manguen){
  const [wy,wm,wd] = dateStr.split('-').map(Number);
  const w = new Date(wy, wm-1, wd).getDay(); // 0=일 6=토, 타임존 안전 파싱
  const isHoliday = !!holidays[dateStr];
  if(w===0) return 'SU';
  if(isHoliday) return 'H';
  if(w===6) return manguen ? 'SA' : 'W'; // 만근(이번주 평일 개근) 체크된 토요일만 특근(SA)으로 인정
  return 'W';
}
// 하루치 근태 기록으로부터 근무시간/초과/심야/가산시간을 계산 (원본 DB입력 수식 100% 대조 검증됨)
function computeDaily(rec, dateStr){
  const zero = {totalWork:0, meal:0, overtime:0, night:0, category:'-', premium:0, valid:false};
  if(!rec || rec.workCode==='OFF' || !rec.checkIn || !rec.checkOut) return zero;

  const checkinDec = toDec(rec.checkIn);
  let start;
  if(checkinDec<=14) start = dateAt(dateStr,8,0);
  else if(checkinDec<=24) start = dateAt(dateStr,19,0);
  else return zero;

  let actualEnd = parseHM(dateStr, rec.checkOut);
  if(!actualEnd) return zero;
  if(actualEnd<=start) actualEnd = new Date(actualEnd.getTime()+24*3600000);
  const checkoutDec = toDec(rec.checkOut);

  const kcat = dayCategory(dateStr, rec.manguen);

  let guaranteedEnd = actualEnd;
  if(kcat==='SU' || kcat==='H'){
    if((rec.workCode==='D'||rec.workCode==='DN') && checkoutDec>8 && checkoutDec<12){
      guaranteedEnd = dateAt(dateStr,12,0);
    }
    if((rec.workCode==='N'||rec.workCode==='ND') && checkoutDec>=19 && checkoutDec<=24){
      guaranteedEnd = dateAt(dateStr,0,0,1); // 24:00 = 익일 00:00
    }
  }

  let meal = 0;
  const noon12=dateAt(dateStr,12,0), noon13=dateAt(dateStr,13,0);
  if(start<noon12 && guaranteedEnd>noon13) meal+=1;
  const eve18=dateAt(dateStr,18,0), eve19=dateAt(dateStr,19,0);
  if(start<eve18 && guaranteedEnd>eve19) meal+=1;
  const next1=dateAt(dateStr,1,0,1);
  if(guaranteedEnd>=next1) meal+=1;

  const raw = (guaranteedEnd-start)/3600000;
  const totalWork = Math.max(raw - meal, 0);
  const overtime = Math.max(totalWork - 8, 0);

  const night22=dateAt(dateStr,22,0), next6=dateAt(dateStr,6,0,1);
  let night = 0;
  const wsExists = guaranteedEnd>night22, weExists = actualEnd>night22;
  if(wsExists && weExists){
    const ws = start>night22 ? start : night22;
    const we = actualEnd<next6 ? actualEnd : next6;
    const wm = rec.yasik ? 0 : (guaranteedEnd>=next1 ? 1 : 0);
    night = Math.max((we-ws)/3600000 - wm, 0);
  }

  let category, premium;
  if(kcat==='SU' || kcat==='H'){
    const mult = rec.extCode ? 2 : 1.5;
    premium = totalWork*mult + overtime*0.5 + night*0.5;
    category = kcat==='SU' ? '일요일' : '공휴일';
  } else if(kcat==='SA'){
    premium = totalWork*1.5 + night*0.5;
    category = '토요일';
  } else {
    premium = rec.extCode ? (totalWork*1.5+night*0.5) : (overtime*1.5+night*0.5);
    category = '평일';
  }
  return {totalWork, meal, overtime, night, category, premium, valid:true};
}
function fmtH(n){ return (Math.round(n*10)/10).toFixed(1); }

// 조출/석출/중식/야식 - 각 1건당 1.5시간 가산 (원본 식사계 = SUM(조출,석출,중식,야식)*1.5)
function computeMealAllowance(rec){
  if(!rec) return 0;
  const cnt = [rec.jochul, rec.seokchul, rec.jungsik, rec.yasik].filter(Boolean).length;
  return cnt * 1.5;
}

// 지원출근/지원퇴근 기준 지원근무 가산시간 계산 (본조보상/타조보상 수동입력 포함, 100% 대조 검증됨)
function computeSupportDaily(rec, dateStr){
  const zero = {supTotal:0, supOT:0, supNight:0, premium:0, valid:false};
  if(!rec) return zero;
  const honjo = Number(rec.honjoComp)||0, tajo = Number(rec.tajoComp)||0;
  const hasSupportShift = !!(rec.supportIn && rec.supportOut);
  if(!hasSupportShift && honjo===0 && tajo===0) return zero;

  let supTotal=0, supOT=0, supNight=0;
  let shiftParsed = false;
  if(hasSupportShift){
    let start = parseHM(dateStr, rec.supportIn);
    let end = parseHM(dateStr, rec.supportOut);
    if(start && end){
      shiftParsed = true;
      if(end <= start) end = new Date(end.getTime() + 24*3600000);

      const totalRaw = (end-start)/3600000;
      let meal = 0;
      const noon12=dateAt(dateStr,12,0), noon13=dateAt(dateStr,13,0);
      if(start<noon12 && end>noon13) meal+=1;
      const eve18=dateAt(dateStr,18,0), eve19=dateAt(dateStr,19,0);
      if(start<eve18 && end>eve19) meal+=1;
      const next1=dateAt(dateStr,1,0,1);
      if(end>=next1) meal+=1;
      supTotal = Math.max(totalRaw - meal, 0);
      supOT = Math.max(supTotal - 8, 0);

      const night22=dateAt(dateStr,22,0), next6=dateAt(dateStr,6,0,1);
      if(end>night22){
        const ws = start>night22 ? start : night22;
        const we = end<next6 ? end : next6;
        const wm = rec.yasik ? 0 : (end>=next1 ? 1 : 0);
        supNight = Math.max((we-ws)/3600000 - wm, 0);
      }
    }
  }

  const kcat = dayCategory(dateStr, rec.manguen);
  let premium;
  if(shiftParsed){
    if(kcat==='SU' || kcat==='H' || kcat==='SA'){
      premium = (8 + supOT + tajo)*2 + honjo*1.5 + supNight*0.5;
    } else {
      premium = (8 + supOT + tajo + honjo)*1.5 + supNight*0.5;
    }
  } else {
    // 실제 지원근무 없이(또는 시간 파싱 불가) 본조보상/타조보상만 입력된 경우: 그 시간만큼만 가산 배율 적용
    const mult = (kcat==='SU' || kcat==='H' || kcat==='SA') ? 2 : 1.5;
    premium = (honjo + tajo) * mult;
  }
  return {supTotal, supOT, supNight, premium, valid:true};
}

    fs = fsM.initializeFirestore(app, {ignoreUndefinedProperties:true,

// 기존 코드가 쓰던 db.collection().doc().get/set/onSnapshot 형태를 그대로 유지하는 어댑터
function createFirebaseDb(){
  const {fsM, fs} = fb;
  const wrapDoc = snap => ({exists: snap.exists(), id: snap.id, data: ()=>snap.data()});
  const wrapQuery = snap => ({docs: snap.docs.map(d=>({id:d.id, data:()=>d.data()}))});
  function docRef(coll, id){
    const ref = fsM.doc(fs, coll, id);
    return {
      async get(){ return wrapDoc(await fsM.getDoc(ref)); },
      set(val, opts){ return fsM.setDoc(ref, val, opts||{}); },
      update(val){ return fsM.setDoc(ref, val, {merge:true}); },
      delete(){ return fsM.deleteDoc(ref); },
      onSnapshot(cb, errCb){ return fsM.onSnapshot(ref, snap=>cb(wrapDoc(snap)), errCb); }
    };
  }
  function collectionRef(name, cons){
    cons = cons || [];
    const q = ()=> fsM.query(fsM.collection(fs, name), ...cons);
    return {
      doc(id){ return docRef(name, id); },
      where(f, op, v){ return collectionRef(name, cons.concat([fsM.where(f, op, v)])); },
      orderBy(f, dir){ return collectionRef(name, cons.concat([fsM.orderBy(f, dir||'asc')])); },
      async get(){ return wrapQuery(await fsM.getDocs(q())); },
      onSnapshot(cb, errCb){ return fsM.onSnapshot(q(), snap=>cb(wrapQuery(snap)), errCb); }
    };
  }
  const COLLS = ['employees','holidays','codeDefs','attendance','dispatch','supportPlan','meta'];
  return {
    collection(name){ return collectionRef(name); },
    doc(path){ const [c, id] = path.split('/'); return docRef(c, id); },
    async exportAll(){
      const out = {};
      for(const n of COLLS){
        const snap = await fsM.getDocs(fsM.collection(fs, n));
        out[n] = {};
        snap.docs.forEach(d=>{ out[n][d.id] = d.data(); });
      }
      return out;
    },
    async importAll(data, onProgress){
      const items = [];
      for(const n of COLLS){ for(const [id, v] of Object.entries(data[n]||{})){ if(v && typeof v==='object') items.push([n, id, v]); } }
      for(let i=0; i<items.length; i+=400){
        const batch = fsM.writeBatch(fs);
        items.slice(i, i+400).forEach(([n, id, v])=> batch.set(fsM.doc(fs, n, id), v));
        await batch.commit();
        if(onProgress) onProgress(Math.min(i+400, items.length), items.length);
      }
      return items.length;
    }
  };
}

async function trySeed(){
  if(!db || !canEdit) return;
  try{
    const marker = await db.doc('meta/seed').get();
    if(!marker.exists){
      for(let i=0;i<SEED_EMPLOYEES.length;i++){
        await db.collection('employees').doc('e'+pad2(i+1)).set({name:SEED_EMPLOYEES[i], part:'STS', order:i+1, active:true, union:'1', team:'', teamRole:'조원', teamOrder:i+1, teamNote:''});
      }
      for(const [d,n] of SEED_HOLIDAYS_2026){
        await db.collection('holidays').doc(d).set({date:d, name:n});
      }
      await db.doc('meta/seed').set({seededAt: Date.now()});
    }
    // 근태코드 실제 의미(코드표) 반영 - 최초 1회만 채움, 이후 사용자가 참조표에서 수정한 값은 덮어쓰지 않음
    const codeMarker = await db.doc('meta/codeLabelsV2').get();

      for(const c of STATUS_CODE_LIST){
        await db.collection('codeDefs').doc(c).set({code:c, label:CODE_LABELS[c]||''});
      }
      await db.doc('meta/codeLabelsV2').set({seededAt: Date.now()});
    }
    // 노조 소속 기본값(원본 노조 시트 기준 전원 1조) - 기존에 union 필드가 없던 직원에 한해 1회만 채움
    const unionMarker = await db.doc('meta/unionSeedV1').get();
    if(!unionMarker.exists){
      const empSnap = await db.collection('employees').get();
      for(const d of empSnap.docs){
        if(d.data().union==null){
          await db.collection('employees').doc(d.id).update({union:'1'});
        }
      }
      await db.doc('meta/unionSeedV1').set({seededAt: Date.now()});
    }
    // 조편성 순번/직책 수기 입력 반영 (사용자 지정: 1조 서인기1번(조장)·김성용2번(조원)·김기영3번(조원))
    const teamMarker = await db.doc('meta/teamOrderSeedV1').get();
    if(!teamMarker.exists){
      const teamData = {'서인기':{team:'1',teamOrder:1,teamRole:'조장'}, '김성용':{team:'1',teamOrder:2,teamRole:'조원'}, '김기영':{team:'1',teamOrder:3,teamRole:'조원'}};
      const empSnap2 = await db.collection('employees').get();
      for(const d of empSnap2.docs){
        const nm = d.data().name;
        if(teamData[nm]){
          await db.collection('employees').doc(d.id).update(teamData[nm]);
        }
      }
      await db.doc('meta/teamOrderSeedV1').set({seededAt: Date.now()});
    }
    // (삭제·이름변경한 직원이 되살아나던 '기본 명단 강제 보충' 로직은 제거함)
  }catch(e){ /* 동시 시딩 등은 무시 */ }
}

let recentlyDeleted = {}; // key -> timestamp, 삭제 직후 지연 도착한 스냅샷이 데이터를 되살리는 것을 잠깐 방지
function markRecentlyDeleted(key){
  recentlyDeleted[key] = Date.now();
  setTimeout(()=>{ if(recentlyDeleted[key]) delete recentlyDeleted[key]; }, 8000);
}
// 출퇴근 기록: 필요한 달만 실시간 구독하고(읽기 비용 절약), 모든 화면이 하나의 공유 캐시를 사용.
// 저장은 항상 '해당 화면이 다루는 항목만 병합(merge)'하므로, 캐시에 없던 기록도 덮어써지지 않음.
const attStore = {};
attendance = attStore; codeStatsAttendance = attStore; otMatrixAttendance = attStore;
const ATT_DEFAULTS = {workCode:'OFF', statusCode:'', note:'', extCode:false, manguen:false};
function normAtt(v){ return Object.assign({}, ATT_DEFAULTS, v); }
const monthSubs = new Map(); // 'YYYY-MM' -> unsubscribe
const MONTH_SUB_MAX = 14;
function nextYm(ym){ const [y,m] = ym.split('-').map(Number); return m===12 ? `${y+1}-01` : `${y}-${pad2(m+1)}`; }
function ensureAttendanceRange(start, end){
  if(!db || !start || !end) return;
  if(end < start) [start, end] = [end, start];
  let ym = start.slice(0,7), guard = 0;
  const endYm = end.slice(0,7);
  while(ym <= endYm && guard++ < 12){ ensureMonth(ym); ym = nextYm(ym); }
}
function ensureMonth(ym){
  if(monthSubs.has(ym)){ const fn = monthSubs.get(ym); monthSubs.delete(ym); monthSubs.set(ym, fn); return; }
  const [y,m] = ym.split('-').map(Number);
  const fn = db.collection('attendance').where('date','>=',ym+'-01').where('date','<=',dstr(y,m,daysInMonth(y,m)))
    .onSnapshot(snap=>{
      const seen = new Set(), now = Date.now();
      snap.docs.forEach(d=>{
        const delAt = recentlyDeleted[d.id];
        if(delAt && now - delAt < 8000) return; // 방금 삭제한 기록은 잠깐 무시
        seen.add(d.id);
        attStore[d.id] = normAtt(d.data());
      });
      Object.keys(attStore).forEach(k=>{ if(k.startsWith(ym) && !seen.has(k)) delete attStore[k]; });
      scheduleRender();
    }, dbErr);
  monthSubs.set(ym, fn);
  while(monthSubs.size > MONTH_SUB_MAX){
    const [oldYm, oldFn] = monthSubs.entries().next().value;
    oldFn(); monthSubs.delete(oldYm);
    Object.keys(attStore).forEach(k=>{ if(k.startsWith(oldYm)) delete attStore[k]; });
  }
}
function ensureForView(){
  if(!dbReady) return;
  if(VIEW==='input'){ const d = (prefill && prefill.date) || inputViewDate || todayStr(); ensureAttendanceRange(d, d); }
  else if(VIEW==='grid'){ const d = dstr(curYear,curMonth,1); ensureAttendanceRange(d, d); }
  else if(VIEW==='combined' || VIEW==='codestats'){ if(codeStatsStart && codeStatsEnd) ensureAttendanceRange(codeStatsStart, codeStatsEnd); }
  else if(VIEW==='ot'){ if(otMatrixStart && otMatrixEnd) ensureAttendanceRange(otMatrixStart, otMatrixEnd); }
  else if(VIEW==='dispatch'){ const d = dispatchDate || todayStr(); ensureAttendanceRange(d, d); }
}

function subscribeAttendanceMonth(y,m){ const d = dstr(y,m,1); ensureAttendanceRange(d, d); }

  if(e){ showToast('데이터 연결 오류: ' + (e.message || e.code || e)); }

async function deleteAttendanceRec(date, empId){
  if(!requireEdit()) return;

/* ========================= 렌더 라우터 ========================= */
function setView(v){
  VIEW = v;
  document.querySelectorAll('nav#nav a').forEach(a=>a.classList.toggle('on', a.dataset.view===v));
  document.getElementById('nav').classList.remove('open');
  document.getElementById('scrim').classList.remove('show');
  if(v==='dispatch'){ if(!dispatchDate) dispatchDate = todayStr(); if(dbReady) subscribeDispatchDay(dispatchDate); }
  if(v==='splan'){ if(!weekStart) weekStart = mondayOf(todayStr()); if(dbReady) loadSupportPlanAll(); }
  if(v==='codestats' || v==='combined'){
    if(!codeStatsStart || !codeStatsEnd){
      const t = new Date();
      codeStatsStart = dstr(t.getFullYear(), t.getMonth()+1, 1);
      codeStatsEnd = dstr(t.getFullYear(), t.getMonth()+1, daysInMonth(t.getFullYear(), t.getMonth()+1));
    }
    if(dbReady) subscribeCodeStatsRange(codeStatsStart, codeStatsEnd);
  }
  if(v==='ot'){
    if(!otMatrixStart || !otMatrixEnd){
      const t = new Date();
      otPayYear = t.getFullYear(); otPayMonth = t.getMonth()+1;
      // 오늘이 26일 이후면 "다음달" 임금월에 이미 들어선 것
      if(t.getDate()>=26){ otPayMonth++; if(otPayMonth>12){ otPayMonth=1; otPayYear++; } }
      [otMatrixStart, otMatrixEnd] = payPeriodRange(otPayYear, otPayMonth);
    }
    if(dbReady) subscribeOtMatrixRange(otMatrixStart, otMatrixEnd);
  }
  render();
}
// 데이터 변경 알림이 여러 개 동시에 와도 화면은 한 번만 다시 그림.
// 입력칸에 커서가 있는 동안에는(다른 창에서 저장된 경우 등) 입력 중인 값이 날아가지 않게 보류했다가 포커스가 빠지면 그림.
let renderScheduled = false, renderDeferred = false;
function isEditingField(){
  const a = document.activeElement;
  if(!a) return false;
  const content = document.getElementById('content');
  if(!content || !content.contains(a)) return false;
  if(a.tagName==='TEXTAREA' || a.tagName==='SELECT') return true;
  if(a.tagName==='INPUT'){ const t=(a.type||'').toLowerCase(); return !['checkbox','radio','button','submit','reset','file'].includes(t); }
  return false;
}
function scheduleRender(){
  if(renderScheduled) return;
  renderScheduled = true;
  setTimeout(()=>{
    renderScheduled = false;
    if(isEditingField()){ renderDeferred = true; return; }
    render();
  }, 0);
}
document.addEventListener('focusout', ()=>{
  if(!renderDeferred) return;
  setTimeout(()=>{ if(renderDeferred && !isEditingField()){ renderDeferred = false; render(); } }, 0);
});
function render(){
  renderDeferred = false;
  ensureForView();
  const el = document.getElementById('content');
  if(VIEW==='input') el.innerHTML = pageInput();
  else if(VIEW==='grid') el.innerHTML = pageGrid();
  else if(VIEW==='ot') el.innerHTML = pageOT();
  else if(VIEW==='codestats') el.innerHTML = pageCodeStats();
  else if(VIEW==='combined') el.innerHTML = pageCombined();
  else if(VIEW==='holidays') el.innerHTML = pageHolidays();
  else if(VIEW==='employees') el.innerHTML = pageEmployees();
  else if(VIEW==='codes') el.innerHTML = pageCodes();
  else if(VIEW==='dispatch') el.innerHTML = pageDispatch();
  else if(VIEW==='splan') el.innerHTML = pageSupportPlan();
  else if(VIEW==='team') el.innerHTML = pageTeam();
  else if(VIEW==='backup') el.innerHTML = pageBackup();
  afterRender();
  if(!canEdit) applyReadonly(el);
}

/* ========================= 월별 근태관리표 ========================= */
function pageGrid(){
  const dim = daysInMonth(curYear,curMonth);
  const days = Array.from({length:dim}, (_,i)=>i+1);
  const head = `<th class="namehead">성명</th>` + days.map(d=>{
    const ds = dstr(curYear,curMonth,d);
    const cls = dayCellClass(ds, curYear, curMonth, d);
    return `<th class="${cls}" title="${esc(holidays[ds]||'')}">${d}<br>${weekdayKr(curYear,curMonth,d)}</th>`;
  }).join('');

  const sortedEmployees = employees.slice().sort((a,b)=>{
    const ta = a.team||'9', tb = b.team||'9';
    if(ta!==tb) return ta<tb?-1:1;
    return (a.teamOrder||999)-(b.teamOrder||999);
  });
  const rows = sortedEmployees.map(e=>{
    const cells = days.map(d=>{
      const ds = dstr(curYear,curMonth,d);
      const rec = attendance[ds+'_'+e.id];
      const cls = dayCellClass(ds, curYear, curMonth, d);
      let inner = '';
      if(rec){
        if(rec.statusCode){
          inner = `<span class="mini" style="color:${codeColor(rec.statusCode)};font-weight:700;">${esc(rec.statusCode)}</span>`;
        } else if(rec.workCode && rec.workCode!=='OFF'){
          inner = `<span class="mini" style="color:${codeColor(rec.workCode)};font-weight:700;">${esc(rec.workCode)}</span>`;
        }
        if(rec.manguen) inner += `<span class="mini2" style="color:var(--ok);">만근</span>`;
      }
      return `<td class="daycell ${cls}" data-act="grid-cell" data-date="${esc(ds)}" data-emp="${esc(e.id)}">${inner}</td>`;
    }).join('');
    const orderTag = e.team ? `<span style="color:var(--text-muted);font-weight:400;font-size:10.5px;">${esc(e.team)}조${e.teamOrder?' '+e.teamOrder+'번':''}</span> ` : '';
    return `<tr><td class="namecell">${orderTag}${esc(e.name)}</td>${cells}</tr>`;
  }).join('');

  const dayCounts = days.map(d=>{
    const ds = dstr(curYear,curMonth,d);
    return sortedEmployees.reduce((n,e)=>{
      const rec = attendance[ds+'_'+e.id];
      return n + (rec && rec.workCode && rec.workCode!=='OFF' ? 1 : 0);
    }, 0);
  });
  const countRow = `<tr style="background:var(--bg);font-weight:800;"><td class="namecell">근무</td>${dayCounts.map(n=>`<td style="text-align:center;">${n||''}</td>`).join('')}</tr>`;

    : `<div class="empty">등록된 직원이 없습니다. 먼저 직원 관리에서 직원을 추가하세요.</div>`}
  <div class="legend">
    <span class="sw"><span class="badge-code bc-D">D</span>주간</span>

  });
  const customCodes = Object.keys(codeDefs).filter(c => !STATUS_CODE_LIST.includes(c) && !WORK_CODES.some(w=>w.code===c));
  const scItems = [...STATUS_CODE_LIST, ...customCodes].filter(c=>!hiddenCodes.has(c)).map(c=>{
    const d = codeDefs[c];
    const lbl = (d && d.label) ? d.label : (CODE_LABELS[c] || '');
    return {code:c, label:lbl};
  });
  const allItems = [...wcItems, ...scItems];
  const optRows = allItems.map(it=>`<div class="gridCodeOpt" data-code="${esc(it.code)}" data-search="${esc((it.code+' '+it.label).toLowerCase())}"
      style="display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;border-radius:6px;">
      <span class="badge-code" style="flex:0 0 auto;background:var(--bg);border-color:var(--border);color:${codeColor(it.code)};">${esc(it.code)}</span>
      <span style="color:var(--text);font-size:13px;">${esc(it.label)}</span>
    </div>`).join('');
  const [wy,wm,wd] = date.split('-').map(Number);
  const isSaturday = new Date(wy,wm-1,wd).getDay()===6;
  const manguenField = isSaturday ? `
      <div class="field" style="margin-bottom:14px;"><label style="display:flex;align-items:center;gap:6px;">
        <input type="checkbox" id="gridManguen" ${rec.manguen?'checked':''}>만근(이번주 평일 개근 → 토요일 특근 인정)</label></div>` : '';
  return `
  <div id="gridEditScrim" style="position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:500;display:flex;align-items:center;justify-content:center;">
    <div class="panel" style="max-width:360px;width:92%;margin-bottom:0;background:var(--surface);">
      <h3 style="margin-bottom:2px;">${esc(emp?emp.name:'')}</h3>
      <p class="hint" style="margin-top:0;margin-bottom:12px;">${esc(date)}${isSaturday?' (토요일)':''}</p>
      <div class="field" style="margin-bottom:14px;position:relative;">
        <label>근무코드 (목록에서 고르거나 직접 입력)</label>
        <input type="text" id="gridCode" autocomplete="off" value="${curVal==='OFF'?'':esc(curVal)}" placeholder="예: D, OFF, FC..." style="border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:var(--bg);color:var(--text);width:100%;">
        <div id="gridCodeDropdown" style="display:none;position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.15);max-height:340px;overflow-y:auto;z-index:50;">${optRows}</div>
      </div>
      ${manguenField}
      <div class="row">
        <button class="btn" id="gridEditSave">저장</button>
        <button class="btn ghost" id="gridEditCancel">취소</button>
        <button class="btn warn ghost" id="gridEditReset">초기화</button>
      </div>
    </div>
  </div>`;
}

/* ========================= 근태관리(통합: 집계+표) ========================= */
function pageCombined(){
  // 집계 기간(코드 집계 + 일자별 표 공통) 준비
  if(!codeStatsStart || !codeStatsEnd){
    const t = new Date();
    codeStatsStart = dstr(t.getFullYear(), t.getMonth()+1, 1);
    codeStatsEnd = dstr(t.getFullYear(), t.getMonth()+1, daysInMonth(t.getFullYear(), t.getMonth()+1));
  }
  const rangeStart = codeStatsStart, rangeEnd = codeStatsEnd;
  const days = [];
  for(let ds=rangeStart; ds<=rangeEnd; ds=addDays(ds,1)) days.push(ds);
  const sortedEmployees = employees.slice().filter(e=> !combinedTeamFilter || (e.team||'')===combinedTeamFilter).sort((a,b)=>{
    const ta = a.team||'9', tb = b.team||'9';
    if(ta!==tb) return ta<tb?-1:1;
    return (a.teamOrder||999)-(b.teamOrder||999);
  });


  const perEmp = sortedEmployees.map(e=>{
    let codeCnt = {FCH:0,MCH:0,MCS:0,FC:0,MC:0};
    let otHoliday=0, otWeekday=0, supDays=0, mealAllow=0;
    for(let ds=rangeStart; ds<=rangeEnd; ds=addDays(ds,1)){
      const rec = codeStatsAttendance[ds+'_'+e.id];
      if(!rec) continue;
      if(rec.statusCode && codeCnt.hasOwnProperty(rec.statusCode)) codeCnt[rec.statusCode]++;
      const c = computeDaily(rec, ds);
      if(c.valid){ if(c.category==='일요일'||c.category==='공휴일') otHoliday+=c.premium; else otWeekday+=c.premium; }
      const s = computeSupportDaily(rec, ds);
      if(s.valid) supDays++;
      mealAllow += computeMealAllowance(rec);
    }
    const gyeHol = codeCnt.FCH+codeCnt.MCH, gyeWk = codeCnt.FC+codeCnt.MC;
    const otWeekdayFinal = otWeekday + (codeStatsIncludeMeal? mealAllow:0);
    return {emp:e, codeCnt, gyeHol, gyeWk, otHoliday, otWeekdayFinal, supDays};
  });
  function rankByAsc(getVal){ const s=perEmp.map((r,i)=>({i,v:getVal(r)||0})).sort((a,b)=>a.v-b.v || a.i-b.i); const arr=new Array(perEmp.length); s.forEach((x,idx)=>arr[x.i]=idx+1); return arr; }
  function rankByDesc(getVal){ const s=perEmp.map((r,i)=>({i,v:getVal(r)||0})).sort((a,b)=>b.v-a.v || a.i-b.i); const arr=new Array(perEmp.length); s.forEach((x,idx)=>arr[x.i]=idx+1); return arr; }
  const rankSup=rankByAsc(r=>r.supDays), rankGyeHol=rankByAsc(r=>r.gyeHol), rankMCS=rankByAsc(r=>r.codeCnt.MCS);
  const rankGyeWk=rankByAsc(r=>r.gyeWk), rankOtHol=rankByDesc(r=>r.otHoliday), rankOtWk=rankByDesc(r=>r.otWeekdayFinal);

  const dayHead = days.map(ds=>{
    const [y,m,d] = ds.split('-').map(Number);
    const cls = dayCellClass(ds, y, m, d);
    return `<th class="${cls}" title="${esc(holidays[ds]||'')}">${m}/${d}<br>${weekdayKr(y,m,d)}</th>`;
  }).join('');

  const head = `<tr>
    <th class="namehead" rowspan="2">No</th><th class="namehead" rowspan="2" style="left:34px;">성명</th>
    <th colspan="2" style="background:var(--accent-soft);">지원근무</th>
    <th colspan="8" style="background:var(--amber-soft);">휴일,주야간</th>
    <th colspan="6" style="background:var(--ok-soft);">평일,주야간</th>
    <th class="namehead" rowspan="2">성명</th>
    <th colspan="${days.length}">일자별</th>
  </tr><tr>
    <th style="width:40px;">지원</th><th style="width:40px;">순번</th>
    <th style="width:40px;">FCH</th><th style="width:40px;">MCH</th><th style="width:40px;">계</th><th style="width:40px;">순번</th><th style="width:40px;">MCS</th><th style="width:40px;">순번</th><th style="width:70px;">OT</th><th style="width:40px;">순번</th>
    <th style="width:40px;">FC</th><th style="width:40px;">MC</th><th style="width:40px;">계</th><th style="width:40px;">순번</th><th style="width:70px;">OT</th><th style="width:40px;">순번</th>
    ${dayHead}
  </tr>`;

  const rows = perEmp.map((r,idx)=>{
    const e = r.emp;
    const dayCells = days.map(ds=>{
      const [y,m,d] = ds.split('-').map(Number);
      const rec = codeStatsAttendance[ds+'_'+e.id];
      const cls = dayCellClass(ds, y, m, d);
      let inner = '';
      if(rec){
        if(rec.statusCode){
          // 근태코드(FC 등)가 있으면 OFF 배지는 숨기고 근태코드만 표시
          inner = `<span class="mini" style="color:${codeColor(rec.statusCode)};font-weight:700;">${esc(rec.statusCode)}</span>`;
        } else if(rec.workCode && rec.workCode!=='OFF'){
          inner = `<span class="mini" style="color:${codeColor(rec.workCode)};font-weight:700;">${esc(rec.workCode)}</span>`;
        }
        // 근태코드도 없고 근무코드도 OFF(또는 없음)면 빈칸
        if(rec.manguen) inner += `<span class="mini2" style="color:var(--ok);">만근</span>`;
      }
      return `<td class="daycell ${cls}" data-act="grid-cell" data-date="${esc(ds)}" data-emp="${esc(e.id)}">${inner}</td>`;
    }).join('');
    const isLeader = e.teamRole==='조장';
    const noCell = isLeader ? '조장' : (idx+1);
    return `<tr>
      <td style="text-align:center;">${esc(noCell)}</td>
      <td class="namecell">${isLeader?'조장 ':''}${esc(e.name)}</td>
      <td style="text-align:center;">${r.supDays||''}</td>
      <td style="text-align:center;font-weight:700;">${rankSup[idx]}</td>
      <td style="text-align:center;">${r.codeCnt.FCH||''}</td>
      <td style="text-align:center;">${r.codeCnt.MCH||''}</td>
      <td style="text-align:center;">${r.gyeHol||''}</td>
      <td style="text-align:center;font-weight:700;">${rankGyeHol[idx]}</td>
      <td style="text-align:center;">${r.codeCnt.MCS||''}</td>
      <td style="text-align:center;font-weight:700;">${rankMCS[idx]}</td>
      <td style="text-align:center;width:70px;">${fmtH(r.otHoliday)}</td>
      <td style="text-align:center;font-weight:700;">${rankOtHol[idx]}</td>
      <td style="text-align:center;">${r.codeCnt.FC||''}</td>
      <td style="text-align:center;">${r.codeCnt.MC||''}</td>
      <td style="text-align:center;">${r.gyeWk||''}</td>
      <td style="text-align:center;font-weight:700;">${rankGyeWk[idx]}</td>
      <td style="text-align:center;width:70px;">${fmtH(r.otWeekdayFinal)}</td>
      <td style="text-align:center;font-weight:700;">${rankOtWk[idx]}</td>
      <td class="namecell" style="">${isLeader?'조장 ':''}${esc(e.name)}</td>
      ${dayCells}
    </tr>`;
  }).join('');

  const modal = gridEdit ? renderGridEditModal() : '';

  return `
  <h2 class="pgttl">근태관리</h2>
  <p class="pgsub">근태코드 집계와 월별 근태관리표가 한 표로 합쳐져 있습니다. 날짜 칸을 클릭하면 근무코드·근태코드를 바로 입력할 수 있어요.</p>
  <div class="row" style="margin-bottom:6px;align-items:center;">
    <div class="field"><label>시작일</label><input type="date" id="codeStatsStartInput" value="${esc(rangeStart)}"></div>
    <div class="field"><label>종료일</label><input type="date" id="codeStatsEndInput" value="${esc(rangeEnd)}"></div>
    <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;">
      <input type="checkbox" id="codeStatsMealChk" ${codeStatsIncludeMeal?'checked':''}>평일OT 식사연장 포함
    </label>
    <span style="flex:1 1 auto;"></span>
    <button class="btn ghost sm" id="prevMonth">◀ 이전달</button>
    <div class="field" style="min-width:auto;"><b style="font-size:15px;">${esc(rangeStart)} ~ ${esc(rangeEnd)}</b></div>
    <button class="btn ghost sm" id="nextMonth">다음달 ▶</button>
  </div>
  <div class="row" style="margin-bottom:14px;">
    <button class="btn ${combinedTeamFilter===''?'':'ghost'} sm" data-act="team-filter" data-team="">전체</button>
    <button class="btn ${combinedTeamFilter==='1'?'':'ghost'} sm" data-act="team-filter" data-team="1">1조</button>
    <button class="btn ${combinedTeamFilter==='2'?'':'ghost'} sm" data-act="team-filter" data-team="2">2조</button>
  </div>
  ${sortedEmployees.length? `<div class="scrollx gridwrap"><table class="gtbl"><thead>${head}</thead><tbody>${rows}</tbody></table></div>`
    : `<div class="empty">등록된 직원이 없습니다.</div>`}
  ${modal}
  `;
}

/* ========================= 근태·OT 집계 ========================= */
function pageOT(){
  if(!otMatrixStart || !otMatrixEnd){
    const t = new Date();
    otPayYear = t.getFullYear(); otPayMonth = t.getMonth()+1;
    if(t.getDate()>=26){ otPayMonth++; if(otPayMonth>12){ otPayMonth=1; otPayYear++; } }
    [otMatrixStart, otMatrixEnd] = payPeriodRange(otPayYear, otPayMonth);
  }
  const sortedEmployees = employees.slice().filter(e=> !otTeamFilter || (e.team||'')===otTeamFilter).sort((a,b)=>{
    const ta = a.team||'9', tb = b.team||'9';
    if(ta!==tb) return ta<tb?-1:1;
    return (a.teamOrder||999)-(b.teamOrder||999);
  });
  const days = [];
  for(let ds=otMatrixStart; ds<=otMatrixEnd; ds=addDays(ds,1)) days.push(ds);

  const perEmp = sortedEmployees.map(e=>{
    let wkTotal=0, hoTotal=0, spTotal=0, mealTotal=0;
    const daily = {};
    days.forEach(ds=>{
      const rec = otMatrixAttendance[ds+'_'+e.id];
      const c = computeDaily(rec, ds);
      const s = computeSupportDaily(rec, ds);
      const meal = computeMealAllowance(rec);
      if(c.valid){ if(c.category==='평일'||c.category==='토요일') wkTotal+=c.premium; else hoTotal+=c.premium; }
      if(s.valid){
        const cat = dayCategory(ds, rec && rec.manguen);
        if(cat==='SU' || cat==='H') hoTotal += s.premium; else spTotal += s.premium;
      }
      mealTotal += meal;
      daily[ds] = (c.valid?c.premium:0) + (s.valid?s.premium:0) + meal;
    });
    const grand = wkTotal + hoTotal + spTotal + mealTotal;
    const hoGuar = Math.max(hoTotal, 60); // 휴일 보전: 월 60시간 최소 보장
    const spGuar = Math.max(spTotal, 30); // 지원 보전: 월 30시간 최소 보장
    const otGuar = wkTotal + hoGuar + spGuar + mealTotal;
    return {emp:e, wkTotal, hoTotal, hoGuar, spTotal, spGuar, mealTotal, grand, otGuar, otDiff: otGuar-grand, daily};
  });

  const dayHead = days.map(ds=>{
    const [y,m,d] = ds.split('-').map(Number);
    const cls = dayCellClass(ds, y, m, d);
    return `<th class="${cls}" style="min-width:44px;">${m}/${d}<br>${weekdayKr(y,m,d)}</th>`;
  }).join('');

  const rows = perEmp.map((r,idx)=>{
    const noCell = r.emp.teamRole==='조장' ? '조장' : (idx+1);
    const z = v => v ? fmtH(v) : '';
    const dayCells = days.map(ds=>{
      const [y,m,d] = ds.split('-').map(Number);
      const cls = dayCellClass(ds, y, m, d);
      const v = r.daily[ds];
      return `<td class="${cls}" data-act="ot-cell-detail" data-date="${esc(ds)}" data-emp="${esc(r.emp.id)}" style="text-align:center;cursor:pointer;">${v?fmtH(v):''}</td>`;
    }).join('');
    return `<tr>
      <td style="text-align:center;">${esc(noCell)}</td>
      <td class="namecell">${esc(r.emp.name)}</td>
      <td style="text-align:center;">${z(r.mealTotal)}</td>
      <td style="text-align:center;background:var(--amber-soft);">${z(r.wkTotal)}</td>
      <td style="text-align:center;background:var(--ok-soft);">${z(r.spTotal)}</td>
      <td style="text-align:center;background:var(--ok-soft);font-weight:700;">${z(r.spGuar)}</td>
      <td style="text-align:center;background:var(--warn-soft);">${z(r.hoTotal)}</td>
      <td style="text-align:center;background:var(--warn-soft);font-weight:700;">${z(r.hoGuar)}</td>
      <td style="text-align:center;background:var(--accent-soft);font-weight:800;">${fmtH(r.grand)}</td>
      <td style="text-align:center;background:var(--accent-soft);">${fmtH(r.otGuar)}</td>
      <td class="namecell">${esc(r.emp.name)}</td>
      ${dayCells}
    </tr>`;
  }).join('');

  const n = perEmp.length || 1;
  const avgOf = k => fmtH(perEmp.reduce((s,r)=>s+(r[k]||0),0)/n);
  const avgRow = `<tr style="background:var(--bg);font-weight:800;">
    <td colspan="2" style="text-align:center;">평 균</td>
    <td style="text-align:center;">${avgOf('mealTotal')}</td>
    <td style="text-align:center;background:var(--amber-soft);">${avgOf('wkTotal')}</td>
    <td style="text-align:center;background:var(--ok-soft);">${avgOf('spTotal')}</td>
    <td style="text-align:center;background:var(--ok-soft);">${avgOf('spGuar')}</td>
    <td style="text-align:center;background:var(--warn-soft);">${avgOf('hoTotal')}</td>
    <td style="text-align:center;background:var(--warn-soft);">${avgOf('hoGuar')}</td>
    <td style="text-align:center;background:var(--accent-soft);">${avgOf('grand')}</td>
    <td style="text-align:center;background:var(--accent-soft);">${avgOf('otGuar')}</td>
    <td></td>
    ${days.map(()=>'<td></td>').join('')}
  </tr>`;

  return `
  <h2 class="pgttl">월별 OT현황</h2>
  <p class="pgsub">평일(평일+토요)·휴일(일요+공휴+휴일지원)·지원(평일지원+토요지원)·식사(조출+석출+중식+야식) 월간 합계와 일자별 상세를 한 표로 보여줍니다. 휴일(월 60시간)·지원(월 30시간)은 최소보장(보전) 시간을 함께 표시합니다.</p>
  <div class="row" style="margin-bottom:6px;align-items:center;">
    <div class="field"><label>시작일</label><input type="date" id="otRangeStartInput" value="${esc(otMatrixStart)}"></div>
    <div class="field"><label>종료일</label><input type="date" id="otRangeEndInput" value="${esc(otMatrixEnd)}"></div>
    <span style="background:#fff200;color:#3a2a00;font-weight:800;padding:6px 16px;border-radius:6px;">총OT</span>
    <span style="flex:1 1 auto;"></span>
    <button class="btn ghost sm" id="prevPayMonth">◀ 이전달</button>
    <div class="field" style="min-width:auto;"><b style="font-size:15px;">${otPayYear}년 ${otPayMonth}월 (${esc(otMatrixStart)} ~ ${esc(otMatrixEnd)})</b></div>
    <button class="btn ghost sm" id="nextPayMonth">다음달 ▶</button>
  </div>
  <div class="row" style="margin-bottom:14px;">
    <button class="btn ${otTeamFilter===''?'':'ghost'} sm" data-act="ot-team-filter" data-team="">전체</button>
    <button class="btn ${otTeamFilter==='1'?'':'ghost'} sm" data-act="ot-team-filter" data-team="1">1조</button>
    <button class="btn ${otTeamFilter==='2'?'':'ghost'} sm" data-act="ot-team-filter" data-team="2">2조</button>
  </div>
  ${sortedEmployees.length? `<div class="scrollx gridwrap"><table class="gtbl"><thead>
    <tr>
      <th rowspan="2" class="namehead">No</th><th rowspan="2" class="namehead" style="left:34px;">성명</th>
      <th>식사</th>
      <th>평일</th>
      <th colspan="2">지원</th>
      <th colspan="2">휴일</th>
      <th colspan="2">OT</th>
      <th rowspan="2" class="namehead">성명</th>
      <th colspan="${days.length}">일자별</th>
    </tr>
    <tr>
      <th>계</th>
      <th style="background:var(--amber-soft);">계</th>
      <th style="background:var(--ok-soft);">계</th><th style="background:var(--ok-soft);">보전</th>
      <th style="background:var(--warn-soft);">계</th><th style="background:var(--warn-soft);">보전</th>
      <th style="background:var(--accent-soft);">실</th><th style="background:var(--accent-soft);">보전</th>
      ${dayHead}
    </tr>
  </thead><tbody>${rows}${avgRow}</tbody></table></div>`
    : `<div class="empty">등록된 직원이 없습니다.</div>`}
  <p class="hint">임금월은 매월 26일부터 다음달 25일까지입니다 (예: "10월"=9/26~10/25). 휴일보전=MAX(휴일계,60), 지원보전=MAX(지원계,30). 출퇴근 입력에서 저장하면 이 표에도 자동으로 반영됩니다.</p>
  <div class="note" style="margin-top:14px;">${OT_NOTE}</div>
  `;
}
/* ========================= 조별 월간집계 ========================= */
function pageTeamOT(){
  const sortedEmployees = employees.slice().filter(e=> !teamOtFilter || (e.team||'')===teamOtFilter).sort((a,b)=>{
    const ta = a.team||'9', tb = b.team||'9';
    if(ta!==tb) return ta<tb?-1:1;
    return (a.teamOrder||999)-(b.teamOrder||999);
  });
  const perEmp = sortedEmployees.map(e=>{
    let wkWeekday=0, wkSat=0, hoSun=0, hoHol=0, hoSup=0, spWeekday=0, spSat=0;
    let jochul=0, seokchul=0, jungsik=0, yasik=0;
    for(let ds=otMatrixStart; ds<=otMatrixEnd; ds=addDays(ds,1)){
      const rec = otMatrixAttendance[ds+'_'+e.id];
      if(!rec) continue;
      const c = computeDaily(rec, ds);
      if(c.valid){
        if(c.category==='평일') wkWeekday += c.premium;
        else if(c.category==='토요일') wkSat += c.premium;
        else if(c.category==='일요일') hoSun += c.premium;
        else if(c.category==='공휴일') hoHol += c.premium;
      }
      const s = computeSupportDaily(rec, ds);
      if(s.valid){
        const cat = dayCategory(ds, rec.manguen);
        if(cat==='SU' || cat==='H') hoSup += s.premium;
        else if(cat==='SA') spSat += s.premium;
        else spWeekday += s.premium;
      }
      if(rec.jochul) jochul += 1.5;
      if(rec.seokchul) seokchul += 1.5;
      if(rec.jungsik) jungsik += 1.5;
      if(rec.yasik) yasik += 1.5;
    }
    const wkTotal = wkWeekday + wkSat;
    const hoTotal = hoSun + hoHol + hoSup;
    const spTotal = spWeekday + spSat;
    const mealTotal = jochul + seokchul + jungsik + yasik;
    const wkGuar = wkTotal; // 평일: 보전(최소보장) 없음 — 실적 그대로
    const hoGuar = Math.max(hoTotal, 60); // 휴일 보전: 월 60시간 최소 보장
    const spGuar = Math.max(spTotal, 30); // 지원 보전: 월 30시간 최소 보장
    const mealGuar = mealTotal; // 식사: 보전 없음 — 실적 그대로
    const otReal = wkTotal + hoTotal + spTotal + mealTotal;
    const otGuar = wkGuar + hoGuar + spGuar + mealGuar;
    return {emp:e, wkWeekday, wkSat, wkTotal, wkGuar, hoSun, hoHol, hoSup, hoTotal, hoGuar,
      spWeekday, spSat, spTotal, spGuar, jochul, seokchul, jungsik, yasik, mealTotal, mealGuar,
      otReal, otGuar, otDiff: otGuar-otReal};
  });

  const rows = perEmp.map((r,idx)=>{
    const noCell = r.emp.teamRole==='조장' ? '조장' : (idx+1);
    const z = v => v ? fmtH(v) : '';
    return `<tr>
      <td style="text-align:center;">${esc(noCell)}</td>
      <td class="namecell">${esc(r.emp.name)}</td>
      <td style="text-align:center;">${z(r.wkTotal)}</td>
      <td style="text-align:center;">${z(r.hoTotal)}</td>
      <td style="text-align:center;background:var(--amber-soft);font-weight:700;">${z(r.hoGuar)}</td>
      <td style="text-align:center;">${z(r.spTotal)}</td>
      <td style="text-align:center;background:var(--amber-soft);font-weight:700;">${z(r.spGuar)}</td>
      <td style="text-align:center;">${z(r.mealTotal)}</td>
      <td style="text-align:center;">${z(r.otReal)}</td><td style="text-align:center;">${z(r.otGuar)}</td><td style="text-align:center;font-weight:700;">${z(r.otDiff)}</td>
    </tr>`;
  }).join('');

  const n = perEmp.length || 1;
  const avgOf = k => fmtH(perEmp.reduce((s,r)=>s+(r[k]||0),0)/n);
  const avgRow = `<tr style="background:var(--bg);font-weight:800;">
    <td colspan="2" style="text-align:center;">평균</td>
    <td style="text-align:center;">${avgOf('wkTotal')}</td>
    <td style="text-align:center;">${avgOf('hoTotal')}</td>
    <td style="text-align:center;background:var(--amber-soft);">${avgOf('hoGuar')}</td>
    <td style="text-align:center;">${avgOf('spTotal')}</td>
    <td style="text-align:center;background:var(--amber-soft);">${avgOf('spGuar')}</td>
    <td style="text-align:center;">${avgOf('mealTotal')}</td>
    <td style="text-align:center;">${avgOf('otReal')}</td><td style="text-align:center;">${avgOf('otGuar')}</td><td style="text-align:center;">${avgOf('otDiff')}</td>
  </tr>`;

  return `
  <h2 class="pgttl">조별 월간집계</h2>
  <p class="pgsub">평일(평일+토요)·휴일(일요+공휴+휴일지원)·지원(평일지원+토요지원)·식사(조출+석출+중식+야식) 월간 합계와, 휴일(월 60시간)·지원(월 30시간) 최소보장(보전) 시간을 보여줍니다. (임금월 ${otPayYear}년 ${otPayMonth}월: ${esc(otMatrixStart)} ~ ${esc(otMatrixEnd)})</p>
  <div class="row" style="margin-bottom:14px;">
    <button class="btn ${teamOtFilter===''?'':'ghost'} sm" data-act="teamot-filter" data-team="">전체</button>
    <button class="btn ${teamOtFilter==='1'?'':'ghost'} sm" data-act="teamot-filter" data-team="1">1조</button>
    <button class="btn ${teamOtFilter==='2'?'':'ghost'} sm" data-act="teamot-filter" data-team="2">2조</button>
  </div>
  ${sortedEmployees.length? `<div class="scrollx"><table class="gtbl"><thead>
    <tr>
      <th rowspan="2" class="namehead">No</th><th rowspan="2" class="namehead" style="left:34px;">성명</th>
      <th>평일</th>
      <th colspan="2">휴일</th>
      <th colspan="2">지원</th>
      <th>식사</th>
      <th colspan="3">OT</th>
    </tr>
    <tr>
      <th>계</th>
      <th>계</th><th style="background:var(--amber-soft);">휴일보전</th>
      <th>계</th><th style="background:var(--amber-soft);">지원보전</th>
      <th>계</th>
      <th>실</th><th>보전</th><th>증감</th>
    </tr>
  </thead><tbody>${rows}${avgRow}</tbody></table></div>`
    : `<div class="empty">등록된 직원이 없습니다.</div>`}
  <p class="hint">휴일보전=MAX(휴일계, 60), 지원보전=MAX(지원계, 30) (평일·식사는 최소보장 없이 실적 그대로). OT 실=평일+휴일+지원+식사, OT 보전=평일+휴일보전+지원보전+식사, 증감=보전-실.</p>
  `;
}

/* ========================= 근태코드 집계 ========================= */
function pageCodeStats(){
  if(!codeStatsStart || !codeStatsEnd){
    const t = new Date();
    codeStatsStart = dstr(t.getFullYear(), t.getMonth()+1, 1);
    codeStatsEnd = dstr(t.getFullYear(), t.getMonth()+1, daysInMonth(t.getFullYear(), t.getMonth()+1));
  }
  const rangeStart = codeStatsStart, rangeEnd = codeStatsEnd;
  const sortedEmployees = employees.slice().sort((a,b)=>{
    const ta = a.team||'9', tb = b.team||'9';
    if(ta!==tb) return ta<tb?-1:1;
    return (a.teamOrder||999)-(b.teamOrder||999);
  });
  const perEmp = sortedEmployees.map(e=>{
    let codeCnt = {FCH:0,MCH:0,MCS:0,FC:0,MC:0};
    let otHoliday=0, otWeekday=0, workHoliday=0, workWeekday=0, supDays=0, mealAllow=0;
    for(let ds=rangeStart; ds<=rangeEnd; ds=addDays(ds,1)){
      const rec = codeStatsAttendance[ds+'_'+e.id];
      if(!rec) continue;
      if(rec.statusCode && codeCnt.hasOwnProperty(rec.statusCode)) codeCnt[rec.statusCode]++;
      const c = computeDaily(rec, ds);
      if(c.valid){
        if(c.category==='일요일' || c.category==='공휴일'){ otHoliday += c.premium; workHoliday++; }
        else { otWeekday += c.premium; workWeekday++; }
      }
      const s = computeSupportDaily(rec, ds);
      if(s.valid) supDays++;
      mealAllow += computeMealAllowance(rec);
    }
    const gyeHol = codeCnt.FCH + codeCnt.MCH;
    const hyuHol = gyeHol + codeCnt.MCS;
    const gyeWk = codeCnt.FC + codeCnt.MC;
    const hyuWk = gyeWk;
    const otWeekdayFinal = otWeekday + (codeStatsIncludeMeal ? mealAllow : 0);
    return {emp:e, codeCnt, gyeHol, hyuHol, gyeWk, hyuWk, otHoliday, otWeekdayFinal, workHoliday, workWeekday, supDays};
  });

  // 순위(순번): 지원일수/계/MCS는 값이 작을수록 1등(오름차순), OT는 값이 클수록 1등(내림차순)
  function rankByAsc(getVal){
    const s = perEmp.map((r,i)=>({i, v:getVal(r)||0})).sort((a,b)=> a.v-b.v || a.i-b.i);
    const ranks = new Array(perEmp.length);
    s.forEach((x,idx)=>{ ranks[x.i] = idx+1; });
    return ranks;
  }
  function rankByDesc(getVal){
    const s = perEmp.map((r,i)=>({i, v:getVal(r)||0})).sort((a,b)=> b.v-a.v || a.i-b.i);
    const ranks = new Array(perEmp.length);
    s.forEach((x,idx)=>{ ranks[x.i] = idx+1; });
    return ranks;
  }
  const rankSup = rankByAsc(r=>r.supDays);
  const rankGyeHol = rankByAsc(r=>r.gyeHol);
  const rankMCS = rankByAsc(r=>r.codeCnt.MCS);
  const rankGyeWk = rankByAsc(r=>r.gyeWk);
  const rankOtHol = rankByDesc(r=>r.otHoliday);
  const rankOtWk = rankByDesc(r=>r.otWeekdayFinal);

  const rows = perEmp.map((r,idx)=>{
    const noCell = r.emp.teamRole==='조장' ? '조장' : (idx+1);
    return `<tr style="height:34px;">
      <td style="text-align:center;">${esc(noCell)}</td>
      <td class="namecell" style="height:34px;">${esc(r.emp.name)}</td>
      <td style="text-align:center;background:var(--accent-soft);">${r.supDays||''}</td>
      <td style="text-align:center;background:var(--accent-soft);font-weight:700;">${rankSup[idx]}</td>
      <td style="text-align:center;background:var(--amber-soft);">${r.codeCnt.FCH||''}</td>
      <td style="text-align:center;background:var(--amber-soft);">${r.codeCnt.MCH||''}</td>
      <td style="text-align:center;background:var(--amber-soft);">${r.gyeHol||''}</td>
      <td style="text-align:center;background:var(--amber-soft);font-weight:700;">${rankGyeHol[idx]}</td>
      <td style="text-align:center;background:var(--amber-soft);">${r.codeCnt.MCS||''}</td>
      <td style="text-align:center;background:var(--amber-soft);font-weight:700;">${rankMCS[idx]}</td>
      <td style="text-align:center;background:var(--amber-soft);">${fmtH(r.otHoliday)}</td>
      <td style="text-align:center;background:var(--amber-soft);font-weight:700;">${rankOtHol[idx]}</td>
      <td style="text-align:center;background:var(--ok-soft);">${r.codeCnt.FC||''}</td>
      <td style="text-align:center;background:var(--ok-soft);">${r.codeCnt.MC||''}</td>
      <td style="text-align:center;background:var(--ok-soft);">${r.gyeWk||''}</td>
      <td style="text-align:center;background:var(--ok-soft);font-weight:700;">${rankGyeWk[idx]}</td>
      <td style="text-align:center;background:var(--ok-soft);">${fmtH(r.otWeekdayFinal)}</td>
      <td style="text-align:center;background:var(--ok-soft);font-weight:700;">${rankOtWk[idx]}</td>
    </tr>`;
  }).join('');
  const footerRow = `<tr style="background:var(--bg);font-weight:800;height:30px;"><td style="text-align:center;"></td><td class="namecell">합계</td>
    <td style="text-align:center;background:var(--accent-soft);">${perEmp.reduce((s,r)=>s+r.supDays,0)||''}</td><td style="background:var(--accent-soft);"></td>
    <td style="text-align:center;background:var(--amber-soft);">${perEmp.reduce((s,r)=>s+r.codeCnt.FCH,0)||''}</td>
    <td style="text-align:center;background:var(--amber-soft);">${perEmp.reduce((s,r)=>s+r.codeCnt.MCH,0)||''}</td>
    <td style="text-align:center;background:var(--amber-soft);">${perEmp.reduce((s,r)=>s+r.gyeHol,0)||''}</td><td style="background:var(--amber-soft);"></td>
    <td style="text-align:center;background:var(--amber-soft);">${perEmp.reduce((s,r)=>s+r.codeCnt.MCS,0)||''}</td><td style="background:var(--amber-soft);"></td>
    <td style="text-align:center;background:var(--amber-soft);">${fmtH(perEmp.reduce((s,r)=>s+r.otHoliday,0))}</td><td style="background:var(--amber-soft);"></td>
    <td style="text-align:center;background:var(--ok-soft);">${perEmp.reduce((s,r)=>s+r.codeCnt.FC,0)||''}</td>
    <td style="text-align:center;background:var(--ok-soft);">${perEmp.reduce((s,r)=>s+r.codeCnt.MC,0)||''}</td>
    <td style="text-align:center;background:var(--ok-soft);">${perEmp.reduce((s,r)=>s+r.gyeWk,0)||''}</td><td style="background:var(--ok-soft);"></td>
    <td style="text-align:center;background:var(--ok-soft);">${fmtH(perEmp.reduce((s,r)=>s+r.otWeekdayFinal,0))}</td><td style="background:var(--ok-soft);"></td>
  </tr>`;

  return `
  <h2 class="pgttl">근태코드 집계</h2>
  <p class="pgsub">월별 근태관리표에 입력된 근태코드(FCH/MCH/MCS/FC/MC)·근무일수·가산시간을 선택한 기간 기준으로 집계합니다.</p>
  <div class="row" style="margin-bottom:6px;align-items:center;">
    <div class="field"><label>시작일</label><input type="date" id="codeStatsStartInput" value="${esc(rangeStart)}"></div>
    <div class="field"><label>종료일</label><input type="date" id="codeStatsEndInput" value="${esc(rangeEnd)}"></div>
    <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;margin-left:12px;">
      <input type="checkbox" id="codeStatsMealChk" ${codeStatsIncludeMeal?'checked':''}>평일OT 식사연장(식사계) 포함
    </label>
  </div>
  <p class="hint" style="margin-bottom:14px;">${esc(rangeStart)}(${weekdayKr(...rangeStart.split('-').map(Number))}) ~ ${esc(rangeEnd)}(${weekdayKr(...rangeEnd.split('-').map(Number))})</p>
  ${sortedEmployees.length? `<div class="scrollx"><table class="gtbl"><thead>
    <tr>
      <th class="namehead">No</th><th class="namehead" style="left:34px;">성명</th>
      <th style="background:var(--accent-soft);">지원일수</th><th style="background:var(--accent-soft);">순번</th>
      <th style="background:var(--amber-soft);">FCH</th><th style="background:var(--amber-soft);">MCH</th><th style="background:var(--amber-soft);">계</th><th style="background:var(--amber-soft);">순번</th><th style="background:var(--amber-soft);">MCS</th><th style="background:var(--amber-soft);">순번</th><th style="background:var(--amber-soft);">OT</th><th style="background:var(--amber-soft);">순번</th>
      <th style="background:var(--ok-soft);">FC</th><th style="background:var(--ok-soft);">MC</th><th style="background:var(--ok-soft);">계</th><th style="background:var(--ok-soft);">순번</th><th style="background:var(--ok-soft);">OT</th><th style="background:var(--ok-soft);">순번</th>
    </tr>
  </thead><tbody>${rows}${footerRow}</tbody></table></div>`
    : `<div class="empty">등록된 직원이 없습니다.</div>`}
  <p class="hint">계(휴일)=FCH+MCH, 계(평일)=FC+MC. 지원일수·계·MCS의 "순번"은 <b>숫자가 작을수록 1등</b>(오름차순), OT의 "순번"은 <b>숫자가 클수록 1등</b>(내림차순)입니다. OT는 해당 구분(휴일/평일)의 가산시간 합계이며, 근태·OT 집계 화면의 값과 연동됩니다.</p>
  `;
}

function pageCodes(){
  const wcRows = WORK_CODES.filter(w=>!hiddenCodes.has(w.code)).map(w=>{
    const d = codeDefs[w.code];
    const labelVal = (d && d.label) ? d.label : w.label.replace(/\([^)]*\)$/, '');
    return `<tr><td>${workBadge(w.code)}</td>
      <td><input type="text" data-code-label="${esc(w.code)}" value="${esc(labelVal)}" style="border:1px solid var(--border);border-radius:6px;padding:5px 8px;background:var(--bg);color:var(--text);width:100%;max-width:320px;"></td>
      <td><button class="btn sm" data-act="save-code" data-code="${esc(w.code)}">저장</button></td>
      <td><button class="btn warn ghost sm" data-act="delete-code" data-code="${esc(w.code)}">삭제</button></td></tr>`;
  }).join('');
  // 기본 근태코드 목록 + codeDefs에 남아있는 그 외 코드(예전 코드 등)까지 전부 표시 - 삭제 버튼으로 직접 정리 가능
  const customCodes = Object.keys(codeDefs).filter(c => !STATUS_CODE_LIST.includes(c) && !WORK_CODES.some(w=>w.code===c));
  const allStatusCodes = [...STATUS_CODE_LIST, ...customCodes].filter(c=>!hiddenCodes.has(c));
  const scRows = allStatusCodes.map(c=>{
    const d = codeDefs[c];
    const labelVal = (d && d.label) ? d.label : (CODE_LABELS[c] || '');
    return `<tr><td><span class="badge-code" style="background:var(--bg);border-color:var(--border);color:${codeColor(c)};">${esc(c)}</span></td>
      <td><input type="text" data-code-label="${esc(c)}" value="${esc(labelVal)}" placeholder="설명을 입력하세요" style="border:1px solid var(--border);border-radius:6px;padding:5px 8px;background:var(--bg);color:var(--text);width:100%;max-width:320px;"></td>
      <td><button class="btn sm" data-act="save-code" data-code="${esc(c)}">저장</button></td>
      <td><button class="btn warn ghost sm" data-act="delete-code" data-code="${esc(c)}">삭제</button></td></tr>`;
  }).join('');
  const hiddenList = Array.from(hiddenCodes);
  const hiddenRow = hiddenList.length ? `
  <div class="panel">
    <h3>숨긴 코드 (${hiddenList.length}개)</h3>
    <p class="hint">삭제한 코드예요. 다시 쓰려면 복원하세요.</p>

      ${hiddenList.map(c=>`<span class="btn ghost sm" style="cursor:default;">${esc(c)} <button class="btn sm" data-act="restore-code" data-code="${esc(c)}" style="margin-left:6px;">복원</button></span>`).join('')}
    </div>
  </div>` : '';
  return `
  <h2 class="pgttl">근태코드 참조</h2>
  <div class="note">근무코드(D/N 등)와 근태코드(특이사항)를 하나의 표로 합쳤습니다. 설명을 고치고 저장하거나, 삭제 버튼으로 정리할 수 있어요.</div>
  <div class="panel">
    <h3>전체 코드</h3>
    <div class="scrollx"><table class="tbl"><thead><tr><th>코드</th><th>의미/설명</th><th></th><th></th></tr></thead><tbody>${wcRows}${scRows}</tbody></table></div>
    <div class="row" style="margin-top:14px;">

/* ========================= 배차표 ========================= */
function pageDispatch(){
  if(!dispatchDate) dispatchDate = todayStr();
  const ds = dispatchDate;
  const slots = dispatchShift==='day' ? DAY_SLOTS : NIGHT_SLOTS;
  const [dy,dm,dd] = ds.split('-').map(Number);
  const dateBanner = `${dy}년 ${dm}월 ${dd}일 ${weekdayKr(dy,dm,dd)}요일`;

  // 전 직원을 조편성 순서(조 → 순번) 기준으로 정렬해서 항상 표시 (조별 필터 적용)
  const sortedEmployees = employees.slice().filter(e=> !dispatchTeamFilter || (e.team||'')===dispatchTeamFilter).sort((a,b)=>{
    const ta = a.team||'9', tb = b.team||'9';
    if(ta!==tb) return ta<tb?-1:1;
    return (a.teamOrder||999)-(b.teamOrder||999);
  });

  const palette = DISPATCH_CATS.map(c=>`<button type="button" class="dpCatBtn" data-cat="${esc(c.key)}"
      style="background:${c.bg};color:${c.fg};border:2px solid ${dispatchPaint===c.key?'var(--text)':c.border};border-radius:10px;padding:8px 16px;font-weight:700;font-size:13px;cursor:pointer;box-shadow:${dispatchPaint===c.key?'0 0 0 2px var(--accent)':'none'};">${esc(c.key)}</button>`).join('');

  function slotCell(empId, s, catKey){
    const cat = dispatchCat(catKey);
    const bg = cat ? cat.bg : 'transparent';
    const fg = cat ? cat.fg : 'var(--text)';
    return `<td class="dpCell" data-dispatch-emp="${esc(empId)}" data-dispatch-slot="${esc(s)}" data-dispatch-cur="${esc(catKey||'')}"
      style="width:30px;height:32px;min-height:32px;background:${bg};color:${fg};cursor:pointer;text-align:center;font-size:9.5px;font-weight:700;border:1px solid var(--border);user-select:none;"></td>`;
  }

  const head = `<th class="namehead">No</th><th class="namehead" style="left:34px;">성명</th><th>근태</th><th>퇴근</th><th>승무</th>` +
    slots.map(s=>{
      const [hh,mm] = s.split(':');
      const isRed = hh==='07' || hh==='12' || hh==='18' || hh==='24';
      const color = isRed ? '#E03131' : '#000000';
      if(mm==='00'){
        return `<th style="min-width:30px;color:${color};font-size:15px;font-weight:800;">${esc(hh)}</th>`;
      }
      return `<th style="min-width:30px;color:${color};font-size:9px;font-weight:600;">${esc(mm)}</th>`;
    }).join('');

  const slotCounts = slots.map(()=>0); // 시간대(칸)별 배치 인원 수

  const rows = sortedEmployees.map((e,idx)=>{
    const rec = attendance[ds+'_'+e.id] || {};
    const id = `${ds}_${dispatchShift}_${e.id}`;
    const drec = dispatch[id];
    let paintedSlots = 0;
    const cells = slots.map((s,si)=>{
      const v = drec && drec.slots ? (drec.slots[s]||'') : '';
      if(v){ paintedSlots++; slotCounts[si]++; }
      return slotCell(e.id, s, v);
    }).join('');
    const isLeader = e.teamRole==='조장';
    return `<tr>
      <td class="namecell" style="text-align:center;">${isLeader?'조장':idx+1}</td>
      <td class="namecell" style="left:34px;">${isLeader?'조장 ':''}${esc(e.name)}</td>
      <td style="text-align:center;">${esc(rec.statusCode || rec.workCode || '')}</td>
      <td style="text-align:center;">${esc(rec.checkOut||'')}</td>
      <td style="text-align:center;" data-dispatch-suwu="${esc(e.id)}">${paintedSlots?fmtH(paintedSlots*0.5):''}</td>
      ${cells}
    </tr>`;
  }).join('');

  // 지원 인력 - 이름을 직접 입력하는 빈 행 10개
  const SUP_COUNT = 10;
  const supRows = Array.from({length:SUP_COUNT}, (_,i)=>{
    const supId = 'sup'+pad2(i+1);
    const id = `${ds}_${dispatchShift}_${supId}`;
    const drec = dispatch[id];
    const supName = drec && drec.name ? drec.name : '';
    let supPainted = 0;
    const cells = slots.map((s,si)=>{
      const v = drec && drec.slots ? (drec.slots[s]||'') : '';
      if(v){ supPainted++; slotCounts[si]++; }
      return slotCell(supId, s, v);
    }).join('');
    const supLabel = i===0 ? `<td class="namecell" rowspan="${SUP_COUNT}" style="text-align:center;vertical-align:middle;">지원</td>` : '';
    return `<tr>
      ${supLabel}
      <td class="namecell" style="left:34px;"><input type="text" data-dispatch-sup="${esc(supId)}" value="${esc(supName)}" placeholder="이름" style="width:70px;border:1px solid var(--border);border-radius:5px;padding:3px 5px;background:var(--bg);color:var(--text);"></td>
      <td></td><td></td><td style="text-align:center;" data-dispatch-suwu="${esc(supId)}">${supPainted?fmtH(supPainted*0.5):''}</td>
      ${cells}
    </tr>`;
  }).join('');

  const countRow = `<tr style="background:var(--bg);">
    <td class="namecell" colspan="5" style="text-align:center;font-weight:800;">시간대별 인원</td>
    ${slots.map((s,si)=>`<td data-dispatch-count="${esc(s)}" style="text-align:center;font-weight:800;color:${slotCounts[si]>0?'var(--accent)':'var(--text-muted)'};">${slotCounts[si]||''}</td>`).join('')}
  </tr>`;

  return `
  <h2 class="pgttl">배차표</h2>
  <p class="pgsub">팔레트에서 항목을 고른 뒤 시간대 칸을 마우스로 눌러서 드래그하면(클릭+드래그) 그 구간이 한번에 칠해지고, 승무 시간이 자동으로 합산됩니다. "수정"을 고르고 칠하면 지워집니다.</p>
  <div class="row" style="margin-bottom:10px;align-items:center;">
    <div class="field"><label>날짜</label><input type="date" id="dpDate" value="${esc(ds)}"></div>
    <div class="field"><label>구분</label><select id="dpShift">
      <option value="day" ${dispatchShift==='day'?'selected':''}>주간(07~19시)</option>
      <option value="night" ${dispatchShift==='night'?'selected':''}>야간(18~07시)</option>
    </select></div>
  </div>
  <div class="row" style="margin-bottom:10px;">
    <button class="btn ${dispatchTeamFilter===''?'':'ghost'} sm" data-act="dispatch-team-filter" data-team="">전체</button>
    <button class="btn ${dispatchTeamFilter==='1'?'':'ghost'} sm" data-act="dispatch-team-filter" data-team="1">1조</button>
    <button class="btn ${dispatchTeamFilter==='2'?'':'ghost'} sm" data-act="dispatch-team-filter" data-team="2">2조</button>
  </div>
  <div class="panel" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;">${palette}</div>
  <div style="background:#E8B84B;color:#3a2a00;font-weight:700;font-size:15px;padding:10px 16px;border-radius:8px 8px 0 0;">${esc(dateBanner)}</div>
  ${sortedEmployees.length? `<div class="scrollx gridwrap"><table class="gtbl" id="dpTable" style="border-radius:0 0 8px 8px;overflow:hidden;"><thead><tr>${head}</tr></thead><tbody>${rows}${supRows}${countRow}</tbody></table></div>`
    : `<div class="empty">등록된 직원이 없습니다. 먼저 직원 관리에서 직원을 추가하세요.</div>`}
  <p class="hint">성명은 조편성 관리에서 설정한 조·순번 순서대로 표시됩니다. "지원" 행은 이름을 직접 입력해서 사용하세요.</p>
  `;
}

/* ========================= 지원계획표 ========================= */
const SPLAN_ROWS = [
  {key:'capacity', label:'가동대수(입력)', editable:true},
  {key:'quota', label:'정원(입력)', editable:true},
  {key:'offCount', label:'휴무·휴가·기타(입력)', editable:true},
  {key:'leadCount', label:'총괄조장(입력)', editable:true},
  {key:'preSupport', label:'선지원(입력)', editable:true},
  {key:'supportOff', label:'지원휴무(입력)', editable:true},
  {key:'support', label:'지원(입력)', editable:true},
  {key:'avail', label:'지원가능', editable:false},
  {key:'attend', label:'출근원', editable:false},
  {key:'ratio', label:'교대비율', editable:false}
];
function splanCalc(rec){
  const n = k => Number(rec && rec[k]) || 0;
  const avail = n('quota') - n('offCount') - n('supportOff');
  const attend = avail + n('leadCount') + n('preSupport') + n('support');
  const ratio = n('capacity') ? attend / n('capacity') : 0;
  return {avail, attend, ratio};
}
function pageSupportPlan(){
  if(!weekStart) weekStart = mondayOf(todayStr());
  const days = Array.from({length:7}, (_,i)=>addDays(weekStart,i));
  const head = `<th style="text-align:left;">항목</th>` + days.map(ds=>{
    const [y,m,d]=ds.split('-').map(Number);
    return `<th colspan="2">${m}/${d}(${weekdayKr(y,m,d)})</th>`;
  }).join('');
  const subhead = `<th></th>` + days.map(()=>`<th style="font-size:10px;">주</th><th style="font-size:10px;">야</th>`).join('');
  const rows = SPLAN_ROWS.map(rowDef=>{
    const cells = days.map(ds=>[['day','주'],['night','야']].map(([shift,shiftLabel])=>{
      const id = `${ds}_${shift}`;
      const rec = supportPlan[id] || {};
      if(rowDef.editable){
        return `<td style="padding:2px;"><input type="text" inputmode="numeric" pattern="[0-9]*" data-splan-date="${esc(ds)}" data-splan-shift="${esc(shift)}" data-splan-field="${rowDef.key}" value="${rec[rowDef.key]!=null?esc(rec[rowDef.key]):''}" style="width:46px;border:1px solid var(--border);border-radius:5px;padding:3px;background:var(--bg);color:var(--text);text-align:center;font-size:11.5px;"></td>`;
      } else {
        const c = splanCalc(rec);
        const val = rowDef.key==='ratio' ? (c.ratio? c.ratio.toFixed(2) : '-') : (c[rowDef.key]||0);
        return `<td style="text-align:center;font-weight:700;">${val}</td>`;
      }
    }).join('')).join('');
    return `<tr><td>${esc(rowDef.label)}</td>${cells}</tr>`;
  }).join('');
  return `
  <h2 class="pgttl">지원계획표</h2>
  <p class="pgsub">주 단위로 가동대수·정원·휴무 등을 입력하면 지원가능/출근원/교대비율이 자동 계산됩니다.</p>
  <div class="row" style="margin-bottom:14px;">
    <button class="btn ghost sm" id="prevWeek">◀ 이전주</button>
    <div class="field" style="min-width:auto;"><b style="font-size:14px;">${esc(weekStart)} ~ ${esc(addDays(weekStart,6))}</b></div>
    <button class="btn ghost sm" id="nextWeek">다음주 ▶</button>
  </div>
  <div class="scrollx"><table class="tbl" id="splanTable"><thead><tr>${head}</tr><tr>${subhead}</tr></thead><tbody>${rows}</tbody></table></div>
  <div class="row" style="margin-top:14px;">
    <button class="btn warn ghost" id="splanResetBtn">초기화</button>
  </div>
  <p class="hint">입력 칸을 벗어나면(blur) 자동 저장됩니다. 지원가능 = 정원 − 휴무·휴가·기타 − 지원휴무 / 출근원 = 지원가능 + 총괄조장 + 선지원 + 지원 / 교대비율 = 출근원 ÷ 가동대수 (원본 시트 수식 기준)</p>
  `;
}
