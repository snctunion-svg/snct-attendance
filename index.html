/* ========================= 근태·OT 집계 ========================= */
function pageOT(){
  if(!otMatrixStart || !otMatrixEnd){
    const t = new Date();
    otPayYear = t.getFullYear(); otPayMonth = t.getMonth()+1;
    if(t.getDate()>=26){ otPayMonth++; if(otPayMonth>12){ otPayMonth=1; otPayYear++; } }
    [otMatrixStart, otMatrixEnd] = payPeriodRange(otPayYear, otPayMonth);
  }
  const sortedEmployees = employees.slice().filter(e=> !otTeamFilter || (e.team||'')===otTeamFilter).sort((a,b)=>{
    const ta = a.team||'9', tb = b.team||'9';
    if(ta!==tb) return ta<tb?-1:1;
    return (a.teamOrder||999)-(b.teamOrder||999);
  });
  const days = [];
  for(let ds=otMatrixStart; ds<=otMatrixEnd; ds=addDays(ds,1)) days.push(ds);

  const perEmp = sortedEmployees.map(e=>{
    let wkTotal=0, hoTotal=0, spTotal=0, mealTotal=0;
    const daily = {}, damDays = {};
    days.forEach(ds=>{
      const rec = otMatrixAttendance[ds+'_'+e.id];
      const c = computeDaily(rec, ds);
      const s = computeSupportDaily(rec, ds);
      const meal = computeMealAllowance(rec) + computeDamdang(rec); // 담당은 식사연장과 같은 OT(월별 OT현황에만)
      if(rec && rec.damdang) damDays[ds] = true;
      if(c.valid){ if(c.category==='평일'||c.category==='토요일') wkTotal+=c.premium; else hoTotal+=c.premium; }
      if(s.valid){
        const cat = dayCategory(ds, recManguen(rec, ds), rec && rec.employeeId);
        if(cat==='SU' || cat==='H') hoTotal += s.premium; else spTotal += s.premium;
      }
      mealTotal += meal;
      daily[ds] = (c.valid?c.premium:0) + (s.valid?s.premium:0) + meal;
    });
    const grand = wkTotal + hoTotal + spTotal + mealTotal;
    const hoGuar = Math.max(hoTotal, 60); // 휴일 보전: 월 60시간 최소 보장
    const spGuar = Math.max(spTotal, 30); // 지원 보전: 월 30시간 최소 보장
    const otGuar = wkTotal + hoGuar + spGuar + mealTotal;
    return {emp:e, wkTotal, hoTotal, hoGuar, spTotal, spGuar, mealTotal, grand, otGuar, otDiff: otGuar-grand, daily, damDays};
  });

  const dayHead = days.map(ds=>{
    const [y,m,d] = ds.split('-').map(Number);
    const cls = dayCellClass(ds, y, m, d);
    return `<th class="${cls}" style="min-width:44px;">${m}/${d}<br>${weekdayKr(y,m,d)}</th>`;
  }).join('');

  const rows = perEmp.map((r,idx)=>{
    const noCell = idx+1;
    const z = v => v ? fmtH(v) : '';
    const dayCells = days.map(ds=>{
      const [y,m,d] = ds.split('-').map(Number);
      const cls = dayCellClass(ds, y, m, d);
      const v = r.daily[ds];
      return `<td class="${cls}${r.damDays[ds]?' otDam':''}" data-act="ot-cell-detail" data-date="${esc(ds)}" data-emp="${esc(r.emp.id)}" style="text-align:center;cursor:pointer;"${r.damDays[ds]?' title="담당"':''}>${v?fmtH(v):''}</td>`;
    }).join('');
    return `<tr>
      <td class="stNo" style="text-align:center;">${esc(noCell)}</td>
      <td class="namecell stName payName" data-act="pay-open" data-emp="${esc(r.emp.id)}" title="급여명세서 보기"><span class="pn">${esc(r.emp.name)}</span></td>
      <td class="gc g-meal" style="text-align:center;font-weight:700;">${z(r.mealTotal)}</td>
      <td class="gc g-wk" style="text-align:center;font-weight:700;">${z(r.wkTotal)}</td>
      <td class="gc g-sup" style="text-align:center;">${z(r.spTotal)}</td>
      <td class="gc g-sup" style="text-align:center;font-weight:800;">${z(r.spGuar)}</td>
      <td class="gc g-hol" style="text-align:center;">${z(r.hoTotal)}</td>

      <td class="otc gc g-ot" style="text-align:center;font-weight:800;">${fmtH(r.grand)}</td>

      <td class="namecell noStick">${esc(r.emp.name)}</td>
      ${dayCells}
    </tr>`;
  }).join('');

  const n = perEmp.length || 1;
  const avgOf = k => fmtH(perEmp.reduce((s,r)=>s+(r[k]||0),0)/n);
  const avgRow = `<tr style="background:var(--bg);font-weight:800;">
    <td colspan="2" style="text-align:center;">평 균</td>

    <td class="gc g-sup" style="text-align:center;">${avgOf('spTotal')}</td>
    <td class="gc g-sup" style="text-align:center;">${avgOf('spGuar')}</td>
    <td class="gc g-hol" style="text-align:center;">${avgOf('hoTotal')}</td>
    <td class="gc g-hol" style="text-align:center;">${avgOf('hoGuar')}</td>
    <td class="gc g-ot" style="text-align:center;">${avgOf('grand')}</td>
    <td class="gc g-ot" style="text-align:center;">${avgOf('otGuar')}</td>
    <td></td>
    ${days.map(()=>'<td></td>').join('')}
  </tr>`;

  return `
  <h2 class="pgttl">월별 OT현황</h2>
  <div class="row" style="margin-bottom:6px;align-items:center;">
    <div class="field"><label>시작일</label><input type="date" id="otRangeStartInput" value="${esc(otMatrixStart)}"></div>
    <div class="field"><label>종료일</label><input type="date" id="otRangeEndInput" value="${esc(otMatrixEnd)}"></div>
    <span style="flex:1 1 auto;"></span>
    <button class="btn ghost sm" id="prevPayMonth">◀ 이전달</button>
    <div class="field" style="min-width:auto;"><b style="font-size:15px;">${otPayYear}년 ${otPayMonth}월 (${esc(otMatrixStart)} ~ ${esc(otMatrixEnd)})</b></div>
    <button class="btn ghost sm" id="nextPayMonth">다음달 ▶</button>
  </div>
  <div class="row" style="margin-bottom:14px;">
    <button class="btn ${otTeamFilter===''?'':'ghost'} sm" data-act="ot-team-filter" data-team="">전체</button>
    <button class="btn ${otTeamFilter==='1'?'':'ghost'} sm" data-act="ot-team-filter" data-team="1">1조</button>
    <button class="btn ${otTeamFilter==='2'?'':'ghost'} sm" data-act="ot-team-filter" data-team="2">2조</button>
  </div>
  ${sortedEmployees.length? `<div class="scrollx gridwrap"><table class="gtbl otSum"><thead>
    <tr>
      <th rowspan="2" class="namehead">No</th><th rowspan="2" class="namehead" style="left:34px;">성명</th>
      <th class="gh g-meal">식사</th>
      <th class="gh g-wk">평일</th>
      <th colspan="2" class="gh g-sup">지원</th>
      <th colspan="2" class="gh g-hol">휴일</th>
      <th colspan="2" class="gc g-ot" style="font-weight:800;">OT</th>
      <th rowspan="2" class="namehead noStick">성명</th>
      <th colspan="${days.length}">일자별</th>
    </tr>
    <tr>
      <th class="gc g-meal">합계</th>
      <th class="gc g-wk">합계</th>
      <th class="gc g-sup">합계</th><th class="gc g-sup">보전</th>
      <th class="gc g-hol">합계</th><th class="gc g-hol">보전</th>
      <th class="gc g-ot">실</th><th class="gc g-ot">보전</th>
      ${dayHead}
    </tr>
  </thead><tbody>${rows}</tbody></table></div>`
    : `<div class="empty">등록된 직원이 없습니다.</div>`}
  ${otEdit ? renderOtEdit() : ''}
  ${payPw ? renderPayPw() : ''}
  ${paySlip ? renderPaySlip() : ''}
  `;
}
/* 월별 OT현황: PC에서는 표 전체(가로·세로)가 한 화면에 들어오도록 자동으로 축소(휴대폰은 그대로, 손가락으로 확대·축소) */
function fitOtTable(){
  const t = document.querySelector('table.otSum'); if(!t) return;
  const wrap = t.parentElement;
  const rows = Array.from(t.querySelectorAll('tbody tr'));
  t.style.zoom = ''; rows.forEach(tr=> tr.style.height = '');
  if(VIEW==='ot') mFreeze(t);
  if(VIEW!=='ot' || window.innerWidth <= 700) return;
  // 가로: 표 전체 폭이 화면에 들어오게 축소
  const availW = wrap.clientWidth - 2;
  let z = Math.min(1, availW / t.scrollWidth);
  z = Math.max(0.45, Math.floor(z*100)/100);
  if(z < 1) t.style.zoom = z;
  t.style.setProperty('--sepW', (1/z).toFixed(2)+'px'); // 줄여도 구분선이 화면에서 1px로 보이게
  // 세로: 남는 아래 공간만큼 줄 높이를 늘려서 화면 아래까지 크게(글씨는 그대로, 칸만 높아짐)
  const top = wrap.getBoundingClientRect().top;
  const availH = (window.innerHeight - Math.max(0, top) - 20) * 0.85; // 세로 85%
  const curH = t.getBoundingClientRect().height;
  if(rows.length && availH > curH + 4){
    const extra = (availH - curH) / z / rows.length;
    rows.forEach(tr=>{ const h = tr.getBoundingClientRect().height / z; tr.style.height = Math.min(h + extra, 60) + 'px'; });
  }
}
// 표를 PC 화면에 '맞춤': 남으면 늘리고(줄 높이·표 폭), 넘치면 줄임(zoom)
//  fitW: 표 폭을 자기 칸 폭에 꽉 맞춤 / fitH: 표 아래가 화면 아래(reserve 만큼 위)에 닿도록 줄 높이 조절
// 휴대폰 틀고정: 표 머리글 두 줄 + 왼쪽 No·성명 칸을 고정 (표 칸 안에서 위아래·옆으로 밀기)
function mFreeze(t){
  if(!t) return;
  const wrap = t.closest('.scrollx'); if(!wrap) return;
  const ths = t.querySelectorAll('thead th');
  if(window.innerWidth > 700){ wrap.classList.remove('mFreeze'); wrap.style.maxHeight = ''; ths.forEach(th=> th.style.top = ''); return; }
  wrap.classList.add('mFreeze');
  const sc = document.getElementById('content');
  const scTop = sc ? sc.getBoundingClientRect().top : 0;
  const h = Math.max(260, window.innerHeight - Math.max(0, scTop) - 12);
  wrap.style.maxHeight = h + 'px';
  const head = t.tHead; if(!head) return;
  [...head.rows].forEach(tr=>{ const y = tr.offsetTop - head.rows[0].offsetTop; [...tr.cells].forEach(th=> th.style.top = y + 'px'); });
}
function fitTableToScreen(t, {fitW=false, fitH=true, reserve=16, minRow=24, maxRow=90, ratio=1}={}){
  if(!t) return;
  const rows = Array.from(t.querySelectorAll('tbody tr'));
  t.style.zoom = ''; t.style.width = ''; rows.forEach(tr=> tr.style.height = '');
  t.style.removeProperty('--sepW');
  if(window.innerWidth <= 700) return; // 휴대폰은 원래 크기(두 손가락 확대·축소)
  let z = 1;
  if(fitW){
    const wrap = t.parentElement, w = wrap.clientWidth - 4;
    t.style.width = '100%';
    const sw = t.scrollWidth;
    if(sw > w + 2){ z = Math.max(0.4, Math.floor(w / sw * 1000)/1000 - 0.005); t.style.zoom = z; }
  }
  if(fitH && rows.length){
    const top = t.getBoundingClientRect().top;
    const availH = (window.innerHeight - Math.max(0, top) - reserve) * ratio; // ratio: 화면 높이의 몇 %까지 채울지
    if(availH < 120) return;
    const curH = t.getBoundingClientRect().height;               // 화면에 보이는 높이(zoom 반영)
    const bodyH = rows.reduce((a,tr)=> a + tr.getBoundingClientRect().height, 0);
    const headH = curH - bodyH;
    let rowH = ((availH - headH) / rows.length) / z;              // zoom 전 기준 줄 높이
    if(rowH >= minRow){
      rowH = Math.min(rowH, maxRow);
      rows.forEach(tr=> tr.style.height = rowH + 'px');
      // 칸 안 내용 때문에 원하는 만큼 안 줄어들면 남는 만큼 전체를 줄임
      const nowH = t.getBoundingClientRect().height;
      if(nowH > availH + 2){ z = Math.max(0.4, z * availH / nowH); t.style.zoom = z; }
    } else {
      rows.forEach(tr=> tr.style.height = minRow + 'px');
      const nowH = t.getBoundingClientRect().height;
      if(nowH > availH){ z = Math.max(0.4, z * availH / nowH); t.style.zoom = z; }
    }
  }
  if(z < 1) t.style.setProperty('--sepW', (1/z).toFixed(2)+'px');
}
// 사고&학자금: PC에서는 두 서류를 나란히, 가로·세로 모두 한 화면에 들어오게 맞춤(출력은 원래 크기)
function fitDocs(){
  const g = document.querySelector('.docGrid'); if(!g) return;
  g.style.zoom = '';
  // 학자금 신청서를 경위서와 같은 크기(높이)로: 아래 큰 빈칸 높이로 맞춤
  const acc = document.getElementById('accSheet'), hak = document.getElementById('hakSheet');
  const big = hak && hak.querySelector('.hakBig td');
  if(acc && hak && big){
    big.style.height = '';
    const diff = acc.getBoundingClientRect().height - hak.getBoundingClientRect().height;
    if(diff > 0) big.style.height = (big.getBoundingClientRect().height + diff) + 'px';
  }
  if(VIEW!=='accident') return;
  if(window.innerWidth <= 700){ // 휴대폰: 한 장씩 화면 폭에 꽉 맞춤
    const pcs0 = getComputedStyle(g.parentElement), w = g.parentElement.clientWidth - parseFloat(pcs0.paddingLeft||0) - parseFloat(pcs0.paddingRight||0) - 2;
    g.style.zoom = Math.min(1, Math.floor(w / 780 * 1000)/1000);
    return;
  }
  const top = g.getBoundingClientRect().top;
  const availH = window.innerHeight - Math.max(0, top) - 12;
  const pcs = getComputedStyle(g.parentElement);
  const availW = g.parentElement.clientWidth - parseFloat(pcs.paddingLeft||0) - parseFloat(pcs.paddingRight||0) - 6;
  // 화면 가로·세로에 꽉 맞춤: 서류 높이(A4 1103px)는 화면 높이에 맞춰 줄이고, 남는 가로는 두 장이 나눠 넓게 씀
  const H = 1103, label = 36, gap = 18;
  g.style.setProperty('--docH', H + 'px');
  const z = Math.min(1, availH > 200 ? availH / (H + label) : 1);
  const W = Math.floor(((availW / z) - gap) / 2);
  g.style.setProperty('--docW', Math.max(560, Math.min(1400, W)) + 'px');
  g.style.zoom = Math.max(0.35, Math.floor(Math.min(z, availW / g.scrollWidth) * 1000)/1000);
}
// 관리감독자 일지: 좌우 두 장을 가로·세로 모두 한 화면에 맞춤

// 배차표(휴대폰): 처음 화면에서 마지막 조원(16번)까지 한 번에 보이도록 표를 화면 높이에 맞춰 줄임
function fitDispatch(){
  const t = document.getElementById('dpTable'); if(!t) return;
  t.style.zoom = ''; t.classList.remove('dpFit'); t.style.removeProperty('--dpRowH'); t.style.removeProperty('--dpFs');
  if(VIEW!=='dispatch' || window.innerWidth > 700) return;
  const empRows = Array.from(t.querySelectorAll('tbody tr')).filter(tr=>{ const c = tr.querySelector('td.dpI1'); return c && /^\d+$/.test(c.textContent.trim()) && !tr.querySelector('input[data-dispatch-sup]'); });
  if(!empRows.length) return;
  // 실제로 보이는 화면 높이(아이폰: 주소창·아래 도구막대·홈 막대 제외)
  const vv = window.visualViewport;
  const vh = Math.min(window.innerHeight, vv ? vv.height : window.innerHeight);
  const sc = document.getElementById('content'), scY = sc ? sc.scrollTop : 0;
  const tTop = t.getBoundingClientRect().top + scY;
  const lastBottom = () => empRows[empRows.length-1].getBoundingClientRect().bottom + (sc ? sc.scrollTop : 0);
  const avail = vh - 10;
  if(lastBottom() <= avail) return;
  // 1단계: 확대·축소(zoom) 없이 줄 높이와 글씨를 줄여서 마지막 조원까지 화면에 넣음(아이폰·안드로이드 모두 같은 방식)
  const headH = t.tHead ? t.tHead.getBoundingClientRect().height : 0;
  const rowH = Math.floor((avail - tTop - headH) / empRows.length);
  const h = Math.max(15, Math.min(28, rowH));
  t.style.setProperty('--dpRowH', h + 'px');
  t.style.setProperty('--dpFs', Math.max(9, Math.min(12, Math.round(h * 0.5 * 10) / 10)) + 'px');
  t.classList.add('dpFit');
  // 2단계: 그래도 넘치면(조원이 아주 많을 때) 표 전체를 조금 줄임
  const lb = lastBottom();
  if(lb > avail){ const z = (avail - tTop) / (lb - tTop); t.style.zoom = Math.max(0.5, Math.min(1, Math.floor(z*1000)/1000)); }
}
// 휴대폰: 화면 높이가 바뀌면(주소창 접힘·펴짐) 배차표 다시 맞춤
if(window.visualViewport) window.visualViewport.addEventListener('resize', ()=>{ clearTimeout(window._dpFitT); window._dpFitT = setTimeout(()=>{ fitDispatch(); fitInputMobile(); }, 150); });
// 지원계획표: 세로를 화면 높이의 85%로(줄 높이를 늘림)

function fitInputMobile(){
  const t = document.querySelector('table.inTbl'); if(!t) return;
  t.classList.remove('inFit'); t.style.removeProperty('--inRowH'); t.style.removeProperty('--inFs'); t.style.zoom = '';
  if((VIEW!=='input' && VIEW!=='input2') || window.innerWidth > 700) return;
  const rows = Array.from(t.querySelectorAll('tbody tr')); if(rows.length < 2) return;
  const vv = window.visualViewport;
  const vh = Math.min(window.innerHeight, vv ? vv.height : window.innerHeight);
  const sc = document.getElementById('content'), y0 = ()=> sc ? sc.scrollTop : 0;
  const tTop = t.getBoundingClientRect().top + y0();
  const btn = document.getElementById('inSave');
  const btnH = btn ? (btn.getBoundingClientRect().height + 16) : 50;   // 표 아래 [저장] 줄
  const lastBottom = ()=> rows[rows.length-1].getBoundingClientRect().bottom + y0();
  const avail = vh - 8 - btnH;
  if(lastBottom() <= avail) return;
  const headH = t.tHead ? t.tHead.getBoundingClientRect().height : 0;
  const h = Math.max(16, Math.min(34, Math.floor((avail - tTop - headH) / rows.length)));
  t.style.setProperty('--inRowH', h + 'px');
  t.style.setProperty('--inFs', Math.max(10, Math.min(13, Math.round(h * 0.48 * 10) / 10)) + 'px');
  t.classList.add('inFit');
  const lb = lastBottom();
  if(lb > avail){ const z = (avail - tTop) / (lb - tTop); t.style.zoom = Math.max(0.6, Math.min(1, Math.floor(z*1000)/1000)); }
}

const UI_ZOOM_KEY = 'snct_ui_zoom', UI_ZOOM_MIN = 0.7, UI_ZOOM_MAX = 1.6, PC_FIT_FLOOR = 0.75;
let uiZoom = 1;
try{ const v = parseFloat(localStorage.getItem(UI_ZOOM_KEY)); if(v >= UI_ZOOM_MIN && v <= UI_ZOOM_MAX) uiZoom = v; }catch(e){}
const UI_ZOOM_TARGETS = '#content table.otSum, #content table.ctbl, #content table.inTbl, #content #splanTable, #content #dpTable, #content .docGrid, #content .svPages';
function applyUiZoom(){
  const pct = document.getElementById('zoomPct'); if(pct) pct.textContent = Math.round(uiZoom*100) + '%';
  if(window.innerWidth <= 700) return;
  document.querySelectorAll(UI_ZOOM_TARGETS).forEach(el=>{
    const cur = parseFloat(el.style.zoom) || 1;
    const z = Math.max(cur, Math.min(1, PC_FIT_FLOOR)) * uiZoom;
    if(Math.abs(z - 1) < 0.001) el.style.zoom = ''; else el.style.zoom = Math.round(z*1000)/1000;
    if(z > cur + 0.001){ const sc = el.closest('.scrollx, .dpWrap'); if(sc) sc.classList.add('zoomScroll'); }
  });
}
function fitAllViews(){ fitOtTable(); fitInputTable(); fitCombined(); fitDocs(); fitSafety(); fitDispatch(); fitSplan(); applyUiZoom(); }
function setUiZoom(v){
  uiZoom = Math.max(UI_ZOOM_MIN, Math.min(UI_ZOOM_MAX, Math.round(v*10)/10));
  try{ localStorage.setItem(UI_ZOOM_KEY, String(uiZoom)); }catch(e){}
  fitAllViews();
}
(function(){
  document.addEventListener('click', ev=>{ const b = ev.target.closest && ev.target.closest('#zoomCtl [data-zoom]'); if(!b) return;
    const d = b.dataset.zoom; setUiZoom(d==='0' ? 1 : uiZoom + (d==='+' ? 0.1 : -0.1)); });
  // Ctrl + 휠 / Ctrl + '+' '-' '0' : 브라우저 확대 대신 앱 배율을 바꿈(표가 화면 맞춤 때문에 도로 작아지지 않게)
  window.addEventListener('wheel', ev=>{ if(!ev.ctrlKey || window.innerWidth <= 700) return; ev.preventDefault(); setUiZoom(uiZoom + (ev.deltaY < 0 ? 0.1 : -0.1)); }, {passive:false});
  window.addEventListener('keydown', ev=>{ if(!(ev.ctrlKey || ev.metaKey) || window.innerWidth <= 700) return;
    if(ev.key==='+' || ev.key==='=' ){ ev.preventDefault(); setUiZoom(uiZoom + 0.1); }

})();

function autoOrdinary(p, asOf){

}
// 'oo-oo-oo'(또는 8자리) → 'YYYY-MM-DD'. 두 자리 연도는 올해 이하면 20xx, 아니면 19xx
function payDateFull(str){
  const d = String(str||'').replace(/\D/g,'');
  let y, m, dd;
  if(d.length===8){ y = +d.slice(0,4); m = +d.slice(4,6); dd = +d.slice(6,8); }
  else if(d.length===6){ const yy = +d.slice(0,2), cy = new Date().getFullYear()%100; y = yy<=cy ? 2000+yy : 1900+yy; m = +d.slice(2,4); dd = +d.slice(4,6); }
  else return '';
  if(m<1 || m>12 || dd<1 || dd>31) return '';
  return dstr(y, m, dd);
}
function payDateFmt(raw){ // 입력하는 대로 oo-oo-oo 모양으로
  const d = String(raw||'').replace(/\D/g,'').slice(0,6);
  return d.length>4 ? d.slice(0,2)+'-'+d.slice(2,4)+'-'+d.slice(4) : d.length>2 ? d.slice(0,2)+'-'+d.slice(2) : d;
}
// 근속수당: 입사일 기준 만 5년 = 10,000원, 5년 초과 1년마다 5,000원 가산(5년 미만 0원). asOf = 기준일(명세서는 근무기간 끝날)
function tenureYears(hire, asOf){
  const h = payDateFull(hire); if(!h) return 0;
  const [hy,hm,hd] = h.split('-').map(Number), [ay,am,ad] = (asOf || todayStr()).split('-').map(Number);
  let y = ay - hy; if(am < hm || (am===hm && ad < hd)) y--;
  return Math.max(0, y);
}
function tenureAllowance(hire, asOf){
  const y = tenureYears(hire, asOf);
  return y < 5 ? 0 : 10000 + (y - 5) * 5000;
}
function dedAmount(rate, gross){
  if(!rate) return 0;
  const v = Number(rate.v)||0; if(!v) return 0;
  return rate.unit==='원' ? Math.round(v) : Math.floor(gross * v / 100 / 10) * 10;
}

/* ========================= 명세서 비번(개인 변경) =========================
   처음 비번 = 급여관리의 '명세서 비번'(생년월일). 개인이 '비번 변경' 화면에서 바꾸면 slipPw/{직원ID}에 암호화(해시)해서 저장.
   UNION은 급여관리에서 '비번 초기화'를 누르면 처음 비번으로 돌아감 */
let slipPwMap = {}; // empId -> {h, updatedAt}
function sha256hex(str){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const bytes = Array.from(new TextEncoder().encode(str)), l = bytes.length*8;
  bytes.push(0x80); while(bytes.length%64!==56) bytes.push(0);
  for(let i=7;i>=0;i--) bytes.push(Math.floor(l/Math.pow(2,i*8))&255);
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const r=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let o=0;o<bytes.length;o+=64){
    const w=new Array(64);
    for(let i=0;i<16;i++) w[i]=(bytes[o+i*4]<<24)|(bytes[o+i*4+1]<<16)|(bytes[o+i*4+2]<<8)|bytes[o+i*4+3];
    for(let i=16;i<64;i++){ const s0=r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3), s1=r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10); w[i]=(w[i-16]+s0+w[i-7]+s1)|0; }
    let [a,b,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){ const S1=r(e,6)^r(e,11)^r(e,25), ch=(e&f)^(~e&g), t1=(h+S1+ch+K[i]+w[i])|0, S0=r(a,2)^r(a,13)^r(a,22), mj=(a&b)^(a&c)^(b&c), t2=(S0+mj)|0; h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0; }
    H=[H[0]+a,H[1]+b,H[2]+c,H[3]+d,H[4]+e,H[5]+f,H[6]+g,H[7]+h].map(x=>x|0);
  }
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}
function slipPwHash(empId, pw){ return sha256hex('snct-slip:'+empId+':'+String(pw||'').trim()); }
function slipPwCustom(empId){ return !!(slipPwMap[empId] && slipPwMap[empId].h); }
// 비번 확인: 개인이 바꾼 비번이 있으면 그것, 없으면 급여관리의 '명세서 비번'(생년월일 6·8자리, 그대로 입력도 허용)
// 명세서 비번: 개인이 '비번' 버튼에서 직접 입력·수정한 비번만 사용(UNION은 초기화만)
function slipPwOk(empId, input){
  const v = String(input||'').trim(); if(!v) return false;
  return slipPwCustom(empId) && slipPwHash(empId, v) === slipPwMap[empId].h;
}
function slipPwHasAny(empId){ return slipPwCustom(empId); }
// 화면 위쪽 [비번] 버튼 → 팝업: 처음이면 '입력', 이미 있으면 현재 비번 확인 후 '수정'
function openPwDialog(){
  const old = document.getElementById('pwOverlay'); if(old) old.remove();
  const list = employees.slice().sort((a,b)=>{ const ta=a.team||'9', tb=b.team||'9'; if(ta!==tb) return ta<tb?-1:1; return (a.teamOrder||999)-(b.teamOrder||999); });
  const ov = document.createElement('div');

  ov.innerHTML = `<div class="pwBox pwDlg" role="dialog" aria-label="명세서 비번">
    <h3 id="pwDlgTtl">명세서 비번</h3>
    <p style="margin:0 0 12px;">급여명세서를 열 때 쓰는 비번이에요. 처음이면 <b>입력</b>, 이미 있으면 <b>수정</b>할 수 있어요. 잊어버리면 UNION에 초기화를 부탁하세요.</p>
    <label class="pwLbl">성명</label>
    <select id="pwDEmp" class="pwIn"><option value="">이름을 고르세요</option>${list.map(e=>`<option value="${esc(e.id)}">${esc((e.team?e.team+'조 ':'')+e.name)}</option>`).join('')}</select>
    <div id="pwDCurWrap" style="display:none;"><label class="pwLbl">현재 비번</label><input type="password" id="pwDCur" class="pwIn" autocomplete="off"></div>
    <label class="pwLbl" id="pwDNewLbl">새 비번 (4자 이상)</label><input type="password" id="pwDNew" class="pwIn" autocomplete="new-password">

    <div class="pwMsg" id="pwDMsg"></div>
    <div class="pwBtns"><button class="pwOk" id="pwDSave">입력</button><button class="pwNo" id="pwDCancel">취소</button></div>
  </div>`;
  document.body.appendChild(ov);
  const $ = id => ov.querySelector('#'+id);
  const msg = (t, ok)=>{ const m = $('pwDMsg'); m.textContent = t; m.classList.toggle('ok', !!ok); };
  let checking = false, checkFail = false;
  const sync = ()=>{
    const id = $('pwDEmp').value, has = !!id && slipPwCustom(id);
    const unknown = !!id && !has && (checking || checkFail || (db && !demoMode && slipPwState!=='ok'));
    $('pwDCurWrap').style.display = has ? '' : 'none';
    $('pwDSave').textContent = has ? '수정' : '입력';
    $('pwDSave').disabled = unknown;
    ['pwDNew','pwDNew2'].forEach(k=> $(k).disabled = unknown);
    $('pwDlgTtl').textContent = (id && !unknown) ? (has ? '명세서 비번 수정' : '명세서 비번 입력') : '명세서 비번';
    if(!id) return msg('', true);
    if(has) return msg('이미 비번이 등록돼 있어요. 바꾸려면 현재 비번을 넣으세요. 잊었으면 UNION에 초기화를 부탁하세요.', true);
    if(checking) return msg('비번 등록 여부를 확인하는 중이에요…', true);
    if(unknown) return msg('지금은 비번 정보를 확인할 수 없어요. 인터넷 연결을 확인하고 잠시 후 다시 해 주세요.');
    msg('아직 비번이 없어요. 새 비번을 입력하세요.', true);

  $('pwDEmp').onchange = async ()=>{
    const id = $('pwDEmp').value; checkFail = false;
    if(!id){ sync(); return; }

    const r = await slipPwServerCheck(id);
    if($('pwDEmp').value !== id) return;
    checking = false; checkFail = (r === null); sync();
  };
  const close = ()=>{ window._pwDlgSync = null; ov.remove(); };
  $('pwDCancel').onclick = close;
  ov.onclick = ev=>{ if(ev.target===ov) close(); };
  $('pwDSave').onclick = async ()=>{
    const id = $('pwDEmp').value;

    const cur = await slipPwServerCheck(id);
    if(cur === null) return msg('지금은 비번 정보를 확인할 수 없어요. 인터넷 연결을 확인하고 잠시 후 다시 해 주세요.');
    const has = !!cur;
    if(has && $('pwDCurWrap').style.display==='none'){ sync(); return msg('이미 비번이 등록돼 있어요. 바꾸려면 현재 비번을 넣으세요. 잊었으면 UNION에 초기화를 부탁하세요.'); }

    if(has) rec.prev = cur.h; // 수정할 때는 이전 비번 값을 함께 보내야 서버가 허락(규칙)
    if(!db || demoMode){ slipPwMap[id] = rec; close(); showToast(has ? '비번을 수정했어요. (미리보기)' : '비번을 입력했어요. (미리보기)'); render(); return; }
    try{ await db.collection('slipPw').doc(id).set(rec); slipPwMap[id] = rec; close(); showToast(has ? '비번을 수정했어요.' : '비번을 입력했어요. 이제 이 비번으로 명세서를 열 수 있어요.'); render(); }

// 명세서 비번: 서버에서 실제로 받아 온 뒤에만 '비번 있음/없음'을 판단(기기에 남은 사본·불러오기 실패로 '없음'이라고 잘못 보이지 않게)
let slipPwState = 'loading'; // loading | ok | error
function subscribeSlipPw(){
  if(!db || demoMode || unsub.slipPw) return;
  try{
    const {fsM, fs} = fb;
    unsub.slipPw = fsM.onSnapshot(fsM.collection(fs, 'slipPw'), {includeMetadataChanges:true}, snap=>{
      const m = {}; snap.docs.forEach(d=>{ m[d.id] = d.data(); }); slipPwMap = m;
      if(!snap.metadata.fromCache) slipPwState = 'ok';
      if(typeof window._pwDlgSync==='function') window._pwDlgSync();
      scheduleRender();
    }, ()=>{ slipPwState = 'error'; if(typeof window._pwDlgSync==='function') window._pwDlgSync(); });
  }catch(e){ slipPwState = 'error'; }
}
// 한 사람의 비번 등록 여부를 서버에서 바로 확인(실패하면 null)
async function slipPwServerCheck(id){
  if(!db || demoMode) return slipPwMap[id] || false;
  try{
    const {fsM, fs} = fb; const snap = await fsM.getDocFromServer(fsM.doc(fs, 'slipPw', id));
    if(snap.exists()){ slipPwMap[id] = snap.data(); return snap.data(); }
    delete slipPwMap[id]; return false;
  }catch(e){ return null; }
}

  </div></div>`;
}
// 기존에 2023년 2월 명세서로 대조 확인한 계산(payCalc)과 같은 방식 — 월별 OT현황에 불러온 기록을 사용
function slipCalc(e, start, end){
  let wk=0, ho=0, sp=0, meal=0, holWork=0, holOT=0, holNight=0, holExtra=0, wkNight=0, wkGroupPrem=0, supPrem=0, tkDays=0;
  for(let ds=start; ds<=end; ds=addDays(ds,1)){
    const rec = otMatrixAttendance[ds+'_'+e.id]; if(!rec) continue;
    const c = computeDaily(rec, ds), p = computeSupportDaily(rec, ds), m = computeMealAllowance(rec) + computeDamdang(rec);
    if(c.valid){
      if(c.category==='일요일' || c.category==='공휴일'){
        ho += c.premium; holWork += c.totalWork - c.overtime; holOT += c.overtime; holNight += c.night;
        holExtra += c.premium - (c.totalWork*1.5 + c.overtime*0.5 + c.night*0.5); // 연근 등 추가분
      } else { wk += c.premium; wkNight += c.night; wkGroupPrem += c.premium; }
    }
    if(p.valid){
      const k = dayCategory(ds, recManguen(rec, ds), rec && rec.employeeId);
      if(k==='SU' || k==='H') ho += p.premium; else sp += p.premium;
      // 2026년 9월 명세서(전재필)와 대조한 규칙:
      //  · 근태코드가 D·N(근무 없는 날 다른 조 지원)인 날의 지원 OT → '타조지원'
      //  · 그 밖의 지원(DN·ND 연장 지원, SC 지원휴무 등) → 연장근로·평일야간에 포함
      //  · SC(지원휴무) 지원일은 하루 8시간 × 시급을 '특근수당'으로 추가
      const code = effCode(rec, ds, String(e.name||'').trim());
      if(code==='D' || code==='N') supPrem += p.premium;
      else { wkNight += p.supNight; wkGroupPrem += p.premium; }
      if(code==='SC') tkDays++;
    }
    meal += m; wkGroupPrem += m;
  }
  const real = wk + ho + sp + meal, guar = wk + Math.max(ho,60) + Math.max(sp,30) + meal;
  return {guar, diff: Math.max(guar-real,0), extHours: Math.max((wkGroupPrem - wkNight*0.5)/1.5, 0), wkNight, holWork, holOT, holNight, holExtra, supPrem, tkDays};
}
function renderPaySlip(){
  const e = employees.find(x=>x.id===paySlip.empId);
  if(!e) return '';
  const p = payMgr[e.id] || {};
  const hourly = Number(p.hourly)||0, tenure = tenureAllowance(p.hire, otMatrixEnd); // 근속수당: 입사일 기준(근무기간 끝날 기준 근속연수)
  const rate = Number(p.ordinary) || autoOrdinary(p, otMatrixEnd); // 통상시급: 입력값, 비어 있으면 (기본급+근속수당)/209
  const pc = slipCalc(e, otMatrixStart, otMatrixEnd);
  const r10 = v => Math.round(v/10)*10;
  const a = {
    base: Math.floor(hourly * PAY_BASE_HOURS / 10) * 10, // 10원 미만 버림(명세서: 20,731×209 = 4,332,770)
    tenure,
    ext: r10(pc.extHours*rate*1.5),                       // 연장근로수당
    night: r10(pc.wkNight*rate*0.5),                      // 평일야간근로수당
    hol: r10((pc.holWork*1.5 + pc.holExtra)*rate),        // 휴일근로수당
    holOT: r10(pc.holOT*rate*2),                          // 휴일연장근로수당
    holN: r10(pc.holNight*rate*0.5),                      // 휴일야간근로수당
    etc: r10(pc.diff*rate),                               // 기타수당(보전 OT − 실 OT)
    sup: Math.ceil(pc.supPrem*rate/10)*10,                // 타조지원(D·N 지원일 OT) — 10원 올림(9월 명세서: 661,312.5 → 661,320)
    tk: r10(pc.tkDays*8*hourly)                           // 특근수당(SC 지원휴무일 × 8시간 × 시급)
  };
  // 기타수당 = 보전 OT 총액 − 다른 OT 수당 합계(10원 단위 차이를 기타수당에서 맞춤 — 9월 명세서와 같은 방식)
  if(pc.diff > 0) a.etc = Math.max(r10(pc.guar*rate) - (a.ext + a.night + a.hol + a.holOT + a.holN + a.sup), 0);
  a.pos = Number(p.posAllow)||0; a.tech = Number(p.techAllow)||0; // 급여관리의 직책수당·기술수당(매달 정액)
  const total = a.base + a.tenure + a.pos + a.tech + a.ext + a.night + a.hol + a.holOT + a.holN + a.etc + a.sup + a.tk;
  const ded = {}; PAY_DED.forEach(([k])=>{ ded[k] = dedAmount(payDedRates[k], total); });
  const dedTotal = PAY_DED.reduce((x,[k])=> x + ded[k], 0);
  const H = t => `<td class="h">${t}</td>`, V = v => `<td>${v}</td>`, E6 = '<td></td>'.repeat(6);
  const sec = (t, n) => `<td class="sec" rowspan="${n}">${t}</td>`;
  const alt = n => Array.from({length:n}, (_,i)=>`<tr class="${i%2===0?'alt':''}">${E6}</tr>`).join('');
  const hm2 = v => v ? hm(v) : '';
  const label = `${otPayYear}년 ${String(otPayMonth).padStart(2,'0')}월`;
  return `<div class="payScrim" id="slipScrim"><div class="slipBox">
    <button id="slipClose" class="slipClose" aria-label="닫기">닫기 ✕</button>
    <div class="slipTitle">급여명세서 &nbsp;( ${label} )</div>
    <table class="slipInfo"><tr>
      <td><b>부서 :</b> ${PAY_DEPT}</td><td><b>직급 :</b> ${esc(p.grade||'')}</td><td><b>성명 :</b> ${esc(e.name)} &nbsp;귀하</td>
    </tr></table>
    <div class="slipDates"><span><b>시급 :</b> ${slipWon(hourly)}원 &nbsp; <b>통상시급 :</b> ${slipWon(rate)}원</span></div>
    <div class="slipWrap"><table class="slipTbl">
      <colgroup><col style="width:12%"><col><col><col><col><col><col></colgroup>
      <tr>${H('지급내역')}${H('기본급')}${H('학자금')}${H('근속수당')}${H('직책수당')}${H('기술수당')}${H('연장근로수당')}</tr>
      <tr>${sec('',9)}${V(slipWon(a.base))}${V('')}${V(slipWon(a.tenure))}${V(slipWon(a.pos))}${V(slipWon(a.tech))}${V(slipWon(a.ext))}</tr>
      <tr>${H('평일야간근로수당')}${H('휴일근로수당')}${H('휴일연장근로수당')}${H('휴일야간근로수당')}${H('특근수당')}${H('보전수당')}</tr>
      <tr>${V(slipWon(a.night))}${V(slipWon(a.hol))}${V(slipWon(a.holOT))}${V(slipWon(a.holN))}${V(slipWon(a.tk))}${V('')}</tr>
      <tr>${H('고공(위험)수당')}${H('식대')}${H('기타수당')}${H('타조지원')}${H('비상정비')}${H('무사고포상금')}</tr>
      <tr>${V('')}${V('')}${V(slipWon(a.etc))}${V(slipWon(a.sup))}${V('')}${V('')}</tr>
      ${alt(4)}
      <tr class="bt">${H('공제내역')}${PAY_DED.slice(0,6).map(([,t])=>H(t)).join('')}</tr>
      <tr>${sec('',9)}${PAY_DED.slice(0,6).map(([k])=>V(slipWon(ded[k]))).join('')}</tr>
      <tr>${PAY_DED.slice(6,12).map(([,t])=>H(t)).join('')}</tr>
      <tr>${PAY_DED.slice(6,12).map(([k])=>V(slipWon(ded[k]))).join('')}</tr>
      <tr>${H(PAY_DED[12][1])}<td class="h"></td><td class="h"></td><td class="h"></td><td class="h"></td><td class="h"></td></tr>
      <tr>${V(slipWon(ded[PAY_DED[12][0]]))}<td></td><td></td><td></td><td></td><td></td></tr>
      ${alt(4)}
      <tr class="bt">${H('근태사항')}${H('평일연장근로시간')}${H('평일야간근로시간')}${H('휴일근로시간')}${H('휴일연장근로시간')}${H('휴일야간근로시간')}<td class="h"></td></tr>
      <tr>${sec('',5)}${V(hm2(pc.extHours))}${V(hm2(pc.wkNight))}${V(hm2(pc.holWork))}${V(hm2(pc.holOT))}${V(hm2(pc.holNight))}${V('')}</tr>
      ${alt(4)}
      <tr class="bt">${H('합계')}<td class="h"></td><td class="h" colspan="2">지급총액</td><td class="h" colspan="2">공제총액</td><td class="h">실지급액</td></tr>
      <tr><td class="h"></td><td></td><td colspan="2">${slipWon(total)}</td><td colspan="2">${slipWon(dedTotal)}</td><td>${slipWon(total - dedTotal)}</td></tr>
    </table></div>
  </div></div>`;
}
function bindPayroll(el){
  // 급여관리 화면
  el.querySelectorAll('[data-act="pay-team"]').forEach(x=>x.onclick=()=>{ payMgrTeam = x.dataset.team; render(); });
  el.querySelectorAll('[data-act="pay-tab"]').forEach(x=>x.onclick=()=>{ payMgrTab = x.dataset.tab; render(); });
  const markDirty = ()=>{ const b = document.getElementById('paySave'); if(b) b.textContent = `저장 (${payDirtyN()}건 변경)`; };
  el.querySelectorAll('input[data-rate]').forEach(x=> x.oninput = ()=>{
    const k = x.dataset.rate; payRateDraft = payRateDraft || JSON.parse(JSON.stringify(payDedRates));
    const r = payRateDraft[k] = Object.assign({unit:'%'}, payRateDraft[k]||{});
    if(r.unit==='원'){
      const digits = x.value.replace(/[^0-9]/g,''); x.value = digits ? Number(digits).toLocaleString('ko-KR') : ''; r.v = digits ? Number(digits) : '';
    } else {
      let t = x.value.replace(/[^0-9.]/g,''); const i = t.indexOf('.'); if(i>=0) t = t.slice(0,i+1) + t.slice(i+1).replace(/\./g,'');
      if(t!==x.value) x.value = t; r.v = t==='' ? '' : (t.endsWith('.') ? t : Number(t));
    }
    markDirty();
  });
  el.querySelectorAll('select[data-rate-unit]').forEach(x=> x.onchange = ()=>{
    const k = x.dataset.rateUnit; payRateDraft = payRateDraft || JSON.parse(JSON.stringify(payDedRates));
    payRateDraft[k] = Object.assign({}, payRateDraft[k]||{}, {unit: x.value, v: ''}); render();
  });
  el.querySelectorAll('select[data-pay]').forEach(x=> x.onchange = ()=>{
    const id = x.dataset.emp; payDraft[id] = payDraft[id] || {}; payDraft[id][x.dataset.pay] = x.value;
    markDirty();
  });
  el.querySelectorAll('input[data-pay]').forEach(x=>{
    if(x.type==='date') x.onchange = ()=> x.oninput();
    x.oninput = ()=>{
      const id = x.dataset.emp, k = x.dataset.pay;
      payDraft[id] = payDraft[id] || {};
      if(PAY_DATE_KEYS.includes(k)){
        const f = payDateFmt(x.value); if(f!==x.value) x.value = f;
        payDraft[id][k] = f;
        if(k==='hire'){ const c = el.querySelector(`.tenureCell[data-emp="${CSS.escape(id)}"]`); if(c) c.innerHTML = tenureCellHtml(payOf(id));
          const lc = el.querySelector(`.leaveCell[data-emp="${CSS.escape(id)}"]`); if(lc){ const ip = lc.querySelector('input'); const ph = leaveCountAuto(payOf(id).hire); if(ip) ip.placeholder = ph===null ? '입사일 입력' : ph; const ys = lc.querySelector('.yrs'); const g = leaveTenure(payOf(id).hire); if(ys) ys.textContent = g===null ? '' : g+'년'; } }
      }
      else if(PAY_TEXT_KEYS.includes(k)){ payDraft[id][k] = x.value.trim(); }
      else {
        // 숫자만 남기고 1,000 단위 콤마로 다시 표시(커서는 뒤에서부터 같은 자리 유지)
        const fromEnd = x.value.length - (x.selectionStart ?? x.value.length);
        const digits = x.value.replace(/[^0-9]/g, '').replace(/^0+(?=\d)/, '');
        x.value = digits ? Number(digits).toLocaleString('ko-KR') : '';
        const pos = Math.max(0, x.value.length - fromEnd); try{ x.setSelectionRange(pos, pos); }catch(_){}
        payDraft[id][k] = digits ? Number(digits) : '';
      }
      // 시급·근속수당을 바꾸면 같은 줄 통상시급 칸의 '자동' 값도 바로 바뀜(사람마다 근속수당이 달라서)
      if(k==='hourly' || k==='tenure' || k==='hire' || k==='posAllow' || k==='techAllow'){
        const o = el.querySelector(`input[data-pay="ordinary"][data-emp="${CSS.escape(id)}"]`);
        if(o){ const v = autoOrdinary(payOf(id)); o.placeholder = v ? v.toLocaleString('ko-KR') : '0'; }
      }
      markDirty();
    };
  });
  const ps = document.getElementById('paySave');
  if(ps) ps.onclick = async ()=>{
    if(!requireEdit()) return;
    if(!payDirtyN()){ showToast('바뀐 내용이 없어요.'); return; }
    const next = Object.assign({}, payMgr);
    Object.keys(payDraft).forEach(id=>{ next[id] = Object.assign({}, payMgr[id]||{}, payDraft[id]); });
    const rates = {};
    Object.entries(payRateDraft || payDedRates).forEach(([k,r])=>{ const v = Number(r && r.v); rates[k] = {unit: (r&&r.unit)||'%', v: Number.isFinite(v) && v ? v : 0}; });
    payMgr = next; payDedRates = rates; payDraft = {}; payRateDraft = null; render();
    if(!db) return;
    try{ await db.doc('meta/payroll').set({byEmp: next, dedRates: rates}); showToast('저장되었습니다.'); }
    catch(err){ showToast(saveErrMsg('저장에 실패했습니다.', err)); }
  };
  const pr = document.getElementById('payReset');
  if(pr) pr.onclick = ()=>{ payDraft = {}; payRateDraft = null; render(); };
  // 월별 OT현황: 성명 → 암호 → 명세서
  el.querySelectorAll('[data-act="pay-open"]').forEach(x=>x.onclick=()=>{
    const p = payMgr[x.dataset.emp];
    if(!slipPwHasAny(x.dataset.emp)){ showToast('명세서 비번이 아직 없어요. 화면 위쪽 [비번] 버튼에서 먼저 비번을 입력하세요.'); return; }
    payPw = {empId: x.dataset.emp, err:''}; render();
    setTimeout(()=>{ const i = document.getElementById('payPwInput'); if(i) i.focus(); }, 30);
  });
  const pi = document.getElementById('payPwInput');
  if(pi){
    const ok = document.getElementById('payPwOk');
    const tryOpen = ()=>{
      const p = payMgr[payPw.empId] || {};
      if(slipPwOk(payPw.empId, pi.value)){ paySlip = {empId: payPw.empId}; payPw = null; render(); }
      else { document.getElementById('payPwErr').textContent = '암호가 맞지 않습니다.'; pi.select(); }
    };
    pi.oninput = ()=>{ ok.disabled = !pi.value; document.getElementById('payPwErr').textContent = ''; };
    pi.onkeydown = ev=>{ if(ev.key==='Enter' && pi.value){ ev.preventDefault(); tryOpen(); } else if(ev.key==='Escape'){ payPw = null; render(); } };
    ok.onpointerdown = ev=> ev.preventDefault();
    ok.onclick = tryOpen;
    document.getElementById('payPwNo').onclick = ()=>{ payPw = null; render(); };
  }
  const sc = document.getElementById('slipScrim');
  if(sc){
    sc.onclick = ev=>{ if(ev.target===sc){ paySlip = null; render(); } };
    document.getElementById('slipClose').onclick = ()=>{ paySlip = null; render(); };
  }
}

function svLogHtml(mon, id){
  mon = mon || svForm.week;
  const w = svWeek(mon), live = !id || id==='svLog', days = Array.from({length:7}, (_,i)=> addDays(mon, i));
  const wd = ['일','월','화','수','목','금','토'];
  const dl = ds => { const [y,m,d] = ds.split('-').map(Number); return `${m}/${String(d).padStart(2,'0')}(${wd[new Date(y,m-1,d).getDay()]})`; };
  const grpSpan = {}; SV_ITEMS.forEach(it=> grpSpan[it.g] = (grpSpan[it.g]||0)+1);
  const cSpan = {}; SV_ITEMS.forEach(it=> cSpan[it.g+it.c] = (cSpan[it.g+it.c]||0)+1);
  const seenG = {}, seenC = {};
  const A = (k)=> live ? ` data-svw="${k}"` : '';
  const rows = SV_ITEMS.map((it, r)=>{
    let h = '<tr' + (r===6||r===12 ? ' class="svGrpTop"' : '') + '>';
    if(!seenG[it.g]){ seenG[it.g] = 1; h += `<th class="svG" rowspan="${grpSpan[it.g]}">${it.g.split(' ').join('<br>')}</th>`; }
    if(!seenC[it.g+it.c]){ seenC[it.g+it.c] = 1; h += `<td class="svC" rowspan="${cSpan[it.g+it.c]}">${esc(it.c)}</td>`; }
    const pt = it.injury
      ? `산업재해 발생상태<div class="svInj">(재해자: <input class="svIn"${A('victim')} value="${esc(w.victim)}">)</div><div class="svInj">(재해원인: <input class="svIn"${A('cause')} value="${esc(w.cause)}">)</div>`
      : esc(it.p).replace(/\n/g,'<br>');
    h += `<td class="svP" colspan="2">${pt}</td>`;
    days.forEach((ds, i)=>{ const v = svLogMark(w, r, i); h += `<td class="svM${v==='X'?' bad':v==='△'?' mid':''}"${live?` data-sv-mark="${r}_${i}"`:''}>${v}</td>`; });
    return h + '</tr>';
  }).join('');
  return svFrame(id || 'svLog', `관리감독자 직무수행 일지<br>(장비파트) ${mon.slice(0,4)}년도`, `

    <table class="svTbl">
      <colgroup><col style="width:5%"><col style="width:15%"><col style="width:24%"><col style="width:8%">${'<col style="width:6.86%">'.repeat(7)}</colgroup>
      <tr><th rowspan="2">구<br>분</th><th rowspan="2">점검내용</th><th rowspan="2">주요 점검 Point</th><th>점검일</th>${days.map(ds=>`<th class="svDay">${dl(ds)}</th>`).join('')}</tr>
      <tr><th>점검자</th>${w.checkers.map((c,i)=>`<td class="svChk"><input class="svIn"${live?` data-sv-chk="${i}"`:''} value="${esc(c)}"></td>`).join('')}</tr>
      <tr class="svGap"><td colspan="11"></td></tr>
      ${rows}
    </table>
    <div class="svIssueWrap svGrow"><div class="svIssueH">◈ 문제점 및 개선방안 ◈</div>
    <textarea class="svIssue"${A('issue')}>${esc(w.issue)}</textarea><div class="svIssuePrint">${esc(w.issue)}</div></div>
  `);
}

// 출력 전용 문서를 따로 만들어(숨은 iframe) 그 안에서 인쇄 — 앱 화면이 다시 그려지거나 다른 인쇄 설정과 섞여도 안전
function svBuildPrintDoc(ids){
  // 입력한 값을 HTML에 옮겨 적음(복사본에도 글자가 남도록)
  document.querySelectorAll('.svPages input, .docGrid input').forEach(x=>{ if(x.type==='checkbox'){ if(x.checked) x.setAttribute('checked',''); else x.removeAttribute('checked'); } else x.setAttribute('value', x.value); });
  document.querySelectorAll('.svPages textarea, .docGrid textarea').forEach(x=>{ x.textContent = x.value; const pr = x.parentElement.querySelector('.svIssuePrint, .accTaPrint'); if(pr) pr.textContent = x.value; });
  // 장마다 A4 한 장 크기의 빈 상자(.pp)로 감싸고, 그 안에 틀을 꽉 채움(여러 장 인쇄 때 크롬이 틀 높이를 줄이는 문제 방지)
  return svBuildPrintHtml(ids.map(id=>{ const n = document.getElementById(id); return n ? n.outerHTML : ''; }));
}
// 여러 장(HTML 문자열 목록)을 A4 한 장씩 담은 출력용 문서로
function svBuildPrintHtml(pages){
  const html = pages.filter(Boolean).map(h=> `<div class="pp">${h}</div>`).join('');
  const css = Array.from(document.querySelectorAll('style')).map(st=> st.textContent).join('\n') + `

    html,body{background:#fff !important;margin:0 !important;padding:0 !important;color:#111;}

    .svPage{display:block !important;box-shadow:none !important;max-width:none !important;width:100% !important;border-radius:0 !important;margin:0 !important;break-after:page;page-break-after:always;}
    .svPage:last-child{break-after:auto;page-break-after:auto;}
    #svLog{padding:0 !important;overflow:visible !important;}
    .svTbl{min-width:0 !important;}
    .svImgPage img{width:100%;height:auto;max-height:280mm;object-fit:contain;}
    .svIssue{display:none !important;} .svIssuePrint{display:block !important;min-height:150px;}
    .svM:hover{background:transparent !important;}
    #svLog{min-height:0 !important;height:auto !important;}
    .svPage{height:auto !important;overflow:visible !important;}
    #svLog,.svImgPage,#svP3{padding:0 !important;}
    html,body{display:block !important;height:auto !important;min-height:0 !important;overflow:visible !important;}
    .pp{position:relative;height:276mm;flex:none;overflow:hidden;break-after:page;page-break-after:always;}
    .pp:last-child{break-after:auto;page-break-after:auto;}
    .pp > .svPage{position:absolute !important;inset:0;break-after:auto !important;page-break-after:auto !important;}
    .svFramed,#svLog.svFramed{display:flex !important;height:auto !important;min-height:0 !important;padding:0 !important;overflow:hidden !important;}
    .svFramed .svIssuePrint{display:block !important;}
    .pp > .docFramed{position:absolute !important;inset:0;aspect-ratio:auto !important;width:auto !important;height:auto !important;max-width:none !important;min-width:0 !important;margin:0 !important;padding:0 !important;box-shadow:none !important;border-radius:0 !important;}
    .docFramed .accTa{display:none !important;} .docFramed .accTaPrint{display:block !important;}
    .accIn::placeholder{color:transparent;}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .hakAmtH,.hakAmt{-webkit-print-color-adjust:exact;print-color-adjust:exact;}`;
  return `<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>출력</title><style>${css}</style></head><body>${html}</body></html>`;
}
function svPrintDocs(ids){ return svPrintHtml(null, ids); }
function svPrintHtml(pages, ids){
  if(navigator.standalone){ showToast('아이폰 홈 화면 앱에서는 인쇄가 막혀 있어요. Safari에서 주소를 열어 출력해 주세요.'); }
  const old = document.getElementById('svPrintFrame'); if(old) old.remove();
  const fr = document.createElement('iframe');
  fr.id = 'svPrintFrame';
  fr.setAttribute('aria-hidden','true');
  fr.style.cssText = 'position:fixed;left:-10000px;top:0;width:900px;height:1200px;border:0;visibility:hidden;';
  document.body.appendChild(fr);
  const d = fr.contentWindow.document;
  d.open(); d.write(pages ? svBuildPrintHtml(pages) : svBuildPrintDoc(ids)); d.close();
  const go = ()=>{
    try{ fr.contentWindow.focus(); fr.contentWindow.print(); }
    catch(err){ showToast('출력 창을 열지 못했어요. 브라우저 메뉴의 인쇄를 이용해 주세요.'); }
    setTimeout(()=>{ try{ fr.remove(); }catch(e){} }, 60000);
  };
  const imgs = Array.from(d.images);
  Promise.all(imgs.map(im=> im.complete ? 1 : new Promise(r=>{ im.onload = im.onerror = r; }))).then(()=> setTimeout(go, 150));
}

}

/* ===== 경위서·학자금: 서류별 메일 발송 (서류는 PDF로 첨부, 학자금은 파일 추가 첨부) ===== */
const DOC_MAIL_KEY = 'snct_docmail_to', DOC_MAIL_MAX_BYTES = 15 * 1024 * 1024;
let docMail = {acc:{to:'', subj:'', body:'', sending:false}, hak:{to:'', subj:'', body:'', sending:false, files:[]}};
try{ const t = JSON.parse(localStorage.getItem(DOC_MAIL_KEY) || 'null'); if(t){ if(t.acc) docMail.acc.to = t.acc; if(t.hak) docMail.hak.to = t.hak; } }catch(e){}
function docMailDefSubj(k){
  if(k==='acc') return '사고경위서' + ((accForm && accForm.name) ? ' - ' + accForm.name : '');
  return '학자금 지급신청서' + ((hakForm && hakForm.applicant) ? ' - ' + hakForm.applicant : '');
}
function fmtBytes(n){ return n >= 1048576 ? (Math.round(n/104857.6)/10) + 'MB' : Math.max(1, Math.round(n/1024)) + 'KB'; }
function docMailBox(k){
  const m = docMail[k], label = k==='acc' ? '📝 사고경위서' : '🎓 학자금 지급신청서';
  const files = k==='hak' ? `
    <div class="field dmField"><label>파일 첨부 <span class="dmSub">(재학증명서·영수증 등, 합계 15MB까지)</span></label>
      <div class="dmFileRow"><label class="btn ghost sm dmFileBtn">📎 파일 선택<input type="file" multiple data-dm-file="hak" hidden></label>
      <span class="dmSub">${m.files.length ? `${m.files.length}개 · ${fmtBytes(m.files.reduce((a,f)=>a+f.size,0))}` : '첨부한 파일 없음'}</span></div>
      ${m.files.length ? `<ul class="dmFiles">${m.files.map((f,i)=>`<li><span>📄 ${esc(f.name)} <i>(${fmtBytes(f.size)})</i></span><button type="button" class="dmDel" data-dm-del="${i}" title="첨부 빼기">✕</button></li>`).join('')}</ul>` : ''}
    </div>` : '';
  return `<div class="panel docMail" data-dm="${k}">
    <h3>📧 ${label} 메일 보내기</h3>
    <div class="field dmField"><label>받는 사람 <span class="dmSub">(여러 명은 , 로 구분)</span></label><input type="text" inputmode="email" class="dmIn" data-dm-f="to" value="${esc(m.to)}" placeholder="예) safety@snct.co.kr" autocomplete="email"></div>
    <div class="field dmField"><label>제목</label><input class="dmIn" data-dm-f="subj" value="${esc(m.subj)}" placeholder="${esc(docMailDefSubj(k))}"></div>
    <div class="field dmField"><label>내용</label><textarea class="dmIn" data-dm-f="body" rows="4" placeholder="메일에 쓸 내용 (비워 두면 기본 문구로 보내요)">${esc(m.body)}</textarea></div>
    ${files}
    <div class="dmFoot"><span class="dmSub">${k==='acc' ? '사고경위서' : '학자금 지급신청서'}는 PDF 파일로 첨부돼요.</span><button type="button" class="btn" data-dm-send="${k}" ${m.sending?'disabled':''}>${m.sending ? '보내는 중…' : '📨 메일 발송'}</button></div>
  </div>`;
}
function bindDocMail(el){
  el.querySelectorAll('.docMail [data-dm-f]').forEach(x=>{ const k = x.closest('.docMail').dataset.dm; x.oninput = ()=>{ docMail[k][x.dataset.dmF] = x.value; }; });
  el.querySelectorAll('[data-dm-file]').forEach(x=> x.onchange = async ()=>{
    const k = x.dataset.dmFile, list = Array.from(x.files || []); x.value = '';
    let total = docMail[k].files.reduce((a,f)=>a+f.size,0);
    for(const f of list){
      if(total + f.size > DOC_MAIL_MAX_BYTES){ showToast(`첨부 파일은 모두 합쳐 15MB까지예요. (${f.name} 빠짐)`); continue; }
      try{
        const data = await new Promise((res, rej)=>{ const fr = new FileReader(); fr.onload = ()=> res(String(fr.result).split(',')[1] || ''); fr.onerror = rej; fr.readAsDataURL(f); });
        docMail[k].files.push({name:f.name, type:f.type || 'application/octet-stream', size:f.size, data}); total += f.size;
      }catch(e){ showToast(`${f.name} 파일을 읽지 못했어요.`); }
    }

  el.querySelectorAll('[data-dm-send]').forEach(b=> b.onclick = ()=> sendDocMail(b.dataset.dmSend));
}
async function sendDocMail(k){
  const m = docMail[k]; if(m.sending) return;
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();

  if(!to.length) return showToast('받는 사람 메일 주소를 입력하세요.');
  const bad = to.filter(x=> !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x));
  if(bad.length) return showToast('메일 주소를 확인해 주세요: ' + bad.join(', '));
  if(to.length > 5) return showToast('받는 사람은 한 번에 5명까지예요.');
  if(!vslApi) return showToast('메일 보내는 주소(Apps Script)가 아직 설정되지 않았어요. UNION에 알려 주세요.');
  const docName = k==='acc' ? '사고경위서' : '학자금 지급신청서';
  const subject = (m.subj || '').trim() || docMailDefSubj(k);
  const extra = k==='hak' && m.files.length ? ` + 첨부 ${m.files.length}개` : '';
  appConfirm(`${docName}(PDF${extra})를 ${to.join(', ')} 에게 보낼까요?`, async ()=>{
    m.sending = true; render();
    try{
      const who = k==='acc' ? (accForm && accForm.name) : (hakForm && hakForm.applicant);
      const base = (docName.replace(/\s/g,'') + (who ? '_' + who : '')).replace(/[\\/:*?"<>|]/g,'');
      const doc = await docSheetFile(k==='acc' ? 'accSheet' : 'hakSheet', base);
      const files = [doc].concat(k==='hak' ? m.files.map(f=>({name:f.name, type:f.type, data:f.data})) : []);
      const body = (m.body || '').trim() || `${docName}를 보내드립니다.${who ? '\n작성자: ' + who : ''}`;
      const api = vslApi.replace(/\/macros\/u\/\d+\/s\//, '/macros/s/');
      const r = await fetch(api, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({type:'docmail', to, subject, body, files})});
      const j = await r.json().catch(()=>null);
      if(j && j.ok){
        showToast(`보냈어요. (${to.length}명${doc.type!=='application/pdf' ? ' · 서류는 HTML 파일로 첨부' : ''})`);
        try{ const t = JSON.parse(localStorage.getItem(DOC_MAIL_KEY) || '{}'); t[k] = m.to; localStorage.setItem(DOC_MAIL_KEY, JSON.stringify(t)); }catch(e){}
      }
      else if(j && (j.berths !== undefined || j.error === 'unknown')) showToast('Apps Script에 서류 메일 기능이 아직 없어요. 새 코드로 바꾸고 새 버전으로 배포해 주세요.');
      else showToast('보내지 못했어요. ' + ((j && j.error) || 'Apps Script를 새 코드로 바꾸고 새 버전으로 배포했는지 확인해 주세요.'));
    }catch(err){ showToast('보내지 못했어요. 인터넷 연결을 확인하고 다시 해 주세요.'); }
    m.sending = false; render();
  });
}
// 서류 한 장을 A4 PDF로 만듦(화면 크기와 상관없이 출력과 같은 모양). 실패하면 출력용 HTML 파일로 대신 첨부
async function docSheetFile(id, base){
  const html = svBuildPrintDoc([id]);
  try{
    const jpg = await docSheetJpeg(html);
    return {name: base + '.pdf', type:'application/pdf', data: btoa(jpegToPdf(jpg.bin, jpg.w, jpg.h))};
  }catch(e){
    return {name: base + '.html', type:'text/html', data: btoa(unescape(encodeURIComponent(html)))};
  }
}
async function docSheetJpeg(html){
  const W = 733, H = 1043, SCALE = 2; // A4(여백 8mm) 안쪽 크기 194×276mm를 96dpi로
  const fr = document.createElement('iframe');
  fr.style.cssText = `position:fixed;left:-10000px;top:0;width:${W}px;height:${H}px;border:0;visibility:hidden;`;
  document.body.appendChild(fr);
  try{
    const d = fr.contentWindow.document; d.open(); d.write(html); d.close();
    await Promise.all(Array.from(d.images).map(im=> im.complete ? 1 : new Promise(r=>{ im.onload = im.onerror = r; })));
    const css = Array.from(d.querySelectorAll('style')).map(x=> x.textContent).join('\n').replace(/\]\]>/g, '');
    const pp = d.querySelector('.pp'); if(!pp) throw new Error('no page');
    const xhtml = new XMLSerializer().serializeToString(pp);
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}"><foreignObject x="0" y="0" width="${W}" height="${H}"><div xmlns="http://www.w3.org/1999/xhtml" style="width:${W}px;height:${H}px;background:#fff;overflow:hidden;"><style><![CDATA[${css}
      .pp{height:${H}px !important;width:${W}px !important;}]]></style>${xhtml}</div></foreignObject></svg>`;
    const img = new Image();
    await new Promise((res, rej)=>{ img.onload = res; img.onerror = rej; img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); });
    const cv = document.createElement('canvas'); cv.width = W * SCALE; cv.height = H * SCALE;
    const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height);
    g.drawImage(img, 0, 0, cv.width, cv.height);
    await new Promise(r=> setTimeout(r, 30)); g.drawImage(img, 0, 0, cv.width, cv.height); // 사파리: 두 번 그려야 글자가 다 나옴
    const url = cv.toDataURL('image/jpeg', 0.9);
    return {bin: atob(url.split(',')[1]), w: cv.width, h: cv.height};
  } finally { try{ fr.remove(); }catch(e){} }
}
// JPEG 한 장을 A4 한 쪽(여백 8mm)에 넣은 PDF(바이너리 문자열)
function jpegToPdf(bin, pxW, pxH){
  const pw = 595.28, ph = 841.89, mg = 22.68, w = pw - mg*2, h = Math.min(ph - mg*2, w * pxH / pxW), x = mg, y = ph - mg - h;
  const content = `q ${w.toFixed(2)} 0 0 ${h.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)} cm /Im0 Do Q`;
  const objs = [
    '<< /Type /Catalog /Pages 2 0 R >>',
    '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
    `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`,
    `<< /Type /XObject /Subtype /Image /Width ${pxW} /Height ${pxH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${bin.length} >>\nstream\n${bin}\nendstream`,
    `<< /Length ${content.length} >>\nstream\n${content}\nendstream`
  ];
  let out = '%PDF-1.4\n%\xE2\xE3\xCF\xD3\n'; const offs = [];
  objs.forEach((o, i)=>{ offs.push(out.length); out += `${i+1} 0 obj\n${o}\nendobj\n`; });
  const xref = out.length;
  out += `xref\n0 ${objs.length+1}\n0000000000 65535 f \n` + offs.map(n=> String(n).padStart(10,'0') + ' 00000 n \n').join('');
  out += `trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  return out;
}

function pageTeamOT(){
  const sortedEmployees = employees.slice().filter(e=> !teamOtFilter || (e.team||'')===teamOtFilter).sort((a,b)=>{
    const ta = a.team||'9', tb = b.team||'9';
    if(ta!==tb) return ta<tb?-1:1;
    return (a.teamOrder||999)-(b.teamOrder||999);
  });
  const perEmp = sortedEmployees.map(e=>{
    let wkWeekday=0, wkSat=0, hoSun=0, hoHol=0, hoSup=0, spWeekday=0, spSat=0;
    let jochul=0, seokchul=0, jungsik=0, yasik=0;
    for(let ds=otMatrixStart; ds<=otMatrixEnd; ds=addDays(ds,1)){
      const rec = otMatrixAttendance[ds+'_'+e.id];
      if(!rec) continue;
      const c = computeDaily(rec, ds);
      if(c.valid){
        if(c.category==='평일') wkWeekday += c.premium;
        else if(c.category==='토요일') wkSat += c.premium;
        else if(c.category==='일요일') hoSun += c.premium;
        else if(c.category==='공휴일') hoHol += c.premium;
      }
      const s = computeSupportDaily(rec, ds);
      if(s.valid){
        const cat = dayCategory(ds, recManguen(rec, ds), rec && rec.employeeId);
        if(cat==='SU' || cat==='H') hoSup += s.premium;
        else if(cat==='SA') spSat += s.premium;
        else spWeekday += s.premium;
      }
      if(rec.jochul) jochul += 1.5;
      if(rec.seokchul) seokchul += 1.5;
      if(rec.jungsik) jungsik += 1.5;
      if(rec.yasik) yasik += 1.5;
    }
    const wkTotal = wkWeekday + wkSat;
    const hoTotal = hoSun + hoHol + hoSup;
    const spTotal = spWeekday + spSat;
    const mealTotal = jochul + seokchul + jungsik + yasik;
    const wkGuar = wkTotal; // 평일: 보전(최소보장) 없음 — 실적 그대로
    const hoGuar = Math.max(hoTotal, 60); // 휴일 보전: 월 60시간 최소 보장
    const spGuar = Math.max(spTotal, 30); // 지원 보전: 월 30시간 최소 보장
    const mealGuar = mealTotal; // 식사: 보전 없음 — 실적 그대로
    const otReal = wkTotal + hoTotal + spTotal + mealTotal;
    const otGuar = wkGuar + hoGuar + spGuar + mealGuar;
    return {emp:e, wkWeekday, wkSat, wkTotal, wkGuar, hoSun, hoHol, hoSup, hoTotal, hoGuar,
      spWeekday, spSat, spTotal, spGuar, jochul, seokchul, jungsik, yasik, mealTotal, mealGuar,
      otReal, otGuar, otDiff: otGuar-otReal};
  });

  const rows = perEmp.map((r,idx)=>{
    const noCell = idx+1;
    const z = v => v ? fmtH(v) : '';
    return `<tr>
      <td style="text-align:center;">${esc(noCell)}</td>
      <td class="namecell">${esc(r.emp.name)}</td>
      <td style="text-align:center;">${z(r.wkTotal)}</td>
      <td style="text-align:center;">${z(r.hoTotal)}</td>
      <td style="text-align:center;background:var(--amber-soft);font-weight:700;">${z(r.hoGuar)}</td>
      <td style="text-align:center;">${z(r.spTotal)}</td>
      <td style="text-align:center;background:var(--amber-soft);font-weight:700;">${z(r.spGuar)}</td>
      <td style="text-align:center;">${z(r.mealTotal)}</td>
      <td style="text-align:center;">${z(r.otReal)}</td><td style="text-align:center;">${z(r.otGuar)}</td><td style="text-align:center;font-weight:700;">${z(r.otDiff)}</td>
    </tr>`;
  }).join('');

  const n = perEmp.length || 1;
  const avgOf = k => fmtH(perEmp.reduce((s,r)=>s+(r[k]||0),0)/n);
  const avgRow = `<tr style="background:var(--bg);font-weight:800;">
    <td colspan="2" style="text-align:center;">평균</td>
    <td style="text-align:center;">${avgOf('wkTotal')}</td>
    <td style="text-align:center;">${avgOf('hoTotal')}</td>
    <td style="text-align:center;background:var(--amber-soft);">${avgOf('hoGuar')}</td>
    <td style="text-align:center;">${avgOf('spTotal')}</td>
    <td style="text-align:center;background:var(--amber-soft);">${avgOf('spGuar')}</td>
    <td style="text-align:center;">${avgOf('mealTotal')}</td>
    <td style="text-align:center;">${avgOf('otReal')}</td><td style="text-align:center;">${avgOf('otGuar')}</td><td style="text-align:center;">${avgOf('otDiff')}</td>
  </tr>`;

  return `
  <h2 class="pgttl">조별 월간집계</h2>
  <p class="pgsub">평일(평일+토요)·휴일(일요+공휴+휴일지원)·지원(평일지원+토요지원)·식사(조출+석출+중식+야식) 월간 합계와, 휴일(월 60시간)·지원(월 30시간) 최소보장(보전) 시간을 보여줍니다. (임금월 ${otPayYear}년 ${otPayMonth}월: ${esc(otMatrixStart)} ~ ${esc(otMatrixEnd)})</p>
  <div class="row" style="margin-bottom:14px;">
    <button class="btn ${teamOtFilter===''?'':'ghost'} sm" data-act="teamot-filter" data-team="">전체</button>
    <button class="btn ${teamOtFilter==='1'?'':'ghost'} sm" data-act="teamot-filter" data-team="1">1조</button>
    <button class="btn ${teamOtFilter==='2'?'':'ghost'} sm" data-act="teamot-filter" data-team="2">2조</button>
  </div>
  ${sortedEmployees.length? `<div class="scrollx"><table class="gtbl"><thead>
    <tr>
      <th rowspan="2" class="namehead">No</th><th rowspan="2" class="namehead" style="left:34px;">성명</th>
      <th>평일</th>
      <th colspan="2">휴일</th>
      <th colspan="2">지원</th>
      <th>식사</th>
      <th colspan="3">OT</th>
    </tr>
    <tr>
      <th>계</th>
      <th>계</th><th style="background:var(--amber-soft);">휴일보전</th>
      <th>계</th><th style="background:var(--amber-soft);">지원보전</th>
      <th>계</th>
      <th>실</th><th>보전</th><th>증감</th>
    </tr>
  </thead><tbody>${rows}${avgRow}</tbody></table></div>`
    : `<div class="empty">등록된 직원이 없습니다.</div>`}
  <p class="hint">휴일보전=MAX(휴일계, 60), 지원보전=MAX(지원계, 30) (평일·식사는 최소보장 없이 실적 그대로). OT 실=평일+휴일+지원+식사, OT 보전=평일+휴일보전+지원보전+식사, 증감=보전-실.</p>
  `;
}

function pageCodeStats(){
  if(!codeStatsStart || !codeStatsEnd){
    const t = new Date();
    codeStatsStart = dstr(t.getFullYear(), t.getMonth()+1, 1);
    codeStatsEnd = dstr(t.getFullYear(), t.getMonth()+1, daysInMonth(t.getFullYear(), t.getMonth()+1));
  }
  const rangeStart = codeStatsStart, rangeEnd = codeStatsEnd;
  const sortedEmployees = employees.slice().sort((a,b)=>{
    const ta = a.team||'9', tb = b.team||'9';
    if(ta!==tb) return ta<tb?-1:1;
    return (a.teamOrder||999)-(b.teamOrder||999);
  });
  const perEmp = sortedEmployees.map(e=>{
    let codeCnt = {FCH:0,MCH:0,MCS:0,FC:0,MC:0};
    let otHoliday=0, otWeekday=0, workHoliday=0, workWeekday=0, supDays=0, mealAllow=0;
    for(let ds=rangeStart; ds<=rangeEnd; ds=addDays(ds,1)){
      const rec = codeStatsAttendance[ds+'_'+e.id];
      if(!rec) continue;
      if(rec.statusCode && codeCnt.hasOwnProperty(rec.statusCode)) codeCnt[rec.statusCode]++;
      const c = computeDaily(rec, ds);
      if(c.valid){
        if(c.category==='일요일' || c.category==='공휴일'){ otHoliday += c.premium; workHoliday++; }
        else { otWeekday += c.premium; workWeekday++; }
      }
      const s = computeSupportDaily(rec, ds);
      if(s.valid) supDays++;
      mealAllow += computeMealAllowance(rec);
    }
    const gyeHol = codeCnt.FCH + codeCnt.MCH;
    const hyuHol = gyeHol + codeCnt.MCS;
    const gyeWk = codeCnt.FC + codeCnt.MC;
    const hyuWk = gyeWk;
    const otWeekdayFinal = otWeekday + (codeStatsIncludeMeal ? mealAllow : 0);
    return {emp:e, codeCnt, gyeHol, hyuHol, gyeWk, hyuWk, otHoliday, otWeekdayFinal, workHoliday, workWeekday, supDays};
  });

    return ranks;
  }

  </tr>`;

  return `
  <h2 class="pgttl">근태코드 집계</h2>
  <p class="pgsub">월별 근태관리표에 입력된 근태코드(FCH/MCH/MCS/FC/MC)·근무일수·가산시간을 선택한 기간 기준으로 집계합니다.</p>
  ${(userRole==='union' || userRole==='all') ? `
  <div class="row" style="margin-bottom:6px;align-items:center;">
    <div class="field"><label>시작일</label><input type="date" id="codeStatsStartInput" value="${esc(rangeStart)}"></div>
    <div class="field"><label>종료일</label><input type="date" id="codeStatsEndInput" value="${esc(rangeEnd)}"></div>
  </div>
  ` : ''}
  <p class="hint" style="margin-bottom:14px;">${esc(rangeStart)}(${weekdayKr(...rangeStart.split('-').map(Number))}) ~ ${esc(rangeEnd)}(${weekdayKr(...rangeEnd.split('-').map(Number))})</p>
  ${sortedEmployees.length? `<div class="scrollx"><table class="gtbl"><thead>
    <tr>
      <th class="namehead">No</th><th class="namehead" style="left:34px;">성명</th>
      <th style="background:var(--accent-soft);">지원일수</th><th style="background:var(--accent-soft);">순번</th>
      <th style="background:var(--amber-soft);">FCH</th><th style="background:var(--amber-soft);">MCH</th><th style="background:var(--amber-soft);">계</th><th style="background:var(--amber-soft);">순번</th><th style="background:var(--amber-soft);">MCS</th><th style="background:var(--amber-soft);">순번</th><th style="background:var(--amber-soft);">OT</th><th style="background:var(--amber-soft);">순번</th>
      <th style="background:var(--ok-soft);">FC</th><th style="background:var(--ok-soft);">MC</th><th style="background:var(--ok-soft);">계</th><th style="background:var(--ok-soft);">순번</th><th style="background:var(--ok-soft);">OT</th><th style="background:var(--ok-soft);">순번</th>
    </tr>
  </thead><tbody>${rows}${footerRow}</tbody></table></div>`
    : `<div class="empty">등록된 직원이 없습니다.</div>`}
  <p class="hint">계(휴일)=FCH+MCH, 계(평일)=FC+MC. 지원일수·계·MCS의 "순번"은 <b>숫자가 작을수록 1등</b>(오름차순), OT의 "순번"은 <b>숫자가 클수록 1등</b>(내림차순)입니다. OT는 해당 구분(휴일/평일)의 가산시간 합계이며, 근태·OT 집계 화면의 값과 연동됩니다.</p>
  `;
}

  // 연도 버튼은 2026년부터(2025년 12/25 기록은 OT 계산용으로 남겨 두되 버튼은 숨김)
  const years = Array.from(new Set(['2026','2027','2028','2029','2030', ...Object.keys(holidays).map(d=>d.slice(0,4))])).filter(y=>y>='2026').sort();
  if(holYearFilter && holYearFilter<'2026') holYearFilter = null;
  if(!holYearFilter) holYearFilter = years.includes(String(curYear)) ? String(curYear) : (years[years.length-1] || String(curYear));
  const list = Object.entries(holidays).filter(([d])=>d.startsWith(holYearFilter)).sort((a,b)=>a[0]<b[0]?-1:1);
  const yearTabs = years.map(y=>`<button class="btn ${y===holYearFilter?'':'ghost'} sm" data-act="hol-year" data-year="${esc(y)}">${esc(y)}</button>`).join(' ');

  <h2 class="pgttl">공휴일 관리</h2>
  <p class="pgsub">공휴일로 지정된 날짜는 월별 근태관리표에서 강조 표시됩니다.</p>
  <div class="note">노조 설립일은 사람마다 달라요: <b>SNCT1노조 → 6/15</b>, <b>SNCT2노조 → 1/2</b> (해마다 자동 적용). 누가 어느 노조인지는 조편성 관리의 '노조' 칸에서 정합니다.</div>
  <div class="panel">
    <h3>연도별 공휴일</h3>
    <div class="row" style="margin-bottom:12px;">${yearTabs || '<span class="hint">등록된 공휴일이 없습니다.</span>'}</div>
    ${list.length? `<div class="scrollx"><table class="tbl"><thead><tr><th>날짜</th><th>요일</th><th>명칭</th><th></th></tr></thead><tbody>
      ${list.map(([d,n])=>{ const [y,m,dd]=d.split('-').map(Number); return `<tr><td>${esc(d)}</td><td>${weekdayKr(y,m,dd)}</td><td>${esc(n)}</td><td><button class="btn warn ghost sm" data-act="del-hol" data-date="${esc(d)}">삭제</button></td></tr>`; }).join('')}
    </tbody></table></div>` : `<div class="empty">${esc(holYearFilter)}년 공휴일이 없습니다.</div>`}
  </div>
  <div class="panel">
    <h3>공휴일 추가</h3>
    <form id="holForm" class="row">
      <div class="field"><label>날짜</label><input type="date" name="date" required></div>
      <div class="field grow"><label>명칭</label><input type="text" name="name" required placeholder="예: 임시공휴일"></div>
      <button class="btn" type="submit">추가</button>
    </form>
  </div>
  `;
}

/* ========================= 근태코드 화면 ========================= */
function pageCodes(){
  // 근무코드 + 근태코드(기본·추가)를 한 목록으로 모아 색깔별로 묶어서 보여줌
  const customCodes = Object.keys(codeDefs).filter(c => !STATUS_CODE_LIST.includes(c) && !WORK_CODES.some(w=>w.code===c));
  const all = [...WORK_CODES.map(w=>w.code), ...STATUS_CODE_LIST, ...customCodes].filter((c,i,a)=>a.indexOf(c)===i && !hiddenCodes.has(c));
  all.sort((a,b)=> codeSortKey(a)-codeSortKey(b));
  const labelOf = c => { const d = codeDefs[c]; if(d && d.label) return d.label; const w = WORK_CODES.find(x=>x.code===c); return w ? w.label.replace(/\([^)]*\)$/, '') : (CODE_LABELS[c] || ''); };
  let lastG = '';
  const rows = all.map(c=>{
    const g = codeGroup(c), gname = (CODE_GROUPS.find(x=>x.key===g)||{}).name || '';
    const head = g!==lastG ? `<tr><td colspan="4" style="background:var(--bg);font-weight:800;font-size:12px;padding:6px 8px;">${codeBadge(c).replace(/>[^<]*<\/span>$/, '>&nbsp;&nbsp;</span>')} ${esc(gname)}</td></tr>` : '';
    lastG = g;
    return head + `<tr><td>${codeBadge(c)}</td>
      <td><input type="text" data-code-label="${esc(c)}" value="${esc(labelOf(c))}" placeholder="설명을 입력하세요" style="border:1px solid var(--border);border-radius:6px;padding:5px 8px;background:var(--bg);color:var(--text);width:100%;max-width:320px;"></td>
      <td><button class="btn sm" data-act="save-code" data-code="${esc(c)}">저장</button></td>
      <td><button class="btn warn ghost sm" data-act="delete-code" data-code="${esc(c)}">삭제</button></td></tr>`;
  }).join('');
  const wcRows = rows, scRows = '';
  const hiddenList = Array.from(hiddenCodes).filter(c=>!FORCED_HIDDEN.includes(c));
  const hiddenRow = hiddenList.length ? `
  <div class="panel">
    <h3>숨긴 코드 (${hiddenList.length}개)</h3>
    <p class="hint">삭제한 코드예요. 다시 쓰려면 복원하세요.</p>
    <div class="row" style="flex-wrap:wrap;">
      ${hiddenList.map(c=>`<span class="btn ghost sm" style="cursor:default;">${esc(c)} <button class="btn sm" data-act="restore-code" data-code="${esc(c)}" style="margin-left:6px;">복원</button></span>`).join('')}
    </div>
  </div>` : '';
  return `
  <h2 class="pgttl">근태코드</h2>
  <div class="note">근무코드(D/N 등)와 근태코드를 <b>색깔별로</b> 모아 보여줍니다. ${roleCanEdit('codes') ? '설명을 고치고 저장하거나, 삭제 버튼으로 정리할 수 있어요.' : '수정은 UNION에서만 할 수 있어요(보기 전용).'}</div>
  <div class="panel">
    <h3>전체 코드</h3>
    <div class="scrollx"><table class="tbl"><thead><tr><th>코드</th><th>의미/설명</th><th></th><th></th></tr></thead><tbody>${wcRows}${scRows}</tbody></table></div>
    <div class="row" style="margin-top:14px;">
      <button class="btn ghost sm" id="showAddCodeBtn">+ 코드 추가</button>
    </div>
    <div id="addCodeForm" style="display:${addCodeFormOpen?'flex':'none'};gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap;">
      <select id="newCodeColor" style="border:1px solid var(--border);border-radius:6px;padding:6px 8px;background:var(--bg);color:var(--text);">
        ${CODE_GROUPS.map(g=>`<option value="${g.key}">${esc(g.name)}</option>`).join('')}
      </select>
      <input type="text" id="newCodeInput" placeholder="코드 (예: HD)" maxlength="8" style="border:1px solid var(--border);border-radius:6px;padding:6px 8px;background:var(--bg);color:var(--text);width:100px;text-transform:uppercase;">
      <input type="text" id="newCodeLabelInput" placeholder="설명 (예: 반차)" style="border:1px solid var(--border);border-radius:6px;padding:6px 8px;background:var(--bg);color:var(--text);width:200px;">
      <button class="btn sm" id="addCodeSaveBtn">추가</button>
      <button class="btn ghost sm" id="addCodeCancelBtn">취소</button>
    </div>
  </div>
  ${hiddenRow}
  `;
}

/* ========================= 배차표 ========================= */
function pageDispatch(){
  if(!dispatchDate) dispatchDate = todayStr();
  const ds = dispatchDate;
  if(isSundayDs(ds)) dispatchShift = 'full'; else if(dispatchShift==='full') autoDispatchShift();
  const fullAll = FULL_SLOTS_FN(), cut = fullAll.indexOf('19:00');
  const slots = dispatchShift==='full'
    ? (dispatchSunPart==='night' ? SUN_NIGHT_SLOTS_FN() : fullAll.slice(0, cut))
    : dispatchShift==='day' ? DAY_SLOTS.filter(x=>x!=='19:00') : NIGHT_SLOTS; // 주간은 19시 칸 없이 07:00~18:30
  const [dy,dm,dd] = ds.split('-').map(Number);
  const dateBanner = `${dy}년 ${dm}월 ${dd}일 ${weekdayKr(dy,dm,dd)}요일 · ${dispatchShift==='full' ? (dispatchSunPart==='night' ? '야간(18~익일 08시)' : '주간(07~19시)') : dispatchShift==='night' ? '야간(18~08시)' : '주간(07~19시)'}`;

  // 전 직원을 조편성 순서(조 → 순번) 기준으로 정렬해서 항상 표시 (조별 필터 적용)
  const sortedEmployees = employees.slice().filter(e=> !dispatchTeamFilter || (e.team||'')===dispatchTeamFilter).sort((a,b)=>{
    const ta = a.team||'9', tb = b.team||'9';
    if(ta!==tb) return ta<tb?-1:1;
    return (a.teamOrder||999)-(b.teamOrder||999);
  });

  const palette = DISPATCH_CATS.map(c=>`<button type="button" class="dpCatBtn" data-cat="${esc(c.key)}"
      style="background:${c.bg};color:${c.fg};border:2px solid ${c.border};border-radius:10px;padding:8px 16px;font-weight:700;font-size:13px;cursor:pointer;box-shadow:${false?'':'none'};">${esc(c.key)}</button>`).join('');

  // 빨간 시간 묶음(예: 07·30)의 바깥쪽에만 빨간 테두리: 묶음의 왼쪽 끝 mL, 오른쪽 끝 mR
  const mealEdge = s => {
    const i = slots.indexOf(s);
    if(i<0 || !isMealSlot(s)) return '';
    return (i===0 || !isMealSlot(slots[i-1]) ? ' mL' : '') + (i===slots.length-1 || !isMealSlot(slots[i+1]) ? ' mR' : '');
  };
  function slotCell(empId, s, catKey, note){
    // 빨간 칸(식사·교대 시간)도 초반·후반·당직 등을 칠할 수 있음 — 빨간 테두리만 유지
    const cat = dispatchCat(catKey);
    const bg = cat ? cat.bg : 'transparent';
    const fg = cat ? cat.fg : 'var(--text)';
    return `<td class="dpCell${cat?' dpPainted':''}${isMealSlot(s) ? ' dpMeal'+mealEdge(s) : ''}" data-dispatch-emp="${esc(empId)}" data-dispatch-slot="${esc(s)}" data-dispatch-cur="${esc(catKey||'')}"
      style="background:${bg};color:${fg};"${note?` title="${esc(note)}"`:''}>${note?`<span class="dpTxt">${esc(note)}</span>`:''}</td>`;
  }

  // 그 날짜의 OT 순번: 일요일·공휴일이면 휴일 OT 순번, 아니면 평일 OT 순번 (근태관리 집계 기간·조별 순번 기준)
  if(!codeStatsStart || !codeStatsEnd){ const t = new Date(); codeStatsStart = dstr(t.getFullYear(), t.getMonth()+1, 1); codeStatsEnd = dstr(t.getFullYear(), t.getMonth()+1, daysInMonth(t.getFullYear(), t.getMonth()+1)); }
  const dayIsHol = ['SU','H'].includes(dayCategory(ds, false));
  const allSorted = employees.slice().sort((a,b)=>{ const ta=a.team||'9', tb=b.team||'9'; if(ta!==tb) return ta<tb?-1:1; return (a.teamOrder||999)-(b.teamOrder||999); });
  const cd = combinedData(allSorted, codeStatsStart, codeStatsEnd);
  const otRankOf = {};
  cd.perEmp.forEach((r,i)=>{ otRankOf[r.emp.id] = {n: dayIsHol ? cd.rankOtHol[i] : cd.rankOtWk[i], tot: cd.nOtT[cd.teamOf(r)]||0}; });
  // 근무자(근태가 D·N 계열이거나 비어 있는 사람)만 순번을 매김 — 그날 근무자끼리 조별로 1번부터 다시 번호
  {
    const byTeam = {};
    sortedEmployees.forEach(e=>{
      const rec = attendance[ds+'_'+e.id] || {};
      const mc = gridCode(rec && rec.date ? rec : null, ds, String(e.name||'').trim());
      const dc = mc || scheduledShift(ds, e.team||'');
      const working = !dc || DP_WORK_CODES.has(dc);
      const o = otRankOf[e.id];
      if(!o) return;
      if(!working || o.n==null){ o.n = null; return; }
      (byTeam[e.team||''] = byTeam[e.team||''] || []).push(o);
    });
    Object.values(byTeam).forEach(list=>{
      list.sort((a,b)=>a.n-b.n);
      let rank = 0, prev = null;
      list.forEach((o,i)=>{ if(o.n!==prev){ rank = i+1; prev = o.n; } o.n = rank; o.tot = list.length; });
    });
  }
  const otRankCell = empId => { // 순번: 근태관리처럼 칸 전체를 색으로, 숫자는 검은색
    const o = otRankOf[empId]; if(!o || o.n==null) return '';
    return `<span class="rkPlain">${o.n}</span>`;
  };
  const head = `<th class="dpI dpI1">No</th><th class="dpI dpI2">성명</th><th class="dpI dpI3">근태</th><th class="dpI dpI4 gc g-${dayIsHol?'yel':'pur'}" title="근태관리 집계 기간(${esc(codeStatsStart)}~${esc(codeStatsEnd)}) 기준">순번</th><th class="dpI dpI5">승무</th>` +
    slots.map(s=>{
      const mm = s.split(':')[1], hh = slotHourLabel(s);
      const isRed = isMealSlot(s);
      const color = isRed ? '#E03131' : '#000000';
      const cls = 'dpSlotH' + (isRed ? ' dpMealH' + mealEdge(s) : '');
      // 엑셀 배차표 모양: 정각 칸은 시간을 크게 왼쪽에, 30분 칸은 '30'을 작게 왼쪽에(= 한 시간 묶음의 가운데)
      if(mm==='00') return `<th class="${cls} dpHH" style="color:${color};">${esc(hh)}</th>`;
      return `<th class="${cls} dpMM" style="color:${color};">${esc(mm)}</th>`;
    }).join('');

  const slotCounts = slots.map(()=>0); // 시간대(칸)별 배치 인원 수

  const rows = sortedEmployees.map((e,idx)=>{
    const rec = attendance[ds+'_'+e.id] || {};
    const id = `${ds}_${dispatchShift}_${e.id}`;
    const drec = dispatch[id];
    let paintedSlots = 0;
    const cells = slots.map((s,si)=>{
      const v = drec && drec.slots ? (drec.slots[s]||'') : '';
      const note = drec && drec.notes ? (drec.notes[s]||'') : '';
      if(v){ paintedSlots++; slotCounts[si]++; } else if(note && isMealSlot(s)) slotCounts[si]++;
      return slotCell(e.id, s, v, note);
    }).join('');
    // 근태: 월별 근태코드 표와 같은 코드(FC·MC·SC·AV·DN 등). 없으면 교대 순환 근무(D/N)
    const mcode = gridCode(rec && rec.date ? rec : null, ds, String(e.name||'').trim());
    const dcode = mcode || scheduledShift(ds, e.team||'');
    const offDay = !!dcode && !DP_WORK_CODES.has(dcode); // D·N 계열이 아니면(휴무·휴가 등) 행을 흐린 회색으로
    const grp = (idx % 3 === 2) && idx < sortedEmployees.length - 1; // 3명마다 검은 구분선
    return `<tr class="${offDay ? 'dpOff' : ''}${grp ? ' dpGrp' : ''}">
      <td class="dpI dpI1">${idx+1}</td>
      <td class="dpI dpI2" style="text-align:center;">${esc(e.name)}</td>
      <td class="dpI dpI3">${mcode ? (DP_WORK_CODES.has(mcode) ? `<b>${esc(mcode)}</b>` : codeBadge(mcode)) : `<span style="color:var(--text-muted);font-weight:700;" title="교대 순환 근무">${esc(dcode)}</span>`}</td>
      <td class="dpI dpI4 dpRk g-${dayIsHol?'yel':'pur'}">${otRankCell(e.id)}</td>
      <td class="dpI dpI5" data-dispatch-suwu="${esc(e.id)}">${(()=>{ const n = dispatchShift==='full' && drec && drec.slots ? Object.values(drec.slots).filter(Boolean).length : paintedSlots; return n ? fmtH(n*0.5) : ''; })()}</td>
      ${cells}
    </tr>`;
  }).join('');

  // 지원 인력 - 이름을 직접 입력하는 빈 행 10개
  const SUP_COUNT = 10;
  const supRows = Array.from({length:SUP_COUNT}, (_,i)=>{
    const supId = 'sup'+pad2(i+1);
    const id = `${ds}_${dispatchShift}_${supId}`;
    const drec = dispatch[id];
    const supName = drec && drec.name ? drec.name : '';
    let supPainted = 0;
    const cells = slots.map((s,si)=>{
      const v = drec && drec.slots ? (drec.slots[s]||'') : '';
      const note = drec && drec.notes ? (drec.notes[s]||'') : '';
      if(v){ supPainted++; slotCounts[si]++; } else if(note && isMealSlot(s)) slotCounts[si]++;
      return slotCell(supId, s, v, note);
    }).join('');
    const supLabel = i===0 ? `<td class="dpI dpI1" rowspan="${SUP_COUNT}" style="vertical-align:middle;">지원</td>` : '';
    return `<tr>
      ${supLabel}
      <td class="dpI dpI2"><input type="text" data-dispatch-sup="${esc(supId)}" value="${esc(supName)}" placeholder="이름" style="width:66px;border:1px solid var(--border);border-radius:5px;padding:3px 5px;background:var(--bg);color:var(--text);"></td>
      <td class="dpI dpI3"></td><td class="dpI dpI4"></td><td class="dpI dpI5" data-dispatch-suwu="${esc(supId)}">${supPainted?fmtH(supPainted*0.5):''}</td>
      ${cells}
    </tr>`;
  }).join('');

  const countRow = `<tr style="background:var(--bg);">
    <td class="dpI dpI1" colspan="5" style="font-weight:800;">시간대별 인원</td>
    ${slots.map((s,si)=>`<td data-dispatch-count="${esc(s)}"${isMealSlot(s)?` class="dpMealF${mealEdge(s)}"`:''} style="text-align:center;font-weight:800;color:${slotCounts[si]>0?'var(--accent)':'var(--text-muted)'};">${slotCounts[si]||''}</td>`).join('')}
  </tr>`;

  return `
  <h2 class="pgttl">배차표</h2>
  <div class="row" style="margin-bottom:12px;align-items:center;">

const SPLAN_ROWS = [
  {key:'capacity', label:'가동대수(입력)', editable:true},
  {key:'quota', label:'정원(입력)', editable:true},
  {key:'offCount', label:'휴무·휴가·기타(입력)', editable:true},
  {key:'leadCount', label:'총괄조장(입력)', editable:true},
  {key:'preSupport', label:'선지원(입력)', editable:true},
  {key:'supportOff', label:'지원휴무(입력)', editable:true},
  {key:'support', label:'지원(입력)', editable:true},
  {key:'avail', label:'지원가능', editable:false},
  {key:'attend', label:'출근원', editable:false},
  {key:'ratio', label:'교대비율', editable:false}
];
function splanCalc(rec){
  const n = k => Number(rec && rec[k]) || 0;
  const avail = n('quota') - n('offCount') - n('supportOff');
  const attend = avail + n('leadCount') + n('preSupport') + n('support');
  const ratio = n('capacity') ? attend / n('capacity') : 0;
  return {avail, attend, ratio};
}
function pageSupportPlan(){
  if(!weekStart) weekStart = mondayOf(todayStr());
  const days = Array.from({length:7}, (_,i)=>addDays(weekStart,i));
  const head = `<th>항목</th>` + days.map(ds=>{
    const [y,m,d]=ds.split('-').map(Number);
    return `<th colspan="2">${m}/${d}(${weekdayKr(y,m,d)})</th>`;
  }).join('');
  const subhead = `<th></th>` + days.map(()=>`<th style="font-size:10px;">주</th><th style="font-size:10px;">야</th>`).join('');
  const rows = SPLAN_ROWS.map(rowDef=>{
    const cells = days.map(ds=>[['day','주'],['night','야']].map(([shift,shiftLabel])=>{
      const id = `${ds}_${shift}`;
      const rec = supportPlan[id] || {};
      if(rowDef.editable){
        return `<td style="padding:2px;"><input type="text" inputmode="numeric" pattern="[0-9]*" data-splan-date="${esc(ds)}" data-splan-shift="${esc(shift)}" data-splan-field="${rowDef.key}" value="${rec[rowDef.key]!=null?esc(rec[rowDef.key]):''}" class="spIn"></td>`;
      } else {
        const c = splanCalc(rec);
        const val = rowDef.key==='ratio' ? (c.ratio? c.ratio.toFixed(2) : '-') : (c[rowDef.key]||0);
        return `<td class="sp-${rowDef.key}">${val}</td>`;
      }
    }).join('')).join('');
    return `<tr class="spRow-${rowDef.key}"><td class="spLbl">${esc(rowDef.label)}</td>${cells}</tr>`;
  }).join('');
  return `
  <h2 class="pgttl">지원계획표</h2>
  <div class="panel">
  <div class="row" style="align-items:flex-end;margin-bottom:12px;">
    <div class="field" style="min-width:auto;"><label>주간</label><b style="font-size:15px;line-height:38px;">${esc(weekStart)} ~ ${esc(addDays(weekStart,6))}</b></div>
    <button class="btn ghost sm" id="prevWeek">◀ 이전주</button>
    <button class="btn ghost sm" id="nextWeek">다음주 ▶</button>
  </div>
  <div class="scrollx gridwrap fitW"><table class="tbl" id="splanTable"><thead><tr>${head}</tr><tr>${subhead}</tr></thead><tbody>${rows}</tbody></table></div>
  <div class="row" style="margin-top:12px;align-items:center;">
    <button class="btn warn ghost" id="splanResetBtn">초기화</button>
  </div>
  </div>
  `;
}
