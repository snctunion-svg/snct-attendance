<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover">
<title>장비관리</title>
<link rel="manifest" href="manifest.webmanifest?v=7">
<meta name="theme-color" content="#db2777">
<link rel="icon" type="image/png" href="icon-snct-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon-snct.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="장비관리">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* 아이폰 Safari·안드로이드 크롬의 '글자 자동 확대' 끄기 — 서류를 화면에 맞춰 줄였을 때 일부 글씨만 커지는 문제 방지 */
html{-webkit-text-size-adjust:100% !important;text-size-adjust:100% !important;}
.docGrid,.docGrid *,.svPages,.svPages *{-webkit-text-size-adjust:none !important;text-size-adjust:none !important;}

:root{
  --accent:#1d4ed8; --accent-soft:#eff6ff; --accent-line:#bfdbfe;
  --warn:#b91c1c; --warn-soft:#fef2f2; --warn-line:#fecaca;
  --ok:#047857; --ok-soft:#ecfdf5; --ok-line:#a7f3d0;
  --amber:#b45309; --amber-soft:#fffbeb; --amber-line:#fde68a;
  --night:#4338ca; --night-soft:#eef2ff; --night-line:#c7d2fe;
  --text:#0f172a; --text-muted:#64748b; --border:#e2e8f0; --surface:#fff; --bg:#f1f5f9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --accent:#60a5fa; --accent-soft:#101d33; --accent-line:#1e3a5f;
    --warn:#f87171; --warn-soft:#341316; --warn-line:#7f1d1d;
    --ok:#34d399; --ok-soft:#052a20; --ok-line:#065f46;
    --amber:#fbbf24; --amber-soft:#302205; --amber-line:#78350f;
    --night:#a5b4fc; --night-soft:#1c1a3d; --night-line:#3730a3;
    --text:#e5e9f0; --text-muted:#8b96a8; --border:#2c3646; --surface:#161d2b; --bg:#0c1119;
  }
}
:root{ --sky:#0369a1; --fill-sky:#e0f2fe; --ot:#854d0e; --ot-soft:#fef9c3; --mc:#15803d; --fill-fc:#cfe0ff; --fill-mc:#c9f2d6; --fill-red:#fdd5d5; --fc:#1e3a8a; --wk:#047857; --wk-soft:#d1fae5; --sup:#1d4ed8; --sup-soft:#dbeafe; --hol:#c2410c; --hol-soft:#ffedd5; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --sky:#7dd3fc; --fill-sky:#0c2d44; --ot:#fde047; --ot-soft:#332a05; --fill-fc:#1c2c52; --fill-mc:#12351f; --fill-red:#44181a; --mc:#4ade80; --fc:#93c5fd; --wk:#34d399; --wk-soft:#06291d; --sup:#60a5fa; --sup-soft:#0f1f3d; --hol:#fb923c; --hol-soft:#3a1706; } }
:root[data-theme="dark"]{ --sky:#7dd3fc; --fill-sky:#0c2d44; --ot:#fde047; --ot-soft:#332a05; --fill-fc:#1c2c52; --fill-mc:#12351f; --fill-red:#44181a; --mc:#4ade80; --fc:#93c5fd; --wk:#34d399; --wk-soft:#06291d; --sup:#60a5fa; --sup-soft:#0f1f3d; --hol:#fb923c; --hol-soft:#3a1706; }
:root[data-theme="dark"]{
  --accent:#60a5fa; --accent-soft:#101d33; --accent-line:#1e3a5f;
  --warn:#f87171; --warn-soft:#341316; --warn-line:#7f1d1d;
  --ok:#34d399; --ok-soft:#052a20; --ok-line:#065f46;
  --amber:#fbbf24; --amber-soft:#302205; --amber-line:#78350f;
  --night:#a5b4fc; --night-soft:#1c1a3d; --night-line:#3730a3;
  --text:#e5e9f0; --text-muted:#8b96a8; --border:#2c3646; --surface:#161d2b; --bg:#0c1119;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body,.tbl th,.tbl td,button,input,select,textarea{word-break:keep-all;overflow-wrap:break-word;}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;margin:0;}
body{background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden;
  font-family:'맑은 고딕','Malgun Gothic',Pretendard,-apple-system,sans-serif;font-size:14px;line-height:1.55;}

header.app{flex:0 0 auto;background:#fde2ec;border-bottom:3px solid #ec4899;
  display:flex;align-items:center;gap:12px;padding:9px 16px;z-index:300;}
header.app .badge{background:#db2777;color:#fff;font-size:10px;font-weight:700;
  letter-spacing:.06em;padding:2px 7px;border-radius:3px;margin-right:6px;vertical-align:2px;}
header.app h1{margin:0;font-size:17px;letter-spacing:-.02em;}
header.app .sub{color:var(--text-muted);font-size:11.5px;margin-top:1px;}
header.app .spacer{flex:1 1 auto;}
header.app .status{font-size:11px;color:var(--text-muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
header.app .status .btn{padding:4px 9px;font-size:11px;white-space:nowrap;}
header.app .status span{white-space:nowrap;}
@media (max-width:700px){
  header.app .sub{display:none;}
  header.app h1{font-size:15px;white-space:nowrap;}
  header.app .status .conn-txt{display:none;}
  header.app .status{gap:5px;}
}
header.app .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none;}
header.app .dot.off{background:var(--text-muted);}
.menu-btn{display:none;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);
  border-radius:7px;width:38px;height:38px;font-size:16px;cursor:pointer;flex:none;}

.layout{flex:1 1 auto;display:flex;min-height:0;}
nav#nav{flex:0 0 218px;width:218px;background:var(--surface);border-right:1px solid var(--border);
  overflow-y:auto;padding:14px 10px 30px;}
nav#nav .navttl{font-size:10.5px;font-weight:700;color:var(--text-muted);letter-spacing:.4px;padding:6px 10px;}
nav#nav a{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:8px;text-decoration:none;
  color:var(--text);font-size:13.5px;margin-bottom:2px;cursor:pointer;min-height:40px;}
nav#nav a:hover{background:var(--accent-soft);color:var(--accent);}
nav#nav a.on{background:#ec4899;color:#fff;font-weight:700;}
nav#nav a:hover:not(.on){background:#fce7f3;color:#be185d;}
nav#nav a .ic{flex:none;width:20px;text-align:center;}

main#content{flex:1 1 auto;min-width:0;overflow-y:auto;padding:22px 26px 60px;}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:350;}

h2.pgttl{margin:0 0 3px;font-size:19px;letter-spacing:-.01em;}
p.pgsub{margin:0 0 18px;color:var(--text-muted);font-size:12.5px;}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:22px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;}
.card .n{font-size:24px;font-weight:700;letter-spacing:-.02em;}
.card .l{font-size:11.5px;color:var(--text-muted);margin-top:2px;}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:18px;}
.panel h3{margin:0 0 12px;font-size:14px;}

.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;}
.field{display:flex;flex-direction:column;gap:4px;min-width:120px;}
.field label{font-size:11.5px;color:var(--text-muted);}
.field input,.field select,.field textarea{border:1px solid var(--border);border-radius:8px;padding:8px 10px;
  font-size:13.5px;background:var(--bg);color:var(--text);font-family:inherit;}
.field textarea{min-height:56px;resize:vertical;}
.field.grow{flex:1 1 200px;}

/* 버튼: 모두 분홍색 */
:root{ --btn:#ec4899; --btn-dark:#db2777; --btn-soft:#fdf2f8; --btn-line:#f9a8d4; }
.btn{border:1px solid var(--btn);background:var(--btn);color:#fff;border-radius:8px;padding:9px 16px;
  font-size:13px;font-weight:700;cursor:pointer;}
.btn:hover:not(:disabled){background:var(--btn-dark);border-color:var(--btn-dark);}
.btn.ghost{background:var(--surface);color:var(--btn-dark);border-color:var(--btn-line);}
.btn.ghost:hover:not(:disabled){background:var(--btn-soft);color:var(--btn-dark);border-color:var(--btn);}
.btn.warn{background:var(--btn);border-color:var(--btn);}
.btn.warn.ghost{background:var(--surface);color:var(--btn-dark);border-color:var(--btn-line);}
.btn.sm{padding:5px 10px;font-size:11.5px;border-radius:6px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.gridCodeOpt:hover{background:var(--bg);}
/* 순번 배지: 그룹별 색 + 순위가 높을수록 진하게 */
.g-sup{--g:var(--sup);--g-soft:var(--sup-soft);} .g-hol{--g:var(--hol);--g-soft:var(--hol-soft);} .g-wk{--g:var(--wk);--g-soft:var(--wk-soft);} .g-ot{--g:var(--ot);--g-soft:var(--ot-soft);} .ctbl th.cntHead{font-weight:800;font-size:12px;color:#111827 !important;background:#ffffff !important;white-space:nowrap;}
/* 급여관리·급여명세서 */
.payName{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;}
.payTbl input{width:100%;min-width:90px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font:inherit;text-align:right;box-sizing:border-box;}
.inCloseBtn.on{background:#111 !important;border-color:#111 !important;color:#fff !important;}
.inLockMsg{font-size:13px;font-weight:700;color:#b91c1c;margin-left:6px;}
.inTbl.inLocked td{background:#f8fafc;}
.pwCell{display:flex;align-items:center;gap:6px;justify-content:center;white-space:nowrap;}
.pwSt{font-size:12px;font-weight:700;color:var(--text-muted);}
.pwSt.on{color:#047857;}
.pwHdrBtn{background:#fff !important;color:#be185d !important;border:1px solid #f9a8d4 !important;}
.pwDlg{max-width:360px;width:92%;}
.pwDlg .pwLbl{display:block;font-size:12px;font-weight:700;color:#475569;margin:10px 0 4px;text-align:left;}
.pwDlg .pwIn{font-size:16px;}
.pwRst{white-space:nowrap;padding:4px 8px !important;font-size:11px !important;}
.pwIn{width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 10px;background:var(--bg);color:var(--text);font:inherit;font-size:15px;box-sizing:border-box;}
.pwMsg{min-height:20px;margin:0 0 10px;color:#dc2626;font-weight:700;font-size:13px;}
.pwMsg.ok{color:#047857;}
.leaveBox{display:flex;align-items:center;gap:4px;justify-content:center;white-space:nowrap;}
.leaveBox .yrs{font-size:11px;color:var(--text-muted);min-width:26px;text-align:right;}
.payTbl .leaveBox input{width:46px !important;min-width:46px !important;max-width:46px;padding:5px 2px !important;}
.leaveBox input{width:44px;text-align:center;font-weight:800;border:1px solid var(--border);border-radius:6px;padding:5px 2px;background:var(--bg);color:var(--text);font:inherit;font-weight:800;}
.leaveBox input::placeholder{color:var(--text);opacity:.85;font-weight:800;}
.payTbl input.tx{text-align:left;min-width:64px;}
.rateTbl input.rateIn{width:110px;text-align:right;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font:inherit;}
.rateTbl td{padding:3px 4px;}
.payTbl select.tx{width:100%;min-width:80px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font:inherit;}
.payTbl input[type=date]{min-width:140px;}
.payTbl input.dt{min-width:90px;text-align:center;letter-spacing:.5px;}
.wonBox{position:relative;}
.wonBox input{padding-right:24px !important;min-width:94px;}
.tenureBox input{background:var(--bg-soft, rgba(0,0,0,.04)) !important;cursor:default;padding-left:30px !important;min-width:104px !important;}
.tenureBox .yrs{left:9px;right:auto !important;font-size:11px;}
.wonBox span{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--text-muted,#6b7280);pointer-events:none;}
.payScrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:600;display:flex;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:calc(14px + env(safe-area-inset-top,0px)) 8px calc(14px + env(safe-area-inset-bottom,0px));}
.pwBox{margin:auto;background:#fff;color:#222;border-radius:8px;padding:22px 22px 18px;width:100%;max-width:400px;box-shadow:0 10px 30px rgba(0,0,0,.25);}
.pwBox h3{margin:0 0 12px;font-size:21px;color:#222;}
.pwBox p{margin:0 0 14px;font-size:14px;line-height:1.5;color:#333;}
.pwBox input{width:100%;box-sizing:border-box;padding:9px 10px;border:2px solid #888;border-radius:3px;font-size:15px;background:#fff;color:#111;}
.pwBox .pwErr{color:#dc2626;font-size:13px;margin-top:6px;min-height:18px;}
.pwBtns{display:flex;gap:10px;margin-top:8px;}
.pwBtns button{flex:1;border:0;border-radius:3px;padding:10px;font-size:15px;font-weight:700;cursor:pointer;}
.pwOk{background:#0f6cbd;color:#fff;} .pwOk:disabled{background:#b3d4f0;cursor:default;}
.pwNo{background:#ececec;color:#222;}
.slipBox{margin:auto;margin-top:44px;background:#fff;color:#111;width:100%;max-width:820px;padding:18px 16px 16px;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;}
.slipTop{display:flex;justify-content:flex-end;gap:8px;margin-bottom:6px;}
/* 닫기 버튼: 화면 오른쪽 위에 고정 — 휴대폰에서 명세서가 커도 잘리지 않음 */
.slipClose{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));z-index:610;
  border:1px solid #f9a8d4;background:#fff;color:#be185d;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.18);}
.slipTop button{border:1px solid #ccc;background:#fff;border-radius:6px;padding:5px 12px;font-size:13px;cursor:pointer;color:#111;}
.slipTitle{text-align:center;font-size:24px;font-weight:800;letter-spacing:1px;margin:2px 0 10px;}
.slipInfo{width:90%;margin:0 auto 18px;border-collapse:collapse;font-size:13px;}
.slipInfo td{padding:6px 4px;border-bottom:1px solid #333;}
.slipInfo tr:first-child td{border-top:2px solid #333;}
.slipInfo b{font-weight:800;}
.slipDates{display:flex;justify-content:space-between;font-size:12px;margin:0 2px 4px;}
.slipWrap{overflow-x:auto;}
.slipTbl{width:100%;min-width:640px;border-collapse:collapse;table-layout:fixed;font-size:12.5px;}
.slipTbl td{border:1px solid #444;height:26px;padding:2px 6px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.slipTbl td.h{background:#fce7f3;text-align:center;font-weight:800;white-space:normal;font-size:11.5px;line-height:1.2;letter-spacing:-0.3px;}
.slipTbl td.sec{background:#fce7f3;text-align:center;font-weight:800;vertical-align:top;}
.slipTbl tr.alt td:not(.sec){background:#fdf2f8;}
.slipTbl .bt td{border-top:2px solid #222;}
@media (max-width:600px){
  /* 휴대폰: 명세서 표가 화면 폭 안에 다 들어오게(옆으로 밀 필요 없음) */
  .slipBox{padding:12px 8px 10px;}
  .slipTitle{font-size:19px;margin:2px 0 8px;}
  .slipInfo{width:100%;font-size:12px;}
  .slipDates{font-size:11px;}
  .slipTbl{min-width:0;font-size:9.5px;}
  .slipTbl td{height:22px;padding:1px 2px;}
  .slipTbl td.h{font-size:8.5px;letter-spacing:-.5px;}
  .slipTbl colgroup col:first-child{width:9% !important;}
}
@media print{ body:not(.printing-acc) *{visibility:hidden;} body:not(.printing-acc) .slipBox, body:not(.printing-acc) .slipBox *{visibility:visible;} .slipBox{position:absolute;left:0;top:0;box-shadow:none;max-width:none;} .slipTop{display:none;} }

.g-meal{--g:#0e7490;--g-soft:#cffafe;--g-strong:#22d3ee;--g-on:#083344;} /* 식사(청록) */
/* 관리감독자 일지 */
.svPages{display:flex;flex-direction:column;gap:18px;align-items:center;}
.svCol{width:100%;max-width:820px;}
@media (min-width:701px){
  .svCol .svPage{height:1159px;overflow:hidden;}
  /* PC: A4 네 장을 2×2로 — 위: 직무수행 일지·계획서 1쪽 / 아래: 계획서 2쪽·참석자 명단 (화면 가로에 맞춤) */
  .svPages{display:grid;grid-template-columns:820px 820px;gap:14px;align-items:start;justify-content:start;width:max-content;}
  .svCol{flex:0 0 auto;width:820px;max-width:none;}
  .svCol .svPage{width:820px;max-width:none;}
  #svLog{height:1159px;box-sizing:border-box;overflow:hidden;}
  .svCol .docLabel{height:30px;font-size:22px;}
}
.svPage{background:#fff;color:#111;width:100%;max-width:820px;box-shadow:0 2px 12px rgba(0,0,0,.12);border-radius:4px;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;}
#svLog{padding:22px 24px 18px;}
.svImgPage img{display:block;width:100%;height:auto;}
/* 네 장 공통 틀 */
.svFramed{display:flex;flex-direction:column;padding:22px 24px 16px !important;box-sizing:border-box;}
.svHdr{display:flex;justify-content:space-between;align-items:flex-start;height:86px;flex:0 0 auto;margin-bottom:6px;}
.svHTitle{font-size:24px;font-weight:800;line-height:1.35;padding-top:4px;}
.svHTitle.u{text-decoration:underline;text-underline-offset:5px;}
.svSub{font-size:14px;font-weight:600;color:#555;text-decoration:none;display:inline-block;}
.svSignBox{width:200px;table-layout:fixed;}
.svBody{flex:1;display:flex;flex-direction:column;min-height:0;}
.svGrow{flex:1 1 auto;}
.svFramed .svFoot{flex:0 0 auto;margin-top:8px;}
.svPT{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12.5px;border:2px solid #111;}
.svPT th,.svPT td{border:1px solid #444;height:23px;padding:1px 5px;text-align:center;font-weight:500;}
.svPT th{font-weight:700;}
.svPT td.l{text-align:left;} .svPT td.r{text-align:right;}
.svSec{font-size:14px;font-weight:800;margin:9px 0 3px;}
.svEdu{display:grid;grid-template-columns:1fr 1fr;row-gap:5px;font-size:12.5px;margin:2px 0 0;}
.svBox{border:2px solid #111;padding:5px 8px;font-size:12.5px;line-height:1.7;}
.svCols{display:grid;grid-template-columns:1.25fr 1fr;gap:10px;}
.svNote{margin-top:-2px;border-top:0;line-height:1.6;}
.svTwin{display:flex;gap:4%;} .svTwin .svPT{width:48%;}
.svDiag{display:flex;align-items:center;justify-content:center;padding:6px;}
.svDiag img{max-width:100%;max-height:100%;width:100%;height:auto;object-fit:contain;}
.svIssueWrap{display:flex;flex-direction:column;margin-top:12px;}
.svIssueWrap .svIssueH{margin-top:0;}
.svIssueWrap .svIssue,.svIssueWrap .svIssuePrint{flex:1;min-height:80px;}
.svRWrap{align-items:stretch;}
.svRWrap .svRoster{height:100%;}
/* 네 장 모두 같은 안쪽 여백(위·좌·우 22·24px)으로 맞춤 */
.svImgPage,#svP3{padding:22px 24px 18px;box-sizing:border-box;}
#svP3{position:relative;}
.svRTitle{font-size:24px;font-weight:800;text-decoration:underline;text-underline-offset:5px;margin:6px 0 26px;}
.svRLine{font-size:15px;font-weight:600;margin:0 0 14px;}
.svRWrap{display:flex;gap:7%;margin-top:22px;}
.svRoster{flex:1;border-collapse:collapse;table-layout:fixed;font-size:14px;}
.svRoster th,.svRoster td{border:1px solid #333;height:37px;text-align:center;}
.svRoster th{font-weight:800;}
.svRosterH{font-size:15px;}
.svRName{font-weight:600;}
.svRFoot{position:absolute;right:24px;bottom:18px;margin:0;}
.svHead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.svTitle{font-size:24px;font-weight:800;line-height:1.35;padding-top:6px;}
.svSignBox{border-collapse:collapse;font-size:13px;}
.svSignBox th,.svSignBox td{border:1px solid #111;text-align:center;font-weight:600;}
.svSignBox tr:first-child th:not([rowspan]){width:78px;height:24px;}

let otTeamFilter = (()=>{ try{ return localStorage.getItem('snct_team_ot')||''; }catch(e){ return ''; } })(); // 월별 OT현황 — 기기에 기억

let addCodeFormOpen = false; // 근태코드 화면: 코드 추가 폼 표시 여부
// 임금월 계산: "M월"은 (M-1월)26일 ~ M월25일
function payPeriodRange(y,m){
  let sy=y, sm=m-1;
  if(sm<1){ sm=12; sy=y-1; }

document.addEventListener('keydown', (ev)=>{
  if(VIEW!=='dispatch' || !dpSel) return;
  const t = ev.target; if(t && (t.tagName==='INPUT' || t.tagName==='TEXTAREA' || t.tagName==='SELECT' || t.isContentEditable)) return;
  if(ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if(ev.key==='Escape'){ dpSel = null; dpApplySel(); return; }
  if(ev.key==='Delete' || ev.key==='Backspace'){ ev.preventDefault(); dpClearNotesInSel(); return; } // 글자만 지움(색은 '수정'으로만)
  if(ev.key==='Enter' || ev.key==='F2'){ ev.preventDefault(); dpStartTyping(dpAnchorCell(), null); return; }
  const arrows = {ArrowLeft:[0,-1], ArrowRight:[0,1], ArrowUp:[-1,0], ArrowDown:[1,0]};
  if(arrows[ev.key]){ ev.preventDefault(); dpMoveSel(arrows[ev.key][0], arrows[ev.key][1]); return; }
  if(ev.key.length===1){ ev.preventDefault(); dpStartTyping(dpAnchorCell(), ev.key); }
});

let dpInlineCommit = null; // 열려 있는 입력칸을 저장하고 닫는 함수(다른 칸을 누르거나 팔레트를 누를 때 먼저 호출)
function startDpInlineEdit(td, firstChar){
  if(!td || !canEdit) return;
  if(dpInlineCommit) dpInlineCommit(true);
  const empId = td.dataset.dispatchEmp, slot = td.dataset.dispatchSlot;
  const id = `${dispatchDate}_${dispatchShift}_${empId}`;
  const prev = ((dispatch[id]||{}).notes||{})[slot] || '';
  const prevHtml = td.innerHTML, prevTitle = td.getAttribute('title');
  td.innerHTML = `<input type="text" class="dpInline" maxlength="10" autocomplete="off" value="${esc(firstChar!=null ? firstChar : prev)}">`;
  const inp = td.querySelector('input');
  inp.focus({preventScroll:true});
  if(firstChar!=null){ const n = inp.value.length; inp.setSelectionRange(n, n); } else inp.select();
  let done = false;
  const finish = (save)=>{
    if(done) return; done = true; dpInlineCommit = null;
    const v = inp.value.trim();
    if(save && v!==prev){
      // 화면을 통째로 다시 그리지 않고 그 칸만 바로 바꿔서, 다른 칸으로 옮겨도 글자가 그대로 보이게
      td.innerHTML = v ? `<span class="dpTxt">${esc(v)}</span>` : '';
      if(v) td.setAttribute('title', v); else td.removeAttribute('title');
      saveDispatchNote(dispatchDate, dispatchShift, empId, slot, v);
    } else {
      td.innerHTML = prevHtml;
      if(prevTitle!=null) td.setAttribute('title', prevTitle); else td.removeAttribute('title');
    }
  };
  dpInlineCommit = finish;
  inp.onkeydown = (ev)=>{
    if(ev.key==='Enter'){ ev.preventDefault(); finish(true); dpMoveSel(1, 0); }      // 엔터: 저장하고 아래 칸으로
    else if(ev.key==='Tab'){ ev.preventDefault(); finish(true); dpMoveSel(0, ev.shiftKey ? -1 : 1); }
    else if(ev.key==='Escape'){ ev.preventDefault(); finish(false); }
  };
  inp.onblur = ()=> finish(true);
  inp.onpointerdown = (ev)=> ev.stopPropagation();
}
// 1조/2조를 고르면 그 조의 그날 근무(교대 순환)에 맞춰 D → 주간(07~19시), N → 야간(18~07시)
function isSundayDs(ds){ const [y,m,d] = String(ds).split('-').map(Number); return new Date(y, m-1, d).getDay()===0; }
function autoDispatchShift(){
  if(isSundayDs(dispatchDate || todayStr())){ // 일요일: 하루치 한 장, 처음엔 고른 조의 근무(D/N)에 맞춰 주간·야간
    dispatchShift = 'full';
    const t = (dispatchTeamFilter==='1' || dispatchTeamFilter==='2') ? dispatchTeamFilter : '1';
    dispatchSunPart = scheduledShift(dispatchDate || todayStr(), t)==='N' ? 'night' : 'day';
    return;
  }
  const team = (dispatchTeamFilter==='1' || dispatchTeamFilter==='2') ? dispatchTeamFilter : '1';
  const c = scheduledShift(dispatchDate || todayStr(), team);
  if(c) dispatchShift = c==='N' ? 'night' : 'day';
}

// 회사 화면의 선석 카드 글자 줄을 항목별로 나눔
const VSL_TIME_LABELS = ['접안예정시간','접안완료시간','작업시작시간','출항예정시간'];
function parseBerthLines(L){
  const isLabel = x => VSL_TIME_LABELS.includes(x) || ['양하','적하','총작업량','완료량','잔량'].includes(x);
  const after = lab => { const i = L.indexOf(lab); return i>=0 && i+1<L.length && !isLabel(L[i+1]) ? L[i+1] : ''; };
  const pair = lab => {
    const i = L.indexOf(lab); if(i<0) return null;
    let a = L[i+1]||'', b = '';
    if(/\/\s*$/.test(a)){ b = L[i+2]||''; a = a.replace(/\/\s*$/,''); }
    else if(a.includes('/')){ [a,b] = a.split('/'); }
    const done = Number(String(a).replace(/[^0-9.]/g,''))||0, total = Number(String(b).replace(/[^0-9.]/g,''))||0;
    return {done, total};
  };
  const pctLine = L.find(x=>/^\d+(\.\d+)?\s*%$/.test(x));
  const ship = L[0] || '';
  const op = L[1] && !isLabel(L[1]) && !/%$/.test(L[1]) && L[1].length<=12 ? L[1] : '';
  return {
    ship, op,
    times: VSL_TIME_LABELS.map(l=>({label:l, value:/^\d{4}[-./]\d{1,2}/.test(after(l)) ? after(l) : ''})),
    pct: pctLine ? parseFloat(pctLine) : null,
    dis: pair('양하'), load: pair('적하'),
    total: after('총작업량'), done: after('완료량'), remain: after('잔량'),
    ok: !!(ship && (L.includes('양하') || L.includes('접안예정시간')))
  };
}
function berthCardHtml(b){
  const has = !b.empty && b.lines && b.lines.length;
  if(!has) return `<div class="vslBerth"><div class="vslBerthHead"><span class="vslBerthIc">⚓</span><span>${esc(b.title)}</span></div><div class="vslBerthEmpty">작업이 없습니다.</div></div>`;
  const p = parseBerthLines(b.lines);
  if(!p.ok) return `<div class="vslBerth on"><div class="vslBerthHead"><span class="vslBerthIc on">⚓</span><span>${esc(b.title)}</span></div>
      <div class="vslBerthBody">${b.lines.map((l,k)=>`<div class="${k===0?'vslShip':'vslLine'}">${esc(l)}</div>`).join('')}</div></div>`;
  const pct = p.pct!=null ? p.pct : 0, R = 44, C = 2*Math.PI*R;
  const bar = x => x && x.total ? Math.min(100, Math.round(x.done/x.total*100)) : 0;
  const box = (name, x, cls) => `<div class="vslBox ${cls}"><div class="vslBoxT">${name}</div>
      <div class="vslBoxN"><b>${x ? x.done.toLocaleString() : 0}</b><span>/${x ? x.total.toLocaleString() : 0}</span></div>
      <div class="vslBar"><i style="width:${bar(x)}%"></i></div></div>`;
  return `<div class="vslBerth on">
    <div class="vslBerthHead"><span class="vslBerthIc on">⚓</span><span>${esc(b.title)}</span>
      <span class="vslShipNo">${esc(p.ship)}</span><span style="flex:1"></span>${p.op ? `<span class="vslOp">${esc(p.op)}</span>` : ''}</div>
    <div class="vslTimes">${p.times.map(t=>`<div class="vslTimeRow"><span><i class="vslDot"></i>${esc(t.label)}</span><b>${esc(t.value)}</b></div>`).join('')}</div>
    <div class="vslMid">
      <div class="vslRing"><svg viewBox="0 0 110 110" width="110" height="110">
          <circle cx="55" cy="55" r="${R}" fill="none" stroke="#fff" stroke-width="12"/>
          ${pct>0 ? `<circle cx="55" cy="55" r="${R}" fill="none" stroke="#db2777" stroke-width="12" stroke-linecap="round"
            stroke-dasharray="${(C*Math.min(pct,100)/100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 55 55)"/>` : ''}
        </svg><div class="vslRingIn"><span>🚢</span><b>${pct}%</b></div></div>
      <div class="vslBoxes">${box('양하', p.dis, 'dis')}${box('적하', p.load, 'load')}</div>
    </div>
    <div class="vslChips">
      <span class="vslChip">총작업량 <b>${esc(p.total)}</b></span>
      <span class="vslChip g">완료량 <b>${esc(p.done)}</b></span>
      <span class="vslChip o">잔량 <b>${esc(p.remain)}</b></span>
    </div>
  </div>`;
}

let berthData = null, berthErr = '', berthLoading = false, berthLoadedAt = 0, berthInfo = null, berthTimer = null;
async function reloadBerth(){
  if(!vslApi || berthLoading) return;
  berthLoading = true; berthLoadedAt = Date.now();
  try{
    const api = vslApi.replace(/\/macros\/u\/\d+\/s\//, '/macros/s/');
    const r = await fetch(api + (api.includes('?') ? '&' : '?') + 'type=berth&t=' + Date.now());
    const j = await r.json();
    if(j && j.ok){ berthData = j; berthErr = ''; try{ saveBerthLog(); }catch(e){} }
    else if(j && j.dates === undefined) berthErr = 'Apps Script에 선석 조회 기능이 아직 없어요. 새 코드로 바꾸고 새 버전으로 배포해 주세요.';
    else berthErr = '회사 사이트에서 선석 정보를 받지 못했어요.';
  }catch(err){ berthErr = '선석 정보를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.'; }
  berthLoading = false;
  if(VIEW==='berth' || VIEW==='safety') render();
}
function textOn(bg){
  const h = String(bg||'').replace('#',''); if(h.length<6) return '#111';
  const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  return (0.299*r + 0.587*g + 0.114*b) > 150 ? '#111' : '#fff';
}

  return `

    ${chart || (d ? '<div class="empty">표시할 선석 일정이 없습니다.</div>' : '')}
    ${chart ? '<p class="hint" style="margin:8px 0 0;">배 블록을 누르면 선명·항차·접안/출항 시간·물량을 볼 수 있어요.</p>' : ''}

// 끌어서 칠하기: 처음 누른 칸 ~ 지금 마우스(손가락)가 있는 칸까지 '사각형'으로 칠함(옆으로·위아래로 모두).
// 끌다가 되돌아오면 벗어난 칸은 원래 색·글자로 돌아감. 휴무(회색) 줄은 건너뜀(처음 누른 줄이 회색이면 포함)
function dispatchStartPaint(td){
  if(!td || !td.classList.contains('dpCell')) return;
  if(!canEdit){ requireEdit(); return; }
  const table = td.closest('table'); if(!table) return;
  const startTr = td.closest('tr');
  const rows = Array.from(table.querySelectorAll('tbody tr')).filter(tr=> tr.querySelector('.dpCell') && (tr===startTr || !tr.classList.contains('dpOff')))
    .map(tr=> Array.from(tr.querySelectorAll('.dpCell')));
  const orig = new Map();
  rows.forEach(cells=> cells.forEach(c=> orig.set(c, {cur: c.dataset.dispatchCur || '', html: c.innerHTML})));
  const r0 = rows.findIndex(cells=> cells.includes(td));
  paintSession = {rows, orig, r0, c0: rows[r0].indexOf(td), last: '', value: dispatchPaintValue(), erase: dispatchPaint==='수정', touched: new Set()};
  dispatchContinuePaint(td);
}
function dispatchContinuePaint(td){
  if(!paintSession || !td || !td.classList.contains('dpCell')) return;
  const ps = paintSession;
  const r = ps.rows.findIndex(cells=> cells.includes(td)); if(r < 0) return;
  const c = ps.rows[r].indexOf(td);
  const key = r+'_'+c; if(key === ps.last) return; ps.last = key;
  const rlo = Math.min(ps.r0, r), rhi = Math.max(ps.r0, r), clo = Math.min(ps.c0, c), chi = Math.max(ps.c0, c);
  const slotsChanged = new Set(), empsChanged = new Set();
  ps.rows.forEach((cells, ri)=> cells.forEach((cell, ci)=>{
    const inRect = ri>=rlo && ri<=rhi && ci>=clo && ci<=chi;
    if(!inRect && !ps.touched.has(cell)) return; // 한 번도 안 건드린 칸은 그대로
    const o = ps.orig.get(cell);
    const want = inRect ? ps.value : o.cur;
    if((cell.dataset.dispatchCur||'') !== want){ applyPaintToCell(cell, want); slotsChanged.add(cell.dataset.dispatchSlot); empsChanged.add(cell.dataset.dispatchEmp); }
    if(ps.erase){ // 수정: 범위 안 칸은 글자도 지워 보이게, 벗어나면 원래 글자 복원
      const html = inRect ? '' : o.html;
      if(cell.innerHTML !== html) cell.innerHTML = html;
    }
    if(inRect) ps.touched.add(cell); else ps.touched.delete(cell);
  }));
  slotsChanged.forEach(updateCountLive);
  empsChanged.forEach(updateSuwuLive);
}
function dispatchFinishPaint(){
  if(!paintSession) return;
  const {rows, orig, erase, touched} = paintSession;
  paintSession = null;
  const byEmp = {}; // 사람마다 바뀐 칸만 모아서 저장
  rows.forEach(cells=> cells.forEach(cell=>{
    const o = orig.get(cell), slot = cell.dataset.dispatchSlot, emp = cell.dataset.dispatchEmp, v = cell.dataset.dispatchCur || '';
    const g = byEmp[emp] = byEmp[emp] || {changes:{}, clear:[]};
    if(v !== o.cur) g.changes[slot] = v;
    if(erase && touched.has(cell)){ const note = (((dispatch[`${dispatchDate}_${dispatchShift}_${emp}`]||{}).notes)||{})[slot]; if(note){ g.clear.push(slot); cell.removeAttribute('title'); } }
  }));
  Object.entries(byEmp).forEach(([emp, g])=>{
    if(Object.keys(g.changes).length || g.clear.length) saveDispatchSlots(dispatchDate, dispatchShift, emp, g.changes, g.clear);
  });
}
// 한 칸만 누르기: 초반·후반 등은 그 칸만 칠하기, 수정은 그 칸의 색·글자 지우기
// 같은 칸을 빨리 두 번 누르면(더블클릭·더블탭) 방금 바꾼 것을 되돌리고 글자 입력칸을 엶
let dpLastTap = null;
function dispatchTapCell(td){
  if(!td || !canEdit) return;
  const slot = td.dataset.dispatchSlot, empId = td.dataset.dispatchEmp, now = Date.now();
  if(dpLastTap && dpLastTap.slot===slot && dpLastTap.emp===empId && now - dpLastTap.t < 400){
    const u = dpLastTap; dpLastTap = null;
    if(u.changed) saveDispatchSlots(dispatchDate, dispatchShift, empId, {[slot]: u.prevCur}, []).then(()=>{});
    if(u.prevNote && u.clearedNote) saveDispatchNote(dispatchDate, dispatchShift, empId, slot, u.prevNote);
    applyPaintToCell(td, u.prevCur);
    startDpInlineEdit(td);
    return;
  }
  const prevCur = td.dataset.dispatchCur || '';
  const prevNote = (((dispatch[`${dispatchDate}_${dispatchShift}_${empId}`]||{}).notes)||{})[slot] || '';
  if(dispatchPaint==='수정'){
    dpLastTap = {slot, emp: empId, t: now, prevCur, prevNote, changed: !!prevCur, clearedNote: !!prevNote};
    if(!prevCur && !prevNote) return;
    applyPaintToCell(td, ''); td.innerHTML = ''; td.removeAttribute('title'); updateCountLive(slot);
    saveDispatchSlots(dispatchDate, dispatchShift, empId, {[slot]: ''}, prevNote ? [slot] : []);
    updateSuwuLive(empId);
    return;
  }
  const val = dispatchPaintValue();
  dpLastTap = {slot, emp: empId, t: now, prevCur, prevNote, changed: prevCur!==val, clearedNote: false};
  if(prevCur === val) return;
  applyPaintToCell(td, val); updateCountLive(slot);
  saveDispatchSlots(dispatchDate, dispatchShift, empId, {[slot]: val});
  updateSuwuLive(empId);
}
function mondayOf(dateStr){
  const [y,m,d]=dateStr.split('-').map(Number);
  const dt=new Date(y,m-1,d);
  const wd=dt.getDay(); // 0=일
  const diff = wd===0 ? -6 : 1-wd;
  dt.setDate(dt.getDate()+diff);
  return dstr(dt.getFullYear(), dt.getMonth()+1, dt.getDate());
}
function addDays(dateStr, n){
  const [y,m,d]=dateStr.split('-').map(Number);
  const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n);
  return dstr(dt.getFullYear(), dt.getMonth()+1, dt.getDate());
}
// 날짜를 n개월 이동(일자는 최대한 유지, 말일 초과시 그 달 말일로 보정)
function shiftMonth(dateStr, n){
  const [y,m,d] = dateStr.split('-').map(Number);
  let ny=y, nm=m+n;
  while(nm>12){ nm-=12; ny++; }
  while(nm<1){ nm+=12; ny--; }
  const nd = Math.min(d, daysInMonth(ny,nm));
  return dstr(ny, nm, nd);
}
// 기간을 n개월 이동. "1일~말일" 한 달 전체 기간이면 이동 후에도 그 달의 1일~말일로 맞춤(8/31, 2/29 등 누락 방지)
function shiftRangeMonth(start, end, n){
  const [sy,sm,sd] = start.split('-').map(Number);
  const [ey,em,ed] = end.split('-').map(Number);
  if(sd===1 && sy===ey && sm===em && ed===daysInMonth(ey,em)){
    const ns = shiftMonth(start, n);
    const [ny,nm] = ns.split('-').map(Number);
    return [ns, dstr(ny,nm,daysInMonth(ny,nm))];
  }
  return [shiftMonth(start,n), shiftMonth(end,n)];
}

function codeStyle(code){
  const cd = (typeof codeDefs!=='undefined') && codeDefs[code];
  if(cd && cd.color && GROUP_STYLE[cd.color]) return GROUP_STYLE[cd.color];
  if(CODE_STYLE[code]) return CODE_STYLE[code];

const CODE_GROUPS = [

  {key:'blue', name:'파란 배경'}, {key:'pink', name:'분홍 배경'}, {key:'purple', name:'보라 배경'}, {key:'gray', name:'회색 배경'}, {key:'sky', name:'하늘색 배경'}

function codeGroup(code){
  if(code==='DS') return 'red'; // 요청: DS는 항상 빨간 배경
  const cd = (typeof codeDefs!=='undefined') && codeDefs[code];
  if(cd && cd.color) return cd.color;
  if(RED_CODES.has(code)) return 'red';
  return ({MC:'yellow', FC:'blue', VP:'pink', SP:'purple', SC:'gray'})[code] || 'black';

const BLACK_ORDER = ['D','N','DN','ND','UJ','E','EC','CK','SV']; // DS는 빨간 코드로 옮김(NS 위)
function codeSortKey(code){

  return gi*1000 + (bi>=0 ? bi : ri>=0 ? ri : 500);
}

let _excelLeaveMap = null;
function excelLeave(ds, name){
  if(!_excelLeaveMap){
    _excelLeaveMap = new Map();
    Object.entries(EXCEL_LEAVE).forEach(([n, list])=> list.split(',').forEach(x=>{
      const [d, c] = x.split(':');
      _excelLeaveMap.set('20'+d.slice(0,2)+'-'+d.slice(2,4)+'-'+d.slice(4,6)+'|'+n, c);
    }));
  }
  return _excelLeaveMap.get(ds+'|'+name) || '';
}
// 그 날의 연가 코드: 편집자가 직접 입력한 코드 → 원본 엑셀 코드 → 저장된 코드 순
function leaveCodeFor(rec, ds, name){
  const c = effCode(rec, ds, name);
  return LEAVE_SET.has(c) ? c : '';
}
function yearEnd(start){ const [y,m,d] = start.split('-').map(Number); return addDays(dstr(y+1, m, Math.min(d, daysInMonth(y+1, m))), -1); }
function leaveCounts(emp, start){
  const end = yearEnd(start), name = String(emp.name||'').trim(), cnt = {};
  LEAVE_TYPES.forEach(([c])=> cnt[c] = 0);
  for(let ds=start; ds<=end; ds=addDays(ds,1)){
    const c = leaveCodeFor(attStore[ds+'_'+emp.id], ds, name);
    if(c) cnt[c]++;
  }
  return {cnt, end, total: Object.values(cnt).reduce((a,b)=>a+b,0)};
}

    return `<div class="card" style="padding:12px 10px;text-align:center;">
      <div class="n" style="font-size:22px;">${cnt[c]}</div><div class="l">${esc(l)}<br><b style="color:var(--text);">${c}</b></div></div>`;
  }).join('');
  return `<div id="leaveScrim" style="position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:500;display:flex;align-items:center;justify-content:center;">
    <div class="panel" style="max-width:460px;width:92%;margin:0;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
        <h3 style="margin:0;">${esc(emp.name)} · 연간 누계</h3><span style="flex:1"></span>
        <button class="btn ghost sm" id="leaveClose">닫기</button>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin:0 0 12px;">
        <button class="btn ghost sm" id="leavePrevYear">◀</button>
        <b style="font-size:15px;">${leaveYear}년</b>
        <button class="btn ghost sm" id="leaveNextYear">▶</button>
        <span class="hint" style="margin:0;">${leaveYear}-01-01 ~ ${leaveYear}-12-31</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;">${cells}</div>
    </div>
  </div>`;
}

function isRefCode(c){ return !!c && (refWorkCodes().has(c) || refStatusCodes().has(c)); }

// ===== 교대 근무 순환 (주 단위, 월요일 시작) =====
// 기준 주에 1조가 D면 2조는 N, 다음 주마다 서로 바뀜. 원본 엑셀(2025-12-22 주 1조 D)과 같은 규칙
let rotation = {start:'2025-12-22', team1:'D'};
function scheduledShift(ds, team){
  if(!rotation || !rotation.start || !ds || (team!=='1' && team!=='2')) return '';
  const a = mondayOf(rotation.start), b = mondayOf(ds);
  const [y1,m1,d1] = a.split('-').map(Number), [y2,m2,d2] = b.split('-').map(Number);
  const weeks = Math.round((Date.UTC(y2,m2-1,d2) - Date.UTC(y1,m1-1,d1)) / (7*86400000));
  const t1 = rotation.team1==='N' ? 'N' : 'D';
  const flip = c => c==='D' ? 'N' : 'D';
  const c1 = (((weeks % 2) + 2) % 2) ? flip(t1) : t1;
  return team==='1' ? c1 : flip(c1);
}
function empScheduled(empId, ds){ const e = employees.find(x=>x.id===empId); return e ? scheduledShift(ds, e.team||'') : ''; }

function dateAt(dateStr, h, m, addDay){
  const [y,mo,d] = dateStr.split('-').map(Number);
  return new Date(y, mo-1, d + (addDay||0), h, m||0);
}
// 분 반올림 규칙: 1~29분→30분, 31~59분→다음 시(0분). 0/30분은 그대로.
function normalizeHM(h,m){
  h = Math.round(h); m = Math.round(m);
  if(m>=1 && m<=29) m = 30;
  else if(m>=31 && m<=59){ h += 1; m = 0; }
  let dayOffset = 0;
  while(h > 24){ h -= 24; dayOffset += 1; }
  return {h, m, dayOffset};
}
// 입력값은 "H:MM" (H=1~24, M=00 또는 30) 체계 — 원본 엑셀의 HH.MM(24시=자정) 표기와 동일한 규칙
function parseHM(dateStr, hm){
  if(!hm) return null;
  let [h,m] = hm.split(':').map(Number);
  if(isNaN(h) || isNaN(m)) return null;
  const norm = normalizeHM(h,m);
  const dayOffset = (norm.h===24 ? 1 : 0) + norm.dayOffset;
  const realHour = norm.h===24 ? 0 : norm.h;
  return dateAt(dateStr, realHour, norm.m, dayOffset);
}
function toDec(hm){
  let [h,m] = hm.split(':').map(Number);
  const norm = normalizeHM(h,m);
  return norm.h + norm.m/60;
}

// 토요일 만근 자동 판정 (원본 엑셀 규칙 — 864개 토요일 전부 대조 일치):
// 그 주 월~금 5일이 모두 '출근(본출근 입력) · 공휴일 · 인정 근태코드' 중 하나면 만근 → 토요일 근무는 특근(SA)
const MANGUEN_CODES = new Set(['VA','VP','E','FCH','MCH','UJ','LS','SV','CK','AV','RV']);
function autoManguen(dateStr, empId){
  if(!empId || typeof attStore==='undefined') return false;
  const [y,m,d] = dateStr.split('-').map(Number);
  if(new Date(y,m-1,d).getDay()!==6) return false;
  for(let i=5;i>=1;i--){

    const r = attStore[ds+'_'+empId];
    const ok = (r && r.checkIn && !preSupportRec(r, ds)) || isHolidayFor(ds, empId) || (r && MANGUEN_CODES.has(r.statusCode));
    if(!ok) return false;
  }
  return true;
}
function recManguen(rec, dateStr){ return !!(rec && (rec.manguen || autoManguen(dateStr, rec.employeeId))); }
// ===== 노조별 설립일(사람마다 다른 공휴일) =====
// SNCT노조(1조 + 고훈희·유재현): 6/15 / 통합노조(그 외 2조): 1/2 — 해마다 같은 날짜
const UNION_DAYS = [{md:'06-15', union:'1', name:'SNCT노조설립일'}, {md:'01-02', union:'2', name:'통합노조설립일'}];
const DEFAULT_UNION2 = new Set(['선종화','우창기','유재선','임성현','강대정','김재천','윤성하','황대영','홍윤택','강위상','김세중','박종국','김성일']);
function unionOf(e){
  if(!e) return '1';
  if(e.unionGroup==='1' || e.unionGroup==='2') return e.unionGroup;
  return DEFAULT_UNION2.has(String(e.name||'').trim()) ? '2' : '1';

function isHolidayFor(ds, empId){

  if(rule && empId && typeof employees!=='undefined'){
    const e = employees.find(x=>x.id===empId);
    if(e) return unionOf(e)===rule.union;
  }
  return !!holidays[ds];
}
function dayCategory(dateStr, manguen, empId){
  const [wy,wm,wd] = dateStr.split('-').map(Number);
  const w = new Date(wy, wm-1, wd).getDay(); // 0=일 6=토, 타임존 안전 파싱
  const isHoliday = isHolidayFor(dateStr, empId);
  if(w===0) return 'SU';
  if(isHoliday) return 'H';
  if(w===6) return manguen ? 'SA' : 'W'; // 만근(이번주 평일 개근) 체크된 토요일만 특근(SA)으로 인정
  return 'W';

// 선지원: 편성이 야간(N)인 사람이 주간(D)에 출근(본출근 14시 이전)하면 본근무가 아니라 지원근무로 계산
// (원본 엑셀은 이런 날을 지원출근/지원퇴근 칸에 입력함 — 본출근 칸에 넣어도 같은 결과가 나오게 자동으로 옮겨 계산)
function preSupportRec(rec, dateStr){
  if(!rec || !rec.checkIn || !rec.checkOut || rec.supportIn || rec.supportOut) return null;
  if(toDec(rec.checkIn) > 14) return null;
  // 교육·노조업무처럼 주간 본근무로 인정되는 날(원본 엑셀은 근무 칸에 D 체크)은 선지원이 아님
  if(['E','UJ','EC'].includes(rec.statusCode)) return null;
  if(rec.statusCode && (rec.workCode==='D' || rec.workCode==='DN')) return null;
  const sched = rec.baseShift || ((typeof empScheduled==='function' && rec.employeeId) ? empScheduled(rec.employeeId, dateStr) : '');
  if(sched !== 'N') return null;
  return Object.assign({}, rec, {supportIn: rec.checkIn, supportOut: rec.checkOut, checkIn: '', checkOut: ''});
}
// 하루치 근태 기록으로부터 근무시간/초과/심야/가산시간을 계산 (원본 DB입력 수식 100% 대조 검증됨)
function computeDaily(rec, dateStr){
  const zero = {totalWork:0, meal:0, overtime:0, night:0, category:'-', premium:0, valid:false};
  if(!rec || !rec.checkIn || !rec.checkOut) return zero;
  if(preSupportRec(rec, dateStr)) return zero; // 선지원 → 지원근무로 계산(computeSupportDaily)
  // 근무코드: 월별표에서 지정한 값(D·N 등). 없으면(출퇴근 입력만 한 날) 본출근 시각으로 주간/야간을 판단.
  // 편집자가 월별표에서 직접 OFF로 지정한 날만 계산하지 않음
  let wc = (rec.workCode && rec.workCode!=='OFF') ? rec.workCode : '';
  const sched = (typeof empScheduled==='function' && rec.employeeId) ? empScheduled(rec.employeeId, dateStr) : '';
  if(!wc){
    if(rec.attManual && rec.workCode==='OFF') return zero;
    wc = sched || (toDec(rec.checkIn) <= 14 ? 'D' : 'N');
  }

  const checkinDec = toDec(rec.checkIn);
  let start;
  if(checkinDec<=14) start = dateAt(dateStr,8,0);
  else if(checkinDec<=24) start = dateAt(dateStr,19,0);
  else return zero;

  let actualEnd = parseHM(dateStr, rec.checkOut);
  if(!actualEnd) return zero;
  if(actualEnd<=start) actualEnd = new Date(actualEnd.getTime()+24*3600000);
  const checkoutDec = toDec(rec.checkOut);

  const kcat = dayCategory(dateStr, recManguen(rec, dateStr), rec.employeeId);

  let guaranteedEnd = actualEnd;
  // 퇴근보전은 원본 엑셀처럼 '근무코드(편성된 주간/야간)' 기준으로 판단. 엑셀에서 가져온 기록은 baseShift(D/N)에 들어 있음
  const gCode = rec.baseShift || sched || wc; // 편성 근무코드(교대 순환) 기준
  if(kcat==='SU' || kcat==='H'){
    if((gCode==='D'||gCode==='DN') && checkoutDec>8 && checkoutDec<12){
      guaranteedEnd = dateAt(dateStr,12,0);
    }
    if((gCode==='N'||gCode==='ND') && checkoutDec>=19 && checkoutDec<=24){
      guaranteedEnd = dateAt(dateStr,0,0,1); // 24:00 = 익일 00:00
    }
  }

  let meal = 0;
  const noon12=dateAt(dateStr,12,0), noon13=dateAt(dateStr,13,0);
  if(start<noon12 && guaranteedEnd>noon13) meal+=1;
  const eve18=dateAt(dateStr,18,0), eve19=dateAt(dateStr,19,0);
  if(start<eve18 && guaranteedEnd>eve19) meal+=1;
  const next1=dateAt(dateStr,1,0,1);
  if(guaranteedEnd>=next1) meal+=1;

  const raw = (guaranteedEnd-start)/3600000;
  const totalWork = Math.max(raw - meal, 0);
  const overtime = Math.max(totalWork - 8, 0);

  const night22=dateAt(dateStr,22,0), next6=dateAt(dateStr,6,0,1);
  let night = 0;
  const wsExists = guaranteedEnd>night22, weExists = actualEnd>night22;
  if(wsExists && weExists){
    const ws = start>night22 ? start : night22;
    const we = actualEnd<next6 ? actualEnd : next6;
    const wm = rec.yasik ? 0 : (guaranteedEnd>=next1 ? 1 : 0);
    night = Math.max((we-ws)/3600000 - wm, 0);
  }

  let category, premium;
  if(kcat==='SU' || kcat==='H'){
    const mult = rec.extCode ? 2 : 1.5;
    premium = totalWork*mult + overtime*0.5 + night*0.5;
    category = kcat==='SU' ? '일요일' : '공휴일';
  } else if(kcat==='SA'){
    premium = totalWork*1.5 + night*0.5;
    category = '토요일';
  } else {
    premium = rec.extCode ? (totalWork*1.5+night*0.5) : (overtime*1.5+night*0.5);
    category = '평일';
  }
  return {totalWork, meal, overtime, night, category, premium, valid:true};
}
function fmtH(n){ return (Math.round(n*10)/10).toFixed(1); }

// 조출/석출/중식/야식 - 각 1건당 1.5시간 가산 (원본 식사계 = SUM(조출,석출,중식,야식)*1.5)
// 담당: 출퇴근 입력에서 체크하면 식사연장과 같은 1.5시간 OT — 월별 OT현황·급여명세서에만 반영(근태관리 집계에는 넣지 않음)
function computeDamdang(rec){ return rec && rec.damdang ? 1.5 : 0; }
function computeMealAllowance(rec){
  if(!rec) return 0;
  const cnt = [rec.jochul, rec.seokchul, rec.jungsik, rec.yasik].filter(Boolean).length;
  return cnt * 1.5;
}

// 지원출근/지원퇴근 기준 지원근무 가산시간 계산 (본조보상/타조보상 수동입력 포함, 100% 대조 검증됨)
function computeSupportDaily(rec, dateStr){
  const zero = {supTotal:0, supOT:0, supNight:0, premium:0, valid:false};
  if(!rec) return zero;
  rec = preSupportRec(rec, dateStr) || rec; // 선지원(N편성 → 주간 출근)은 본출근·본퇴근을 지원 시간으로
  const honjo = Number(rec.honjoComp)||0, tajo = Number(rec.tajoComp)||0;
  const hasSupportShift = !!(rec.supportIn && rec.supportOut);
  if(!hasSupportShift && honjo===0 && tajo===0) return zero;

  let supTotal=0, supOT=0, supNight=0;
  let shiftParsed = false;
  if(hasSupportShift){
    let start = parseHM(dateStr, rec.supportIn);
    let end = parseHM(dateStr, rec.supportOut);
    if(start && end){
      shiftParsed = true;
      if(end <= start) end = new Date(end.getTime() + 24*3600000);

      const totalRaw = (end-start)/3600000;
      let meal = 0;
      const noon12=dateAt(dateStr,12,0), noon13=dateAt(dateStr,13,0);
      if(start<noon12 && end>noon13) meal+=1;
      const eve18=dateAt(dateStr,18,0), eve19=dateAt(dateStr,19,0);
      if(start<eve18 && end>eve19) meal+=1;
      const next1=dateAt(dateStr,1,0,1);
      if(end>=next1) meal+=1;
      supTotal = Math.max(totalRaw - meal, 0);
      supOT = Math.max(supTotal - 8, 0);

      const night22=dateAt(dateStr,22,0), next6=dateAt(dateStr,6,0,1);
      if(end>night22){
        const ws = start>night22 ? start : night22;
        const we = end<next6 ? end : next6;
        const wm = rec.yasik ? 0 : (end>=next1 ? 1 : 0);
        supNight = Math.max((we-ws)/3600000 - wm, 0);
      }
    }
  }

  const kcat = dayCategory(dateStr, recManguen(rec, dateStr), rec.employeeId);
  let premium;
  if(shiftParsed){
    if(kcat==='SU' || kcat==='H' || kcat==='SA'){
      premium = (8 + supOT + tajo)*2 + honjo*1.5 + supNight*0.5;
    } else {
      premium = (8 + supOT + tajo + honjo)*1.5 + supNight*0.5;
    }
  } else {
    // 실제 지원근무 없이 본조보상/타조보상만 입력된 경우 (원본 수식 기준):
    // 본조보상은 요일과 관계없이 1.5배, 타조보상은 휴일·토요일 2배 / 평일 1.5배
    const tajoMult = (kcat==='SU' || kcat==='H' || kcat==='SA') ? 2 : 1.5;
    premium = honjo * 1.5 + tajo * tajoMult;
  }
  return {supTotal, supOT, supNight, premium, valid:true};
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pad2(n){ return String(n).padStart(2,'0'); }
function dstr(y,m,d){ return `${y}-${pad2(m)}-${pad2(d)}`; }
function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }
function weekdayKr(y,m,d){ return ['일','월','화','수','목','금','토'][new Date(y,m-1,d).getDay()]; }
function isWeekend(y,m,d){ const w=new Date(y,m-1,d).getDay(); return w===0||w===6; }
// 날짜 셀 색상 클래스: 공휴일(빨강) > 일요일(빨강) > 토요일(파랑) > 평일(기본)
function dayCellClass(ds, y, m, d){
  if(holidays[ds]) return 'holiday';
  const w = new Date(y,m-1,d).getDay();
  if(w===0) return 'sunday';
  if(w===6) return 'saturday';
  return 'weekday';
}
function todayStr(){ const t=new Date(); return dstr(t.getFullYear(), t.getMonth()+1, t.getDate()); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>t.classList.remove('show'), msg.length>30 ? 6000 : 2200);
}
// window.confirm()은 샌드박스 iframe(아티팩트 환경)에서 차단되어 조용히 실패할 수 있어,
// 자체 DOM으로 만든 확인창을 사용한다. document.body에 직접 붙여서 render()와 무관하게 동작.
function appConfirm(message, onConfirm){
  const old = document.getElementById('appConfirmOverlay');
  if(old) old.remove();
  const overlay = document.createElement('div');
  overlay.id = 'appConfirmOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:900;display:flex;align-items:center;justify-content:center;';
  overlay.innerHTML = `
    <div style="background:var(--surface);color:var(--text);border-radius:12px;padding:20px;max-width:340px;width:88%;box-shadow:0 10px 30px rgba(0,0,0,.25);">
      <p style="margin:0 0 16px;font-size:14px;line-height:1.5;">${esc(message)}</p>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button type="button" id="appConfirmCancel" class="btn ghost sm">취소</button>
        <button type="button" id="appConfirmOk" class="btn warn sm">확인</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const cleanup = ()=> overlay.remove();
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) cleanup(); });
  document.getElementById('appConfirmCancel').onclick = cleanup;
  document.getElementById('appConfirmOk').onclick = ()=>{ cleanup(); onConfirm(); };
}

async function loadFirebase(){
  const [appM, fsM, authM] = await Promise.all([
    import(FIREBASE_SDK+'firebase-app.js'),
    import(FIREBASE_SDK+'firebase-firestore.js'),
    import(FIREBASE_SDK+'firebase-auth.js')
  ]);
  const app = appM.initializeApp(FIREBASE_CONFIG);
  let fs;
  try{
    // 기기에 사본을 저장해 두어 다시 열 때 빠르고, 잠깐 인터넷이 끊겨도 입력이 유지됨
    fs = fsM.initializeFirestore(app, {ignoreUndefinedProperties:true,
      localCache: fsM.persistentLocalCache({tabManager: fsM.persistentMultipleTabManager()})});
  }catch(e){
    fs = fsM.initializeFirestore(app, {ignoreUndefinedProperties:true});
  }
  const auth = authM.getAuth(app);
  fb = {fsM, authM, fs, auth};
}

// 기존 코드가 쓰던 db.collection().doc().get/set/onSnapshot 형태를 그대로 유지하는 어댑터
function createFirebaseDb(){
  const {fsM, fs} = fb;
  const wrapDoc = snap => ({exists: snap.exists(), id: snap.id, data: ()=>snap.data()});
  const wrapQuery = snap => ({docs: snap.docs.map(d=>({id:d.id, data:()=>d.data()}))});
  function docRef(coll, id){
    const ref = fsM.doc(fs, coll, id);
    return {
      async get(){ return wrapDoc(await fsM.getDoc(ref)); },
      set(val, opts){ return fsM.setDoc(ref, val, opts||{}); },
      update(val){ return fsM.setDoc(ref, val, {merge:true}); },
      delete(){ return fsM.deleteDoc(ref); },
      onSnapshot(cb, errCb){ return fsM.onSnapshot(ref, snap=>cb(wrapDoc(snap)), errCb); }
    };
  }
  function collectionRef(name, cons){
    cons = cons || [];
    const q = ()=> fsM.query(fsM.collection(fs, name), ...cons);
    return {
      doc(id){ return docRef(name, id); },
      where(f, op, v){ return collectionRef(name, cons.concat([fsM.where(f, op, v)])); },
      orderBy(f, dir){ return collectionRef(name, cons.concat([fsM.orderBy(f, dir||'asc')])); },
      async get(){ return wrapQuery(await fsM.getDocs(q())); },
      onSnapshot(cb, errCb){ return fsM.onSnapshot(q(), snap=>cb(wrapQuery(snap)), errCb); }
    };
  }
  const COLLS = ['employees','holidays','codeDefs','attendance','dispatch','supportPlan','meta'];
  return {
    collection(name){ return collectionRef(name); },
    doc(path){ const [c, id] = path.split('/'); return docRef(c, id); },
    async exportAll(){
      const out = {};
      for(const n of COLLS){
        const snap = await fsM.getDocs(fsM.collection(fs, n));
        out[n] = {};
        snap.docs.forEach(d=>{ out[n][d.id] = d.data(); });
      }
      return out;
    },
    async importAll(data, onProgress){
      const items = [];
      for(const n of COLLS){ for(const [id, v] of Object.entries(data[n]||{})){ if(v && typeof v==='object') items.push([n, id, v]); } }
      for(let i=0; i<items.length; i+=400){
        const batch = fsM.writeBatch(fs);
        items.slice(i, i+400).forEach(([n, id, v])=> batch.set(fsM.doc(fs, n, id), v, {merge:true}));
        await batch.commit();
        if(onProgress) onProgress(Math.min(i+400, items.length), items.length);
      }
      return items.length;
    }
  };
}

function saveErrMsg(base, err){
  const c = (err && err.code) || '';
  if(c==='permission-denied') return base + ' (권한 없음 — Firestore 보안 규칙을 게시했는지, 로그인한 계정의 권한을 확인하세요)';
  if(c==='not-found') return base + ' (Firestore 데이터베이스를 찾을 수 없음 — 데이터베이스가 만들어졌는지 확인하세요)';
  if(c==='unavailable') return base + ' (서버에 연결할 수 없음 — 인터넷 연결을 확인하세요)';
  return base + (c ? ` (오류: ${c})` : (err && err.message ? ` (${err.message})` : ''));
}

/* ========================= 미리보기 모드 (Claude 화면 등 Firebase 연결이 막힌 곳) ========================= */
// 실제 앱 주소가 아닌 곳에서 서버 연결이 안 되면, 예시 데이터로 화면을 보여줌. 여기서 바꾼 내용은 저장되지 않음.
const LIVE_HOSTS = ['snctunion-svg.github.io'];
let demoMode = false;
function createDemoDb(){
  const store = {};
  const listeners = new Set();
  const clone = v => v==null ? v : JSON.parse(JSON.stringify(v));
  const coll = n => (store[n] = store[n] || {});
  const notify = ()=> setTimeout(()=> listeners.forEach(l=>l()), 0);
  const wrapDoc = (c,id)=>{ const v = coll(c)[id]; return {exists: v!==undefined, id, data: ()=>clone(v)}; };
  function runQuery(name, cons){
    let e = Object.entries(coll(name));
    cons.filter(k=>k.t==='w').forEach(k=>{
      e = e.filter(([id,v])=>{ const f=v[k.f]; return k.op==='=='?f===k.v : k.op==='>='?f>=k.v : k.op==='<='?f<=k.v : true; });
    });
    const o = cons.find(k=>k.t==='o');
    if(o){ e = e.filter(([id,v])=>v[o.f]!==undefined).sort((a,b)=> (a[1][o.f]<b[1][o.f]?-1:a[1][o.f]>b[1][o.f]?1:0) * (o.d==='desc'?-1:1)); }
    return {docs: e.map(([id,v])=>({id, data:()=>clone(v)}))};
  }
  function docRef(c, id){
    return {
      async get(){ return wrapDoc(c,id); },
      async set(val, opts){ coll(c)[id] = (opts && opts.merge) ? Object.assign({}, coll(c)[id]||{}, clone(val)) : clone(val); notify(); },
      async update(val){ coll(c)[id] = Object.assign({}, coll(c)[id]||{}, clone(val)); notify(); },
      async delete(){ delete coll(c)[id]; notify(); },
      onSnapshot(cb){ const l=()=>cb(wrapDoc(c,id)); listeners.add(l); setTimeout(l,0); return ()=>listeners.delete(l); }
    };
  }
  function collectionRef(name, cons){
    cons = cons || [];
    return {
      doc(id){ return docRef(name, id); },
      where(f,op,v){ return collectionRef(name, cons.concat([{t:'w',f,op,v}])); },
      orderBy(f,d){ return collectionRef(name, cons.concat([{t:'o',f,d}])); },
      async get(){ return runQuery(name, cons); },
      onSnapshot(cb){ const l=()=>cb(runQuery(name, cons)); listeners.add(l); setTimeout(l,0); return ()=>listeners.delete(l); }
    };
  }
  // 예시 데이터 채우기
  SEED_EMPLOYEES.filter(n=>!SEED_EMPLOYEES_SKIP.has(n)).forEach((n,i)=>{
    const team = i<8 ? '1' : '2';
    coll('employees')['e'+pad2(i+1)] = {name:n, part:'STS', order:i+1, active:true, team, teamOrder: team==='1' ? i+1 : i-7};
  });
  SEED_HOLIDAYS_2026.concat(SEED_HOLIDAYS_2027_2030).forEach(([d,n])=>{ coll('holidays')[d] = {date:d, name:n}; });
  STATUS_CODE_LIST.forEach(c=>{ coll('codeDefs')[c] = {code:c, label:CODE_LABELS[c]||''}; });
  const t = new Date();
  let ds = shiftMonth(dstr(t.getFullYear(), t.getMonth()+1, 1), -1);
  const nx = shiftMonth(dstr(t.getFullYear(), t.getMonth()+1, 1), 1).split('-').map(Number);
  const end = dstr(nx[0], nx[1], daysInMonth(nx[0], nx[1])); // 지난달~다음달까지 예시 기록
  let k = 0;
  while(ds <= end){
    const [y,m,d] = ds.split('-').map(Number);
    const w = new Date(y,m-1,d).getDay();
    Object.entries(coll('employees')).forEach(([id,e],i)=>{
      k++;
      const night = (d + i) % 4 >= 2;
      const off = (d + i*3) % 7 === 0;
      const rec = {date:ds, employeeId:id};
      if(off){ Object.assign(rec, {workCode:'OFF', statusCode: w===0 ? 'MCS' : (k%3 ? 'FC' : 'MC')}); }
      else if(night){ Object.assign(rec, {workCode:'N', checkIn:'19:00', checkOut: k%3 ? '7:00' : '8:00', yasik: k%2===0}); }
      else { Object.assign(rec, {workCode:'D', checkIn:'8:00', checkOut: k%4 ? '17:00' : '20:00', jungsik: k%5===0}); }
      if(k%11===0){ rec.supportIn = '19:00'; rec.supportOut = '24:00'; }
      if(!off && k%9===0){ rec.attCode = night ? 'ND' : 'DN'; } // 예시: 근태코드 칸에 입력된 지원근무
      coll('attendance')[ds+'_'+id] = rec;
    });
    ds = addDays(ds, 1);
  }
  coll('meta').seed = {seededAt:1};
  return {
    collection(name){ return collectionRef(name); },
    doc(path){ const [c,id] = path.split('/'); return docRef(c,id); },
    async exportAll(){ return clone(store); },
    async importAll(data){ let n=0; Object.entries(data||{}).forEach(([c,docs])=> Object.entries(docs||{}).forEach(([id,v])=>{ coll(c)[id] = Object.assign({}, coll(c)[id]||{}, clone(v)); n++; })); notify(); return n; }
  };
}

async function initDb(){
  const statusEl = document.getElementById('dbStatus');
  statusEl.innerHTML = '<span class="dot off"></span><span>서버 연결 중…</span>';
  try{
    await loadFirebase();
    db = createFirebaseDb();
  }catch(e){ db = null; console.error(e); }
  if(!db && !LIVE_HOSTS.includes(location.hostname)){
    // 미리보기 모드: 예시 데이터 + 편집 가능(저장은 안 됨)
    demoMode = true;
    db = createDemoDb();
    dbReady = true; authResolved = true; canEdit = true; userRole = 'all';
    updateStatusBar(); updateNavForRole();
    subscribeAll();
    render();
    return;
  }
  if(!db){
    dbReady = false;
    updateStatusBar();
    render();
    return;
  }
  dbReady = true;
  updateStatusBar();
  subscribeAll();
  fb.authM.onAuthStateChanged(fb.auth, user=>{
    currentUser = user;
    userRole = user ? roleOfEmail(user.email) : null;
    canEdit = roleCanEdit(VIEW);
    const first = !authResolved;
    authResolved = true;
    updateStatusBar();
    updateNavForRole();
    if(!roleCanSee(VIEW)) setView('combined'); // 볼 수 없는 화면이면 근태관리로
    else render();
    if(userRole) afterEditorLogin();
  });
}
// 편집자 로그인 직후: 클라우드가 비어 있으면 이전 브라우저 데이터를 올리거나 기본값을 채움
let editorSetupDone = false;
async function afterEditorLogin(){
  if(editorSetupDone) return;
  editorSetupDone = true;
  try{
    const marker = await db.doc('meta/seed').get();
    if(!marker.exists){
      const old = oldLocalData();
      const nAtt = old ? Object.keys(old.attendance||{}).length : 0;
      const nEmp = old ? Object.keys(old.employees||{}).length : 0;
      if(old && (nAtt || nEmp)){
        appConfirm(`클라우드가 아직 비어 있습니다. 이 브라우저에 이전 버전 데이터(직원 ${nEmp}명·출퇴근 ${nAtt}건)가 있는데, 클라우드로 올릴까요? (취소하면 기본 명단으로 시작합니다)`, async ()=>{
          await uploadData(old);
          trySeed();
        });
        // 취소한 경우를 대비해 잠시 뒤 기본값 채우기 (올리기를 선택했으면 marker가 생겨 건너뜀)
        setTimeout(async ()=>{ const m = await db.doc('meta/seed').get(); if(!m.exists && !document.getElementById('appConfirmOverlay')) trySeed(); }, 30000);
        return;
      }
    }
  }catch(e){}
  trySeed();
}
async function uploadData(data){
  showToast('클라우드로 올리는 중…');
  try{
    const n = await db.importAll(data, (done, total)=> showToast(`클라우드로 올리는 중… ${done}/${total}`));
    showToast(`${n}건을 클라우드에 올렸습니다.`);
    return true;
  }catch(e){
    showToast(saveErrMsg('올리기에 실패했습니다.', e));
    return false;
  }
}

async function trySeed(){
  if(!db || !userRole) return;
  try{
    const marker = await db.doc('meta/seed').get();
    if(!marker.exists){
      for(let i=0;i<SEED_EMPLOYEES.length;i++){
        if(SEED_EMPLOYEES_SKIP.has(SEED_EMPLOYEES[i])) continue;
        await db.collection('employees').doc('e'+pad2(i+1)).set({name:SEED_EMPLOYEES[i], part:'STS', order:i+1, active:true, union:'1', team:'', teamRole:'조원', teamOrder:i+1, teamNote:''});
      }
      for(const [d,n] of SEED_HOLIDAYS_2026){
        await db.collection('holidays').doc(d).set({date:d, name:n});
      }
      await db.doc('meta/seed').set({seededAt: Date.now()});
    }
    // 근태코드 실제 의미(코드표) 반영 - 최초 1회만 채움, 이후 사용자가 참조표에서 수정한 값은 덮어쓰지 않음
    const codeMarker = await db.doc('meta/codeLabelsV2').get();
    if(!codeMarker.exists){
      for(const c of STATUS_CODE_LIST){
        await db.collection('codeDefs').doc(c).set({code:c, label:CODE_LABELS[c]||''});
      }
      await db.doc('meta/codeLabelsV2').set({seededAt: Date.now()});
    }
    // 노조 소속 기본값(원본 노조 시트 기준 전원 1조) - 기존에 union 필드가 없던 직원에 한해 1회만 채움
    const unionMarker = await db.doc('meta/unionSeedV1').get();
    if(!unionMarker.exists){
      const empSnap = await db.collection('employees').get();
      for(const d of empSnap.docs){
        if(d.data().union==null){
          await db.collection('employees').doc(d.id).update({union:'1'});
        }
      }
      await db.doc('meta/unionSeedV1').set({seededAt: Date.now()});
    }
    // 조편성 순번/직책 수기 입력 반영 (사용자 지정: 1조 서인기1번(조장)·김성용2번(조원)·김기영3번(조원))
    const teamMarker = await db.doc('meta/teamOrderSeedV1').get();
    if(!teamMarker.exists){
      const teamData = {'서인기':{team:'1',teamOrder:1,teamRole:'조장'}, '김성용':{team:'1',teamOrder:2,teamRole:'조원'}, '김기영':{team:'1',teamOrder:3,teamRole:'조원'}};
      const empSnap2 = await db.collection('employees').get();
      for(const d of empSnap2.docs){
        const nm = d.data().name;
        if(teamData[nm]){
          await db.collection('employees').doc(d.id).update(teamData[nm]);
        }
      }
      await db.doc('meta/teamOrderSeedV1').set({seededAt: Date.now()});
    }
    // 2027~2030 공휴일: 없는 날짜만 1회 추가
    const holMarker = await db.doc('meta/holidaySeed2030').get();
    if(!holMarker.exists){
      for(const [d,n] of SEED_HOLIDAYS_2027_2030){ if(!holidays[d]) await db.collection('holidays').doc(d).set({date:d, name:n}); }
      await db.doc('meta/holidaySeed2030').set({seededAt: Date.now()});
    }
    // (삭제·이름변경한 직원이 되살아나던 '기본 명단 강제 보충' 로직은 제거함)
  }catch(e){ /* 동시 시딩 등은 무시 */ }
}

let recentlyDeleted = {}; // key -> timestamp, 삭제 직후 지연 도착한 스냅샷이 데이터를 되살리는 것을 잠깐 방지
function markRecentlyDeleted(key){
  recentlyDeleted[key] = Date.now();
  setTimeout(()=>{ if(recentlyDeleted[key]) delete recentlyDeleted[key]; }, 8000);
}
// 출퇴근 기록: 필요한 달만 실시간 구독하고(읽기 비용 절약), 모든 화면이 하나의 공유 캐시를 사용.
// 저장은 항상 '해당 화면이 다루는 항목만 병합(merge)'하므로, 캐시에 없던 기록도 덮어써지지 않음.
const attStore = {};
attendance = attStore; codeStatsAttendance = attStore; otMatrixAttendance = attStore;
const ATT_DEFAULTS = {workCode:'OFF', statusCode:'', note:'', extCode:false, manguen:false};
function normAtt(v){ return Object.assign({}, ATT_DEFAULTS, v); }
const monthSubs = new Map(); // 'YYYY-MM' -> unsubscribe
const MONTH_SUB_MAX = 18;
function nextYm(ym){ const [y,m] = ym.split('-').map(Number); return m===12 ? `${y+1}-01` : `${y}-${pad2(m+1)}`; }
function ensureAttendanceRange(start, end){
  if(!db || !start || !end) return;
  if(end < start) [start, end] = [end, start];
  start = addDays(start, -6); // 토요일 만근 판정에 필요한 그 주 월~금 기록까지
  let ym = start.slice(0,7), guard = 0;
  const endYm = end.slice(0,7);
  while(ym <= endYm && guard++ < 15){ ensureMonth(ym); ym = nextYm(ym); }
}
function ensureMonth(ym){
  if(monthSubs.has(ym)){ const fn = monthSubs.get(ym); monthSubs.delete(ym); monthSubs.set(ym, fn); return; }
  const [y,m] = ym.split('-').map(Number);
  const fn = db.collection('attendance').where('date','>=',ym+'-01').where('date','<=',dstr(y,m,daysInMonth(y,m)))
    .onSnapshot(snap=>{
      const seen = new Set(), now = Date.now();
      snap.docs.forEach(d=>{
        const delAt = recentlyDeleted[d.id];
        if(delAt && now - delAt < 8000) return; // 방금 삭제한 기록은 잠깐 무시
        seen.add(d.id);
        attStore[d.id] = normAtt(d.data());
      });
      Object.keys(attStore).forEach(k=>{ if(k.startsWith(ym) && !seen.has(k)) delete attStore[k]; });
      mergeExcelAtt(ym);
      scheduleRender();
    }, dbErr);
  monthSubs.set(ym, fn);
  while(monthSubs.size > MONTH_SUB_MAX){
    const [oldYm, oldFn] = monthSubs.entries().next().value;
    oldFn(); monthSubs.delete(oldYm);
    Object.keys(attStore).forEach(k=>{ if(k.startsWith(oldYm)) delete attStore[k]; });
  }
}
function ensureForView(){
  if(!dbReady) return;
  if(VIEW==='input' || VIEW==='input2'){ const d = (prefill && prefill.date) || inputViewDate || todayStr(); ensureAttendanceRange(d, d); }
  else if(VIEW==='grid'){ const d = dstr(curYear,curMonth,1); ensureAttendanceRange(d, d); }
  else if(VIEW==='combined' || VIEW==='codestats'){
    if(codeStatsStart && codeStatsEnd) ensureAttendanceRange(codeStatsStart, codeStatsEnd);
    if(VIEW==='combined' && combinedYm){ const d = dstr(combinedYm.y, combinedYm.m, 1); ensureAttendanceRange(d, d); }
    if(VIEW==='combined' && leaveEmpId && leaveYear) ensureAttendanceRange(`${leaveYear}-01-01`, `${leaveYear}-12-31`);
  }
  else if(VIEW==='ot'){ if(otMatrixStart && otMatrixEnd) ensureAttendanceRange(otMatrixStart, otMatrixEnd); }
  else if(VIEW==='mail'){ const mr = mailRangeNow(); ensureAttendanceRange(mr.start, mr.end); }
  else if(VIEW==='pay'){ if(payYm){ const [a,b] = payPeriodRange(payYm.y, payYm.m); ensureAttendanceRange(a, b); } }
  else if(VIEW==='dispatch'){ const d = dispatchDate || todayStr(); ensureAttendanceRange(d, d); if(codeStatsStart && codeStatsEnd) ensureAttendanceRange(codeStatsStart, codeStatsEnd); }
}

// partial: 이 화면이 다루는 항목만(date, employeeId 필수). 서버에는 병합 저장되어 다른 항목은 보존됨.
// 원본(내장) 기록을 처음 고칠 때는 원본 내용 전체를 함께 저장(고치지 않은 칸이 사라지지 않게)
function withEmbedded(partial){
  const cur = attStore[partial.date+'_'+partial.employeeId];
  if(!cur || !cur._emb) return partial;
  const base = Object.assign({}, cur); delete base._emb;
  return Object.assign(base, partial);
}
async function saveAttendance(partial){
  if(!requireEdit()) return;
  partial = withEmbedded(partial);
  const key = partial.date+'_'+partial.employeeId;
  attStore[key] = normAtt(Object.assign({}, attStore[key]||{}, partial, {_emb:false})); // 낙관적 로컬 업데이트
  render();
  try{
    await db.collection('attendance').doc(key).set(partial, {merge:true});
    showToast('저장되었습니다.');
  }catch(err){
    showToast(saveErrMsg('저장에 실패했습니다.', err));
  }
}

let renderScheduled = false, renderDeferred = false;
function isEditingField(){
  const a = document.activeElement;
  if(!a) return false;
  const content = document.getElementById('content');
  if(!content || !content.contains(a)) return false;
  if(a.tagName==='TEXTAREA' || a.tagName==='SELECT') return true;
  if(a.tagName==='INPUT'){ const t=(a.type||'').toLowerCase(); return !['checkbox','radio','button','submit','reset','file'].includes(t); }
  return false;
}
function scheduleRender(){
  if(renderScheduled) return;
  renderScheduled = true;
  setTimeout(()=>{
    renderScheduled = false;
    if(isEditingField()){ renderDeferred = true; return; }
    render();
  }, 0);
}
document.addEventListener('focusout', ()=>{
  if(!renderDeferred) return;
  setTimeout(()=>{ if(renderDeferred && !isEditingField()){ renderDeferred = false; render(); } }, 0);
});
function render(){

let inputTeam = (()=>{ try{ return localStorage.getItem('snct_input_team')||'1'; }catch(e){ return '1'; } })();
let inputDraft = {}; // `${date}|${empId}` -> {field: 값} (저장 전 입력 내용)
const IN_TIME = ['checkIn','checkOut','supportIn','supportOut'];
const IN_NUM = ['honjoComp','tajoComp'];
const IN_CHK = ['jochul','seokchul','jungsik','yasik','damdang','extCode']; // extCode = 연근(휴일 2배·평일 전체 1.5배)
// 엑셀식 시각 표기 ↔ 저장 형식: 8 → 8:00, 15.3 → 15:30, 7.3 → 7:30 (15:30 도 가능)
function hmToExcel(hm){ if(!hm) return ''; const [h,m] = hm.split(':'); return Number(m) ? `${Number(h)}.${String(m).replace(/0$/,'')}` : String(Number(h)); }
function excelToHm(v){
  v = String(v||'').trim(); if(!v) return '';
  const p = v.split(/[.:]/); const h = Number(p[0]);
  let m = p[1]===undefined || p[1]==='' ? 0 : (p[1].length===1 ? Number(p[1])*10 : Number(p[1].slice(0,2)));
  if(!Number.isFinite(h) || !Number.isFinite(m) || h<0 || h>30 || m<0 || m>59) return null;
  return `${h}:${String(m).padStart(2,'0')}`;
}
function inputRowRec(date, e){
  const base = attStore[date+'_'+e.id] || {};
  const d = inputDraft[date+'|'+e.id] || {};
  const r = Object.assign({}, base, {employeeId:e.id, date});
  IN_TIME.forEach(f=>{ if(d[f]!==undefined){ const hm = excelToHm(d[f]); r[f] = hm===null ? '' : hm; } });
  IN_NUM.forEach(f=>{ if(d[f]!==undefined) r[f] = d[f]; });
  IN_CHK.forEach(f=>{ if(d[f]!==undefined) r[f] = !!d[f]; });
  return normAtt(r);
}
function inputRowTotal(date, e){
  const r = inputRowRec(date, e);
  const c = computeDaily(r, date), sp = computeSupportDaily(r, date), m = computeMealAllowance(r) + computeDamdang(r);
  return (c.valid?c.premium:0) + (sp.valid?sp.premium:0) + m;
}

// 조장 근태관리에서 날짜·조별로 [마감] → 배포용(로그인 안 한) 출퇴근 입력에서는 그날 그 조를 수정할 수 없음. 조장·UNION은 계속 수정 가능
let inputClose = {}; // `${date}_${team}` -> {closed:true, at}
function subscribeInputClose(){
  if(!db || demoMode || unsub.inputClose) return;

}
function isInputClosed(date, team){ const c = inputClose[date+'_'+team]; return !!(c && c.closed); }
function isLeaderUser(){ return userRole==='leader' || userRole==='union' || userRole==='all'; }
// 마감되면 배포용 '출퇴근 입력'은 누구든(조장·UNION 로그인 상태여도) 잠김 → 수정은 '조장 근태관리'에서만
function inputLocked(){ return VIEW==='input' && isInputClosed(inputViewDate || todayStr(), inputTeam); }
async function toggleInputClose(){

  const date = inputViewDate || todayStr(), team = inputTeam, id = date+'_'+team, now = isInputClosed(date, team);

function bindInputTable(el){

  dEl.onchange = ()=>{ if(dEl.value) go(dEl.value); };
  document.getElementById('inPrev').onclick = ()=> go(addDays(inputViewDate, -1));
  document.getElementById('inNext').onclick = ()=> go(addDays(inputViewDate, 1));
  el.querySelectorAll('[data-act="in-team"]').forEach(b=> b.onclick = ()=>{ inputTeam = b.dataset.team; try{ localStorage.setItem('snct_input_team', inputTeam); }catch(e){} render(); });
  const setDraft = (empId, f, v)=>{ const k = inputViewDate+'|'+empId; inputDraft[k] = Object.assign({}, inputDraft[k]||{}, {[f]: v}); };
  const refreshRow = (empId, inp)=>{
    const e = employees.find(x=>x.id===empId); const tr = inp.closest('tr'); if(!e || !tr) return;
    const tot = inputRowTotal(inputViewDate, e); const cell = tr.querySelector('.inTot'); if(cell) cell.textContent = tot ? fmtH(tot) : '';

/* ========================= 근태관리(통합: 집계+표) ========================= */
// 근태관리 집계(지원·휴일·평일 개수, OT, 조별 순번) — 근태관리 표와 배차표 OT순번에서 함께 사용
function combinedData(sortedEmployees, rangeStart, rangeEnd){
  let noAttCount = 0; // 근태코드 칸 정보 없이 저장된 기록 수(예전 버전으로 가져온 경우)
  const perEmp = sortedEmployees.map(e=>{
    let codeCnt = {FCH:0,MCH:0,MCS:0,FC:0,MC:0};
    let otHoliday=0, otWeekday=0, otExt=0, supDays=0, mealAllow=0;
    // 원본 기준: 코드·지원 일수는 시작일~종료일, OT는 시작일이 속한 주의 월요일부터 합산
    for(let ds=mondayOf(rangeStart); ds<=rangeEnd; ds=addDays(ds,1)){
      const rec = codeStatsAttendance[ds+'_'+e.id];
      if(ds >= rangeStart){
        const ec = effCode(rec, ds, String(e.name||'').trim());
        if(codeCnt.hasOwnProperty(ec)) codeCnt[ec]++;
        if(isSupportCode(ec)) supDays++;
      }
      if(!rec) continue;
      if(rec.attCode===undefined && ds<=IMPORT_LAST_DATE && (rec.checkIn || (rec.workCode && rec.workCode!=='OFF'))) noAttCount++;
      // 원본 26년_근태관리 기준: 휴일 OT = 휴일 근무 + 휴일 지원, 평일 OT = 평일 근무(토요 만근 특근 제외) + 식사
      const c = computeDaily(rec, ds);
      const sp = computeSupportDaily(rec, ds);
      const kc = dayCategory(ds, recManguen(rec, ds), rec && rec.employeeId);
      // 연근: 1조 휴일 OT에는 포함, 그 외(1조 평일, 2조 휴일·평일)는 제외(화면에는 표시하지 않음)
      const isHolCat = c.category==='일요일'||c.category==='공휴일', team1 = (e.team||'')==='1';
      if(c.valid){ if(rec.extCode && !(team1 && isHolCat)) otExt+=c.premium; else if(isHolCat) otHoliday+=c.premium; else if(c.category==='평일') otWeekday+=c.premium; }
      // 휴일 OT: 1조는 휴일 지원 포함, 2조는 지원 제외 / 평일 OT: 1·2조 모두 지원 제외(원래 미포함)
      if(sp.valid && (kc==='SU' || kc==='H') && team1) otHoliday += sp.premium;
      mealAllow += computeMealAllowance(rec);
    }
    const A2 = k => adjOf(e,k) + userAdjOf(e,k); // 기존 보정 + 직접 넣은 보정
    codeCnt.FCH += A2('fchAdj'); codeCnt.MCH += A2('mchAdj'); codeCnt.FC += A2('fcAdj'); codeCnt.MC += A2('mcAdj');
    codeCnt.MCS += A2('mcsAdj');
    const gyeHol = codeCnt.FCH+codeCnt.MCH + A2('holCntAdj'), gyeWk = codeCnt.FC+codeCnt.MC + A2('wkCntAdj');
    const otWeekdayFinal = otWeekday + (codeStatsIncludeMeal? mealAllow:0) + A2('wkAdj');
    // 원본처럼 보정값(지원·휴일·평일)을 더함 — 조편성 관리의 '근태관리 보정값'에서 입력
    return {emp:e, codeCnt, gyeHol, gyeWk, otHoliday: otHoliday + A2('holAdj'), otWeekdayFinal, otExt, supDays: supDays + A2('supAdj')};
  });
  // 순번 제외 대상은 순위 계산에서 빼고 칸을 비움(null)
  const inAll = r => rankExcl(r.emp)!=='all';
  const inOt = r => rankExcl(r.emp)==='';
  // 순번은 1조·2조 따로 매김(조가 없는 사람끼리도 따로)
  const teamOf = r => r.emp.team || '';
  function rankBy(getVal, desc, ok){
    const arr = new Array(perEmp.length).fill(null);
    const groups = {};
    perEmp.forEach((r,i)=>{ if(ok(r)) (groups[teamOf(r)] = groups[teamOf(r)] || []).push({i, v:getVal(r)||0}); });
    Object.values(groups).forEach(list=>{
      list.sort((a,b)=>(desc? b.v-a.v : a.v-b.v) || a.i-b.i).forEach((q,idx)=>{ arr[q.i] = idx+1; });
    });
    return arr;
  }
  const rankSup=rankBy(r=>r.supDays,false,inAll), rankGyeHol=rankBy(r=>r.gyeHol,false,inAll), rankMCS=rankBy(r=>r.codeCnt.MCS,false,inAll);
  const rankGyeWk=rankBy(r=>r.gyeWk,false,inAll), rankOtHol=rankBy(r=>r.otHoliday,true,inOt), rankOtWk=rankBy(r=>r.otWeekdayFinal,true,inOt), rankOtExt=rankBy(r=>r.otExt,true,inOt);
  const cntBy = ok => { const m = {}; perEmp.forEach(r=>{ if(ok(r)) m[teamOf(r)] = (m[teamOf(r)]||0) + 1; }); return m; };
  const nAllT = cntBy(inAll), nOtT = cntBy(inOt);
  return {perEmp, rankSup, rankGyeHol, rankMCS, rankGyeWk, rankOtHol, rankOtWk, rankOtExt, nAllT, nOtT, teamOf};
}
function pageCombined(){
  // ① 근태 집계: 시작일~종료일 기간 기준
  if(!codeStatsStart || !codeStatsEnd){
    const t = new Date();
    codeStatsStart = dstr(t.getFullYear(), t.getMonth()+1, 1);
    codeStatsEnd = dstr(t.getFullYear(), t.getMonth()+1, daysInMonth(t.getFullYear(), t.getMonth()+1));
  }
  // ② 월별 근태코드: 달력 한 달 기준
  if(!combinedYm){ const t = new Date(); combinedYm = {y:t.getFullYear(), m:t.getMonth()+1}; }
  const rangeStart = codeStatsStart, rangeEnd = codeStatsEnd;
  const sortedEmployees = employees.slice().filter(e=> !combinedTeamFilter || (e.team||'')===combinedTeamFilter).sort((a,b)=>{
    const ta = a.team||'9', tb = b.team||'9';
    if(ta!==tb) return ta<tb?-1:1;
    return (a.teamOrder||999)-(b.teamOrder||999);
  });

  const {perEmp, rankSup, rankGyeHol, rankMCS, rankGyeWk, rankOtHol, rankOtWk, rankOtExt, nAllT, nOtT, teamOf} = combinedData(sortedEmployees, rangeStart, rangeEnd);

  const statHead = `<tr>
    <th class="namehead" rowspan="2" style="min-width:34px;width:34px;">No</th><th class="namehead" rowspan="2" style="left:34px;">성명</th>
    <th colspan="2" class="gh g-blk sepL">지원근무</th>
    <th colspan="8" class="gh g-hol sepL">휴일,주야간</th>
    <th colspan="6" class="gh g-wk sepL">평일,주야간</th>
  </tr><tr>
    <th class="gc g-blk sepL">합계</th><th class="gc g-blk">순번</th>
    <th class="gc g-blue sepL">FCH</th><th class="gc g-blue">MCH</th><th class="gc g-blue">합계</th><th class="gc g-blue">순번</th><th class="gc g-red">MCS</th><th class="gc g-red">순번</th><th class="gc g-yel otCol">OT</th><th class="gc g-yel">순번</th>
    <th class="gc g-wk sepL">FC</th><th class="gc g-wk">MC</th><th class="gc g-wk">합계</th><th class="gc g-wk">순번</th><th class="gc g-pur otCol">OT</th><th class="gc g-pur">순번</th>
  </tr>`;
  const c0 = v => v||'';
  const nEmp = perEmp.length;
  // 순번 배지: 1~3위 진하게, 상위 절반 연하게, 나머지는 글자색만
  // 순번: 동그라미·강조색 없이 검은 숫자만(순번 칸 전체에 그룹 색을 칠함)
  const rk = (n, g, tot) => n==null ? '' : `<span class="rkPlain">${n}</span>`;
  const RC = g => `class="rkCol g-${g}" style="text-align:center;"`;
  // 순번 제외 대상은 숫자도 숨김: 전체 제외 → 모든 숫자, OT순번 제외 → OT 숫자만
  const statRows = perEmp.map((r,idx)=>{
    const ex = rankExcl(r.emp), hA = ex==='all', hO = ex!=='';
    const nAll = nAllT[teamOf(r)]||0, nOt = nOtT[teamOf(r)]||0;
    const v = x => hA ? '' : c0(x);
    const ot = x => hO ? '' : fmtH(x);
    // 누르면 보정 팝업: data-adj(보정 항목), data-raw(계산값)
    const A = (key, label, total, shown, extra) => `<td class="adjCell${extra||''}" data-act="adj" data-emp="${esc(r.emp.id)}" data-key="${key}" data-label="${esc(label)}" data-raw="${Math.round((total - userAdjOf(r.emp,key))*100)/100}" style="text-align:center;${key==='supAdj'?'font-weight:700;':''}${key==='holAdj'||key==='wkAdj'?'min-width:52px;':''}">${shown}</td>`;
    return `<tr>
      <td class="stNo" style="text-align:center;">${idx+1}</td>
      <td class="namecell nameLink stName" data-act="leave" data-emp="${esc(r.emp.id)}" title="연간 누계 보기">${esc(r.emp.name)}</td>
      ${A('supAdj','지원근무 합계', r.supDays, v(r.supDays), ' sepL')}<td ${RC('blk')}>${rk(rankSup[idx],'blk',nAll)}</td>
      ${A('fchAdj','FCH', r.codeCnt.FCH, v(r.codeCnt.FCH), ' sepL')}${A('mchAdj','MCH', r.codeCnt.MCH, v(r.codeCnt.MCH))}
      ${A('holCntAdj','휴일 합계', r.gyeHol, v(r.gyeHol))}<td ${RC('blue')}>${rk(rankGyeHol[idx],'blue',nAll)}</td>
      ${A('mcsAdj','MCS', r.codeCnt.MCS, v(r.codeCnt.MCS))}<td ${RC('red')}>${rk(rankMCS[idx],'red',nAll)}</td>
      ${A('holAdj','휴일 OT', r.otHoliday, ot(r.otHoliday))}<td ${RC('yel')}>${rk(rankOtHol[idx],'yel',nOt)}</td>
      ${A('fcAdj','FC', r.codeCnt.FC, v(r.codeCnt.FC), ' sepL')}${A('mcAdj','MC', r.codeCnt.MC, v(r.codeCnt.MC))}
      ${A('wkCntAdj','평일 합계', r.gyeWk, v(r.gyeWk))}<td ${RC('wk')}>${rk(rankGyeWk[idx],'wk',nAll)}</td>
      ${A('wkAdj','평일 OT', r.otWeekdayFinal, ot(r.otWeekdayFinal))}<td ${RC('pur')}>${rk(rankOtWk[idx],'pur',nOt)}</td>
    </tr>`;
  }).join('');

  // 월별 근태코드 표
  const {y:cy, m:cm} = combinedYm;
  const monthDays = Array.from({length:daysInMonth(cy,cm)}, (_,i)=>dstr(cy,cm,i+1));
  const TODAY = todayStr(); // 오늘 날짜 칸은 얇은 검은 테두리(매일 바뀜)
  const lastEmpId = sortedEmployees.length ? sortedEmployees[sortedEmployees.length-1].id : '';
  const dayHead = monthDays.map(ds=>{
    const d = Number(ds.slice(8,10));
    const cls = dayCellClass(ds, cy, cm, d);
    return `<th class="${cls} ${weekBand(ds)} dayHead${ds===TODAY?' todayCol todayTop':''}" data-act="daymemo" data-date="${esc(ds)}" title="${esc(holidays[ds]||'')}">${d}<br>${weekdayKr(cy,cm,d)}</th>`;
  }).join('');
  // 날짜별 근무 인원: 근태코드가 N·D·ND·DN 이거나 비어 있는(휴무 아님) 사람 수
  const WORK_SET = new Set(['N','D','ND','DN']);
  const countHead = monthDays.map(ds=>{
    const d = Number(ds.slice(8,10));
    const n = sortedEmployees.filter(e=>{ const dc = gridCode(codeStatsAttendance[ds+'_'+e.id], ds, String(e.name||'').trim()); return !dc || WORK_SET.has(dc); }).length;
    return `<th class="cntHead${ds===TODAY?' todayCol':''}" title="근무 인원(N·D·ND·DN·빈칸)">${n}</th>`;
  }).join('');
  const codeRows = sortedEmployees.map(e=>{
    const cells = monthDays.map(ds=>{
      const d = Number(ds.slice(8,10));
      const rec = codeStatsAttendance[ds+'_'+e.id];
      const cls = dayCellClass(ds, cy, cm, d);
      let inner = '', fill = '';
      const dc = gridCode(rec, ds, String(e.name||'').trim());
      {
        fill = dc ? codeFill(dc) : '';
        if(dc) inner = `<span class="mini" style="color:${fill ? codeFillText(dc) : codeColor(dc)};font-weight:800;">${esc(dc)}</span>`;
      }
      const memo = rec && rec.note ? String(rec.note) : '';
      return `<td class="daycell ${cls} ${weekBand(ds)}${fill?' filled':''}${ds===TODAY ? (' todayCol'+(e.id===lastEmpId?' todayBot':'')) : ''}" data-act="grid-cell" data-date="${esc(ds)}" data-emp="${esc(e.id)}"${fill?` style="background:${fill};"`:''}>${inner}</td>`;
    }).join('');
    return `<tr><td class="namecell">${esc(e.name)}</td>${cells}</tr>`;
  }).join('');

  const modal = gridEdit ? renderGridEditModal() : '';
