let teamDrag = null; // {id, fromTeam, target:{team, beforeId|null}}
function teamListOf(teamKey, excludeId){
  return employees.filter(e=>(e.team||'')===teamKey && e.id!==excludeId).sort((a,b)=>(a.teamOrder||999)-(b.teamOrder||999));
}
function clearTeamDropMarks(){
  document.querySelectorAll('.drop-before,.drop-after,.drop-into').forEach(x=>x.classList.remove('drop-before','drop-after','drop-into'));
}
function teamDragMove(clientX, clientY){
  if(!teamDrag) return;
  // 화면 가장자리 근처면 자동 스크롤
  const main = document.getElementById('content');
  const r = main.getBoundingClientRect();
  if(clientY < r.top + 50) main.scrollTop -= 12; else if(clientY > r.bottom - 50) main.scrollTop += 12;
  clearTeamDropMarks();
  const at = document.elementFromPoint(clientX, clientY);
  if(!at){ teamDrag.target = null; return; }
  const row = at.closest('tr[data-emp-row]');
  const zone = at.closest('[data-team-drop]');
  if(row && row.dataset.empRow !== teamDrag.id){
    const rr = row.getBoundingClientRect();
    const after = clientY > rr.top + rr.height/2;
    row.classList.add(after ? 'drop-after' : 'drop-before');
    const teamKey = row.closest('[data-team-drop]').dataset.teamDrop;
    const list = teamListOf(teamKey, teamDrag.id);
    const i = list.findIndex(e=>e.id===row.dataset.empRow);
    teamDrag.target = {team: teamKey, index: after ? i+1 : i};
  } else if(zone && !row){
    zone.classList.add('drop-into');
    teamDrag.target = {team: zone.dataset.teamDrop, index: teamListOf(zone.dataset.teamDrop, teamDrag.id).length};
  } else if(!row){
    teamDrag.target = null;
  }
}
function teamDragEnd(){
  if(!teamDrag) return;
  const {id, fromTeam, target} = teamDrag;
  teamDrag = null;
  clearTeamDropMarks();
  document.querySelectorAll('tr.dragging').forEach(x=>x.classList.remove('dragging'));
  document.body.classList.remove('team-dragging');
  if(!target) return;
  const me = employees.find(e=>e.id===id);
  if(!me) return;
  const updates = [];
  const dest = teamListOf(target.team, id);
  dest.splice(Math.max(0, Math.min(target.index, dest.length)), 0, me);
  dest.forEach((e,i)=>{ if((e.team||'')!==target.team || e.teamOrder!==i+1) updates.push({id:e.id, team:target.team, teamOrder:i+1}); });
  if(target.team !== fromTeam){
    teamListOf(fromTeam, id).forEach((e,i)=>{ if(e.teamOrder!==i+1) updates.push({id:e.id, team:fromTeam, teamOrder:i+1}); });
  }
  saveTeamOrders(updates);
}

    // 휴대폰: 한 번 탭=그 칸 입력, 꾹 누른 뒤 끌기=여러 칸 선택, 밀기=스크롤, 두 손가락=확대·축소

      if(dpTouch && !e.isPrimary){ clearTimeout(dpLongTimer); dpDown = null; dpSelDragging = false; return; }
      if(dpInlineCommit) dpInlineCommit(true); // 입력 중이던 칸 먼저 저장(글자 그대로 보임)
      dpDown = {td, x: e.clientX, y: e.clientY, moved: false};

        if(e.shiftKey && dpSel) extendTo(td); else selectOne(td);
        dpSelDragging = true;
        try{ dpTable.setPointerCapture(e.pointerId); }catch(err){}
      } else {
        clearTimeout(dpLongTimer);

      }
    };
    dpTable.onpointermove = (e)=>{
      if(!dpDown) return;
      if(!dpDown.moved && Math.hypot(e.clientX-dpDown.x, e.clientY-dpDown.y) > 8){
        dpDown.moved = true;
        if(dpTouch && !dpSelDragging){ clearTimeout(dpLongTimer); dpDown = null; return; } // 터치로 밀면 스크롤
      }
      if(dpSelDragging) extendTo(cellAt(e.clientX, e.clientY));
    };
    dpTable.onpointerup = (e)=>{
      clearTimeout(dpLongTimer);
      const d = dpDown; dpDown = null; const wasDrag = dpSelDragging; dpSelDragging = false;
      if(!d) return;
      // 휴대폰: 짧게 한 번 탭 = 그 칸 선택 + 바로 입력(키패드). 꾹 눌러 끌면 여러 칸 선택
      if(dpTouch && !d.moved && !d.long){ selectOne(d.td); dpStartTyping(d.td, null); }

    dpTable.addEventListener('touchmove', (ev)=>{ if(dpSelDragging && ev.touches.length===1) ev.preventDefault(); }, {passive:false});
    dpTable.addEventListener('touchstart', (ev)=>{ if(ev.touches.length>1){ clearTimeout(dpLongTimer); dpDown = null; dpSelDragging = false; } }, {passive:true});
    dpApplySel(); // 다시 그려도 선택 유지
  }
  if(dpPop){

//  · 휴일근로/휴일연장/휴일야간 : 일요일·공휴일에 '자기 조'로 근무한 시간

//  · 기타수당 : (보전 OT − 실 OT) × 통상시급
//  · 통상시급 = 월 통상임금 합계 ÷ 209 (원 단위 반올림), 수당은 10원 단위 반올림

const round10 = v => Math.round(v/10)*10;
// 명세서에서 직접 입력하는 금액 항목
const PAY_FIXED = [['base','기본급'],['tuition','학자금'],['longevity','근속수당'],['position','직책수당'],['tech','기술수당'],['hazard','고공(위험)수당'],['meal','식대'],['special','특근수당'],['keep','보전수당']];
const RATE_ITEMS = ['base','longevity','position','tech','hazard']; // 통상시급에 들어가는 항목
function payInfo(empId){
  const p = payroll[empId] || {};
  const sum = RATE_ITEMS.reduce((a,k)=> a + (Number(p[k])||0), 0);
  const wage = sum || Number(p.wageTotal) || 0;
  return {p, wage, rate: wage ? Math.round(wage/209) : 0};
}
// 명세서 시간 표기: 시간.분 (28.5시간 → 28.3 = 28시간 30분)
function hm(v){
  if(!v) return '';
  let h = Math.floor(v + 1e-9), m = Math.round((v - h) * 60);
  if(m===60){ h++; m = 0; }
  return m ? `${h}.${String(m).padStart(2,'0').replace(/0$/,'')}` : String(h);
}
function payAmounts(e, start, end){
  const pc = payCalc(e, start, end), info = payInfo(e.id), rate = info.rate;
  const a = {
    ext: rate ? round10(pc.extHours*rate*1.5) : 0,
    night: rate ? round10(pc.wkNight*rate*0.5) : 0,
    hol: rate ? round10((pc.holWork*1.5 + pc.holExtra)*rate) : 0,
    holOT: rate ? round10(pc.holOT*rate*2) : 0,
    holN: rate ? round10(pc.holNight*rate*0.5) : 0,
    etc: rate ? round10(pc.diff*rate) : 0
  };
  a.ot = a.ext + a.night + a.hol + a.holOT + a.holN + a.etc;
  const fixed = PAY_FIXED.reduce((x,[k])=> x + (Number(info.p[k])||0), 0);
  a.gross = a.ot + fixed;
  return {pc, info, rate, a};
}

function payCalc(e, start, end){
  let wk=0, ho=0, sp=0, meal=0;           // 월별 OT현황과 같은 묶음(보전 계산용)
  let holWork=0, holOT=0, holNight=0, holExtra=0, wkNight=0, wkGroupPrem=0;
  for(let ds=start; ds<=end; ds=addDays(ds,1)){
    const rec = attStore[ds+'_'+e.id]; if(!rec) continue;
    const c = computeDaily(rec, ds), p = computeSupportDaily(rec, ds), m = computeMealAllowance(rec) + computeDamdang(rec);
    if(c.valid){
      if(c.category==='일요일' || c.category==='공휴일'){
        ho += c.premium;
        holWork += c.totalWork - c.overtime; holOT += c.overtime; holNight += c.night;
        holExtra += c.premium - (c.totalWork*1.5 + c.overtime*0.5 + c.night*0.5); // 연근 등 추가분
      } else { wk += c.premium; wkNight += c.night; wkGroupPrem += c.premium; }
    }
    if(p.valid){
      const k = dayCategory(ds, recManguen(rec, ds), rec && rec.employeeId);
      if(k==='SU' || k==='H') ho += p.premium; else sp += p.premium;
      wkNight += p.supNight; wkGroupPrem += p.premium;
    }
    meal += m; wkGroupPrem += m;
  }
  const real = wk + ho + sp + meal;
  const guar = wk + Math.max(ho,60) + Math.max(sp,30) + meal;
  const extHours = Math.max((wkGroupPrem - wkNight*0.5) / 1.5, 0);
  return {real, guar, diff: Math.max(guar-real,0), extHours, wkNight, holWork, holOT, holNight, holExtra};
}

  const old = oldLocalData();
  const nOldAtt = old ? Object.keys(old.attendance||{}).length : 0, nOldEmp = old ? Object.keys(old.employees||{}).length : 0;
  return `
  <h2 class="pgttl">백업·복원</h2>
  <p class="pgsub">데이터는 클라우드(Firebase)에 저장되어 PC·휴대폰에서 실시간으로 함께 보입니다. 만일을 대비해 가끔 백업 파일을 내려받아 두세요.</p>
  <div class="panel">
    <h3>백업 파일 내려받기</h3>
    <p class="hint" style="margin:0 0 12px;">마지막 백업(이 기기 기준): <b>${esc(lbTxt)}</b></p>
    <button class="btn" id="backupExportBtn" ${db?'':'disabled'}>백업 파일 내려받기 (.json)</button>
  </div>
  <div class="panel editor-only">
    <h3>백업 파일 올리기</h3>
    <p class="hint" style="margin:0 0 12px;">백업 파일 안의 기록을 클라우드에 올립니다. <b>같은 기록은 파일 내용으로 덮어쓰고</b>, 파일에 없는 기록은 그대로 둡니다. 이전 버전(브라우저 저장) 백업 파일과 <b>엑셀 DB입력 가져오기 파일</b>도 여기서 올립니다.</p>
    <input type="file" id="backupImportFile" accept=".json,application/json" style="display:none;">
    <button class="btn warn ghost" id="backupImportBtn" ${db?'':'disabled'}>백업 파일 선택…</button>
  </div>
  ${(nOldAtt||nOldEmp) ? `<div class="panel editor-only">
    <h3>이 브라우저에 남아 있는 이전 데이터</h3>
    <p class="hint" style="margin:0 0 12px;">이전 버전에서 이 브라우저에 저장했던 데이터(직원 ${nOldEmp}명·출퇴근 ${nOldAtt.toLocaleString()}건)가 있습니다. 클라우드로 올릴 수 있습니다.</p>
    <button class="btn ghost" id="uploadOldLocalBtn">이전 데이터 클라우드로 올리기</button>
  </div>` : ''}`;
}
async function exportBackup(){
  if(!db) return;
  showToast('백업 파일 만드는 중…');
  let data;
  try{ data = await db.exportAll(); }catch(e){ showToast('백업에 실패했습니다. 인터넷 연결을 확인하세요.'); return; }
  const payload = {app:'SNCT근태관리', format:2, exportedAt:new Date().toISOString(), data};
  const blob = new Blob([JSON.stringify(payload)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `장비관리_백업_${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
  try{ localStorage.setItem(LAST_BACKUP_KEY, String(Date.now())); }catch(e){}
  showToast('백업 파일을 내려받았습니다.');
  if(VIEW==='backup') render();
}
function importBackupFile(file){
  if(!file || !db || !requireEdit()) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let obj;
    try{ obj = JSON.parse(reader.result); }catch(e){ showToast('올바른 백업 파일이 아닙니다.'); return; }
    if(obj && obj.kind==='attendanceByName'){ importAttendanceByName(obj); return; }
    const data = obj && obj.data ? obj.data : obj;
    if(!data || typeof data!=='object' || (!data.employees && !data.attendance)){
      showToast('장비관리 백업 파일이 아닙니다.'); return;
    }
    const n = Object.keys(data.attendance||{}).length, ne = Object.keys(data.employees||{}).length;
    const when = obj.exportedAt ? new Date(obj.exportedAt).toLocaleString('ko-KR') : '날짜 정보 없음';
    appConfirm(`백업(${when}, 직원 ${ne}명·출퇴근 ${n}건)을 클라우드에 올릴까요? 같은 기록은 파일 내용으로 덮어씁니다.`, ()=> uploadData(data));
  };
  reader.onerror = ()=> showToast('파일을 읽지 못했습니다.');
  reader.readAsText(file);
}
// 엑셀(DB입력) 출퇴근 가져오기: 성명으로 직원을 찾아 날짜별 기록에 병합 저장(근무코드·근태코드 등 다른 항목은 보존)
function importAttendanceByName(obj){
  const rows = Array.isArray(obj.rows) ? obj.rows : [];
  const byName = {};
  employees.forEach(e=>{ byName[String(e.name||'').trim()] = e.id; });
  const statusSet = refStatusCodes();
  const ALL_WORK = new Set(WORK_CODES.map(w=>w.code));
  const docs = {}, missing = {}, skippedCodes = {};
  let minD = null, maxD = null, nCode = 0;
  rows.forEach(r=>{
    const id = byName[String(r.name||'').trim()];
    if(!id){ missing[r.name] = (missing[r.name]||0) + 1; return; }
    const {name, code, workCheck, rawCode: _raw, ...fields} = r;
    // 근무코드·근태코드: 근태코드 화면에 있는 것만 반영
    // 근태코드 칸 원래 값은 항상 attCode로 저장(지원근무 일수 계산용 — 참조표·숨김 설정과 무관)
    fields.attCode = code || '';
    if(r.rawCode) fields.rawCode = r.rawCode; // 원본 코드(AV·RV 등 — 연가 누계용)
    if(code){
      if(ALL_WORK.has(code)){ fields.workCode = code; fields.statusCode = ''; nCode++; }
      else if(statusSet.has(code)){ fields.statusCode = code; fields.workCode = (workCheck && ALL_WORK.has(workCheck)) ? workCheck : 'OFF'; nCode++; }
      else {
        skippedCodes[code] = (skippedCodes[code]||0) + 1;
        if(workCheck && ALL_WORK.has(workCheck)){ fields.workCode = workCheck; }
      }
    } else if(workCheck && ALL_WORK.has(workCheck)){
      fields.workCode = workCheck; fields.statusCode = ''; nCode++;
    }
    if(Object.keys(fields).length <= 1) return; // date만 남으면 넣을 게 없음
    docs[r.date+'_'+id] = Object.assign(fields, {employeeId:id, updatedAt:Date.now()});
    if(!minD || r.date<minD) minD = r.date;
    if(!maxD || r.date>maxD) maxD = r.date;
  });
  const n = Object.keys(docs).length;
  const missTxt = Object.keys(missing).length ? ` 직원 명단에 없는 이름(${Object.entries(missing).map(([k,v])=>k+' '+v+'건').join(', ')})은 건너뜁니다.` : '';
  const skipTxt = Object.keys(skippedCodes).length ? ` 근태코드에 없는 코드(${Object.entries(skippedCodes).sort((a,b)=>b[1]-a[1]).map(([k,v])=>k+' '+v+'건').join(', ')})는 넣지 않습니다.` : '';
  if(!n){ showToast('넣을 기록이 없습니다.' + missTxt); return; }
  const codeTxt = obj.includesCodes ? ` 근무코드·근태코드 ${nCode.toLocaleString()}건도 함께 넣습니다.` : ' 근무코드·근태코드는 그대로 둡니다.';
  const empAdj = {}; let nAdj = 0;
  (Array.isArray(obj.adjust) ? obj.adjust : []).forEach(a=>{
    const id = byName[String(a.name||'').trim()];
    if(id){ empAdj[id] = {}; ['supAdj','holAdj','wkAdj','holCntAdj','mcsAdj','wkCntAdj'].forEach(f=>{ if(a[f]!==undefined) empAdj[id][f] = Number(a[f])||0; }); nAdj++; }
  });
  const hol = {};
  (Array.isArray(obj.holidays) ? obj.holidays : []).forEach(h=>{ if(h && h.date) hol[h.date] = {date:h.date, name:h.name||'공휴일'}; });
  const holTxt = Object.keys(hol).length ? ` 원본의 공휴일 ${Object.keys(hol).length}일도 공휴일 관리에 맞춰 넣습니다.` : '';
  const adjTxt = nAdj ? ` 근태관리 보정값(지원·휴일·평일) ${nAdj}명도 넣습니다.` : '';
  appConfirm(`엑셀 DB입력 기록 ${n.toLocaleString()}건(${minD} ~ ${maxD})을 넣을까요?${codeTxt}${holTxt}${adjTxt}${skipTxt}${missTxt}`,
    ()=>{ const up = {attendance: docs}; if(Object.keys(hol).length) up.holidays = hol; if(nAdj) up.employees = empAdj; uploadData(up); });
}
document.addEventListener('click', (e)=>{
  if(e.target.closest('#backupExportBtn')) exportBackup();
  else if(e.target.closest('#backupImportBtn')){ if(!requireEdit()) return; const f=document.getElementById('backupImportFile'); if(f){ f.value=''; f.click(); } }
  else if(e.target.closest('#uploadOldLocalBtn')){
    if(!requireEdit()) return;
    const old = oldLocalData(); if(!old) return;
    appConfirm('이 브라우저의 이전 데이터를 클라우드로 올릴까요? 같은 기록은 덮어씁니다.', ()=> uploadData(old));
  }
});
document.addEventListener('change', (e)=>{
  if(e.target && e.target.id==='backupImportFile') importBackupFile(e.target.files && e.target.files[0]);
});
