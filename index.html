/* ========================= 이벤트 바인딩 ========================= */
function afterRender(){
  const el = document.getElementById('content');

  el.querySelectorAll('[data-act="goto-grid"]').forEach(x=>x.onclick=(e)=>{ e.preventDefault(); setView('grid'); });
  el.querySelectorAll('[data-act="team-filter"]').forEach(x=>x.onclick=()=>{ combinedTeamFilter = x.dataset.team; render(); });
  el.querySelectorAll('[data-act="teamot-filter"]').forEach(x=>x.onclick=()=>{ teamOtFilter = x.dataset.team; render(); });

  // 입력 폼
  const form = document.getElementById('attForm');
  if(form){
    form.onsubmit = (e)=>{
      e.preventDefault();
      const f = new FormData(form);
      const key = f.get('date')+'_'+f.get('employeeId');
      const existing = attendance[key];
      const checkInVal = readTimeSelect(f,'checkIn');
      // 근무코드가 아직 월별표에서 지정 안 된 경우, 계산 미리보기와 동일하게 체크인 시각으로 D/N을 추정해서 저장
      // 근무코드(D/N 등)는 자동 추정하지 않고 항상 근태관리 그리드에서 수동으로만 지정한다
      // 이 화면이 다루는 항목만 저장(근무코드·근태코드·만근·비고는 월별표에서 관리하므로 건드리지 않음)
      const rec = {
        date: f.get('date'), employeeId: f.get('employeeId'),
        checkIn: checkInVal, checkOut: readTimeSelect(f,'checkOut'),
        supportIn: readTimeSelect(f,'supportIn'), supportOut: readTimeSelect(f,'supportOut'),
        honjoComp: f.get('honjoComp')||'', tajoComp: f.get('tajoComp')||'',
        jochul: !!f.get('jochul'), seokchul: !!f.get('seokchul'), jungsik: !!f.get('jungsik'),
        yasik: !!f.get('yasik'), updatedAt: Date.now()
      };
      if(!rec.date || !rec.employeeId){ showToast('날짜와 직원을 선택하세요.'); return; }
      curYear = Number(rec.date.slice(0,4)); curMonth = Number(rec.date.slice(5,7));
      if(dbReady) subscribeAttendanceMonth(curYear,curMonth);
      saveAttendance(rec);
    };
    const dateEl = document.getElementById('fDate'), empEl = document.getElementById('fEmp');
    const emp1El = document.getElementById('fEmp1'), emp2El = document.getElementById('fEmp2');
    const reload = ()=>{ prefill = {date: dateEl.value, employeeId: empEl.value}; render(); };
    dateEl.onchange = reload;
    if(emp1El) emp1El.onchange = ()=>{ if(emp1El.value){ empEl.value = emp1El.value; reload(); } };
    if(emp2El) emp2El.onchange = ()=>{ if(emp2El.value){ empEl.value = emp2El.value; reload(); } };
    const delBtn = document.getElementById('delRecBtn');
    if(delBtn) delBtn.onclick = ()=>{
      appConfirm('이 기록을 초기화할까요? 입력된 모든 값이 지워집니다.', ()=>{
        const d = dateEl.value, emp = empEl.value;
        prefill = {date: d, employeeId: emp}; // 초기화 후에도 같은 날짜·직원 화면을 유지
        deleteAttendanceRec(d, emp);
      });
    };
    const updatePreview = ()=>{
      const f = new FormData(form);
      const curRec = attendance[f.get('date')+'_'+f.get('employeeId')];
      const common = {extCode: !!(curRec&&curRec.extCode), yasik: !!f.get('yasik'), manguen: !!(curRec&&curRec.manguen),
        jochul: !!f.get('jochul'), seokchul: !!f.get('seokchul'), jungsik: !!f.get('jungsik')};
      const checkInVal = readTimeSelect(f,'checkIn');
      // 근무코드가 아직 월별표에서 지정 안 된 경우, 미리보기용으로만 체크인 시각을 보고 주간(D)/야간(N)을 추정
      // 미리보기 계산용으로만 체크인 시각을 보고 D/N을 추정(실제 저장 데이터는 건드리지 않음)
      let previewWorkCode = curRec && curRec.workCode && curRec.workCode!=='OFF' ? curRec.workCode : '';
      if(!previewWorkCode && checkInVal && !(curRec && curRec.statusCode)){
        const hh = Number(checkInVal.split(':')[0]);
        previewWorkCode = hh<=14 ? 'D' : 'N';
      }
      previewWorkCode = previewWorkCode || 'OFF';
      const tmp = Object.assign({workCode:previewWorkCode, checkIn:checkInVal, checkOut:readTimeSelect(f,'checkOut')}, common);
      const supTmp = Object.assign({supportIn:readTimeSelect(f,'supportIn'), supportOut:readTimeSelect(f,'supportOut'), honjoComp:f.get('honjoComp'), tajoComp:f.get('tajoComp')}, common);
      const c = computeDaily(tmp, f.get('date'));
      const s = computeSupportDaily(supTmp, f.get('date'));
      const meal = computeMealAllowance(common);
      const box = document.getElementById('otPreview');
      if(!c.valid && !s.valid && meal===0){ box.innerHTML = '<div class="hint">출퇴근 시각을 입력하면 예상 근무시간이 계산됩니다.</div>'; return; }
      const wkPremium = (c.valid && (c.category==='평일'||c.category==='토요일')) ? c.premium : 0;
      const hoPremium = (c.valid && (c.category==='일요일'||c.category==='공휴일')) ? c.premium : 0;
      const spPremium = s.valid ? s.premium : 0;
      const total = wkPremium + hoPremium + spPremium + meal;
      box.innerHTML = `<div class="panel" style="background:var(--accent-soft);border-color:var(--accent-line);margin-bottom:0;">
        <h3 style="margin-bottom:8px;">계산 미리보기${c.valid?` (${esc(c.category)})`:''}</h3>
        <div class="cards" style="margin-bottom:0;">
          <div class="card"><div class="n">${fmtH(c.totalWork)}</div><div class="l">실근무시간</div></div>
          <div class="card"><div class="n">${fmtH(wkPremium)}</div><div class="l">평일</div></div>
          <div class="card"><div class="n">${fmtH(hoPremium)}</div><div class="l">휴일</div></div>
          <div class="card"><div class="n">${fmtH(spPremium)}</div><div class="l">지원</div></div>
          <div class="card"><div class="n">${fmtH(meal)}</div><div class="l">식사</div></div>
          <div class="card"><div class="n">${fmtH(total)}</div><div class="l">총 가산시간</div></div>
        </div>
      </div>`;
    };
    form.querySelectorAll('[name="checkInH"],[name="checkInM"],[name="checkOutH"],[name="checkOutM"],[name="date"],[name="supportInH"],[name="supportInM"],[name="supportOutH"],[name="supportOutM"],[name="honjoComp"],[name="tajoComp"],[name="jochul"],[name="seokchul"],[name="jungsik"],[name="yasik"]').forEach(x=>{ x.addEventListener('input',updatePreview); x.addEventListener('change',updatePreview); });
    updatePreview();
  }
  el.querySelectorAll('[data-act="edit-rec"]').forEach(x=>x.onclick=()=>{
    prefill = {date:x.dataset.date, employeeId:x.dataset.emp}; render();
  });

  // 월별 OT현황: 임금월(26일~25일) 이동
  const prevPayMonth = document.getElementById('prevPayMonth'), nextPayMonth = document.getElementById('nextPayMonth');
  if(prevPayMonth) prevPayMonth.onclick = ()=>{
    otPayMonth--; if(otPayMonth<1){ otPayMonth=12; otPayYear--; }
    [otMatrixStart, otMatrixEnd] = payPeriodRange(otPayYear, otPayMonth);
    if(dbReady) subscribeOtMatrixRange(otMatrixStart, otMatrixEnd);
    render();
  };
  if(nextPayMonth) nextPayMonth.onclick = ()=>{
    otPayMonth++; if(otPayMonth>12){ otPayMonth=1; otPayYear++; }
    [otMatrixStart, otMatrixEnd] = payPeriodRange(otPayYear, otPayMonth);
    if(dbReady) subscribeOtMatrixRange(otMatrixStart, otMatrixEnd);
    render();
  };
  el.querySelectorAll('[data-act="ot-team-filter"]').forEach(x=>x.onclick=()=>{ otTeamFilter = x.dataset.team; render(); });
  el.querySelectorAll('[data-act="dispatch-team-filter"]').forEach(x=>x.onclick=()=>{ dispatchTeamFilter = x.dataset.team; render(); });
  el.querySelectorAll('[data-act="ot-cell-detail"]').forEach(x=>x.onclick=()=>{
    prefill = {date: x.dataset.date, employeeId: x.dataset.emp};
    setView('input');
  });
  // 작업기간 직접수정
  const otRangeStartInput = document.getElementById('otRangeStartInput'), otRangeEndInput = document.getElementById('otRangeEndInput');
  if(otRangeStartInput) otRangeStartInput.onchange = ()=>{
    otMatrixStart = otRangeStartInput.value;
    if(otMatrixStart > otMatrixEnd) otMatrixEnd = otMatrixStart;
    if(dbReady) subscribeOtMatrixRange(otMatrixStart, otMatrixEnd);
    render();
  };
  if(otRangeEndInput) otRangeEndInput.onchange = ()=>{
    otMatrixEnd = otRangeEndInput.value;
    if(otMatrixEnd < otMatrixStart) otMatrixStart = otMatrixEnd;
    if(dbReady) subscribeOtMatrixRange(otMatrixStart, otMatrixEnd);
    render();
  };

  // 그리드
  const prevM = document.getElementById('prevMonth'), nextM = document.getElementById('nextMonth');
  if(prevM) prevM.onclick = ()=>{
    if(VIEW==='combined'){
      [codeStatsStart, codeStatsEnd] = shiftRangeMonth(codeStatsStart, codeStatsEnd, -1);
      if(dbReady) subscribeCodeStatsRange(codeStatsStart, codeStatsEnd);
      render(); return;
    }
    curMonth--; if(curMonth<1){curMonth=12;curYear--;} if(dbReady) subscribeAttendanceMonth(curYear,curMonth); render();
  };
  if(nextM) nextM.onclick = ()=>{
    if(VIEW==='combined'){
      [codeStatsStart, codeStatsEnd] = shiftRangeMonth(codeStatsStart, codeStatsEnd, 1);
      if(dbReady) subscribeCodeStatsRange(codeStatsStart, codeStatsEnd);
      render(); return;
    }
    curMonth++; if(curMonth>12){curMonth=1;curYear++;} if(dbReady) subscribeAttendanceMonth(curYear,curMonth); render();
  };
  const codeStatsMealChk = document.getElementById('codeStatsMealChk');
  if(codeStatsMealChk) codeStatsMealChk.onchange = ()=>{ codeStatsIncludeMeal = codeStatsMealChk.checked; render(); };
  const codeStatsStartInput = document.getElementById('codeStatsStartInput'), codeStatsEndInput = document.getElementById('codeStatsEndInput');
  if(codeStatsStartInput) codeStatsStartInput.onchange = ()=>{
    codeStatsStart = codeStatsStartInput.value;
    if(codeStatsStart > codeStatsEnd) codeStatsEnd = codeStatsStart;
    if(dbReady) subscribeCodeStatsRange(codeStatsStart, codeStatsEnd);
    render();
  };
  if(codeStatsEndInput) codeStatsEndInput.onchange = ()=>{
    codeStatsEnd = codeStatsEndInput.value;
    if(codeStatsEnd < codeStatsStart) codeStatsStart = codeStatsEnd;
    if(dbReady) subscribeCodeStatsRange(codeStatsStart, codeStatsEnd);
    render();
  };
  el.querySelectorAll('[data-act="grid-cell"]').forEach(x=>x.onclick=()=>{
    if(!canEdit){ requireEdit(); return; }
    gridEdit = {date:x.dataset.date, employeeId:x.dataset.emp};
    render();
  });
  const gCode = document.getElementById('gridCode');
  const gDropdown = document.getElementById('gridCodeDropdown');
  if(gCode && gDropdown){
    const showDropdown = ()=>{ gDropdown.style.display = 'block'; };
    const hideDropdown = ()=>{ gDropdown.style.display = 'none'; };
    const filterDropdown = ()=>{
      const q = gCode.value.trim().toLowerCase();
      gDropdown.querySelectorAll('.gridCodeOpt').forEach(el=>{
        el.style.display = (!q || el.dataset.search.includes(q)) ? 'flex' : 'none';
      });
    };
    gCode.addEventListener('focus', ()=>{ filterDropdown(); showDropdown(); });
    gCode.addEventListener('click', ()=>{ filterDropdown(); showDropdown(); });
    gCode.addEventListener('input', ()=>{ filterDropdown(); showDropdown(); });
    gDropdown.querySelectorAll('.gridCodeOpt').forEach(opt=>{
      opt.onclick = ()=>{ gCode.value = opt.dataset.code; hideDropdown(); };
    });
    if(window._gridOutsideClick) document.removeEventListener('click', window._gridOutsideClick);
    window._gridOutsideClick = function outsideClick(e){
      if(!gCode.contains(e.target) && !gDropdown.contains(e.target)) hideDropdown();
    };
    document.addEventListener('click', window._gridOutsideClick);
  }
  const gManguen = document.getElementById('gridManguen');
  const gSave = document.getElementById('gridEditSave'), gCancel = document.getElementById('gridEditCancel');
  const gScrim = document.getElementById('gridEditScrim');
  if(gSave) gSave.onclick = ()=>{
    const {date, employeeId} = gridEdit;
    const existing = attendance[date+'_'+employeeId] || {};
    const val = gCode.value.trim().toUpperCase() || 'OFF';
    const isWorkCode = WORK_CODES.some(w=>w.code===val);
    const isStatusCode = STATUS_CODE_LIST.includes(val) || !!codeDefs[val];
    if(!isWorkCode && !isStatusCode){
      showToast('"'+val+'"은(는) 유효한 근무코드·근태코드가 아니에요.');
      return;
    }
    const rec = {
      date, employeeId,
      workCode: isWorkCode ? val : 'OFF',
      statusCode: isWorkCode ? '' : val,
      manguen: gManguen ? gManguen.checked : !!existing.manguen,
      updatedAt: Date.now()
    };
    gridEdit = null;
    saveAttendance(rec);
  };
  if(gCancel) gCancel.onclick = ()=>{ gridEdit = null; render(); };
  const gReset = document.getElementById('gridEditReset');
  if(gReset) gReset.onclick = ()=>{
    const {date, employeeId} = gridEdit;
    gridEdit = null;
    deleteAttendanceRec(date, employeeId);
  };
  if(gScrim) gScrim.onclick = (e)=>{ if(e.target===gScrim){ gridEdit = null; render(); } };

  // 직원 관리 → 조편성 관리로 통합
  el.querySelectorAll('[data-act="goto-team"]').forEach(x=>x.onclick=(e)=>{ e.preventDefault(); setView('team'); });
  const teamAddForm = document.getElementById('teamAddForm');
  if(teamAddForm) teamAddForm.onsubmit=(e)=>{
    e.preventDefault();
    const f = new FormData(teamAddForm);
    const name = (f.get('name')||'').trim();
    if(!name){ return; }
    addEmployee(name, (f.get('part')||'STS').trim(), f.get('team')||'');
    teamAddForm.reset();
  };
  el.querySelectorAll('[data-emp-field]').forEach(x=>{
    const commit = ()=>{
      const id = x.dataset.empId, field = x.dataset.empField;
      const val = x.type==='checkbox' ? x.checked : x.value;
      updateEmployee(id, {[field]: val});
    };
    if(x.type==='checkbox') x.onchange = commit; else x.onblur = commit;
  });
  el.querySelectorAll('[data-act="del-emp"]').forEach(x=>x.onclick=()=>{
    appConfirm('이 직원을 삭제할까요? 기존 근태 기록은 남아있습니다.', ()=> removeEmployee(x.dataset.id));
  });

  // 공휴일 관리
  const holForm = document.getElementById('holForm');
  if(holForm) holForm.onsubmit=(e)=>{
    e.preventDefault();
    const f = new FormData(holForm);
    const date = f.get('date'), name=(f.get('name')||'').trim();
    if(!date||!name) return;
    addHoliday(date,name);
    holYearFilter = date.slice(0,4);
    holForm.reset();
  };
  el.querySelectorAll('[data-act="hol-year"]').forEach(x=>x.onclick=()=>{ holYearFilter = x.dataset.year; render(); });
  el.querySelectorAll('[data-act="del-hol"]').forEach(x=>x.onclick=()=>{
    appConfirm('이 공휴일을 삭제할까요?', ()=> removeHoliday(x.dataset.date));
  });

  // 근태코드 참조
  el.querySelectorAll('[data-act="save-code"]').forEach(x=>x.onclick=()=>{
    const code = x.dataset.code;
    const input = el.querySelector(`[data-code-label="${CSS.escape(code)}"]`);
    saveCodeLabel(code, input.value.trim());
  });
  el.querySelectorAll('[data-act="delete-code"]').forEach(x=>x.onclick=()=>{
    const code = x.dataset.code;
    appConfirm(`"${code}" 코드를 삭제할까요?`, ()=> deleteCodeDef(code));
  });
  el.querySelectorAll('[data-act="restore-code"]').forEach(x=>x.onclick=()=>{
    restoreCodeDef(x.dataset.code);
  });
  const showAddCodeBtn = document.getElementById('showAddCodeBtn');
  if(showAddCodeBtn) showAddCodeBtn.onclick = ()=>{ addCodeFormOpen = true; render(); };
  const addCodeCancelBtn = document.getElementById('addCodeCancelBtn');
  if(addCodeCancelBtn) addCodeCancelBtn.onclick = ()=>{ addCodeFormOpen = false; render(); };
  const addCodeSaveBtn = document.getElementById('addCodeSaveBtn');
  if(addCodeSaveBtn) addCodeSaveBtn.onclick = ()=>{
    const codeInput = document.getElementById('newCodeInput'), labelInput = document.getElementById('newCodeLabelInput');
    const code = codeInput.value.trim().toUpperCase();
    const label = labelInput.value.trim();
    if(!code){ showToast('코드를 입력해주세요.'); return; }
    if(WORK_CODES.some(w=>w.code===code) || STATUS_CODE_LIST.includes(code)){ showToast('이미 있는 코드예요.'); return; }
    addCodeFormOpen = false;
    saveCodeLabel(code, label);
  };

  // 배차표
  const dpDate = document.getElementById('dpDate'), dpShift = document.getElementById('dpShift');
  if(dpDate) dpDate.onchange = ()=>{ dispatchDate = dpDate.value; if(dbReady) subscribeDispatchDay(dispatchDate); render(); };
  if(dpShift) dpShift.onchange = ()=>{ dispatchShift = dpShift.value; render(); };
  el.querySelectorAll('.dpCatBtn').forEach(x=>x.onclick=()=>{ dispatchPaint = x.dataset.cat; render(); });
  const dpTable = document.getElementById('dpTable');
  if(dpTable){
    dpTable.style.touchAction = 'none';
    dpTable.onpointerdown = (e)=>{
      const td = e.target.closest('.dpCell');
      if(!td) return;
      e.preventDefault();
      try{ dpTable.setPointerCapture(e.pointerId); }catch(err){}
      dispatchStartPaint(td);
    };
    dpTable.onpointermove = (e)=>{
      if(!paintSession) return;
      const atPoint = document.elementFromPoint(e.clientX, e.clientY);
      const td = atPoint ? atPoint.closest('.dpCell') : null;
      dispatchContinuePaint(td);
    };
    dpTable.onpointerup = dispatchFinishPaint;
    dpTable.onpointercancel = dispatchFinishPaint;
  }
  el.querySelectorAll('[data-dispatch-sup]').forEach(x=>{
    x.onblur = ()=> saveDispatchSupportName(dispatchDate, dispatchShift, x.dataset.dispatchSup, x.value.trim());
  });

  // 지원계획표
  const prevWeek = document.getElementById('prevWeek'), nextWeek = document.getElementById('nextWeek');
  if(prevWeek) prevWeek.onclick = ()=>{ weekStart = addDays(weekStart,-7); render(); if(dbReady) loadSupportPlanAll(); };
  if(nextWeek) nextWeek.onclick = ()=>{ weekStart = addDays(weekStart,7); render(); if(dbReady) loadSupportPlanAll(); };
  el.querySelectorAll('[data-splan-field]').forEach(x=>{
    x.onblur = ()=>{
      const ds=x.dataset.splanDate, sh=x.dataset.splanShift, field=x.dataset.splanField;
      const id = `${ds}_${sh}`;
      const cur = Object.assign({}, supportPlan[id]);
      cur[field] = x.value===''? 0 : Number(x.value);
      saveSupportPlan(ds, sh, cur);
    };
  });
  const splanResetBtn = document.getElementById('splanResetBtn');
  if(splanResetBtn) splanResetBtn.onclick = ()=>{
    appConfirm('이번 주 지원계획표 입력값을 모두 초기화할까요?', ()=>{
      deleteSupportPlanWeek(weekStart);
    });
  };

  // 조편성 관리
  el.querySelectorAll('[data-team-emp]').forEach(x=>{
    const commit = ()=>{
      const id = x.dataset.teamEmp, field = x.dataset.teamField;
      let val = x.value;
      if(field==='teamOrder') val = val===''? null : Number(val);
      updateEmployee(id, {[field]: val});
    };
    if(x.tagName==='SELECT') x.onchange = commit; else x.onblur = commit;
  });
  el.querySelectorAll('[data-act="toggle-role"]').forEach(x=>{
    x.onclick = ()=>{
      const id = x.dataset.id, newRole = x.dataset.role;
      if(newRole==='조장'){
        // 같은 조에서 기존 조장은 조원으로 내림 (조장은 조당 한 명)
        const me = employees.find(e=>e.id===id);
        if(me){
          employees.filter(e=>e.id!==id && e.team===me.team && e.teamRole==='조장')
            .forEach(e=> updateEmployee(e.id, {teamRole:'조원'}));
        }
        updateEmployee(id, {teamRole:'조장'});
      } else {
        updateEmployee(id, {teamRole:'조원'});
      }
    };
  });
}

/* ========================= 백업·복원 ========================= */
function pageBackup(){
  const lb = lastBackupAt();
  const lbTxt = lb ? new Date(lb).toLocaleString('ko-KR') : '아직 백업한 적 없음';
  const old = oldLocalData();
  const nOldAtt = old ? Object.keys(old.attendance||{}).length : 0, nOldEmp = old ? Object.keys(old.employees||{}).length : 0;
  return `
  <h2 class="pgttl">백업·복원</h2>
  <p class="pgsub">데이터는 클라우드(Firebase)에 저장되어 PC·휴대폰에서 실시간으로 함께 보입니다. 만일을 대비해 가끔 백업 파일을 내려받아 두세요.</p>
  <div class="panel">
    <h3>백업 파일 내려받기</h3>
    <p class="hint" style="margin:0 0 12px;">마지막 백업(이 기기 기준): <b>${esc(lbTxt)}</b></p>
    <button class="btn" id="backupExportBtn" ${db?'':'disabled'}>백업 파일 내려받기 (.json)</button>
  </div>
  <div class="panel editor-only">
    <h3>백업 파일 올리기</h3>
    <p class="hint" style="margin:0 0 12px;">백업 파일 안의 기록을 클라우드에 올립니다. <b>같은 기록은 파일 내용으로 덮어쓰고</b>, 파일에 없는 기록은 그대로 둡니다. 이전 버전(브라우저 저장) 백업 파일도 올릴 수 있습니다.</p>
    <input type="file" id="backupImportFile" accept=".json,application/json" style="display:none;">
    <button class="btn warn ghost" id="backupImportBtn" ${db?'':'disabled'}>백업 파일 선택…</button>
  </div>
  ${(nOldAtt||nOldEmp) ? `<div class="panel editor-only">
    <h3>이 브라우저에 남아 있는 이전 데이터</h3>
    <p class="hint" style="margin:0 0 12px;">이전 버전에서 이 브라우저에 저장했던 데이터(직원 ${nOldEmp}명·출퇴근 ${nOldAtt.toLocaleString()}건)가 있습니다. 클라우드로 올릴 수 있습니다.</p>
    <button class="btn ghost" id="uploadOldLocalBtn">이전 데이터 클라우드로 올리기</button>
  </div>` : ''}`;
}
async function exportBackup(){
  if(!db) return;
  showToast('백업 파일 만드는 중…');
  let data;
  try{ data = await db.exportAll(); }catch(e){ showToast('백업에 실패했습니다. 인터넷 연결을 확인하세요.'); return; }
  const payload = {app:'SNCT근태관리', format:2, exportedAt:new Date().toISOString(), data};
  const blob = new Blob([JSON.stringify(payload)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `SNCT근태_백업_${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
  try{ localStorage.setItem(LAST_BACKUP_KEY, String(Date.now())); }catch(e){}
  showToast('백업 파일을 내려받았습니다.');
  if(VIEW==='backup') render();
}
function importBackupFile(file){
  if(!file || !db || !requireEdit()) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let obj;
    try{ obj = JSON.parse(reader.result); }catch(e){ showToast('올바른 백업 파일이 아닙니다.'); return; }
    const data = obj && obj.data ? obj.data : obj;
    if(!data || typeof data!=='object' || (!data.employees && !data.attendance)){
      showToast('SNCT 근태관리 백업 파일이 아닙니다.'); return;
    }
    const n = Object.keys(data.attendance||{}).length, ne = Object.keys(data.employees||{}).length;
    const when = obj.exportedAt ? new Date(obj.exportedAt).toLocaleString('ko-KR') : '날짜 정보 없음';
    appConfirm(`백업(${when}, 직원 ${ne}명·출퇴근 ${n}건)을 클라우드에 올릴까요? 같은 기록은 파일 내용으로 덮어씁니다.`, ()=> uploadData(data));
  };
  reader.onerror = ()=> showToast('파일을 읽지 못했습니다.');
  reader.readAsText(file);
}
document.addEventListener('click', (e)=>{
  if(e.target.closest('#backupExportBtn')) exportBackup();
  else if(e.target.closest('#backupImportBtn')){ if(!requireEdit()) return; const f=document.getElementById('backupImportFile'); if(f){ f.value=''; f.click(); } }
  else if(e.target.closest('#uploadOldLocalBtn')){
    if(!requireEdit()) return;
    const old = oldLocalData(); if(!old) return;
    appConfirm('이 브라우저의 이전 데이터를 클라우드로 올릴까요? 같은 기록은 덮어씁니다.', ()=> uploadData(old));
  }
});
document.addEventListener('change', (e)=>{
  if(e.target && e.target.id==='backupImportFile') importBackupFile(e.target.files && e.target.files[0]);
});

/* ========================= 내비게이션/모바일 ========================= */
document.querySelectorAll('nav#nav a').forEach(a=>{
  a.addEventListener('click', ()=> setView(a.dataset.view));
});
document.getElementById('menuBtn').addEventListener('click', ()=>{
  document.getElementById('nav').classList.add('open');
  document.getElementById('scrim').classList.add('show');
});
document.getElementById('scrim').addEventListener('click', ()=>{
  document.getElementById('nav').classList.remove('open');
  document.getElementById('scrim').classList.remove('show');
});
document.querySelector('nav#nav a[data-view="input"]').classList.add('on');
