<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SNCT 근태관리</title>
<link rel="manifest" href="manifest.webmanifest?v=4">
<meta name="theme-color" content="#db2777">
<link rel="icon" type="image/png" href="icon-pink-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon-pink.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SNCT근태">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --accent:#1d4ed8; --accent-soft:#eff6ff; --accent-line:#bfdbfe;
  --warn:#b91c1c; --warn-soft:#fef2f2; --warn-line:#fecaca;
  --ok:#047857; --ok-soft:#ecfdf5; --ok-line:#a7f3d0;
  --amber:#b45309; --amber-soft:#fffbeb; --amber-line:#fde68a;
  --night:#4338ca; --night-soft:#eef2ff; --night-line:#c7d2fe;
  --text:#0f172a; --text-muted:#64748b; --border:#e2e8f0; --surface:#fff; --bg:#f1f5f9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --accent:#60a5fa; --accent-soft:#101d33; --accent-line:#1e3a5f;
    --warn:#f87171; --warn-soft:#341316; --warn-line:#7f1d1d;
    --ok:#34d399; --ok-soft:#052a20; --ok-line:#065f46;
    --amber:#fbbf24; --amber-soft:#302205; --amber-line:#78350f;
    --night:#a5b4fc; --night-soft:#1c1a3d; --night-line:#3730a3;
    --text:#e5e9f0; --text-muted:#8b96a8; --border:#2c3646; --surface:#161d2b; --bg:#0c1119;
  }
}
:root{ --sky:#0369a1; --fill-sky:#e0f2fe; --ot:#854d0e; --ot-soft:#fef9c3; --mc:#15803d; --fill-fc:#cfe0ff; --fill-mc:#c9f2d6; --fill-red:#fdd5d5; --fc:#1e3a8a; --wk:#047857; --wk-soft:#d1fae5; --sup:#1d4ed8; --sup-soft:#dbeafe; --hol:#c2410c; --hol-soft:#ffedd5; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --sky:#7dd3fc; --fill-sky:#0c2d44; --ot:#fde047; --ot-soft:#332a05; --fill-fc:#1c2c52; --fill-mc:#12351f; --fill-red:#44181a; --mc:#4ade80; --fc:#93c5fd; --wk:#34d399; --wk-soft:#06291d; --sup:#60a5fa; --sup-soft:#0f1f3d; --hol:#fb923c; --hol-soft:#3a1706; } }
:root[data-theme="dark"]{ --sky:#7dd3fc; --fill-sky:#0c2d44; --ot:#fde047; --ot-soft:#332a05; --fill-fc:#1c2c52; --fill-mc:#12351f; --fill-red:#44181a; --mc:#4ade80; --fc:#93c5fd; --wk:#34d399; --wk-soft:#06291d; --sup:#60a5fa; --sup-soft:#0f1f3d; --hol:#fb923c; --hol-soft:#3a1706; }
:root[data-theme="dark"]{
  --accent:#60a5fa; --accent-soft:#101d33; --accent-line:#1e3a5f;
  --warn:#f87171; --warn-soft:#341316; --warn-line:#7f1d1d;
  --ok:#34d399; --ok-soft:#052a20; --ok-line:#065f46;
  --amber:#fbbf24; --amber-soft:#302205; --amber-line:#78350f;
  --night:#a5b4fc; --night-soft:#1c1a3d; --night-line:#3730a3;
  --text:#e5e9f0; --text-muted:#8b96a8; --border:#2c3646; --surface:#161d2b; --bg:#0c1119;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body,.tbl th,.tbl td,button,input,select,textarea{word-break:keep-all;overflow-wrap:break-word;}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;margin:0;}
body{background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden;
  font-family:'맑은 고딕','Malgun Gothic',Pretendard,-apple-system,sans-serif;font-size:14px;line-height:1.55;}

header.app{flex:0 0 auto;background:#fde2ec;border-bottom:3px solid #ec4899;
  display:flex;align-items:center;gap:12px;padding:9px 16px;z-index:300;}
header.app .badge{background:#db2777;color:#fff;font-size:10px;font-weight:700;
  letter-spacing:.06em;padding:2px 7px;border-radius:3px;margin-right:6px;vertical-align:2px;}
header.app h1{margin:0;font-size:17px;letter-spacing:-.02em;}
header.app .sub{color:var(--text-muted);font-size:11.5px;margin-top:1px;}
header.app .spacer{flex:1 1 auto;}
header.app .status{font-size:11px;color:var(--text-muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
header.app .status .btn{padding:4px 9px;font-size:11px;white-space:nowrap;}
header.app .status span{white-space:nowrap;}
@media (max-width:700px){
  header.app .sub{display:none;}
  header.app h1{font-size:15px;white-space:nowrap;}
  header.app .status .conn-txt{display:none;}
  header.app .status{gap:5px;}
}
header.app .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none;}
header.app .dot.off{background:var(--text-muted);}
.menu-btn{display:none;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);
  border-radius:7px;width:38px;height:38px;font-size:16px;cursor:pointer;flex:none;}

.layout{flex:1 1 auto;display:flex;min-height:0;}
nav#nav{flex:0 0 218px;width:218px;background:var(--surface);border-right:1px solid var(--border);
  overflow-y:auto;padding:14px 10px 30px;}
nav#nav .navttl{font-size:10.5px;font-weight:700;color:var(--text-muted);letter-spacing:.4px;padding:6px 10px;}
nav#nav a{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:8px;text-decoration:none;
  color:var(--text);font-size:13.5px;margin-bottom:2px;cursor:pointer;min-height:40px;}
nav#nav a:hover{background:var(--accent-soft);color:var(--accent);}
nav#nav a.on{background:#ec4899;color:#fff;font-weight:700;}
nav#nav a:hover:not(.on){background:#fce7f3;color:#be185d;}
nav#nav a .ic{flex:none;width:20px;text-align:center;}

main#content{flex:1 1 auto;min-width:0;overflow-y:auto;padding:22px 26px 60px;}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:350;}

h2.pgttl{margin:0 0 3px;font-size:19px;letter-spacing:-.01em;}
p.pgsub{margin:0 0 18px;color:var(--text-muted);font-size:12.5px;}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:22px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;}
.card .n{font-size:24px;font-weight:700;letter-spacing:-.02em;}
.card .l{font-size:11.5px;color:var(--text-muted);margin-top:2px;}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:18px;}
.panel h3{margin:0 0 12px;font-size:14px;}

.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;}
.field{display:flex;flex-direction:column;gap:4px;min-width:120px;}
.field label{font-size:11.5px;color:var(--text-muted);}
.field input,.field select,.field textarea{border:1px solid var(--border);border-radius:8px;padding:8px 10px;
  font-size:13.5px;background:var(--bg);color:var(--text);font-family:inherit;}
.field textarea{min-height:56px;resize:vertical;}
.field.grow{flex:1 1 200px;}

.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:9px 16px;
  font-size:13px;font-weight:700;cursor:pointer;}
.btn.ghost{background:var(--surface);color:var(--accent);}
.btn.warn{background:var(--warn);border-color:var(--warn);}
.btn.warn.ghost{background:var(--surface);color:var(--warn);border-color:var(--warn-line);}
.btn.sm{padding:5px 10px;font-size:11.5px;border-radius:6px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.gridCodeOpt:hover{background:var(--bg);}
/* 순번 배지: 그룹별 색 + 순위가 높을수록 진하게 */
.g-sup{--g:var(--sup);--g-soft:var(--sup-soft);} .g-hol{--g:var(--hol);--g-soft:var(--hol-soft);} .g-wk{--g:var(--wk);--g-soft:var(--wk-soft);} .g-ot{--g:var(--ot);--g-soft:var(--ot-soft);}
.g-blk{--g:var(--text);--g-soft:var(--bg);} .g-blue{--g:#1d4ed8;--g-soft:#dbeafe;} .g-red{--g:#dc2626;--g-soft:#fee2e2;}
.g-pur{--g:#7c3aed;--g-soft:#f1ecff;--g-strong:#c9b8fb;--g-on:#3b0764;}
.g-yel{--g:#a16207;--g-soft:#fef9c3;--g-strong:#facc15;--g-on:#3f2a00;}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .g-blue{--g:#60a5fa;--g-soft:#0f1f3d;} :root:not([data-theme="light"]) .g-red{--g:#f87171;--g-soft:#3b1113;} :root:not([data-theme="light"]) .g-yel{--g:#fde047;--g-soft:#332a05;} :root:not([data-theme="light"]) .g-pur{--g:#c4b5fd;--g-soft:#2a1a4a;} }
.rk{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:21px;padding:0 6px;border-radius:11px;font-weight:800;font-size:11.5px;line-height:1;}
.rk.t1{background:var(--g-strong,var(--g));color:var(--g-on,#fff);box-shadow:0 0 0 2px var(--g-soft);}
.rk.t2{background:var(--g-soft);color:var(--g);border:1px solid var(--g);}
.rk.t3{color:var(--g);opacity:.75;}
/* 그룹 색으로 칠한 칸 */
td.gc,th.gc{background:var(--g-soft) !important;color:var(--g);}
td.gc b,td.gc strong{color:var(--g);}
th.gh{background:var(--g) !important;color:#fff !important;font-weight:800;}
.gtbl .sepL{border-left:3px solid var(--text) !important;}
/* 급여 지급명세서 */
.psWrap{overflow-x:auto;padding-bottom:10px;}
.psSheet{background:#fff;color:#111;max-width:780px;min-width:680px;margin:0;padding:22px 24px 18px;border-radius:8px;border:1px solid var(--border);font-size:12.5px;position:relative;}
.psTools{position:absolute;right:14px;top:12px;display:flex;gap:6px;}
.psTitle{text-align:center;font-size:20px;letter-spacing:.02em;margin:6px 0 14px;} .psTitle span{margin-left:14px;}
.psHead{width:88%;margin:0 auto 10px;border-collapse:collapse;border-top:1px solid #333;border-bottom:1px solid #333;} .psHead td{padding:7px 8px;}
.psMeta{display:flex;justify-content:space-between;font-size:11.5px;margin:10px 0 4px;color:#333;}
.psT{width:100%;border-collapse:collapse;table-layout:fixed;} .psT td{border:1px solid #9aa0a6;height:24px;padding:2px 6px;}
.psT td.psSec{background:#dcdcdc;text-align:center;font-weight:700;width:13%;vertical-align:top;padding-top:5px;}
.psT td.psL{background:#dcdcdc;text-align:center;font-weight:700;font-size:11px;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;}
.psT td.psV{text-align:right;background:#fff;} .psT td.psA{background:#f3f7ff;} .psT td.psTot{font-weight:700;}
.psNameIn{width:120px;border:0;border-bottom:1px solid #999;background:#fffde8;font:inherit;padding:2px 4px;color:#111;} .psNameIn:focus{outline:2px solid #1d4ed8;}
.psIn{width:100%;border:0;background:#fffde8;text-align:right;font:inherit;padding:2px 0;color:#111;} .psIn:focus{outline:2px solid #1d4ed8;}
@media print{ body.printing-ps > *:not(.layout){display:none !important;} body.printing-ps .layout > *:not(main){display:none !important;}
  body.printing-ps main#content > *:not(.psWrap){display:none !important;} body.printing-ps .psSheet{border:0;}
  body.printing-ps .psTools{display:none;} body.printing-ps .psIn{background:none;} body.printing-ps .psT td.psA{background:none;} }
.gtbl td.stNo{position:sticky;left:0;z-index:2;background:var(--surface);min-width:34px;width:34px;}
.gtbl td.namecell.stName{position:sticky;left:34px !important;z-index:3;background:var(--surface);}
.cmbLeft .scrollx{max-width:100%;}
@media (max-width:860px){ .cmbLeft{flex:1 1 100%;min-width:0;} .cmbLeft .scrollx{display:block !important;overflow-x:auto;} }
.dayHead{cursor:pointer;} .dayHead:hover{outline:2px solid var(--accent);outline-offset:-2px;}
.cellMemo{display:block;font-size:8px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:clip;max-width:28px;margin:0 auto;}
.inTbl td{padding:0 !important;height:34px;} .inTbl td.inName{padding:0 8px !important;white-space:nowrap;}
.inTbl .inCell{width:58px;height:32px;border:0;background:transparent;text-align:center;font:inherit;font-size:13px;color:var(--text);}
.inTbl .inCell:focus{outline:2px solid var(--accent);outline-offset:-2px;background:#fffde8;} .inTbl .inCell.bad{background:#fee2e2;color:#b91c1c;}
.inTbl td.inRO{text-align:center;color:var(--text-muted);min-width:52px;padding:0 6px !important;} .inTbl td.inTot{font-weight:800;color:var(--accent);}
.inTbl tr.inDirty td{background:#fff7ed;} .inTbl input[type=checkbox]{width:17px;height:17px;}
.adjCell{cursor:pointer;} .adjCell:hover{outline:2px solid var(--accent);outline-offset:-2px;} .adjMark{color:var(--accent);font-size:9px;margin-left:1px;}
.nameLink{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;}
.nameLink:hover{color:var(--accent);}
:root th.gh.g-blk{background:#1f2937 !important;}
.otSum td.gc,.otSum th.gc,.otSum td.otc{min-width:50px;padding:4px 6px !important;}
.dragHandle{display:inline-flex;align-items:center;justify-content:center;width:26px;height:28px;margin-right:4px;border-radius:6px;
  cursor:grab;color:var(--text-muted);font-size:16px;touch-action:none;user-select:none;-webkit-user-select:none;}
.dragHandle:hover{background:var(--accent-soft);color:var(--accent);}
body.team-dragging, body.team-dragging *{cursor:grabbing !important;user-select:none;-webkit-user-select:none;}
tr.dragging{opacity:.35;}
tr.drop-before td{box-shadow:inset 0 3px 0 var(--accent);}
tr.drop-after td{box-shadow:inset 0 -3px 0 var(--accent);}
[data-team-drop].drop-into{outline:2px dashed var(--accent);outline-offset:4px;}

.badge-code{display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;
  border-radius:6px;padding:2px 7px;border:1px solid transparent;}
.bc-D{background:var(--amber-soft);color:var(--amber);border-color:var(--amber-line);}
.bc-N{background:var(--night-soft);color:var(--night);border-color:var(--night-line);}
.bc-OFF{background:var(--bg);color:var(--text-muted);border-color:var(--border);}
.bc-DN{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line);}
.bc-ND{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line);}
.bc-DS{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line);}
.bc-NS{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line);}
.bc-IN{background:var(--bg);color:var(--text);border-color:var(--border);}
.bc-status{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line);}

table.tbl{border-collapse:collapse;width:100%;font-size:12.5px;}
.tbl th,.tbl td{border:1px solid var(--border);padding:6px 8px;text-align:left;white-space:nowrap;}
.tbl th{background:var(--bg);font-weight:700;color:var(--text-muted);font-size:11.5px;}
.scrollx{overflow-x:auto;max-width:100%;border-radius:10px;}
.gridwrap{border:2px solid var(--text);border-radius:10px;}

.gridwrap table.gtbl{border-collapse:collapse;font-size:11.5px;}
.gtbl th,.gtbl td{border:1px solid var(--border);padding:0;text-align:center;}
.gtbl th{background:var(--bg);color:var(--text-muted);font-weight:700;padding:5px 3px;position:sticky;top:0;z-index:2;}
.gtbl td.namecell{background:var(--surface);text-align:left;padding:6px 10px;font-weight:700;white-space:nowrap;
  position:sticky;left:0;z-index:1;}
.gtbl th.namehead{position:sticky;left:0;top:0;z-index:3;text-align:left;padding:6px 10px;}
.gtbl td.daycell{width:34px;height:34px;cursor:pointer;}
.gtbl td.daycell:hover{outline:2px solid var(--accent);outline-offset:-2px;}
.gtbl th.weekday,.tbl th.weekday{color:var(--text);}
.gtbl th.sunday,.tbl th.sunday{color:var(--warn);}
.gtbl th.saturday,.tbl th.saturday{color:var(--accent);}
.gtbl th.holiday,.tbl th.holiday{color:var(--warn);font-weight:800;}
.gtbl td.sunday,.tbl td.sunday{color:var(--warn);}
.gtbl td.saturday,.tbl td.saturday{color:var(--accent);}
.gtbl td.holiday,.tbl td.holiday{color:var(--warn);}
.daycell .mini{font-size:10.5px;font-weight:700;}
.daycell .mini2{font-size:8.5px;color:var(--text-muted);display:block;}
/* 근태관리(통합) 화면: 좌(집계)·우(월별표) 표의 행 높이/글자 크기를 강제로 맞춤 */
.ctbl.gtbl th,.ctbl.gtbl td{height:30px !important;font-size:10.5px !important;padding:2px 3px !important;box-sizing:border-box;}
.ctbl.gtbl td.namecell,.ctbl.gtbl th.namehead{padding:2px 8px !important;font-size:11px !important;}
.ctbl.gtbl td.daycell{width:30px !important;}
td.daycell.filled{border-color:rgba(255,255,255,.7);}
.gtbl th.wkA{background:#fce7f3 !important;} .gtbl th.wkB{background:#dbeafe !important;}
.gtbl td.daycell.wkA{background:#fdf2f8;} .gtbl td.daycell.wkB{background:#eff6ff;}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .gtbl th.wkA{background:#1b2332 !important;} :root:not([data-theme="light"]) .gtbl th.wkB{background:#253044 !important;}
  :root:not([data-theme="light"]) .gtbl td.daycell.wkA{background:#161d2b;} :root:not([data-theme="light"]) .gtbl td.daycell.wkB{background:#1d2637;} }
/* 근태관리: 집계(왼쪽)와 월별 근태코드(오른쪽)를 나란히, 행 높이를 맞춤 */
.cmbWrap{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;}
.cmbWrap .panel{margin-bottom:0;padding:14px;}
.cmbLeft{flex:0 0 auto;max-width:100%;}
.cmbRight{flex:1 1 360px;min-width:0;}
.cmbCtrl{height:104px;display:flex;flex-direction:column;justify-content:space-between;margin-bottom:10px;}
.cmbCtrl h3{margin:0;}
.ctbl.gtbl thead th{height:34px !important;}
/* 배차표: 가로로 밀어서 보기 + 왼쪽 정보칸·머리글 고정 + 줄 높이 통일 */
.dpScrollBar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 8px;}
.dpWrap{overflow:auto;max-height:calc(100vh - 150px);border:2px solid var(--text);border-radius:0 0 10px 10px;background:var(--surface);-webkit-overflow-scrolling:touch;}
#dpTable{border-collapse:separate;border-spacing:0;font-size:12px;}
#dpTable th,#dpTable td{height:36px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);text-align:center;padding:0 4px;white-space:nowrap;}
#dpTable thead th{position:sticky;top:0;z-index:3;background:var(--bg);}
#dpTable td.dpCell{min-width:42px;width:42px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none;}
#dpTable th.dpSlotH{min-width:42px;width:42px;}
#dpTable td.dpMeal{min-width:42px;width:42px;padding:0 !important;}
#dpTable .dpInline{width:100%;height:30px;border:0;outline:2px solid #1d4ed8;background:#fff;color:#111;font-weight:800;font-size:11px;text-align:center;padding:0;}
#dpTable tr.dpOff td:not(.dpPainted){background:#e5e7eb !important;color:#6b7280;}
#dpTable tr.dpOff .dpNote{color:#9ca3af;}
#dpTable .dpTxt{font-size:10px;font-weight:800;line-height:1.1;display:block;overflow:hidden;white-space:nowrap;}
#dpTable th.dpMealH{border-top:2px solid #E03131 !important;}
#dpTable td.dpMealF{border-bottom:2px solid #E03131 !important;}
#dpTable .mL{border-left:2px solid #E03131 !important;}
#dpTable .mR{border-right:2px solid #E03131 !important;}
#dpTable .dpNote{width:100%;height:100%;min-height:34px;border:0;background:transparent;color:#E03131;font-weight:800;font-size:12px;text-align:center;padding:0 2px;font-family:inherit;}
#dpTable .dpNote:focus{outline:2px solid #E03131;outline-offset:-2px;background:#fff5f5;}
#dpTable .dpNote:disabled{color:#E03131;opacity:1;-webkit-text-fill-color:#E03131;}
#dpTable .dpI{position:sticky;background:var(--surface);z-index:2;}
#dpTable thead .dpI{z-index:4;background:var(--bg);}
#dpTable .dpI1{left:0;min-width:40px;width:40px;}
#dpTable .dpI2{left:40px;min-width:88px;width:88px;font-weight:700;}
#dpTable .dpI3{left:128px;min-width:48px;width:48px;font-weight:700;}
#dpTable .dpI4{left:176px;min-width:50px;width:50px;}
#dpTable .dpI5{left:226px;min-width:46px;width:46px;border-right:2px solid var(--text-muted);}
#dpTable td.dpI1[colspan]{min-width:272px;border-right:2px solid var(--text-muted);}
@media (max-width:700px){
  /* 폰: 번호·성명만 고정하고 좁게 → 시간 칸이 더 많이 보이게 */
  #dpTable .dpI3,#dpTable .dpI4,#dpTable .dpI5{position:static;}
  #dpTable .dpI1{min-width:28px;width:28px;padding:0 2px;}
  #dpTable .dpI2{left:28px;min-width:64px;width:64px;border-right:2px solid var(--text-muted);}
  #dpTable .dpI2 input{width:56px !important;}
  #dpTable .dpI5{border-right:1px solid var(--border);}
  #dpTable td.dpI1[colspan]{min-width:0;}
  .dpScrollBar .hint{display:none;}
  #dpTable td.dpCell,#dpTable th.dpSlotH{min-width:38px;width:38px;}
}

.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:11.5px;color:var(--text-muted);align-items:center;}
.legend .sw{display:inline-flex;align-items:center;gap:4px;}

.empty{color:var(--text-muted);font-size:12.5px;padding:20px;text-align:center;border:1px dashed var(--border);border-radius:10px;}
.hint{font-size:11.5px;color:var(--text-muted);margin-top:8px;}
.note{background:var(--amber-soft);border:1px solid var(--amber-line);color:var(--amber);border-radius:8px;
  padding:9px 12px;font-size:12px;margin-bottom:14px;}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--surface);
  padding:9px 16px;border-radius:8px;font-size:12.5px;z-index:400;opacity:0;pointer-events:none;transition:opacity .25s;}
.toast.show{opacity:1;}

@media (max-width:860px){
  .menu-btn{display:flex;align-items:center;justify-content:center;}
  nav#nav{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .2s;
    z-index:360;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(30px + env(safe-area-inset-bottom,0px));box-shadow:0 0 24px rgba(0,0,0,.25);}
  nav#nav.open{transform:translateX(0);}
  .scrim{z-index:350;}
  .scrim.show{display:block;}
  main#content{padding:16px 14px 50px;}
}
</style>
</head>
<body>
<header class="app">
  <button class="menu-btn" id="menuBtn" aria-label="메뉴">☰</button>
  <h1><span class="badge">근태관리</span>SNCT 근태관리</h1>
  <div class="sub" id="headerSub">선광신컨테이너터미널 · STS파트</div>
  <div class="spacer"></div>
  <div class="status" id="dbStatus"><span class="dot off"></span>연결 확인 중…</div>
</header>
<div class="layout">
  <nav id="nav">
    <div class="navttl">근태관리</div>
    <a data-view="input"><span class="ic">✏️</span>출퇴근 입력</a>
    <a data-view="combined"><span class="ic">📋</span>근태관리</a>
    <a data-view="ot"><span class="ic">🧮</span>월별 OT현황</a>
    <div class="navttl" style="margin-top:10px;">조장관리</div>
    <a data-view="dispatch"><span class="ic">🚧</span>배차표</a>
    <a data-view="splan"><span class="ic">📋</span>지원계획표</a>
    <div class="navttl" data-editor-only style="margin-top:10px;">조장 운영</div>
    <a data-view="team"><span class="ic">🧩</span>조편성 관리</a>
    <a data-view="holidays"><span class="ic">📅</span>공휴일 관리</a>
    <a data-view="codes"><span class="ic">🏷️</span>근태코드 참조</a>
    <div class="navttl" data-editor-only style="margin-top:10px;">데이터</div>
    <a data-view="backup"><span class="ic">💾</span>백업·복원</a>
  </nav>
  <main id="content"></main>
</div>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast"></div>

<script>
/* ========================= 상태 ========================= */
let VIEW = 'input';
let db = null, userCap = null, dbReady = false;
let employees = [];        // [{id,name,part,order,active}]
let holidays = {};         // dateStr -> name
let codeDefs = {};         // code -> {code,label}
const FORCED_HIDDEN = ['IN','OFF','VA']; // 요청으로 삭제(목록·선택창에서 숨김)
let hiddenCodes = new Set(FORCED_HIDDEN); // 근무코드/근태코드 중 사용자가 "삭제"해서 목록·선택창에서 숨긴 코드들
let attendance = {};       // `${date}_${empId}` -> record
let curYear = 2026, curMonth = 9; // 표시 중인 년/월 (grid + input 기본값)
let unsub = { emp:null, hol:null, code:null, att:null, dispatch:null, splan:null, codeStats:null, otMatrix:null, hiddenCodes:null };
let prefill = null; // {date, employeeId} - 그리드에서 셀 클릭 시 입력화면 프리필
let inputViewDate = null, inputViewEmp = null; // 출퇴근 입력화면에서 마지막으로 보던 날짜/직원 (재렌더 시에도 유지)
let combinedTeamFilter = (()=>{ try{ return localStorage.getItem('snct_team_cmb')||''; }catch(e){ return ''; } })(); // 근태관리 표: '' (전체), '1', '2' — 기기에 기억
let combinedYm = null; // 근태관리 아래 '월별 근태코드' 표의 연/월 {y,m}
let teamOtFilter = ''; // 조별 월간집계: '' (전체), '1', '2'
let otMatrixStart = null, otMatrixEnd = null; // 월별 OT현황: 작업기간
let otPayYear = null, otPayMonth = null; // 월별 OT현황: 임금월(예: "10월"=9/26~10/25) 기준 연/월
let otTeamFilter = (()=>{ try{ return localStorage.getItem('snct_team_ot')||''; }catch(e){ return ''; } })(); // 월별 OT현황 — 기기에 기억
let dispatchTeamFilter = ''; // 배차표: '' (전체), '1', '2'
let addCodeFormOpen = false; // 근태코드 참조: 코드 추가 폼 표시 여부
// 임금월 계산: "M월"은 (M-1월)26일 ~ M월25일
function payPeriodRange(y,m){
  let sy=y, sm=m-1;
  if(sm<1){ sm=12; sy=y-1; }
  return [dstr(sy,sm,26), dstr(y,m,25)];
}
let otMatrixAttendance = {}; // 기사별 OT현황 전용 출퇴근 데이터(작업기간 전체 구독)
let holYearFilter = null;
let dispatchDate = null, dispatchShift = 'day', dispatchPaint = '초반'; // 배차표 화면 상태
let paintSession = null; // {empId, changes:{slot:value}} - 배차표 드래그 색칠 중 임시 상태
let gridEdit = null; // {date, employeeId} - 월별표에서 셀 클릭 시 근무코드/근태코드 인라인 편집
let otDetailEmpId = null;
let otEdit = null; // 월별 OT현황에서 바로 보기·수정하는 칸 {date, employeeId}
function renderOtEdit(){
  const {date, employeeId} = otEdit;
  const e = employees.find(x=>x.id===employeeId); if(!e) return '';
  const rec = attStore[date+'_'+employeeId] || {};
  const [y,m,d] = date.split('-').map(Number);
  const c = computeDaily(rec.checkIn ? rec : null, date), sp = computeSupportDaily(rec, date), meal = computeMealAllowance(rec);
  const chk = (n,l) => `<label style="display:flex;align-items:center;gap:5px;"><input type="checkbox" name="${n}" ${rec[n]?'checked':''}>${l}</label>`;
  const dc = gridCode(rec, date, String(e.name||'').trim());
  return `<div id="otEditScrim" style="position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:500;display:flex;align-items:center;justify-content:center;overflow:auto;padding:16px;">
    <form id="otEditForm" class="panel" style="max-width:520px;width:100%;margin:0;" autocomplete="off">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
        <h3 style="margin:0;">${esc(e.name)} · ${m}/${d}(${weekdayKr(y,m,d)})</h3>${dc ? codeBadge(dc) : ''}
        <span style="flex:1"></span><button type="button" class="btn ghost sm" id="otEditClose">닫기</button>
      </div>
      <p class="hint" style="margin:0 0 10px;">${holidays[date] ? esc(holidays[date])+' · ' : ''}${c.valid ? esc(c.category)+' 근무' : '본근무 없음'}</p>
      <div class="row">
        <div class="field"><label>본출근</label><div style="display:flex;gap:4px;">${timeSelectRangeHtml('checkIn', rec.checkIn, [8,12,19,24])}</div></div>
        <div class="field"><label>본퇴근</label><div style="display:flex;gap:4px;">${timeSelectHtml('checkOut', rec.checkOut)}</div></div>
        <div class="field"><label>지원출근</label><div style="display:flex;gap:4px;">${timeSelectRangeHtml('supportIn', rec.supportIn, [8,12,19,24])}</div></div>
        <div class="field"><label>지원퇴근</label><div style="display:flex;gap:4px;">${timeSelectHtml('supportOut', rec.supportOut)}</div></div>
      </div>
      <div class="row" style="margin-top:8px;align-items:center;">
        <div class="field" style="min-width:90px;"><label>본조보상</label><input type="number" step="0.5" min="0" name="honjoComp" value="${esc(rec.honjoComp||'')}" placeholder="0" style="width:90px;"></div>
        <div class="field" style="min-width:90px;"><label>타조보상</label><input type="number" step="0.5" min="0" name="tajoComp" value="${esc(rec.tajoComp||'')}" placeholder="0" style="width:90px;"></div>
        ${chk('jochul','조출')}${chk('jungsik','중식')}${chk('seokchul','석출')}${chk('yasik','야식')}
      </div>
      <div class="cards" style="margin:12px 0 8px;grid-template-columns:repeat(4,1fr);">
        <div class="card"><div class="n" style="font-size:18px;">${fmtH(c.totalWork)}</div><div class="l">실근무</div></div>
        <div class="card"><div class="n" style="font-size:18px;">${fmtH(c.valid?c.premium:0)}</div><div class="l">본근무 가산</div></div>
        <div class="card"><div class="n" style="font-size:18px;">${fmtH(sp.valid?sp.premium:0)}</div><div class="l">지원 가산</div></div>
        <div class="card"><div class="n" style="font-size:18px;">${fmtH(meal)}</div><div class="l">식사</div></div>
      </div>
      ${canEdit ? `<div class="row" style="justify-content:flex-end;">
        <button type="button" class="btn warn ghost sm" id="otEditDel" ${attStore[date+'_'+employeeId]?'':'disabled'}>초기화</button>
        <button type="submit" class="btn sm">저장</button>
      </div>` : '<p class="hint" style="margin:0;">보기 전용입니다.</p>'}
    </form></div>`;
}
function bindOtEdit(el){
  const f = document.getElementById('otEditForm'); if(!f) return;
  const close = ()=>{ otEdit = null; render(); };
  document.getElementById('otEditClose').onclick = close;
  document.getElementById('otEditScrim').onclick = (ev)=>{ if(ev.target.id==='otEditScrim') close(); };
  if(!canEdit){ f.querySelectorAll('input,select').forEach(x=> x.disabled = true); return; }
  f.onsubmit = (ev)=>{
    ev.preventDefault();
    const fd = new FormData(f), {date, employeeId} = otEdit;
    const rec = {
      date, employeeId,
      checkIn: readTimeSelect(fd,'checkIn'), checkOut: readTimeSelect(fd,'checkOut'),
      supportIn: readTimeSelect(fd,'supportIn'), supportOut: readTimeSelect(fd,'supportOut'),
      honjoComp: fd.get('honjoComp')||'', tajoComp: fd.get('tajoComp')||'',
      jochul: !!fd.get('jochul'), seokchul: !!fd.get('seokchul'), jungsik: !!fd.get('jungsik'), yasik: !!fd.get('yasik'),
      updatedAt: Date.now()
    };
    otEdit = null;
    saveAttendance(rec);
  };
  const del = document.getElementById('otEditDel');
  // 초기화: 출퇴근 시각·보상·식사만 지움(근무코드·근태코드·메모는 그대로)
  if(del) del.onclick = ()=> appConfirm('이 날의 출퇴근 시각·보상·식사 입력을 지울까요? (근태코드는 그대로)', ()=>{
    const {date, employeeId} = otEdit; otEdit = null;
    saveAttendance({date, employeeId, checkIn:'', checkOut:'', supportIn:'', supportOut:'', honjoComp:'', tajoComp:'', jochul:false, seokchul:false, jungsik:false, yasik:false, updatedAt: Date.now()});
  });
} // 기사별 OT현황: 달력 상세보기 중인 직원
let codeStatsIncludeMeal = true; // 근태코드 집계: 평일OT에 식사연장(식사계) 포함 여부
let codeStatsStart = null, codeStatsEnd = null; // 근태코드 집계: 집계 기간(시작~종료)
// 근태관리 집계 기간·식사연장 설정을 이 기기에 기억(다른 화면에 다녀오거나 앱을 다시 열어도 유지)
const CMB_PREF_KEY = 'snct_combined_range';
try{
  const p = JSON.parse(localStorage.getItem(CMB_PREF_KEY) || 'null');
  if(p && /^\d{4}-\d{2}-\d{2}$/.test(p.start||'') && /^\d{4}-\d{2}-\d{2}$/.test(p.end||'')){ codeStatsStart = p.start; codeStatsEnd = p.end; }
  if(p && typeof p.meal==='boolean') codeStatsIncludeMeal = p.meal;
}catch(e){}
function saveCombinedPref(){
  try{ localStorage.setItem(CMB_PREF_KEY, JSON.stringify({start:codeStatsStart, end:codeStatsEnd, meal:codeStatsIncludeMeal})); }catch(e){}
  saveViewPrefsCloud({combinedStart:codeStatsStart, combinedEnd:codeStatsEnd, combinedMeal:codeStatsIncludeMeal});
}
// 월별 OT현황 기간도 같은 방식으로 기억
const OT_PREF_KEY = 'snct_ot_range';
const isYmd = v => /^\d{4}-\d{2}-\d{2}$/.test(v||'');
function loadOtPrefLocal(){
  try{
    const p = JSON.parse(localStorage.getItem(OT_PREF_KEY) || 'null');
    if(p && isYmd(p.start) && isYmd(p.end)){ otMatrixStart = p.start; otMatrixEnd = p.end; otPayYear = p.payYear; otPayMonth = p.payMonth; }
  }catch(e){}
}
function saveOtPref(){
  const v = {start:otMatrixStart, end:otMatrixEnd, payYear:otPayYear, payMonth:otPayMonth};
  try{ localStorage.setItem(OT_PREF_KEY, JSON.stringify(v)); }catch(e){}
  saveViewPrefsCloud({otStart:otMatrixStart, otEnd:otMatrixEnd, otPayYear, otPayMonth});
}
// 편집자가 바꾼 설정만 클라우드에 저장(보기 전용 사용자가 바꾼 건 그 기기에서만 잠시 유지)
function saveViewPrefsCloud(partial){
  if(!db || !canEdit || demoMode) return;
  db.doc('meta/viewPrefs').set(Object.assign({updatedAt: Date.now()}, partial), {merge:true}).catch(()=>{});
}
// 클라우드의 공용 설정을 화면에 반영
function applyViewPrefs(p){
  if(!p) return;
  if(isYmd(p.combinedStart) && isYmd(p.combinedEnd)){ codeStatsStart = p.combinedStart; codeStatsEnd = p.combinedEnd; }
  if(typeof p.combinedMeal==='boolean') codeStatsIncludeMeal = p.combinedMeal;
  if(isYmd(p.otStart) && isYmd(p.otEnd)){ otMatrixStart = p.otStart; otMatrixEnd = p.otEnd; if(p.otPayYear) otPayYear = p.otPayYear; if(p.otPayMonth) otPayMonth = p.otPayMonth; }
  try{
    localStorage.setItem(CMB_PREF_KEY, JSON.stringify({start:codeStatsStart, end:codeStatsEnd, meal:codeStatsIncludeMeal}));
    if(otMatrixStart) localStorage.setItem(OT_PREF_KEY, JSON.stringify({start:otMatrixStart, end:otMatrixEnd, payYear:otPayYear, payMonth:otPayMonth}));
  }catch(e){}
}
let codeStatsAttendance = {}; // 근태코드 집계 전용 출퇴근 데이터 (선택한 기간 전체를 별도로 구독)
let dispatch = {}; // `${date}_${shift}_${empId}` -> {slots:{slot:catKey}}
let weekStart = null; // 지원계획표 화면 상태 (해당 주의 월요일, YYYY-MM-DD)
let supportPlan = {}; // `${date}_${shift}` -> {capacity,quota,offCount,leadCount,preSupport,supportOff,support}
const DAY_SLOTS = ['07:00','07:30','08:00','08:30','09:00','09:30','10:00','10:30','11:00','11:30','12:00','12:30','13:00','13:30','14:00','14:30','15:00','15:30','16:00','16:30','17:00','17:30','18:00','18:30','19:00'];
const NIGHT_SLOTS = ['18:00','18:30','19:00','19:30','20:00','20:30','21:00','21:30','22:00','22:30','23:00','23:30','24:00','00:30','01:00','01:30','02:00','02:30','03:00','03:30','04:00','04:30','05:00','05:30','06:00','06:30','07:00'];
const DISPATCH_CATS = [
  {key:'수정', bg:'#FFFFFF', fg:'#333333', border:'#c7cad1'},
  {key:'초반', bg:'#8CE24C', fg:'#1a3d00', border:'#8CE24C'},
  {key:'후반', bg:'#FFA654', fg:'#5c2d00', border:'#FFA654'},
  {key:'당직', bg:'#8C8C8C', fg:'#ffffff', border:'#8C8C8C'},
  {key:'정비', bg:'#F3B3F3', fg:'#5c005c', border:'#F3B3F3'},
  {key:'기타', bg:'#7A2FA8', fg:'#ffffff', border:'#7A2FA8'}
];
// 배차표의 조출·중식·석출·야식 시간 칸(빨간 시각: 07·12·18·24시) — 칠하기 대신 한글·숫자를 직접 입력
// 월별 표 주 단위 색 구분(월~일 한 주씩 연한 회색 / 조금 더 진한 회색 번갈아)
function weekBand(ds){
  const [y,m,d] = mondayOf(ds).split('-').map(Number);
  const wk = Math.floor(Date.UTC(y,m-1,d) / (7*86400000));
  return (wk % 2) ? 'wkB' : 'wkA';
}
let dpPop = null; // {empId, slot}
let dpPopOpenedAt = 0;
function openDpPop(empId, slot){ dpPop = {empId, slot}; dpPopOpenedAt = Date.now(); render(); }
const dpPopReady = ()=> Date.now() - dpPopOpenedAt > 450; // 칸을 누른 손가락이 팝업 버튼을 눌러버리는 것 방지
function renderDpPop(){
  const id = `${dispatchDate}_${dispatchShift}_${dpPop.empId}`;
  const drec = dispatch[id] || {};
  const cur = (drec.slots||{})[dpPop.slot] || '', note = (drec.notes||{})[dpPop.slot] || '';
  const who = dpPop.empId.startsWith('sup') ? (drec.name || '지원') : empName(dpPop.empId);
  const btns = DISPATCH_CATS.filter(c=>c.key!=='수정').map(c=>`<button type="button" class="dpPopCat" data-cat="${esc(c.key)}" style="background:${c.bg};color:${c.fg};border:2px solid ${cur===c.key?'#111':c.border};border-radius:10px;padding:10px 0;font-weight:800;font-size:14px;cursor:pointer;">${esc(c.key)}</button>`).join('');
  return `<div id="dpPopScrim" style="position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:500;display:flex;align-items:center;justify-content:center;">
    <div class="panel" style="max-width:360px;width:92%;margin:0;">
      <h3 style="margin:0 0 2px;">${esc(who)} · ${esc(dpPop.slot)}</h3>
      <p class="hint" style="margin:0 0 12px;">항목을 누르면 바로 칠해집니다.</p>
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px;">${btns}</div>
      <button type="button" class="btn warn ghost sm" id="dpPopClear" style="width:100%;margin-bottom:10px;">색 지우기</button>
      <p class="hint" style="margin:0 0 8px;">글씨는 칸을 <b>두 번 누르면</b> 칸 안에서 바로 입력할 수 있어요.</p>
      <div class="row" style="justify-content:flex-end;"><button class="btn ghost sm" id="dpPopClose">닫기</button></div>
    </div></div>`;
}

function mondayOf(dateStr){
  const [y,m,d]=dateStr.split('-').map(Number);
  const dt=new Date(y,m-1,d);
  const wd=dt.getDay(); // 0=일
  const diff = wd===0 ? -6 : 1-wd;
  dt.setDate(dt.getDate()+diff);
  return dstr(dt.getFullYear(), dt.getMonth()+1, dt.getDate());
}
function addDays(dateStr, n){
  const [y,m,d]=dateStr.split('-').map(Number);
  const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n);
  return dstr(dt.getFullYear(), dt.getMonth()+1, dt.getDate());
}
// 날짜를 n개월 이동(일자는 최대한 유지, 말일 초과시 그 달 말일로 보정)
function shiftMonth(dateStr, n){
  const [y,m,d] = dateStr.split('-').map(Number);
  let ny=y, nm=m+n;
  while(nm>12){ nm-=12; ny++; }
  while(nm<1){ nm+=12; ny--; }
  const nd = Math.min(d, daysInMonth(ny,nm));
  return dstr(ny, nm, nd);
}
// 기간을 n개월 이동. "1일~말일" 한 달 전체 기간이면 이동 후에도 그 달의 1일~말일로 맞춤(8/31, 2/29 등 누락 방지)
function shiftRangeMonth(start, end, n){
  const [sy,sm,sd] = start.split('-').map(Number);
  const [ey,em,ed] = end.split('-').map(Number);
  if(sd===1 && sy===ey && sm===em && ed===daysInMonth(ey,em)){
    const ns = shiftMonth(start, n);
    const [ny,nm] = ns.split('-').map(Number);
    return [ns, dstr(ny,nm,daysInMonth(ny,nm))];
  }
  return [shiftMonth(start,n), shiftMonth(end,n)];
}

function excelCode(ds, name){
  if(!_excelSupMap){
    _excelSupMap = new Map();
    Object.entries(EXCEL_SUPPORT).forEach(([n, list])=> list.split(',').forEach(x=>{
      const [d, c] = x.split(':');
      _excelSupMap.set('20'+d.slice(0,2)+'-'+d.slice(2,4)+'-'+d.slice(4,6)+'|'+n, c);
    }));
  }
  return (ds <= IMPORT_LAST_DATE && _excelSupMap.get(ds+'|'+name)) || '';
}

const LEAVE_TYPES = [['RV','정기'],['AV','연차'],['LS','근속'],['SL','병가'],['TL','휴직']];
const LEAVE_SET = new Set(LEAVE_TYPES.map(x=>x[0]));
let _excelLeaveMap = null;
function excelLeave(ds, name){
  if(!_excelLeaveMap){
    _excelLeaveMap = new Map();
    Object.entries(EXCEL_LEAVE).forEach(([n, list])=> list.split(',').forEach(x=>{
      const [d, c] = x.split(':');
      _excelLeaveMap.set('20'+d.slice(0,2)+'-'+d.slice(2,4)+'-'+d.slice(4,6)+'|'+n, c);
    }));
  }
  return _excelLeaveMap.get(ds+'|'+name) || '';
}
// 그 날의 연가 코드: 편집자가 직접 입력한 코드 → 원본 엑셀 코드 → 저장된 코드 순
function leaveCodeFor(rec, ds, name){
  const c = effCode(rec, ds, name);
  return LEAVE_SET.has(c) ? c : '';
}
function yearEnd(start){ const [y,m,d] = start.split('-').map(Number); return addDays(dstr(y+1, m, Math.min(d, daysInMonth(y+1, m))), -1); }
function leaveCounts(emp, start){
  const end = yearEnd(start), name = String(emp.name||'').trim(), cnt = {};
  LEAVE_TYPES.forEach(([c])=> cnt[c] = 0);
  for(let ds=start; ds<=end; ds=addDays(ds,1)){
    const c = leaveCodeFor(attStore[ds+'_'+emp.id], ds, name);
    if(c) cnt[c]++;
  }
  return {cnt, end, total: Object.values(cnt).reduce((a,b)=>a+b,0)};
}

let rotation = {start:'2025-12-22', team1:'D'};
function scheduledShift(ds, team){
  if(!rotation || !rotation.start || !ds || (team!=='1' && team!=='2')) return '';
  const a = mondayOf(rotation.start), b = mondayOf(ds);
  const [y1,m1,d1] = a.split('-').map(Number), [y2,m2,d2] = b.split('-').map(Number);
  const weeks = Math.round((Date.UTC(y2,m2-1,d2) - Date.UTC(y1,m1-1,d1)) / (7*86400000));
  const t1 = rotation.team1==='N' ? 'N' : 'D';
  const flip = c => c==='D' ? 'N' : 'D';
  const c1 = (((weeks % 2) + 2) % 2) ? flip(t1) : t1;
  return team==='1' ? c1 : flip(c1);
}

function dateAt(dateStr, h, m, addDay){
  const [y,mo,d] = dateStr.split('-').map(Number);
  return new Date(y, mo-1, d + (addDay||0), h, m||0);
}
// 분 반올림 규칙: 1~29분→30분, 31~59분→다음 시(0분). 0/30분은 그대로.
function normalizeHM(h,m){
  h = Math.round(h); m = Math.round(m);
  if(m>=1 && m<=29) m = 30;
  else if(m>=31 && m<=59){ h += 1; m = 0; }
  let dayOffset = 0;
  while(h > 24){ h -= 24; dayOffset += 1; }
  return {h, m, dayOffset};
}
// 입력값은 "H:MM" (H=1~24, M=00 또는 30) 체계 — 원본 엑셀의 HH.MM(24시=자정) 표기와 동일한 규칙
function parseHM(dateStr, hm){
  if(!hm) return null;
  let [h,m] = hm.split(':').map(Number);
  if(isNaN(h) || isNaN(m)) return null;
  const norm = normalizeHM(h,m);
  const dayOffset = (norm.h===24 ? 1 : 0) + norm.dayOffset;
  const realHour = norm.h===24 ? 0 : norm.h;
  return dateAt(dateStr, realHour, norm.m, dayOffset);
}
function toDec(hm){
  let [h,m] = hm.split(':').map(Number);
  const norm = normalizeHM(h,m);
  return norm.h + norm.m/60;
}

function unionOf(e){
  if(!e) return '1';
  if(e.unionGroup==='1' || e.unionGroup==='2') return e.unionGroup;
  return DEFAULT_UNION2.has(String(e.name||'').trim()) ? '2' : '1';
}
function isHolidayFor(ds, empId){
  const rule = UNION_DAYS.find(u=> ds.slice(5)===u.md);
  if(rule && empId && typeof employees!=='undefined'){
    const e = employees.find(x=>x.id===empId);
    if(e) return unionOf(e)===rule.union;
  }
  return !!holidays[ds];
}
function dayCategory(dateStr, manguen, empId){
  const [wy,wm,wd] = dateStr.split('-').map(Number);
  const w = new Date(wy, wm-1, wd).getDay(); // 0=일 6=토, 타임존 안전 파싱
  const isHoliday = isHolidayFor(dateStr, empId);
  if(w===0) return 'SU';
  if(isHoliday) return 'H';
  if(w===6) return manguen ? 'SA' : 'W'; // 만근(이번주 평일 개근) 체크된 토요일만 특근(SA)으로 인정
  return 'W';
}
// 하루치 근태 기록으로부터 근무시간/초과/심야/가산시간을 계산 (원본 DB입력 수식 100% 대조 검증됨)
function computeDaily(rec, dateStr){
  const zero = {totalWork:0, meal:0, overtime:0, night:0, category:'-', premium:0, valid:false};
  if(!rec || !rec.checkIn || !rec.checkOut) return zero;
  // 근무코드: 월별표에서 지정한 값(D·N 등). 없으면(출퇴근 입력만 한 날) 본출근 시각으로 주간/야간을 판단.
  // 편집자가 월별표에서 직접 OFF로 지정한 날만 계산하지 않음
  let wc = (rec.workCode && rec.workCode!=='OFF') ? rec.workCode : '';
  const sched = (typeof empScheduled==='function' && rec.employeeId) ? empScheduled(rec.employeeId, dateStr) : '';
  if(!wc){
    if(rec.attManual && rec.workCode==='OFF') return zero;
    wc = sched || (toDec(rec.checkIn) <= 14 ? 'D' : 'N');
  }

  const checkinDec = toDec(rec.checkIn);
  let start;
  if(checkinDec<=14) start = dateAt(dateStr,8,0);
  else if(checkinDec<=24) start = dateAt(dateStr,19,0);
  else return zero;

  let actualEnd = parseHM(dateStr, rec.checkOut);
  if(!actualEnd) return zero;
  if(actualEnd<=start) actualEnd = new Date(actualEnd.getTime()+24*3600000);
  const checkoutDec = toDec(rec.checkOut);

  const kcat = dayCategory(dateStr, recManguen(rec, dateStr), rec.employeeId);

  let guaranteedEnd = actualEnd;
  // 퇴근보전은 원본 엑셀처럼 '근무코드(편성된 주간/야간)' 기준으로 판단. 엑셀에서 가져온 기록은 baseShift(D/N)에 들어 있음
  const gCode = rec.baseShift || sched || wc; // 편성 근무코드(교대 순환) 기준
  if(kcat==='SU' || kcat==='H'){
    if((gCode==='D'||gCode==='DN') && checkoutDec>8 && checkoutDec<12){
      guaranteedEnd = dateAt(dateStr,12,0);
    }
    if((gCode==='N'||gCode==='ND') && checkoutDec>=19 && checkoutDec<=24){
      guaranteedEnd = dateAt(dateStr,0,0,1); // 24:00 = 익일 00:00
    }
  }

  let meal = 0;
  const noon12=dateAt(dateStr,12,0), noon13=dateAt(dateStr,13,0);
  if(start<noon12 && guaranteedEnd>noon13) meal+=1;
  const eve18=dateAt(dateStr,18,0), eve19=dateAt(dateStr,19,0);
  if(start<eve18 && guaranteedEnd>eve19) meal+=1;
  const next1=dateAt(dateStr,1,0,1);
  if(guaranteedEnd>=next1) meal+=1;

  const raw = (guaranteedEnd-start)/3600000;
  const totalWork = Math.max(raw - meal, 0);
  const overtime = Math.max(totalWork - 8, 0);

  const night22=dateAt(dateStr,22,0), next6=dateAt(dateStr,6,0,1);
  let night = 0;
  const wsExists = guaranteedEnd>night22, weExists = actualEnd>night22;
  if(wsExists && weExists){
    const ws = start>night22 ? start : night22;
    const we = actualEnd<next6 ? actualEnd : next6;
    const wm = rec.yasik ? 0 : (guaranteedEnd>=next1 ? 1 : 0);
    night = Math.max((we-ws)/3600000 - wm, 0);
  }

  let category, premium;
  if(kcat==='SU' || kcat==='H'){
    const mult = rec.extCode ? 2 : 1.5;
    premium = totalWork*mult + overtime*0.5 + night*0.5;
    category = kcat==='SU' ? '일요일' : '공휴일';
  } else if(kcat==='SA'){
    premium = totalWork*1.5 + night*0.5;
    category = '토요일';
  } else {
    premium = rec.extCode ? (totalWork*1.5+night*0.5) : (overtime*1.5+night*0.5);
    category = '평일';
  }
  return {totalWork, meal, overtime, night, category, premium, valid:true};
}
function fmtH(n){ return (Math.round(n*10)/10).toFixed(1); }

// 조출/석출/중식/야식 - 각 1건당 1.5시간 가산 (원본 식사계 = SUM(조출,석출,중식,야식)*1.5)
function computeMealAllowance(rec){
  if(!rec) return 0;
  const cnt = [rec.jochul, rec.seokchul, rec.jungsik, rec.yasik].filter(Boolean).length;
  return cnt * 1.5;
}

// 지원출근/지원퇴근 기준 지원근무 가산시간 계산 (본조보상/타조보상 수동입력 포함, 100% 대조 검증됨)
function computeSupportDaily(rec, dateStr){
  const zero = {supTotal:0, supOT:0, supNight:0, premium:0, valid:false};
  if(!rec) return zero;
  const honjo = Number(rec.honjoComp)||0, tajo = Number(rec.tajoComp)||0;
  const hasSupportShift = !!(rec.supportIn && rec.supportOut);
  if(!hasSupportShift && honjo===0 && tajo===0) return zero;

  let supTotal=0, supOT=0, supNight=0;
  let shiftParsed = false;
  if(hasSupportShift){
    let start = parseHM(dateStr, rec.supportIn);
    let end = parseHM(dateStr, rec.supportOut);
    if(start && end){
      shiftParsed = true;
      if(end <= start) end = new Date(end.getTime() + 24*3600000);

      const totalRaw = (end-start)/3600000;
      let meal = 0;
      const noon12=dateAt(dateStr,12,0), noon13=dateAt(dateStr,13,0);
      if(start<noon12 && end>noon13) meal+=1;
      const eve18=dateAt(dateStr,18,0), eve19=dateAt(dateStr,19,0);
      if(start<eve18 && end>eve19) meal+=1;
      const next1=dateAt(dateStr,1,0,1);
      if(end>=next1) meal+=1;
      supTotal = Math.max(totalRaw - meal, 0);
      supOT = Math.max(supTotal - 8, 0);

      const night22=dateAt(dateStr,22,0), next6=dateAt(dateStr,6,0,1);
      if(end>night22){
        const ws = start>night22 ? start : night22;
        const we = end<next6 ? end : next6;
        const wm = rec.yasik ? 0 : (end>=next1 ? 1 : 0);
        supNight = Math.max((we-ws)/3600000 - wm, 0);
      }
    }
  }

  const kcat = dayCategory(dateStr, recManguen(rec, dateStr), rec.employeeId);
  let premium;
  if(shiftParsed){
    if(kcat==='SU' || kcat==='H' || kcat==='SA'){
      premium = (8 + supOT + tajo)*2 + honjo*1.5 + supNight*0.5;
    } else {
      premium = (8 + supOT + tajo + honjo)*1.5 + supNight*0.5;
    }
  } else {
    // 실제 지원근무 없이 본조보상/타조보상만 입력된 경우 (원본 수식 기준):
    // 본조보상은 요일과 관계없이 1.5배, 타조보상은 휴일·토요일 2배 / 평일 1.5배
    const tajoMult = (kcat==='SU' || kcat==='H' || kcat==='SA') ? 2 : 1.5;
    premium = honjo * 1.5 + tajo * tajoMult;
  }
  return {supTotal, supOT, supNight, premium, valid:true};
}

/* ========================= 유틸 ========================= */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pad2(n){ return String(n).padStart(2,'0'); }
function dstr(y,m,d){ return `${y}-${pad2(m)}-${pad2(d)}`; }
function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }
function weekdayKr(y,m,d){ return ['일','월','화','수','목','금','토'][new Date(y,m-1,d).getDay()]; }
function isWeekend(y,m,d){ const w=new Date(y,m-1,d).getDay(); return w===0||w===6; }
// 날짜 셀 색상 클래스: 공휴일(빨강) > 일요일(빨강) > 토요일(파랑) > 평일(기본)
function dayCellClass(ds, y, m, d){
  if(holidays[ds]) return 'holiday';
  const w = new Date(y,m-1,d).getDay();
  if(w===0) return 'sunday';
  if(w===6) return 'saturday';
  return 'weekday';
}
function todayStr(){ const t=new Date(); return dstr(t.getFullYear(), t.getMonth()+1, t.getDate()); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>t.classList.remove('show'), msg.length>30 ? 6000 : 2200);
}
// window.confirm()은 샌드박스 iframe(아티팩트 환경)에서 차단되어 조용히 실패할 수 있어,
// 자체 DOM으로 만든 확인창을 사용한다. document.body에 직접 붙여서 render()와 무관하게 동작.
function appConfirm(message, onConfirm){
  const old = document.getElementById('appConfirmOverlay');
  if(old) old.remove();
  const overlay = document.createElement('div');
  overlay.id = 'appConfirmOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:900;display:flex;align-items:center;justify-content:center;';
  overlay.innerHTML = `
    <div style="background:var(--surface);color:var(--text);border-radius:12px;padding:20px;max-width:340px;width:88%;box-shadow:0 10px 30px rgba(0,0,0,.25);">
      <p style="margin:0 0 16px;font-size:14px;line-height:1.5;">${esc(message)}</p>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button type="button" id="appConfirmCancel" class="btn ghost sm">취소</button>
        <button type="button" id="appConfirmOk" class="btn warn sm">확인</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const cleanup = ()=> overlay.remove();
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) cleanup(); });
  document.getElementById('appConfirmCancel').onclick = cleanup;
  document.getElementById('appConfirmOk').onclick = ()=>{ cleanup(); onConfirm(); };
}

// 기존 코드가 쓰던 db.collection().doc().get/set/onSnapshot 형태를 그대로 유지하는 어댑터
function createFirebaseDb(){
  const {fsM, fs} = fb;
  const wrapDoc = snap => ({exists: snap.exists(), id: snap.id, data: ()=>snap.data()});
  const wrapQuery = snap => ({docs: snap.docs.map(d=>({id:d.id, data:()=>d.data()}))});
  function docRef(coll, id){
    const ref = fsM.doc(fs, coll, id);
    return {
      async get(){ return wrapDoc(await fsM.getDoc(ref)); },
      set(val, opts){ return fsM.setDoc(ref, val, opts||{}); },
      update(val){ return fsM.setDoc(ref, val, {merge:true}); },
      delete(){ return fsM.deleteDoc(ref); },
      onSnapshot(cb, errCb){ return fsM.onSnapshot(ref, snap=>cb(wrapDoc(snap)), errCb); }
    };
  }
  function collectionRef(name, cons){
    cons = cons || [];
    const q = ()=> fsM.query(fsM.collection(fs, name), ...cons);
    return {
      doc(id){ return docRef(name, id); },
      where(f, op, v){ return collectionRef(name, cons.concat([fsM.where(f, op, v)])); },
      orderBy(f, dir){ return collectionRef(name, cons.concat([fsM.orderBy(f, dir||'asc')])); },
      async get(){ return wrapQuery(await fsM.getDocs(q())); },
      onSnapshot(cb, errCb){ return fsM.onSnapshot(q(), snap=>cb(wrapQuery(snap)), errCb); }
    };
  }
  const COLLS = ['employees','holidays','codeDefs','attendance','dispatch','supportPlan','meta'];
  return {
    collection(name){ return collectionRef(name); },
    doc(path){ const [c, id] = path.split('/'); return docRef(c, id); },
    async exportAll(){
      const out = {};
      for(const n of COLLS){
        const snap = await fsM.getDocs(fsM.collection(fs, n));
        out[n] = {};
        snap.docs.forEach(d=>{ out[n][d.id] = d.data(); });
      }
      return out;
    },
    async importAll(data, onProgress){
      const items = [];
      for(const n of COLLS){ for(const [id, v] of Object.entries(data[n]||{})){ if(v && typeof v==='object') items.push([n, id, v]); } }
      for(let i=0; i<items.length; i+=400){
        const batch = fsM.writeBatch(fs);
        items.slice(i, i+400).forEach(([n, id, v])=> batch.set(fsM.doc(fs, n, id), v, {merge:true}));
        await batch.commit();
        if(onProgress) onProgress(Math.min(i+400, items.length), items.length);
      }
      return items.length;
    }
  };
}

    return {docs: e.map(([id,v])=>({id, data:()=>clone(v)}))};

      const off = (d + i*3) % 7 === 0;
      const rec = {date:ds, employeeId:id};
      if(off){ Object.assign(rec, {workCode:'OFF', statusCode: w===0 ? 'MCS' : (k%3 ? 'FC' : 'MC')}); }
      else if(night){ Object.assign(rec, {workCode:'N', checkIn:'19:00', checkOut: k%3 ? '7:00' : '8:00', yasik: k%2===0}); }
      else { Object.assign(rec, {workCode:'D', checkIn:'8:00', checkOut: k%4 ? '17:00' : '20:00', jungsik: k%5===0}); }
      if(k%11===0){ rec.supportIn = '19:00'; rec.supportOut = '24:00'; }
      if(!off && k%9===0){ rec.attCode = night ? 'ND' : 'DN'; } // 예시: 근태코드 칸에 입력된 지원근무
      coll('attendance')[ds+'_'+id] = rec;
    });
    ds = addDays(ds, 1);
  }
  coll('meta').seed = {seededAt:1};
  return {
    collection(name){ return collectionRef(name); },
    doc(path){ const [c,id] = path.split('/'); return docRef(c,id); },
    async exportAll(){ return clone(store); },
    async importAll(data){ let n=0; Object.entries(data||{}).forEach(([c,docs])=> Object.entries(docs||{}).forEach(([id,v])=>{ coll(c)[id] = Object.assign({}, coll(c)[id]||{}, clone(v)); n++; })); notify(); return n; }
  };
}

async function trySeed(){
  if(!db || !canEdit) return;
  try{
    const marker = await db.doc('meta/seed').get();
    if(!marker.exists){
      for(let i=0;i<SEED_EMPLOYEES.length;i++){
        if(SEED_EMPLOYEES_SKIP.has(SEED_EMPLOYEES[i])) continue;
        await db.collection('employees').doc('e'+pad2(i+1)).set({name:SEED_EMPLOYEES[i], part:'STS', order:i+1, active:true, union:'1', team:'', teamRole:'조원', teamOrder:i+1, teamNote:''});
      }
      for(const [d,n] of SEED_HOLIDAYS_2026){
        await db.collection('holidays').doc(d).set({date:d, name:n});
      }
      await db.doc('meta/seed').set({seededAt: Date.now()});
    }
    // 근태코드 실제 의미(코드표) 반영 - 최초 1회만 채움, 이후 사용자가 참조표에서 수정한 값은 덮어쓰지 않음
    const codeMarker = await db.doc('meta/codeLabelsV2').get();
    if(!codeMarker.exists){
      for(const c of STATUS_CODE_LIST){
        await db.collection('codeDefs').doc(c).set({code:c, label:CODE_LABELS[c]||''});
      }
      await db.doc('meta/codeLabelsV2').set({seededAt: Date.now()});
    }
    // 노조 소속 기본값(원본 노조 시트 기준 전원 1조) - 기존에 union 필드가 없던 직원에 한해 1회만 채움
    const unionMarker = await db.doc('meta/unionSeedV1').get();
    if(!unionMarker.exists){
      const empSnap = await db.collection('employees').get();
      for(const d of empSnap.docs){
        if(d.data().union==null){
          await db.collection('employees').doc(d.id).update({union:'1'});
        }
      }
      await db.doc('meta/unionSeedV1').set({seededAt: Date.now()});
    }
    // 조편성 순번/직책 수기 입력 반영 (사용자 지정: 1조 서인기1번(조장)·김성용2번(조원)·김기영3번(조원))
    const teamMarker = await db.doc('meta/teamOrderSeedV1').get();
    if(!teamMarker.exists){
      const teamData = {'서인기':{team:'1',teamOrder:1,teamRole:'조장'}, '김성용':{team:'1',teamOrder:2,teamRole:'조원'}, '김기영':{team:'1',teamOrder:3,teamRole:'조원'}};
      const empSnap2 = await db.collection('employees').get();
      for(const d of empSnap2.docs){
        const nm = d.data().name;
        if(teamData[nm]){
          await db.collection('employees').doc(d.id).update(teamData[nm]);
        }
      }
      await db.doc('meta/teamOrderSeedV1').set({seededAt: Date.now()});
    }
    // 2027~2030 공휴일: 없는 날짜만 1회 추가
    const holMarker = await db.doc('meta/holidaySeed2030').get();
    if(!holMarker.exists){
      for(const [d,n] of SEED_HOLIDAYS_2027_2030){ if(!holidays[d]) await db.collection('holidays').doc(d).set({date:d, name:n}); }
      await db.doc('meta/holidaySeed2030').set({seededAt: Date.now()});
    }
    // (삭제·이름변경한 직원이 되살아나던 '기본 명단 강제 보충' 로직은 제거함)
  }catch(e){ /* 동시 시딩 등은 무시 */ }
}

let recentlyDeleted = {}; // key -> timestamp, 삭제 직후 지연 도착한 스냅샷이 데이터를 되살리는 것을 잠깐 방지
function markRecentlyDeleted(key){
  recentlyDeleted[key] = Date.now();
  setTimeout(()=>{ if(recentlyDeleted[key]) delete recentlyDeleted[key]; }, 8000);
}
// 출퇴근 기록: 필요한 달만 실시간 구독하고(읽기 비용 절약), 모든 화면이 하나의 공유 캐시를 사용.
// 저장은 항상 '해당 화면이 다루는 항목만 병합(merge)'하므로, 캐시에 없던 기록도 덮어써지지 않음.
const attStore = {};
attendance = attStore; codeStatsAttendance = attStore; otMatrixAttendance = attStore;
const ATT_DEFAULTS = {workCode:'OFF', statusCode:'', note:'', extCode:false, manguen:false};
function normAtt(v){ return Object.assign({}, ATT_DEFAULTS, v); }
const monthSubs = new Map(); // 'YYYY-MM' -> unsubscribe
const MONTH_SUB_MAX = 18;
function nextYm(ym){ const [y,m] = ym.split('-').map(Number); return m===12 ? `${y+1}-01` : `${y}-${pad2(m+1)}`; }
function ensureAttendanceRange(start, end){
  if(!db || !start || !end) return;
  if(end < start) [start, end] = [end, start];
  start = addDays(start, -6); // 토요일 만근 판정에 필요한 그 주 월~금 기록까지
  let ym = start.slice(0,7), guard = 0;
  const endYm = end.slice(0,7);
  while(ym <= endYm && guard++ < 15){ ensureMonth(ym); ym = nextYm(ym); }
}
function ensureMonth(ym){
  if(monthSubs.has(ym)){ const fn = monthSubs.get(ym); monthSubs.delete(ym); monthSubs.set(ym, fn); return; }
  const [y,m] = ym.split('-').map(Number);
  const fn = db.collection('attendance').where('date','>=',ym+'-01').where('date','<=',dstr(y,m,daysInMonth(y,m)))
    .onSnapshot(snap=>{
      const seen = new Set(), now = Date.now();
      snap.docs.forEach(d=>{
        const delAt = recentlyDeleted[d.id];
        if(delAt && now - delAt < 8000) return; // 방금 삭제한 기록은 잠깐 무시
        seen.add(d.id);
        attStore[d.id] = normAtt(d.data());
      });
      Object.keys(attStore).forEach(k=>{ if(k.startsWith(ym) && !seen.has(k)) delete attStore[k]; });
      mergeExcelAtt(ym);
      scheduleRender();
    }, dbErr);
  monthSubs.set(ym, fn);
  while(monthSubs.size > MONTH_SUB_MAX){
    const [oldYm, oldFn] = monthSubs.entries().next().value;
    oldFn(); monthSubs.delete(oldYm);
    Object.keys(attStore).forEach(k=>{ if(k.startsWith(oldYm)) delete attStore[k]; });
  }
}
function ensureForView(){
  if(!dbReady) return;
  if(VIEW==='input'){ const d = (prefill && prefill.date) || inputViewDate || todayStr(); ensureAttendanceRange(d, d); }
  else if(VIEW==='grid'){ const d = dstr(curYear,curMonth,1); ensureAttendanceRange(d, d); }
  else if(VIEW==='combined' || VIEW==='codestats'){
    if(codeStatsStart && codeStatsEnd) ensureAttendanceRange(codeStatsStart, codeStatsEnd);
    if(VIEW==='combined' && combinedYm){ const d = dstr(combinedYm.y, combinedYm.m, 1); ensureAttendanceRange(d, d); }
    if(VIEW==='combined' && leaveEmpId && leaveYear) ensureAttendanceRange(`${leaveYear}-01-01`, `${leaveYear}-12-31`);
  }
  else if(VIEW==='ot'){ if(otMatrixStart && otMatrixEnd) ensureAttendanceRange(otMatrixStart, otMatrixEnd); }
  else if(VIEW==='pay'){ if(payYm){ const [a,b] = payPeriodRange(payYm.y, payYm.m); ensureAttendanceRange(a, b); } }
  else if(VIEW==='dispatch'){ const d = dispatchDate || todayStr(); ensureAttendanceRange(d, d); if(codeStatsStart && codeStatsEnd) ensureAttendanceRange(codeStatsStart, codeStatsEnd); }
}

// partial: 이 화면이 다루는 항목만(date, employeeId 필수). 서버에는 병합 저장되어 다른 항목은 보존됨.
// 원본(내장) 기록을 처음 고칠 때는 원본 내용 전체를 함께 저장(고치지 않은 칸이 사라지지 않게)
function withEmbedded(partial){
  const cur = attStore[partial.date+'_'+partial.employeeId];
  if(!cur || !cur._emb) return partial;
  const base = Object.assign({}, cur); delete base._emb;
  return Object.assign(base, partial);
}

  const key = partial.date+'_'+partial.employeeId;
  attStore[key] = normAtt(Object.assign({}, attStore[key]||{}, partial, {_emb:false})); // 낙관적 로컬 업데이트
  render();
  try{
    await db.collection('attendance').doc(key).set(partial, {merge:true});
    showToast('저장되었습니다.');
  }catch(err){
    showToast(saveErrMsg('저장에 실패했습니다.', err));
  }
}

async function saveDispatchSlots(dateStr, shift, empId, changes){
  if(!requireEdit()) return;
  const id = `${dateStr}_${shift}_${empId}`;
  const cur = Object.assign({date:dateStr, shift, employeeId:empId, slots:{}}, dispatch[id]||{});
  cur.slots = Object.assign({}, cur.slots, changes);
  dispatch[id] = cur; // 낙관적 로컬 업데이트: 저장 성공 여부와 무관하게 화면엔 즉시 반영
  if(!db){ render(); return; }
  try{ await db.collection('dispatch').doc(id).set(cur); }
  catch(err){ console.error(err); showToast(saveErrMsg('배차 저장에 실패했습니다.', err)); render(); }
}
async function saveDispatchSupportName(dateStr, shift, supId, name){
  if(!requireEdit()) return;
  const id = `${dateStr}_${shift}_${supId}`;
  const cur = Object.assign({date:dateStr, shift, employeeId:supId, slots:{}}, dispatch[id]||{}, {name});
  dispatch[id] = cur; // 낙관적 로컬 업데이트
  if(!db){ render(); return; }
  try{ await db.collection('dispatch').doc(id).set(cur); }
  catch(err){ console.error(err); showToast(saveErrMsg('배차 저장에 실패했습니다.', err)); render(); }
}
async function saveSupportPlan(dateStr, shift, data){
  if(!requireEdit()) return;
  const id = `${dateStr}_${shift}`;
  const rec = Object.assign({date:dateStr, shift}, data);
  supportPlan[id] = rec; // 낙관적 로컬 업데이트
  render();
  if(!db) return;
  try{ await db.collection('supportPlan').doc(id).set(rec); }
  catch(err){ /* 저장 실패 알림은 표시하지 않음(요청에 따라) */ }
}
// 여러 날짜/조 칸을 한번에 저장할 때는 로컬 반영은 한번에, 서버 저장은 순차적으로 진행해서
// 동시 다발 쓰기로 인해 일부가 유실되는 것을 방지한다.
async function saveSupportPlanBatch(groups){
  if(!requireEdit()) return;
  groups.forEach(g=>{ supportPlan[`${g.ds}_${g.sh}`] = Object.assign({date:g.ds, shift:g.sh}, g.cur); });
  render();
  if(!db){ showToast('저장되었습니다.'); return; }
  for(const g of groups){
    const id = `${g.ds}_${g.sh}`;
    try{ await db.collection('supportPlan').doc(id).set(supportPlan[id]); }
    catch(err){ /* 조용히 무시 */ }
  }
  showToast('저장되었습니다.');
}
async function deleteSupportPlanWeek(startStr){
  if(!requireEdit()) return;
  const days = Array.from({length:7}, (_,i)=>addDays(startStr,i));
  const ids = [];
  days.forEach(ds=>['day','night'].forEach(sh=> ids.push(`${ds}_${sh}`)));
  ids.forEach(id=> delete supportPlan[id]); // 낙관적 로컬 업데이트
  render();
  if(!db) return;
  try{ await Promise.all(ids.map(id=> db.collection('supportPlan').doc(id).delete())); }
  catch(err){ /* 조용히 무시 */ }
}

/* ========================= 렌더 라우터 ========================= */
function setView(v){
  if(v==='pay') v = 'combined'; // 급여 명세서는 잠시 숨김(나중에 다시 사용)
  if(authResolved && !canEdit && isEditorOnlyView(v)) v = 'combined';
  VIEW = v;
  document.querySelectorAll('nav#nav a').forEach(a=>a.classList.toggle('on', a.dataset.view===v));
  document.getElementById('nav').classList.remove('open');
  document.getElementById('scrim').classList.remove('show');
  if(v==='dispatch'){ if(!dispatchDate) dispatchDate = todayStr(); autoDispatchShift(); if(dbReady) subscribeDispatchDay(dispatchDate); }
  if(v==='input'){ if(dbReady) subscribeDispatchDay(inputViewDate || todayStr()); }
  if(v==='splan'){ if(!weekStart) weekStart = mondayOf(todayStr()); if(dbReady) loadSupportPlanAll(); }
  if(v==='codestats' || v==='combined'){
    if(!codeStatsStart || !codeStatsEnd){
      const t = new Date();
      codeStatsStart = dstr(t.getFullYear(), t.getMonth()+1, 1);
      codeStatsEnd = dstr(t.getFullYear(), t.getMonth()+1, daysInMonth(t.getFullYear(), t.getMonth()+1));
    }
    if(dbReady) subscribeCodeStatsRange(codeStatsStart, codeStatsEnd);
  }
  if(v==='ot'){
    if(!otMatrixStart || !otMatrixEnd){
      const t = new Date();
      otPayYear = t.getFullYear(); otPayMonth = t.getMonth()+1;
      // 오늘이 26일 이후면 "다음달" 임금월에 이미 들어선 것
      if(t.getDate()>=26){ otPayMonth++; if(otPayMonth>12){ otPayMonth=1; otPayYear++; } }
      [otMatrixStart, otMatrixEnd] = payPeriodRange(otPayYear, otPayMonth);
    }
    if(dbReady) subscribeOtMatrixRange(otMatrixStart, otMatrixEnd);
  }
  render();
}
// 데이터 변경 알림이 여러 개 동시에 와도 화면은 한 번만 다시 그림.
// 입력칸에 커서가 있는 동안에는(다른 창에서 저장된 경우 등) 입력 중인 값이 날아가지 않게 보류했다가 포커스가 빠지면 그림.
let renderScheduled = false, renderDeferred = false;
function isEditingField(){
  const a = document.activeElement;
  if(!a) return false;
  const content = document.getElementById('content');
  if(!content || !content.contains(a)) return false;
  if(a.tagName==='TEXTAREA' || a.tagName==='SELECT') return true;
  if(a.tagName==='INPUT'){ const t=(a.type||'').toLowerCase(); return !['checkbox','radio','button','submit','reset','file'].includes(t); }
  return false;
}
function scheduleRender(){
  if(renderScheduled) return;
  renderScheduled = true;
  setTimeout(()=>{
    renderScheduled = false;
    if(isEditingField()){ renderDeferred = true; return; }
    render();
  }, 0);
}
document.addEventListener('focusout', ()=>{
  if(!renderDeferred) return;
  setTimeout(()=>{ if(renderDeferred && !isEditingField()){ renderDeferred = false; render(); } }, 0);
});
function render(){
  renderDeferred = false;
  ensureForView();
  const el = document.getElementById('content');
  if(VIEW==='input') el.innerHTML = pageInput();
  else if(VIEW==='grid') el.innerHTML = pageGrid();
  else if(VIEW==='ot') el.innerHTML = pageOT();
  else if(VIEW==='codestats') el.innerHTML = pageCodeStats();
  else if(VIEW==='combined') el.innerHTML = pageCombined();
  else if(VIEW==='holidays') el.innerHTML = pageHolidays();
  else if(VIEW==='employees') el.innerHTML = pageEmployees();
  else if(VIEW==='codes') el.innerHTML = pageCodes();
  else if(VIEW==='dispatch') el.innerHTML = pageDispatch();
  else if(VIEW==='splan') el.innerHTML = pageSupportPlan();
  else if(VIEW==='team') el.innerHTML = pageTeam();
  else if(VIEW==='backup') el.innerHTML = pageBackup();

  afterRender();
  if(!canEdit) applyReadonly(el);
}

function workBadge(code){
  const found = WORK_CODES.find(w=>w.code===code);
  const c = found ? found.code : '-';
  return `<span class="badge-code" style="background:var(--bg);border-color:var(--border);color:${codeColor(c)};">${esc(c)}</span>`;
}

/* ========================= 출퇴근 입력 ========================= */
let inputTeam = (()=>{ try{ return localStorage.getItem('snct_input_team')||'1'; }catch(e){ return '1'; } })();
let inputDraft = {}; // `${date}|${empId}` -> {field: 값} (저장 전 입력 내용)
const IN_TIME = ['checkIn','checkOut','supportIn','supportOut'];
const IN_NUM = ['honjoComp','tajoComp'];
const IN_CHK = ['jochul','seokchul','jungsik','yasik'];
// 엑셀식 시각 표기 ↔ 저장 형식: 8 → 8:00, 15.3 → 15:30, 7.3 → 7:30 (15:30 도 가능)
function hmToExcel(hm){ if(!hm) return ''; const [h,m] = hm.split(':'); return Number(m) ? `${Number(h)}.${String(m).replace(/0$/,'')}` : String(Number(h)); }
function excelToHm(v){
  v = String(v||'').trim(); if(!v) return '';
  const p = v.split(/[.:]/); const h = Number(p[0]);
  let m = p[1]===undefined || p[1]==='' ? 0 : (p[1].length===1 ? Number(p[1])*10 : Number(p[1].slice(0,2)));
  if(!Number.isFinite(h) || !Number.isFinite(m) || h<0 || h>30 || m<0 || m>59) return null;
  return `${h}:${String(m).padStart(2,'0')}`;
}
function inputRowRec(date, e){
  const base = attStore[date+'_'+e.id] || {};
  const d = inputDraft[date+'|'+e.id] || {};
  const r = Object.assign({}, base, {employeeId:e.id, date});
  IN_TIME.forEach(f=>{ if(d[f]!==undefined){ const hm = excelToHm(d[f]); r[f] = hm===null ? '' : hm; } });
  IN_NUM.forEach(f=>{ if(d[f]!==undefined) r[f] = d[f]; });
  IN_CHK.forEach(f=>{ if(d[f]!==undefined) r[f] = !!d[f]; });
  return normAtt(r);
}
function inputRowTotal(date, e){
  const r = inputRowRec(date, e);
  const c = computeDaily(r, date), sp = computeSupportDaily(r, date), m = computeMealAllowance(r);
  return (c.valid?c.premium:0) + (sp.valid?sp.premium:0) + m;
}
function pageInput(){
  const date = (prefill && prefill.date) || inputViewDate || todayStr();
  prefill = null; inputViewDate = date;
  const [y,m,d] = date.split('-').map(Number);
  const list = employees.filter(e=> (e.team||'')===inputTeam).sort((a,b)=>(a.teamOrder||999)-(b.teamOrder||999));
  const dirtyN = Object.keys(inputDraft).filter(k=>k.startsWith(date+'|')).length;
  const rows = list.map(e=>{
    const base = attStore[date+'_'+e.id] || {};
    const dr = inputDraft[date+'|'+e.id] || {};
    const val = f => dr[f]!==undefined ? dr[f] : (IN_TIME.includes(f) ? hmToExcel(base[f]) : (base[f]||''));
    const chk = f => (dr[f]!==undefined ? dr[f] : base[f]) ? 'checked' : '';
    const bad = f => IN_TIME.includes(f) && dr[f]!==undefined && excelToHm(dr[f])===null ? ' bad' : '';
    const t = f => `<td><input type="text" inputmode="decimal" class="inCell${bad(f)}" data-emp="${esc(e.id)}" data-f="${f}" value="${esc(val(f))}"></td>`;
    const suwu = ['day','night'].reduce((a,sh)=>{ const dd = dispatch[`${date}_${sh}_${e.id}`]; return a + (dd && dd.slots ? Object.values(dd.slots).filter(Boolean).length*0.5 : 0); }, 0);
    const dc = gridCode(base, date, String(e.name||'').trim()) || scheduledShift(date, e.team||'');
    const tot = inputRowTotal(date, e);
    return `<tr class="${dr && Object.keys(dr).length ? 'inDirty' : ''}">
      <td class="namecell inName">${esc(e.name)} ${dc ? `<span style="margin-left:4px;">${codeBadge(dc)}</span>` : ''}</td>
      ${t('checkIn')}${t('checkOut')}${t('supportIn')}${t('supportOut')}
      <td class="inRO">${suwu ? fmtH(suwu) : ''}</td>
      ${t('honjoComp')}${t('tajoComp')}
      ${IN_CHK.map(f=>`<td style="text-align:center;"><input type="checkbox" class="inChk" data-emp="${esc(e.id)}" data-f="${f}" ${chk(f)}></td>`).join('')}
      <td class="inRO inTot" data-emp="${esc(e.id)}">${tot ? fmtH(tot) : ''}</td>
    </tr>`;
  }).join('');
  return `
  <h2 class="pgttl">출퇴근 입력</h2>
  <p class="pgsub">엑셀 DB 입력과 같은 방식이에요. 시각은 <b>숫자로 직접</b> 입력합니다(8 = 8:00, 15.3 = 15:30, 야간 퇴근 7.3 = 다음날 7:30). 조출·석출·중식·야식은 체크, 승무시간과 총OT는 자동 계산돼요. 다 입력한 뒤 <b>저장</b>을 누르세요.</p>
  <div class="panel">
    <div class="row" style="align-items:flex-end;margin-bottom:12px;">
      <div class="field"><label>날짜</label><input type="date" id="inDate" value="${esc(date)}"></div>
      <button class="btn ghost sm" id="inPrev">◀ 전날</button><button class="btn ghost sm" id="inNext">다음날 ▶</button>
      <b style="font-size:15px;margin-left:6px;">${y}년 ${m}월 ${d}일 (${weekdayKr(y,m,d)})${holidays[date] ? ' <span style="color:var(--warn);">'+esc(holidays[date])+'</span>' : ''}</b>
      <span style="flex:1"></span>
      <button class="btn ${inputTeam==='1'?'':'ghost'} sm" data-act="in-team" data-team="1">1조</button>
      <button class="btn ${inputTeam==='2'?'':'ghost'} sm" data-act="in-team" data-team="2">2조</button>
    </div>
    <div class="scrollx gridwrap"><table class="gtbl inTbl"><thead><tr>
      <th class="namehead">성명</th><th>본출근</th><th>본퇴근</th><th>지원출근</th><th>지원퇴근</th><th>승무시간</th><th>본조보상</th><th>타조보상</th><th>조출</th><th>석출</th><th>중식</th><th>야식</th><th>총OT</th>
    </tr></thead><tbody>${rows || `<tr><td colspan="13" class="empty">${inputTeam}조에 배정된 직원이 없습니다.</td></tr>`}</tbody></table></div>
    <div class="row" style="margin-top:12px;align-items:center;">
      <button class="btn" id="inSave">저장${dirtyN ? ` (${dirtyN}명 변경)` : ''}</button>
      <button class="btn warn ghost" id="inReset">초기화</button>
      <span class="hint" style="margin:0;">초기화 = 저장하지 않은 입력을 지우고 저장된 값으로 되돌림. 빨간 칸은 시각 형식이 잘못된 칸이에요.</span>
    </div>
  </div>`;
}
function bindInputTable(el){
  const dEl = document.getElementById('inDate'); if(!dEl) return;
  const go = ds=>{ inputViewDate = ds; if(dbReady) subscribeDispatchDay(ds); render(); };
  dEl.onchange = ()=>{ if(dEl.value) go(dEl.value); };
  document.getElementById('inPrev').onclick = ()=> go(addDays(inputViewDate, -1));
  document.getElementById('inNext').onclick = ()=> go(addDays(inputViewDate, 1));
  el.querySelectorAll('[data-act="in-team"]').forEach(b=> b.onclick = ()=>{ inputTeam = b.dataset.team; try{ localStorage.setItem('snct_input_team', inputTeam); }catch(e){} render(); });
  const setDraft = (empId, f, v)=>{ const k = inputViewDate+'|'+empId; inputDraft[k] = Object.assign({}, inputDraft[k]||{}, {[f]: v}); };
  const refreshRow = (empId, inp)=>{
    const e = employees.find(x=>x.id===empId); const tr = inp.closest('tr'); if(!e || !tr) return;
    const tot = inputRowTotal(inputViewDate, e); const cell = tr.querySelector('.inTot'); if(cell) cell.textContent = tot ? fmtH(tot) : '';
    tr.classList.add('inDirty');
    const sb = document.getElementById('inSave'); const n = Object.keys(inputDraft).filter(k=>k.startsWith(inputViewDate+'|')).length; if(sb) sb.textContent = `저장 (${n}명 변경)`;
  };
  el.querySelectorAll('.inCell').forEach(x=>{
    x.oninput = ()=>{ setDraft(x.dataset.emp, x.dataset.f, x.value); if(IN_TIME.includes(x.dataset.f)) x.classList.toggle('bad', excelToHm(x.value)===null); refreshRow(x.dataset.emp, x); };
    x.onkeydown = (ev)=>{ if(ev.key==='Enter'){ ev.preventDefault(); const all = [...el.querySelectorAll('.inCell')]; const i = all.indexOf(x); const cols = 6; const nx = all[i+cols] || all[i+1]; if(nx){ nx.focus(); nx.select(); } } };
  });
  el.querySelectorAll('.inChk').forEach(x=> x.onchange = ()=>{ setDraft(x.dataset.emp, x.dataset.f, x.checked); refreshRow(x.dataset.emp, x); });
  document.getElementById('inReset').onclick = ()=>{ Object.keys(inputDraft).forEach(k=>{ if(k.startsWith(inputViewDate+'|')) delete inputDraft[k]; }); render(); };
  document.getElementById('inSave').onclick = async ()=>{
    if(!requireEdit()) return;
    const date = inputViewDate;
    const keys = Object.keys(inputDraft).filter(k=>k.startsWith(date+'|'));
    if(!keys.length){ showToast('변경된 내용이 없습니다.'); return; }
    const badCells = keys.some(k=> IN_TIME.some(f=> inputDraft[k][f]!==undefined && excelToHm(inputDraft[k][f])===null));
    if(badCells){ showToast('빨간 칸의 시각 형식을 확인해 주세요 (예: 8, 15.3, 7.3).'); return; }
    const partials = keys.map(k=>{
      const empId = k.split('|')[1], dr = inputDraft[k], p = {date, employeeId: empId, updatedAt: Date.now()};
      IN_TIME.forEach(f=>{ if(dr[f]!==undefined) p[f] = excelToHm(dr[f]) || ''; });
      IN_NUM.forEach(f=>{ if(dr[f]!==undefined) p[f] = String(dr[f]).trim(); });
      IN_CHK.forEach(f=>{ if(dr[f]!==undefined) p[f] = !!dr[f]; });
      return p;
    });
    for(let i=0;i<partials.length;i++) partials[i] = withEmbedded(partials[i]);
    partials.forEach(p=>{ const key = p.date+'_'+p.employeeId; attStore[key] = normAtt(Object.assign({}, attStore[key]||{}, p, {_emb:false})); });
    keys.forEach(k=> delete inputDraft[k]);
    render();
    try{
      await Promise.all(partials.map(p=> db.collection('attendance').doc(p.date+'_'+p.employeeId).set(p, {merge:true})));
      showToast(`${partials.length}명 저장되었습니다.`);
    }catch(err){ showToast(saveErrMsg('저장에 실패했습니다.', err)); }
  };
}

/* ========================= 월별 근태관리표 ========================= */
function pageGrid(){
  const dim = daysInMonth(curYear,curMonth);
  const days = Array.from({length:dim}, (_,i)=>i+1);
  const head = `<th class="namehead">성명</th>` + days.map(d=>{
    const ds = dstr(curYear,curMonth,d);
    const cls = dayCellClass(ds, curYear, curMonth, d);
    return `<th class="${cls} ${weekBand(ds)}" title="${esc(holidays[ds]||'')}">${d}<br>${weekdayKr(curYear,curMonth,d)}</th>`;
  }).join('');

  const sortedEmployees = employees.slice().sort((a,b)=>{
    const ta = a.team||'9', tb = b.team||'9';
    if(ta!==tb) return ta<tb?-1:1;
    return (a.teamOrder||999)-(b.teamOrder||999);
  });
  const rows = sortedEmployees.map(e=>{
    const cells = days.map(d=>{
      const ds = dstr(curYear,curMonth,d);
      const rec = attendance[ds+'_'+e.id];
      const cls = dayCellClass(ds, curYear, curMonth, d);
      let inner = '', fill = '';
      const dc = gridCode(rec, ds, String(e.name||'').trim());
      {
        fill = dc ? codeFill(dc) : '';
        if(dc) inner = `<span class="mini" style="color:${fill ? codeFillText(dc) : codeColor(dc)};font-weight:800;">${esc(dc)}</span>`;
      }
      const memo = rec && rec.note ? String(rec.note) : '';
      return `<td class="daycell ${cls} ${weekBand(ds)}${fill?' filled':''}" data-act="grid-cell" data-date="${esc(ds)}" data-emp="${esc(e.id)}"${fill?` style="background:${fill};"`:''}>${inner}</td>`;
    }).join('');
    const orderTag = e.team ? `<span style="color:var(--text-muted);font-weight:400;font-size:10.5px;">${esc(e.team)}조${e.teamOrder?' '+e.teamOrder+'번':''}</span> ` : '';
    return `<tr><td class="namecell">${orderTag}${esc(e.name)}</td>${cells}</tr>`;
  }).join('');

  const dayCounts = days.map(d=>{
    const ds = dstr(curYear,curMonth,d);
    return sortedEmployees.reduce((n,e)=>{
      const rec = attendance[ds+'_'+e.id];
      return n + (rec && rec.workCode && rec.workCode!=='OFF' ? 1 : 0);
    }, 0);
  });
  const countRow = `<tr style="background:var(--bg);font-weight:800;"><td class="namecell">근무</td>${dayCounts.map(n=>`<td style="text-align:center;">${n||''}</td>`).join('')}</tr>`;

  const modal = gridEdit ? renderGridEditModal() : '';

  return `
  <h2 class="pgttl">월별 근태관리표</h2>
  <p class="pgsub">셀을 클릭하면 그 자리에서 근무코드·근태코드를 입력할 수 있습니다.</p>
  <div class="row" style="margin-bottom:14px;">
    <button class="btn ghost sm" id="prevMonth">◀ 이전달</button>
    <div class="field" style="min-width:auto;"><b style="font-size:15px;">${curYear}년 ${curMonth}월</b></div>
    <button class="btn ghost sm" id="nextMonth">다음달 ▶</button>
  </div>
  ${employees.length? `<div class="scrollx gridwrap"><table class="gtbl"><thead><tr>${head}</tr></thead><tbody>${rows}${countRow}</tbody></table></div>`
    : `<div class="empty">등록된 직원이 없습니다. 먼저 직원 관리에서 직원을 추가하세요.</div>`}
  <div class="legend">
    <span class="sw"><span class="badge-code bc-D">D</span>주간</span>
    <span class="sw"><span class="badge-code bc-N">N</span>야간</span>
    <span class="sw"><span class="badge-code bc-DN">DN</span>주-야</span>
    <span class="sw"><span class="badge-code bc-ND">ND</span>야-주</span>
    <span class="sw"><span class="badge-code bc-DS">DS</span>주간지원</span>
    <span class="sw"><span class="badge-code bc-NS">NS</span>야간지원</span>

/* ========================= 근태관리(통합: 집계+표) ========================= */
// 근태관리 집계(지원·휴일·평일 개수, OT, 조별 순번) — 근태관리 표와 배차표 OT순번에서 함께 사용
function combinedData(sortedEmployees, rangeStart, rangeEnd){
  let noAttCount = 0; // 근태코드 칸 정보 없이 저장된 기록 수(예전 버전으로 가져온 경우)
  const perEmp = sortedEmployees.map(e=>{
    let codeCnt = {FCH:0,MCH:0,MCS:0,FC:0,MC:0};
    let otHoliday=0, otWeekday=0, supDays=0, mealAllow=0;
    // 원본 기준: 코드·지원 일수는 시작일~종료일, OT는 시작일이 속한 주의 월요일부터 합산
    for(let ds=mondayOf(rangeStart); ds<=rangeEnd; ds=addDays(ds,1)){
      const rec = codeStatsAttendance[ds+'_'+e.id];
      if(ds >= rangeStart){
        const ec = effCode(rec, ds, String(e.name||'').trim());
        if(codeCnt.hasOwnProperty(ec)) codeCnt[ec]++;
        if(isSupportCode(ec)) supDays++;
      }
      if(!rec) continue;
      if(rec.attCode===undefined && ds<=IMPORT_LAST_DATE && (rec.checkIn || (rec.workCode && rec.workCode!=='OFF'))) noAttCount++;
      // 원본 26년_근태관리 기준: 휴일 OT = 휴일 근무 + 휴일 지원, 평일 OT = 평일 근무(토요 만근 특근 제외) + 식사
      const c = computeDaily(rec, ds);
      const sp = computeSupportDaily(rec, ds);
      const kc = dayCategory(ds, recManguen(rec, ds), rec && rec.employeeId);
      if(c.valid){ if(c.category==='일요일'||c.category==='공휴일') otHoliday+=c.premium; else if(c.category==='평일') otWeekday+=c.premium; }
      if(sp.valid && (kc==='SU' || kc==='H')) otHoliday += sp.premium;
      mealAllow += computeMealAllowance(rec);
    }
    const A2 = k => adjOf(e,k) + userAdjOf(e,k); // 기존 보정 + 직접 넣은 보정
    codeCnt.FCH += A2('fchAdj'); codeCnt.MCH += A2('mchAdj'); codeCnt.FC += A2('fcAdj'); codeCnt.MC += A2('mcAdj');
    codeCnt.MCS += A2('mcsAdj');
    const gyeHol = codeCnt.FCH+codeCnt.MCH + A2('holCntAdj'), gyeWk = codeCnt.FC+codeCnt.MC + A2('wkCntAdj');
    const otWeekdayFinal = otWeekday + (codeStatsIncludeMeal? mealAllow:0) + A2('wkAdj');
    // 원본처럼 보정값(지원·휴일·평일)을 더함 — 조편성 관리의 '근태관리 보정값'에서 입력
    return {emp:e, codeCnt, gyeHol, gyeWk, otHoliday: otHoliday + A2('holAdj'), otWeekdayFinal, supDays: supDays + A2('supAdj')};
  });
  // 순번 제외 대상은 순위 계산에서 빼고 칸을 비움(null)
  const inAll = r => rankExcl(r.emp)!=='all';
  const inOt = r => rankExcl(r.emp)==='';
  // 순번은 1조·2조 따로 매김(조가 없는 사람끼리도 따로)
  const teamOf = r => r.emp.team || '';
  function rankBy(getVal, desc, ok){
    const arr = new Array(perEmp.length).fill(null);
    const groups = {};
    perEmp.forEach((r,i)=>{ if(ok(r)) (groups[teamOf(r)] = groups[teamOf(r)] || []).push({i, v:getVal(r)||0}); });
    Object.values(groups).forEach(list=>{
      list.sort((a,b)=>(desc? b.v-a.v : a.v-b.v) || a.i-b.i).forEach((q,idx)=>{ arr[q.i] = idx+1; });
    });
    return arr;
  }
  const rankSup=rankBy(r=>r.supDays,false,inAll), rankGyeHol=rankBy(r=>r.gyeHol,false,inAll), rankMCS=rankBy(r=>r.codeCnt.MCS,false,inAll);
  const rankGyeWk=rankBy(r=>r.gyeWk,false,inAll), rankOtHol=rankBy(r=>r.otHoliday,true,inOt), rankOtWk=rankBy(r=>r.otWeekdayFinal,true,inOt);
  const cntBy = ok => { const m = {}; perEmp.forEach(r=>{ if(ok(r)) m[teamOf(r)] = (m[teamOf(r)]||0) + 1; }); return m; };
  const nAllT = cntBy(inAll), nOtT = cntBy(inOt);
  return {perEmp, rankSup, rankGyeHol, rankMCS, rankGyeWk, rankOtHol, rankOtWk, nAllT, nOtT, teamOf};
}
function pageCombined(){
  // ① 근태 집계: 시작일~종료일 기간 기준
  if(!codeStatsStart || !codeStatsEnd){
    const t = new Date();
    codeStatsStart = dstr(t.getFullYear(), t.getMonth()+1, 1);
    codeStatsEnd = dstr(t.getFullYear(), t.getMonth()+1, daysInMonth(t.getFullYear(), t.getMonth()+1));
  }
  // ② 월별 근태코드: 달력 한 달 기준
  if(!combinedYm){ const t = new Date(); combinedYm = {y:t.getFullYear(), m:t.getMonth()+1}; }
  const rangeStart = codeStatsStart, rangeEnd = codeStatsEnd;
  const sortedEmployees = employees.slice().filter(e=> !combinedTeamFilter || (e.team||'')===combinedTeamFilter).sort((a,b)=>{
    const ta = a.team||'9', tb = b.team||'9';
    if(ta!==tb) return ta<tb?-1:1;
    return (a.teamOrder||999)-(b.teamOrder||999);
  });

  const {perEmp, rankSup, rankGyeHol, rankMCS, rankGyeWk, rankOtHol, rankOtWk, nAllT, nOtT, teamOf} = combinedData(sortedEmployees, rangeStart, rangeEnd);

  const statHead = `<tr>
